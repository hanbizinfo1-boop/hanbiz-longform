<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s64 저울 — 수수료·광고비(손님 한 명당) 빨강이 무겁다 → 막국수 원가 가볍다 → «단골 손님»이 오른쪽에 올라 파랑이 이김 · 설명 층</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#cam{left:0;top:0;width:1920px;height:1080px;transform-origin:960px 540px}
#sc{left:140px;top:120px;width:1640px;height:810px;overflow:visible}
#sc text{font-family:"Pre";font-weight:800}
</style></head>
<body><div id="stage">
  <div id="cam" class="abs">
    <div class="grid"></div>
    <svg id="sc" class="abs" viewBox="140 120 1640 810" data-box="sc">
      <path id="post" class="ln w6" d="M960 290 L960 860"/>
      <path id="base" class="ln w6" d="M760 864 L1160 864"/>
      <path id="beam" class="ln w6" d="M410 290 L1510 290"/>
      <circle id="pv" cx="960" cy="290" r="24" fill="#F4F5F2" class="ln w4"/>
      <g id="pl"><!-- 왼쪽 접시 -->
        <path class="ln w4" d="M0 -310 L0 -230 M-240 -230 L240 -230 M-240 -230 L-240 0 M240 -230 L240 0"/>
        <path class="ln w4" d="M-240 0 L240 0 C220 60 110 90 0 90 C-110 90 -220 60 -240 0"/>
        <g id="L1"><rect x="-180" y="-84" width="360" height="80" rx="8" fill="#D63A3A"/><text x="0" y="-28" font-size="46" text-anchor="middle" fill="#fff">수수료</text></g>
        <g id="L2"><rect x="-180" y="-168" width="360" height="80" rx="8" fill="#D63A3A"/><text x="0" y="-112" font-size="46" text-anchor="middle" fill="#fff">광고비</text></g>
        <text id="Lsub" x="0" y="150" font-size="46" text-anchor="middle" fill="#D63A3A">손님 한 명당</text>
      </g>
      <g id="pr"><!-- 오른쪽 접시 -->
        <path class="ln w4" d="M0 -310 L0 -230 M-240 -230 L240 -230 M-240 -230 L-240 0 M240 -230 L240 0"/>
        <path class="ln w4" d="M-240 0 L240 0 C220 60 110 90 0 90 C-110 90 -220 60 -240 0"/>
        <g id="R1"><rect x="-170" y="-74" width="340" height="70" rx="8" fill="#fff" stroke="#20262D" stroke-width="3"/><text x="0" y="-25" font-size="42" text-anchor="middle" fill="#20262D">막국수 원가</text></g>
        <g id="R2"><rect x="-170" y="-168" width="340" height="90" rx="8" fill="#1F5FD1"/><text x="0" y="-106" font-size="52" text-anchor="middle" fill="#fff">단골 손님</text></g>
      </g>
      <text id="eff" x="1498" y="250" font-size="84" text-anchor="middle" fill="#1F5FD1">몇 배 효율</text>
      <path id="efl" class="ln bl w6" d="M1290 276 L1706 276"/>
    </svg>
  </div>
</div>
<script src="../data/s64.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#F4F5F2', '#20262D', '#1F5FD1', '#D63A3A'];   // 모눈 · 선 · 파랑(막국수 서비스·단골 쪽이 이김) · 빨강(수수료·광고비 — 연출표 뜻 색)
const T = { q: S.at('어떠세요'), sv: S.at('서비스로'), mk: S.at('마케팅이'), pl: S.at('배달앱'), b1: S.at('수수료나'), b2: S.at('광고비'), sub: S.at('한 명당'), pr: S.at('이 비용이'), r1: S.at('막국수', 0), heavy: S.at('비싸면'), srv: S.at('서비스로'), win: S.at('몇 배'), eff: S.at('효율'), ok: S.at('확정입니다') };
const T0 = 0.02;
S.ev(T0, 'marker', 'scale'); S.ev(T.pl, 'in', 'pl'); S.ev(T.b1, 'coin', 'L1'); S.ev(T.b2, 'gauge', 'L2'); S.ev(T.pr, 'card_in', 'pr'); S.ev(T.r1, 'in', 'R1');
S.ev(T.win, 'shine', 'R2'); S.ev(T.ok, 'marker', 'efl');
const $ = id => document.getElementById(id);
const C = (t, a, b) => S.cam(t, a, b);
function pose(tau) { return 5 * C(tau, T.b1, T.b1 + 0.45) + 4 * C(tau, T.b2, T.b2 + 0.45) - 1 * C(tau, T.r1, T.r1 + 0.4) + 4 * C(tau, T.heavy, T.heavy + 0.45) - 24 * C(tau, T.win, T.win + 0.7); }
function blk(id, tau, t0, dy = -110) { const el = $(id), k = S.ent(tau, t0, 0.14); el.style.opacity = k; el.style.transform = `translate(0px,${(dy * (1 - k)).toFixed(2)}px)`; }
S.scene(tau => {
  // 카메라: 수수료나 → 빨강 접시 쪽 · 어떠세요 → 가운데 · 막국수를 서비스로 → 오른쪽 접시 쪽 · 몇 배 → 가운데로 빠짐 / 마케팅이: 이기는 쪽만 진하게(빨강 쪽 옅어짐)
  const c1 = C(tau, T.b1, T.b1 + 0.7), c2 = C(tau, T.q, T.q + 0.7), c3 = C(tau, T.sv, T.sv + 0.7), c4 = C(tau, T.win, T.win + 0.7);
  const cz = 1 + 0.045 * (c1 - c2 + c3 - c4), cx = 15 * (c1 - c2) - 15 * (c3 - c4);
  S.css('#cam', { transform: `translateX(${cx.toFixed(2)}px) scale(${(E.drift(tau) * cz).toFixed(4)})` });
  const dm = 1 - 0.6 * S.EO(S.P(tau, T.mk, T.mk + 0.4));
  ['#L1', '#L2', '#Lsub'].forEach(id => S.css(id, { filter: `opacity(${dm.toFixed(3)})` }));
  const th = pose(tau), r = th * Math.PI / 180, dx = 550 * Math.cos(r), dy = 550 * Math.sin(r);
  const L = [960 - dx, 290 + dy], R = [960 + dx, 290 - dy];
  $('beam').setAttribute('d', `M${L[0].toFixed(1)} ${L[1].toFixed(1)} L${R[0].toFixed(1)} ${R[1].toFixed(1)}`);
  E.stroke('#post', tau, T0, 0.45); E.stroke('#base', tau, T0 + 0.2, 0.3);
  const bk = S.ent(tau, T0 + 0.1, 0.15); $('beam').style.opacity = bk; $('pv').style.opacity = bk;
  // 접시와 줄
  const pa = S.ent(tau, T.pl, 0.14), pb = S.ent(tau, T.pr, 0.14);
  $('pl').setAttribute('transform', `translate(${L[0].toFixed(1)} ${(L[1] + 310).toFixed(1)})`); $('pl').style.opacity = pa;
  $('pr').setAttribute('transform', `translate(${R[0].toFixed(1)} ${(R[1] + 310).toFixed(1)})`); $('pr').style.opacity = pb;
  // 블록
  blk('L1', tau, T.b1); blk('L2', tau, T.b2); blk('R1', tau, T.r1); blk('R2', tau, T.win, -150);
  $('Lsub').style.opacity = S.ent(tau, T.sub, 0.14);
  const ef = S.ent(tau, T.eff, 0.14); $('eff').style.opacity = ef;
  E.stroke('#efl', tau, T.ok, 0.4);
});
</script>
</body></html>
