<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s63 더 큰 서비스를 받았다고 생각 — 밤 집 냉장고 앞, 손님이 쪽지를 자석으로 붙임(실물 층, Codex 사진 + 선)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#wrap{left:0;top:0;width:1920px;height:1080px;transform-origin:1600px 240px}
.fv{left:0;top:0;width:1920px;height:1080px;pointer-events:none;opacity:0}
#fm{background:radial-gradient(ellipse 420px 480px at 1648px 190px,rgba(0,0,0,0) 40%,rgba(0,0,0,.38) 100%)}
.rg{fill:none;stroke:#4F86F0;stroke-width:8;opacity:0}
</style></head>
<body><div id="stage">
  <div id="wrap" class="abs">
    <div id="ph" class="photo"></div>
    <div id="fm" class="abs fv"></div>
  </div>
</div>
<script src="../data/s63.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#20262D', '#1F5FD1', '#1E9E5A'];
S.$('#ph').style.backgroundImage = S.ph('p63_fridge_magnet');
const T = { gson: S.at('그', 0), keun: S.at('큰'), bad: S.at('받았다고'), ak: S.at('아까운가요') };
S.ev(T.keun, 'sweep', 'push1'); S.ev(T.ak, 'sweep', 'push2');
S.scene(tau => {
  // 강조 = 냉장고 쪽지 밖을 어둡게(그 쪽지) + 천천히 밀기 두 번(큰 · 아까운가요) — 선·고리·체크 없음
  const p1 = S.cam(tau, T.keun, T.keun + 0.7), p2 = S.cam(tau, T.ak, T.ak + 0.7);
  S.css('#wrap', { transform: `scale(${((1 + 0.04 * S.P(tau, 0, S.SC.dur)) * (1 + 0.05 * p1 + 0.04 * p2)).toFixed(4)})` });
  S.css('#fm', { opacity: S.EO(S.P(tau, T.gson + 0.1, T.gson + 0.5)).toFixed(3) });
});
</script>
</body></html>
