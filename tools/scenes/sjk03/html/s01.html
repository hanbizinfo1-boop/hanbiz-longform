<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s01 포장대 김치찌개 + 영수증 12,000원 — 실물 층(Codex 사진 2.5D · 천천히 밀기)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#ring{left:0;top:0;width:1920px;height:1080px}
#dp{left:150px;top:540px;font-size:68px}
</style></head>
<body><div id="stage">
  <div id="ph" class="photo">
    <svg id="ring" class="abs" viewBox="0 0 1920 1080">
      <path id="rg" class="ln bl w6" d="M650 694 L764 640 L880 798 L748 850 Z"/>
      <path id="rl" class="ln w4" style="stroke:#fff" d="M560 636 L650 690"/>
    </svg>
    <div id="dp" class="dpan abs" data-box="dp">12,000원</div>
  </div>
</div>
<script src="../data/s01.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#1B1E22', '#FFFFFF', '#1F5FD1'];
S.css('#ph', { backgroundImage: S.ph('p01_pack_counter') });
const T = { dp: 0.1, ring: S.at('배달로') };
S.ev(T.dp, 'in', 'dp'); S.ev(T.ring, 'marker', 'rg');
S.scene(tau => {
  S.css('#ph', { transform: `scale(${E.drift(tau, 1, 1.06).toFixed(4)})` });
  E.pop('#dp', tau, T.dp, { dy: 10 });
  E.stroke('#rl', tau, T.dp + 0.1, 0.25);
  E.stroke('#rg', tau, T.ring, 0.4);
});
</script>
</body></html>
