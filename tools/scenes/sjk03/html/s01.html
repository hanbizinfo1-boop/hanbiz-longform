<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s01 포장대 김치찌개 + 영수증 12,000원 — 실물 층(Codex 사진 2.5D · 천천히 밀기)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#vg{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;opacity:0}
#dp{left:150px;top:540px;font-size:68px}
</style></head>
<body><div id="stage">
  <div id="ph" class="photo">
    <div id="vg"></div>
    <div id="dp" class="dpan abs" data-box="dp">12,000원</div>
  </div>
</div>
<script src="../data/s01.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#1B1E22', '#FFFFFF', '#1F5FD1'];
S.css('#ph', { backgroundImage: S.ph('p01_pack_counter') });
const T = { dp: 0.1, ring: S.at('배달로') };
S.ev(T.dp, 'in', 'dp'); S.ev(T.ring, 'sweep', 'push');
S.scene(tau => {
  // 두 번 밀기: 먼저 찌개 그릇 쪽(0.3초~) → «배달로» 에서 영수증 쪽으로 옮겨 감 + 바깥 비네트(선 표시 없음)
  const p1 = S.cam(tau, 0.3, 1.2), push = S.cam(tau, T.ring, T.ring + 0.7);
  const ox = S.lerp(1130, 760, push), oy = S.lerp(530, 745, push);
  const sc = E.drift(tau, 1, 1.04) * (1 + 0.06 * p1 + 0.06 * push);
  S.css('#ph', { transformOrigin: `${ox.toFixed(2)}px ${oy.toFixed(2)}px`, transform: `scale(${sc.toFixed(4)})` });
  S.css('#vg', { opacity: (0.6 * p1 + 0.4 * push).toFixed(3), background: `radial-gradient(ellipse 560px 400px at ${ox.toFixed(1)}px ${oy.toFixed(1)}px, rgba(0,0,0,0) 40%, rgba(0,0,0,.38) 100%)` });
  E.pop('#dp', tau, T.dp, { dy: 10 });
});
</script>
</body></html>
