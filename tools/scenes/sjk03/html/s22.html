<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s22 주방 벽 주문서 걸이 — «떡볶이 ×1» 대신 «떡볶이 ×3» 주문서가 꽂히고 집어 올림(실물 층 · 클로즈업 정면 · 아주 느린 밀기)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
.tk{left:0;top:0;width:215px;height:290px;color:#2B2A22;font-family:"Pre";font-weight:800;text-align:center;line-height:1.1;font-size:42px;padding-top:64px;opacity:0}
#sl{left:878px;top:284px;width:238px;height:350px;background:#F2ECDE;border-radius:3px;box-shadow:0 14px 28px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.4);
  background-image:radial-gradient(rgba(120,100,70,.10) 1px,transparent 1.3px);background-size:6px 6px;color:#2B2A22;font-family:"Pre";text-align:center;opacity:0;transform-origin:50% 0}
#sl .mn{position:absolute;left:0;right:0;top:60px;font-size:60px;font-weight:900;white-space:nowrap}
#sl .nx{position:absolute;left:0;right:0;top:150px;font-size:130px;font-weight:900;white-space:nowrap;letter-spacing:-.02em}
#sl .ulx{position:absolute;left:46px;top:290px;width:146px;height:10px;background:#1F5FD1;border-radius:5px;transform-origin:0 50%;transform:scaleX(0)}
#clip{left:956px;top:186px;width:84px;height:92px}
</style></head>
<body><div id="stage">
  <div id="ph" class="photo">
    <div id="tL" class="abs tk">김치찌개</div>
    <div id="tR" class="abs tk">막국수</div>
    <div id="sl" class="abs" data-box="sl"><div class="mn">떡볶이</div><div class="nx" id="nx">×1</div><div class="ulx" id="ulx"></div></div>
  </div>
</div>
<script src="../data/s22.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#2B2A22', '#F2ECDE', '#1F5FD1'];
S.css('#ph', { backgroundImage: S.ph('p22_ticket_rail') });
const Q = q => q.map(([x, y]) => [x * 1.25, y * 1.25 - 100]);
const QL = Q([[335, 286], [550, 286], [542, 576], [333, 573]]);
const QR = Q([[1082, 286], [1257, 286], [1277, 579], [1097, 579]]);
const T = { a: 0.25, l: 1.0, r: 1.5, ring: S.at('어떤'), b: S.at('당연히'), dim: S.at('같은'), pick: S.at('주문', 1), ul: S.at('배') };
S.ev(T.a, 'page', 'sl'); S.ev(T.l, 'paper', 'tL'); S.ev(T.ring, 'click', 'sl'); S.ev(T.b, 'in', 'sl'); S.ev(T.dim, 'marker', 'tL'); S.ev(T.pick, 'paper', 'sl'); S.ev(T.ul, 'marker', 'ulx');
S.scene(tau => {
  S.css('#ph', { transform: `scale(${E.drift(tau, 1, 1.07).toFixed(4)})` });   // 아주 느린 밀기
  S.fitQuad(S.$('#tL'), 215, 290, QL); S.fitQuad(S.$('#tR'), 215, 290, QR);
  const dim = 1 - 0.55 * S.ent(tau, T.dim, 0.3);
  [['#tL', T.l], ['#tR', T.r]].forEach(([s, t]) => {
    const e = S.$(s), k = S.ent(tau, t, 0.16); e.style.opacity = (k * dim).toFixed(3); e.style.clipPath = `inset(0 ${((1 - k) * 100).toFixed(1)}% 0 0)`;
  });
  // 가운데 걸이: ×1 이 꽂혔다가(0.25) «당연히» 에서 ×3 으로 바뀜 → «주문 단위에» 에서 집어 올려짐
  const sl = S.$('#sl'); const isB = tau >= T.b;
  S.$('#nx').textContent = isB ? '×3' : '×1';
  let a = S.ent(tau, T.a, 0.12), dy = -34 * (1 - a), sc = 1, rot = 0, ring = 0;
  if (tau >= T.ring && !isB) ring = S.ent(tau, T.ring, 0.2);
  if (isB) { const k = S.ent(tau, T.b, 0.14); a = k; dy = -34 * (1 - k); ring = 1; }
  const pk = S.EO(S.P(tau, T.pick, T.pick + 0.5));
  dy -= pk * 70; sc = 1 + 0.12 * pk; rot = -3 * pk;
  sl.style.opacity = a.toFixed(3);
  sl.style.transform = `translateY(${dy.toFixed(1)}px) rotate(${rot.toFixed(2)}deg) scale(${sc.toFixed(4)})`;
  sl.style.boxShadow = `0 ${14 + 26 * pk}px ${28 + 26 * pk}px rgba(0,0,0,.45)` + (ring > 0 ? `, 0 0 0 ${(ring * 6).toFixed(1)}px rgba(31,95,209,${(0.9 * ring).toFixed(2)})` : '');
  S.$('#ulx').style.transform = `scaleX(${S.EO(S.P(tau, T.ul, T.ul + 0.4)).toFixed(3)})`;
});
</script>
</body></html>
