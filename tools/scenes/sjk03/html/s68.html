<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s68 수수료로 단골을 만들어야 — 저녁 계산대 너머 홀, 포장 손님이 봉투 받아 나가고 다음 손님이 들어옴(실물 층, Codex 사진 + 선)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#wrap{left:0;top:0;width:1920px;height:1080px;transform-origin:960px 540px}
.fv{left:0;top:0;width:1920px;height:1080px;pointer-events:none;opacity:0}
#fP{background:radial-gradient(ellipse 430px 330px at 377px 639px,rgba(0,0,0,0) 40%,rgba(0,0,0,.38) 100%)}
#fG{background:radial-gradient(ellipse 240px 260px at 1418px 525px,rgba(0,0,0,0) 40%,rgba(0,0,0,.38) 100%)}
#fW{background:radial-gradient(ellipse 250px 420px at 1575px 420px,rgba(0,0,0,0) 40%,rgba(0,0,0,.38) 100%)}
</style></head>
<body><div id="stage">
  <div id="wrap" class="abs">
    <div id="ph" class="photo"></div>
    <div id="fP" class="abs fv"></div>
    <div id="fG" class="abs fv"></div>
    <div id="fW" class="abs fv"></div>
  </div>
</div>
<script src="../data/s68.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#20262D', '#1F5FD1', '#D63A3A'];
S.$('#ph').style.backgroundImage = S.ph('p68_counter_hall');
const T = { bae: S.at('배달앱에'), su: S.at('수수료', 0), ma: S.at('마시고'), iy: S.at('수수료를', 1), dan: S.at('단골을'), man: S.at('만드셔야'), sal: S.at('살아남는'), ga: S.at('가게가') };
const T3 = S.at('이용해서');
S.ev(T.su + 0.4, 'coin', 'fee'); S.ev(T.dan, 'sweep', 'pan1'); S.ev(T.sal, 'sweep', 'pan2');
S.scene(tau => {
  // 강조 = 대상 쪽으로 천천히 밀기·옆으로 미끄러짐 + 대상 밖 어둡게(POS → 포장 봉투 → 손님 휴대폰) — 선·✕·화살표 없음
  const k1 = S.cam(tau, T.dan, T.dan + 0.7), k2 = S.cam(tau, T.sal, T.sal + 0.7);
  const fx = 377 + (1418 - 377) * k1 + (1575 - 1418) * k2;
  const sc = 1.06 + 0.03 * S.cam(tau, T.bae, T.bae + 0.7) + 0.03 * k1 + 0.03 * k2;
  S.css('#wrap', { transform: `translateX(${(-(fx - 960) * 0.1).toFixed(2)}px) scale(${sc.toFixed(4)})` });
  const on = (a, b) => S.EO(S.P(tau, a, a + 0.3)) * (b == null ? 1 : 1 - S.EO(S.P(tau, b, b + 0.3)));
  S.css('#fP', { opacity: on(T.bae, T.dan).toFixed(3) });
  S.css('#fG', { opacity: on(T.dan, T.sal).toFixed(3) });
  S.css('#fW', { opacity: on(T.sal).toFixed(3) });
});
</script>
</body></html>
