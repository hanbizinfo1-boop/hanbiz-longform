<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s14 서울시 조사 원문 카드(다시 그린 보고서 표) — 16.9% · 29.3% 에 파란 형광펜, 카드 아래 출처 줄(실물 층)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#card{left:410px;top:130px;width:1100px;height:660px;background:#F1EDE3;border-radius:6px;color:#26211A;
  background-image:radial-gradient(rgba(120,100,70,.10) 1px,transparent 1.3px);background-size:6px 6px;
  box-shadow:0 26px 52px rgba(0,0,0,.55),0 2px 4px rgba(0,0,0,.35);transform-origin:50% 50%;opacity:0}
#card .ttl{position:absolute;left:56px;top:40px;font-size:56px;font-weight:900;white-space:nowrap}
#card .rule{position:absolute;left:44px;right:44px;height:3px;background:#8C8472;transform-origin:0 50%}
#card .hd{position:absolute;top:146px;font-size:40px;font-weight:700;color:#5B5547;white-space:nowrap}
#card .vl{position:absolute;top:226px;width:440px;text-align:center}
#card .vl span{display:inline-block;font-size:150px;font-weight:900;letter-spacing:-.03em;color:#26211A;padding:0 20px;line-height:1.15}
#card .vl .hl{background-position:0 0}
#card .col{position:absolute;top:128px;bottom:44px;width:3px;background:#8C8472;transform-origin:50% 0}
#card .trk{position:absolute;left:78px;top:520px;width:944px;height:30px;background:#DAD3C2;border-radius:15px}
#card .seg{position:absolute;top:520px;height:30px;border-radius:15px;background:#1F5FD1;transform-origin:0 50%}
#card .tk{position:absolute;top:566px;font-size:30px;font-weight:700;color:#5B5547}
#cardSrc{left:410px;top:826px;width:1100px;text-align:center;color:#C4C9CF}
</style></head>
<body><div id="stage">
  <div id="ph" class="photo">
    <div id="card" class="abs" data-box="card" data-box-group="cd">
      <div class="ttl" id="ttl">플랫폼 비용 / 매출</div>
      <div class="rule" id="rl1" style="top:116px"></div>
      <div class="col" id="cl" style="left:550px"></div>
      <div class="hd" id="h0" style="left:56px">적은 곳</div>
      <div class="hd" id="h1" style="left:600px">많은 곳</div>
      <div class="rule" id="rl2" style="top:206px"></div>
      <div class="vl" style="left:50px"><span id="v0" class="hl">16.9%</span></div>
      <div class="vl" style="left:594px"><span id="v1" class="hl">29.3%</span></div>
      <div class="trk" id="trk"></div>
      <div class="seg" id="seg" style="left:582px;width:0"></div>
    </div>
    <div id="cardSrc" class="src abs" data-box="src" data-box-group="cd">출처: 서울특별시 배달플랫폼 상생지수 (2025.12)</div>
  </div>
</div>
<script src="../data/s14.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#F1EDE3', '#26211A', '#1F5FD1'];
S.css('#ph', { backgroundImage: S.ph('p14_desk_top') });
const T = { card: 0.25, ttl: S.at('서울시가'), grid: S.at('정산'), hd: S.at('이런'), h16: S.at('16.9%'), many: S.at('많게는'), h29: S.at('29.3%'), end: S.at('나갔습니다') };
// 막대 눈금: 0%~30%(카드 폭 944px) — 16.9% 는 534px, 29.3% 는 924px
S.ev(T.card, 'paper', 'card'); S.ev(T.ttl, 'marker', 'ttl'); S.ev(T.grid, 'marker', 'rl1'); S.ev(T.h16, 'marker', 'v0'); S.ev(T.many, 'gauge', 'seg'); S.ev(T.h29, 'shine', 'v1');
S.scene(tau => {
  const k = S.P(tau, 0, S.SC.dur);
  S.css('#ph', { transform: `scale(${S.lerp(1.0, 1.06, k).toFixed(4)})` });   // 천천히 밀기
  const a = S.ent(tau, T.card, 0.14);
  S.css('#card', { opacity: a, transform: `perspective(2200px) rotateX(18deg) rotateZ(-2.6deg) translateY(${(-24 * (1 - a)).toFixed(1)}px)` });
  E.wipe('#ttl', tau, T.ttl, 0.5);
  S.$('#rl1').style.transform = `scaleX(${S.EO(S.P(tau, T.grid, T.grid + 0.4)).toFixed(3)})`;
  S.$('#rl2').style.transform = `scaleX(${S.EO(S.P(tau, T.grid + 0.15, T.grid + 0.55)).toFixed(3)})`;
  S.$('#cl').style.transform = `scaleY(${S.EO(S.P(tau, T.grid + 0.3, T.grid + 0.7)).toFixed(3)})`;
  E.pop('#h0', tau, T.hd, { dy: 6 }); E.pop('#h1', tau, T.hd + 0.12, { dy: 6 });
  // 형광펜(글자 뒤 파랑 반투명) — 칸 너비 0→100%
  S.$('#v0').style.backgroundSize = (S.EO(S.P(tau, T.h16, T.h16 + 0.45)) * 100).toFixed(1) + '% 100%';
  S.$('#v1').style.backgroundSize = (S.EO(S.P(tau, T.h29, T.h29 + 0.45)) * 100).toFixed(1) + '% 100%';
  // 숫자는 말할 때 나온다
  E.pop('#v0', tau, T.h16 - 0.05, { dy: 10 }); E.pop('#v1', tau, T.h29 - 0.05, { dy: 10 });
  // 범위 막대: 16.9% ~ 29.3% 구간이 늘어남(많게는 → 나갔습니다), 끝에서 빨강
  const trk = S.ent(tau, T.many - 0.1, 0.15); S.css('#trk', { opacity: trk });
  const g = S.EO(S.P(tau, T.many, T.h29 + 0.4));
  const seg = S.$('#seg'); seg.style.opacity = tau >= T.many ? 1 : 0; seg.style.left = '612px'; seg.style.width = (g * 390) + 'px';
  seg.style.background = tau >= T.end ? '#D63A3A' : '#1F5FD1';
  E.pop('#cardSrc', tau, T.card + 0.2, { dy: 8 });
});
</script>
</body></html>
