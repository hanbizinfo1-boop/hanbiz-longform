<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s08 진행표 카드 그대로 — 휴대폰 사진 삭제, 장면 7 끝 상태(세 칸 다 나온 카드)를 이어 그림 · «첫 번째부터» 에서 첫 칸만 진하게 (설명 층 · 판 B)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#cam{left:0;top:0;width:1920px;height:1080px;transform-origin:960px 540px}
#brk{left:0;top:0;width:1920px;height:1080px}
#cnt{left:760px;top:806px;width:400px;text-align:center;font-size:56px;color:#1F5FD1}
#band{left:240px;top:200px;width:461px;height:12px;background:#1F5FD1;opacity:0;border-radius:10px 10px 0 0}
</style></head>
<body><div id="stage">
  <div id="cam" class="abs">
    <div class="grid"></div>
    <svg id="brk" class="abs" viewBox="0 0 1920 1080">
      <path id="bk" class="ln w6" style="stroke:#1F5FD1" d="M240 750 L240 774 L1680 774 L1680 750 M960 774 L960 794"/>
      <path id="ck" class="ln w6" style="stroke:#1F5FD1;opacity:0" d="M890 800 L945 852 L1040 768"/>
    </svg>
    <div id="cnt" class="abs t" data-box="cnt">세 가지</div>
    <div id="band" class="abs"></div>
  </div>
</div>
<script src="../data/s08.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script src="../lib/prog.js"></script>
<script>
window.PALETTE = ['#F4F5F2', '#20262D', '#1F5FD1'];
// 장면 7 끝 상태와 같은 카드(x240 y200 w1440 h520) — 세 칸 다 나와 있고, 바탕은 장면 7 끝 배율 1.04 에서 이어 1.06 까지 아주 느리게
const T = { first: S.at('첫'), v0: S.at('영상을'), pan: S.at('판단이') };
const pc = PROG.mount('#cam', { x: 240, y: 200, w: 1440, h: 520 });
['#band'].forEach(s => document.getElementById('cam').appendChild(S.$(s)));
S.ev(T.first, 'click', 'cell0'); S.ev(T.pan, 'marker', 'check');
S.scene(tau => {
  S.css('#cam', { transform: `scale(${S.lerp(1.04, 1.06, S.P(tau, 0, S.SC.dur - 0.3)).toFixed(4)})` });
  PROG.draw(pc, [{ show: 1, on: 0 }, { show: 1, on: 0 }, { show: 1, on: 0 }], 1);
  // 이 영상을 끝까지 보시면: 카드 세 칸이 왼→오 0.35초 간격으로 하나씩 살짝 진해졌다 돌아감(가격→광고→단골 훑기)
  pc.root.querySelectorAll('.pcell').forEach((c, i) => {
    const a = T.v0 + 0.35 * i, p = S.P(tau, a, a + 0.15) * (1 - S.P(tau, a + 0.15, a + 0.35));
    c.querySelector('.pfill').style.opacity = (0.16 * p).toFixed(3);
  });
  // 장면 7 끝에 남아 있던 괄호·«세 가지» 는 앞 0.6초 동안 서서히 걷힘(경계가 안 보이게)
  const fo = 1 - S.P(tau, 0.1, 0.7);
  S.css('#bk', { opacity: fo }); S.css('#cnt', { opacity: fo });
  // 첫 번째부터: 첫 칸만 진하게(파랑 띠 · 파랑 테두리), 나머지 두 칸은 옅게
  const k = S.ent(tau, T.first, 0.2);
  const cs = pc.root.querySelectorAll('.pcell');
  cs[0].style.borderColor = k > 0 ? '#1F5FD1' : '';
  cs[0].style.boxShadow = k > 0 ? `0 0 0 ${(k * 5).toFixed(1)}px rgba(31,95,209,.40)` : '';
  cs[1].style.opacity = (1 - 0.65 * k).toFixed(3); cs[2].style.opacity = (1 - 0.65 * k).toFixed(3);
  // 바로 판단이 서실 겁니다: 카드 아래 가운데 파랑 체크 선이 그려지고, 첫 번째부터 0.3초에 걷힘
  E.stroke('#ck', tau, T.pan, 0.5);
  S.css('#ck', { opacity: tau >= T.pan ? (1 - S.P(tau, T.first, T.first + 0.3)) : 0 });
  S.css('#band', { opacity: k, transform: `translateY(${(0).toFixed(1)}px)` });
});
</script>
</body></html>
