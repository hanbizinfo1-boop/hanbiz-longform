<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s47 언제 개선? — 하루 시간 막대(남는 시간 칸 파랑 안에 인테리어·맛과 양·리뷰 답변 세 칸) · 설명 층</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#cam{left:0;top:0;width:1920px;height:1080px;transform-origin:960px 540px}
#frame{left:196px;top:330px;width:1528px;height:480px}
#gseg{left:236px;top:370px;width:340px;height:400px;background:#E9ECEE;border:2px solid #C9CED3;border-radius:8px}
#gseg .t{position:absolute;left:0;width:100%;top:150px;text-align:center;font-size:48px;line-height:1.3;white-space:normal;color:var(--mute)}
#bseg{left:604px;top:370px;width:1080px;height:400px;background:var(--blt);border:3px solid var(--bl);border-radius:8px}
#hq{left:236px;top:200px;font-size:92px;font-weight:900;color:#A9B0B6}
#hn{left:604px;top:200px;font-size:92px;font-weight:900;color:var(--bl)}
.cell{position:absolute;top:402px;width:320px;height:336px;background:#fff;border:2px solid var(--bl);border-radius:10px}
.cell svg{position:absolute;left:60px;top:24px;width:200px;height:180px}
.cell .t{position:absolute;left:0;width:100%;top:236px;text-align:center;font-size:58px;font-weight:900;color:var(--bl)}
</style></head>
<body><div id="stage">
  <div id="cam" class="abs">
    <div class="grid"></div>
    <svg id="frame" class="abs" viewBox="0 0 1528 480" data-box="frame" data-box-group="bar"><path id="f1" class="ln w4" d="M8 8 L1520 8 L1520 472 L8 472 Z"/></svg>
    <div id="hq" class="abs t" data-box="hq">언제?</div>
    <div id="hn" class="abs t" data-box="hn">남는 시간</div>
    <div id="gseg" class="abs" data-box="gseg" data-box-group="bar"><div class="t">배달 단가<br>조정</div></div>
    <div id="bseg" class="abs" data-box="bseg" data-box-group="bar"></div>
    <div class="cell" id="c0" style="left:636px" data-box="c0" data-box-group="bar">
      <svg viewBox="0 0 200 180"><path class="ln bl w4" d="M100 8 L100 58"/><path class="ln bl w4" d="M52 112 C58 78 78 58 100 58 C122 58 142 78 148 112 Z"/><path class="ln bl w4" d="M86 130 C92 146 108 146 114 130"/><path class="ln bl w4" d="M58 142 L44 154"/><path class="ln bl w4" d="M142 142 L156 154"/><path class="ln bl w4" d="M100 150 L100 170"/></svg>
      <div class="t">인테리어</div>
    </div>
    <div class="cell" id="c1" style="left:984px" data-box="c1" data-box-group="bar">
      <svg viewBox="0 0 200 180"><path class="ln bl w4" d="M40 80 L160 80 C156 130 130 155 100 155 C70 155 44 130 40 80 Z"/><path class="ln bl w4" d="M28 80 L172 80"/><path class="ln bl w4" d="M78 60 C72 45 86 38 80 22"/><path class="ln bl w4" d="M120 60 C114 45 128 38 122 22"/></svg>
      <div class="t">맛 · 양</div>
    </div>
    <div class="cell" id="c2" style="left:1332px" data-box="c2" data-box-group="bar">
      <svg viewBox="0 0 200 180"><path class="ln bl w4" d="M26 24 L174 24 L174 112 L26 112 Z"/><path class="ln bl w4" d="M50 50 L150 50"/><path class="ln bl w4" d="M50 78 L120 78"/><path class="ln bl w4" d="M168 150 C 168 132, 130 132, 92 142"/><path class="ln bl w4" d="M106 128 L90 142 L108 154"/></svg>
      <div class="t">리뷰 답변</div>
    </div>
  </div>
</div>
<script src="../data/s47.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#F4F5F2', '#20262D', '#1F5FD1'];   // 모눈 · 선 · 파랑(남는 시간)
const T = { q: S.at('언제'), adj: S.at('배달 단가를'), free: S.at('남는'), c0: S.at('인테리어는'), c1: S.at('같은 업종에'), c2: S.at('리뷰는') };
const T0 = 0.02;
S.ev(T0, 'marker', 'frame'); S.ev(T.q, 'card_in', 'q'); S.ev(T.adj, 'gauge', 'gseg'); S.ev(T.free, 'click', 'bseg');
S.ev(T.c0, 'card_in', 'c0'); S.ev(T.c1, 'in', 'c1'); S.ev(T.c2, 'card_in', 'c2');
function cell(id, tau, t0) {
  const k = E.pop('#' + id, tau, t0, { dy: 18 });
  document.querySelectorAll('#' + id + ' svg .ln').forEach((p, i) => E.stroke(p, tau, t0 + 0.1 + 0.12 * i, 0.45));
  E.wipe('#' + id + ' .t', tau, t0 + 0.55, 0.5);
}
S.scene(tau => {
  S.css('#cam', { transform: `scale(${E.drift(tau).toFixed(4)})` });
  E.stroke('#f1', tau, T0, 0.6);
  E.pop('#hq', tau, T.q, { dy: 10 });
  S.css('#hq', { opacity: S.ent(tau, T.q, 0.12) * (1 - S.P(tau, T.free - 0.05, T.free + 0.08)) });
  E.wipe('#gseg', tau, T.adj, 0.55);
  E.wipe('#bseg', tau, T.free, 0.6);
  E.wipe('#hn', tau, T.free + 0.1, 0.6);
  cell('c0', tau, T.c0); cell('c1', tau, T.c1); cell('c2', tau, T.c2);
});
</script>
</body></html>
