<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s30 레시피·응대·쿠폰북·인테리어 — 2×2 사진 격자(단어마다 한 칸씩) · 실물 층</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#wrap{left:0;top:0;width:1920px;height:1080px}
#bgp{left:0;top:0;width:1920px;height:1080px;background-size:cover;background-position:center;filter:blur(28px) brightness(.38) saturate(.9);transform:scale(1.08)}
.slot{position:absolute;width:830px;height:380px;border-radius:10px;background:rgba(255,244,230,.07);opacity:0}
.cell{position:absolute;width:830px;height:380px;overflow:hidden;border-radius:10px;opacity:0;background:#1E1710}
.cin{position:absolute;left:0;top:0;width:830px;height:553px;background-size:830px 553px;background-repeat:no-repeat}
</style></head>
<body><div id="stage">
  <div id="wrap" class="abs">
    <div id="bgp" class="abs"></div>
    <div class="slot" id="sl1" style="left:120px;top:70px"></div><div class="slot" id="sl2" style="left:970px;top:70px"></div>
    <div class="slot" id="sl3" style="left:120px;top:480px"></div><div class="slot" id="sl4" style="left:970px;top:480px"></div>
    <div class="cell" id="c1" data-box="c1" style="left:120px;top:70px"><div class="cin" id="i1"></div></div>
    <div class="cell" id="c2" data-box="c2" style="left:970px;top:70px"><div class="cin" id="i2"></div></div>
    <div class="cell" id="c3" data-box="c3" style="left:120px;top:480px"><div class="cin" id="i3"></div></div>
    <div class="cell" id="c4" data-box="c4" style="left:970px;top:480px"><div class="cin" id="i4"></div></div>
  </div>
</div>
<script src="../data/s30.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#F4EFE6', '#1F5FD1', '#1E1710'];   // 크림 틀 · 파랑(짚는 것) · 따뜻한 어둠 바탕
const CELLS = [[120, 70], [970, 70], [120, 480], [970, 480]];
const T = { rec: S.at('레시피'), res: S.at('응대'), cou: S.at('쿠폰북'), dan: S.at('단골'), man: S.at('만들기'), int: S.at('인테리어나'), ire: S.at('이런'), don: S.at('돈을'), yeon: S.at('연구해야') };
S.ev(0.05, 'in', 'frames'); S.ev(T.rec, 'card_in', 'c1'); S.ev(T.res, 'in', 'c2'); S.ev(T.cou, 'card_in', 'c3'); S.ev(T.int, 'in', 'c4'); S.ev(T.don, 'sweep', 'push'); S.ev(T.yeon, 'shine', 'c1');
const PHOTO = ['p30a_recipe_note', 'p30b_bowl_handing', 'p30c_stamp_card', 'p30d_warm_hall'];
const BASEY = [-153, -94, -153, -86], T_IN = [T.rec, T.res, T.cou, T.int], DIR = [1, -1, 1, -1];
S.css('#bgp', { backgroundImage: S.ph('p30d_warm_hall') });
PHOTO.forEach((n, i) => S.css('#i' + (i + 1), { backgroundImage: S.ph(n) }));
S.scene(tau => {
  // 칸 바탕 자리는 선이 아니라 옅은 면으로 먼저 깔리고, 단어마다 사진이 한 칸씩 채워진다. «돈을» 에서 격자 전체가 천천히 밀려 들어감
  const pu = S.cam(tau, T.don, T.don + 0.7);
  S.css('#wrap', { transform: `scale(${(E.drift(tau, 1, 1.02) * (1 + 0.04 * pu)).toFixed(4)})` });
  CELLS.forEach((c, i) => {
    S.css('#sl' + (i + 1), { opacity: S.ent(tau, 0.05 + 0.1 * i, 0.3) * (tau < T_IN[i] ? 1 : 0) });
    const k = S.ent(tau, T_IN[i], 0.12);
    // «이런» 에서 칸을 차례로 비춘다: 그 칸이 밝고 나머지는 어두워짐(0.27초 간격) — «돈을» 에서 모두 원래 밝기
    let lit = 1;
    if (tau >= T.ire && tau < T.don) { const on = Math.min(3, Math.max(0, Math.floor((tau - T.ire) / 0.27 + 1e-6))); lit = (on === i) ? 1 : 0.62; }
    const dim = i === 0 ? 0 : 0.55 * S.EO(S.P(tau, T.yeon, T.yeon + 0.3));
    S.css('#c' + (i + 1), { opacity: k, transform: `scale(${(0.96 + 0.04 * k).toFixed(4)})`, filter: `brightness(${((1 - dim) * lit).toFixed(3)})` });
    // 칸마다 살짝 밀기: 칸 안 사진이 자기 방향으로 천천히 옆 흐름 + 아주 조금 확대
    const p = S.P(tau, T_IN[i], S.SC.dur);
    const sc = 1.06 + (i === 0 ? 0.04 * S.EO(S.P(tau, T.yeon, T.yeon + 1.2)) : 0);
    S.css('#i' + (i + 1), { transform: `translate(${(DIR[i] * (-14 + 28 * p)).toFixed(2)}px,${BASEY[i]}px) scale(${sc.toFixed(4)})` });
  });
});
</script>
</body></html>
