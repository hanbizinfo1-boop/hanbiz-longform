<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s37 진행표 둘째 칸 «광고» 켜지고 칸으로 들어감 → 칸 안 가게 목록에서 한 줄이 맨 위로 (설명 층 · 진행표 카드)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#cam{left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.rw{position:absolute;left:789px;width:342px;height:52px;background:#fff;border-radius:8px;display:flex;align-items:center;gap:12px;padding:0 14px;font-family:"Pre";font-weight:800;font-size:23px;color:#20262D;z-index:5;white-space:nowrap;border:3px solid #fff}
.rw .th{width:30px;height:30px;border-radius:50%;border:2.5px solid #20262D;flex:none}
.rw .tg{margin-left:auto;background:#20262D;color:#fff;border-radius:6px;padding:3px 10px;font-size:18px;font-weight:800;opacity:0}
.rw.me{border-color:#20262D}
</style></head>
<body><div id="stage">
  <div id="cam" class="abs">
    <div class="grid"></div>
    <div id="bt" class="abs t" style="left:793px;top:340px;width:334px;height:50px;font-size:28px;font-weight:900;color:#fff;opacity:0;z-index:6;display:flex;align-items:center;gap:12px"><span style="opacity:.8">2</span>광고</div>
    <div id="r0" class="rw" data-box="r0" data-box-group="list"><span class="th"></span>○○</div>
    <div id="r1" class="rw" data-box="r1" data-box-group="list"><span class="th"></span>○○</div>
    <div id="r2" class="rw" data-box="r2" data-box-group="list"><span class="th"></span>○○</div>
    <div id="r3" class="rw me" data-box="r3" data-box-group="list"><span class="th"></span>우리 가게<span class="tg" id="tg">광고</span></div>
    <div id="r4" class="rw" data-box="r4" data-box-group="list"><span class="th"></span>○○</div>
    <svg id="upS" class="abs" style="left:720px;top:400px;width:50px;height:240px" viewBox="0 0 50 240" data-box="upS">
      <path id="upA" class="ln bl w6" d="M25 226 L25 14 M8 34 L25 12 L42 34"/>
    </svg>
  </div>
</div>
<script src="../data/s37.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script src="../lib/prog.js"></script>
<script>
window.PALETTE = ['#F4F5F2', '#20262D', '#1F5FD1'];   // 모눈 · 선 · 파랑(켜진 칸)
const pc = PROG.mount('#cam', { x: 360, y: 330, w: 1200, h: 380 });
const cells = pc.root.querySelectorAll('.pcell');
const T = { on: S.at('두번째는'), push: S.at('예시로') - 0.45, rows: S.at('예시로') + 0.06, tag: S.at('돈을'), rise: S.at('띄우는'), me: S.at('우리 가게를'), up: S.at('위로') };
S.ev(T.on, 'click', 'cell2'); S.ev(T.push, 'sweep', 'push'); S.ev(T.rows, 'card_in', 'rows'); S.ev(T.tag, 'marker', 'tag'); S.ev(T.rise, 'shine', 'rise');
const RY = i => 406 + 60 * i;
S.scene(tau => {
  // 카드 전체 → 둘째 칸으로 밀고 들어감(0.5초)
  const cam = S.camState(tau, [{ t: -9, s: 1, x: 960, y: 540 }, { t: T.push, s: 2.0, x: 960, y: 540, d: 0.5 }]);
  S.css('#cam', { transform: S.camCss(cam) });
  const on2 = S.P(tau, T.on, T.on + 0.2), out = 1 - S.P(tau, T.push + 0.35, T.push + 0.6);
  PROG.draw(pc, [{ show: 1, on: 1 }, { show: out, on: on2 }, { show: 1, on: 0 }], 1);
  cells[1].querySelector('.pnum').style.opacity = out;
  const nf = 1 - 1.0 * S.P(tau, T.push, T.push + 0.4);
  cells[0].style.opacity = nf; cells[2].style.opacity = nf;
  // 들어간 칸 = 흰 카드 + 위쪽 파랑 띠(단색 판 금지): 파랑이 띠로 줄고 «2 광고» 글이 띠 안에
  const bk = S.EZ(S.P(tau, T.push + 0.1, T.push + 0.5));
  cells[1].querySelector('.pfill').style.height = S.lerp(100, 19, bk).toFixed(2) + '%';
  const bt = document.getElementById('bt'); bt.style.opacity = bk;
  // 칸 안 가게 목록: 5줄이 차례로
  const k = S.EZ(S.P(tau, T.rise, T.rise + 0.4));
  const idx = [0, 1, 2, 3, 4].map(i => (i === 3 ? 3 * (1 - k) : (i < 3 ? i + k : i)));
  [0, 1, 2, 3, 4].forEach(i => {
    const el = document.getElementById('r' + i);
    E.pop(el, tau, T.rows + i * 0.18, { dy: 10, sc: 0 });
    el.style.top = RY(idx[i]).toFixed(1) + 'px';
    el.style.zIndex = i === 3 ? 7 : 5;
  });
  // 우리 가게를: 우리 가게 줄만 진하게, 나머지 줄은 옅게(0.4초) — 위로 올라간 뒤에도 그대로
  const dm = 1 - 0.58 * S.ent(tau, T.me, 0.4);
  [0, 1, 2, 4].forEach(i => { const el = document.getElementById('r' + i); el.style.opacity = (parseFloat(el.style.opacity) * dm).toFixed(3); });
  // 위로: 줄 왼쪽에 파랑 위쪽 화살표가 그려지고(0.35초) 줄이 올라가면 걷힘
  E.stroke('#upA', tau, T.up - 0.12, 0.35);
  document.getElementById('upA').style.opacity = tau >= T.up - 0.12 ? (1 - S.P(tau, T.rise + 0.5, T.rise + 0.8)).toFixed(3) : 0;
  // 돈을 내고 → «광고» 꼬리표
  document.getElementById('tg').style.opacity = S.ent(tau, T.tag, 0.12);
  // 위로 올라간 뒤 파랑 강조(칸 파랑 위라 어두운 테두리 + 꼬리표)
  document.getElementById('r3').style.borderColor = '#20262D';
});
</script>
</body></html>
