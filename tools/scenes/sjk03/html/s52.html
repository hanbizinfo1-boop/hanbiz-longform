<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s52 s41 경로도 다시 — 별점 표지판이 초록 체크, 화살표가 문 안으로 (설명 층)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#cam{left:0;top:0;width:1920px;height:1080px;transform-origin:960px 540px}
#art{left:0;top:0;width:1920px;height:1080px}
#adl{left:800px;top:640px;font-size:56px;transform:translate(-50%,-50%)}
</style></head>
<body><div id="stage">
  <div id="cam" class="abs">
    <div class="grid"></div>
    <!-- 경로도: s52 가 이 <svg id="route"> 한 덩어리를 복사해 씀 -->
    <svg id="route" class="abs" viewBox="0 0 1920 1080" style="left:0;top:0;width:1920px;height:1080px">
      <path id="gr" class="ln w4" d="M120 780 H1800"/>
      <path id="bw" class="ln w4" d="M1560 780 V220 H1800 V780"/>
      <path id="bd" class="ln w4" d="M1620 780 V560 H1740 V780"/>
      <path id="bsg" class="ln w4" d="M1590 330 H1770 V420 H1590 Z"/>
      <path id="bwin" class="ln" d="M1590 470 H1770"/>
      <!-- 별점 표지판 -->
      <path id="bd1" class="ln w4" d="M1230 400 H1500 V620 H1230 Z"/>
      <path id="bl1" class="ln w4" d="M1500 450 H1560 M1500 570 H1560"/>
      <path id="s0" class="ln w4" d="M0 0"/><path id="s1" class="ln w4" d="M0 0"/><path id="s2" class="ln w4" d="M0 0"/><path id="s3" class="ln w4" d="M0 0"/><path id="s4" class="ln w4" d="M0 0"/>
      <path id="chk" class="ln gn w6" style="opacity:0" d="M1325 545 L1365 585 L1445 510"/>
      <!-- 손님 -->
      <g id="cus" style="opacity:0"><path class="ln w4" d="M280 650 a42 42 0 1 0 84 0 a42 42 0 1 0 -84 0 M322 692 V740 M322 740 L296 780 M322 740 L348 780 M322 704 H282 M322 704 H362"/></g>
      <!-- 화살표: 광고(파랑) → 표지판 앞 / 빨강 U턴 -->
      <path id="ar" class="ln bl w6" d="M420 700 H1190"/><path id="ar2" class="ln bl w6" d="M1190 700 H1520"/>
      <path id="ah" class="ln bl w6" d="M1482 666 L1526 700 L1482 734"/>
      <path id="ut" class="ln rd w6" style="stroke-dasharray:16 12" d="M1130 580 L900 580"/>
      <path id="uh" class="ln rd w6" d="M944 546 L896 580 L944 614"/>
      <path id="x1" class="ln rd w6" d="M1010 550 L1070 610"/><path id="x2" class="ln rd w6" d="M1070 550 L1010 610"/>
    </svg>
    <div id="adl" class="abs t bl" data-box="adl">광고</div>
    <div id="ess" class="abs t bl" data-box="ess" style="left:1365px;top:340px;font-size:64px;transform:translate(-50%,-50%)">본질</div>
  </div>
</div>
<script src="../data/s52.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#F4F5F2', '#20262D', '#1F5FD1', '#D63A3A', '#1E9E5A'];   // 모눈 · 선 · 파랑 · 빨강(돌려보낸 옛 길) · 초록(체크)
const NS = 'http://www.w3.org/2000/svg';
function star(cx, cy, R, r) { let d = ''; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r : R; d += (i ? 'L' : 'M') + (cx + rr * Math.cos(a)).toFixed(1) + ' ' + (cy + rr * Math.sin(a)).toFixed(1); } return d + 'Z'; }
for (let i = 0; i < 5; i++) { const e = document.getElementById('s' + i); e.setAttribute('d', star(1277 + i * 44, 460, 20, 8)); }
const T0 = 0.02;
const T = { cus: S.at('광고는'), ok: S.at('가게를'), chk: S.at('더빨리'), door: S.at('알리는'), bad: S.at('안좋은'), no: S.at('아닙니다'), rem: S.at('기억하세요'), ess: S.at('본질이') };
S.ev(T0, 'in', 'town'); S.ev(T.cus, 'card_in', 'cus'); S.ev(T.ok, 'shine', 'stars'); S.ev(T.chk, 'ok', 'check'); S.ev(T.door, 'marker', 'door'); S.ev(T.bad + 0.45, 'page', 'ghost'); S.ev(T.no, 'no', 'x'); S.ev(T.rem, 'click', 'ring'); S.ev(T.ess, 'shine', 'ess');
S.scene(tau => {
  S.css('#cam', { transform: `scale(${E.drift(tau).toFixed(4)})` });
  E.stroke('#gr', tau, T0, 0.5); E.stroke('#bw', tau, T0 + 0.05, 0.5); E.stroke('#bd', tau, T0 + 0.25, 0.3); E.stroke('#bsg', tau, T0 + 0.35, 0.3); E.stroke('#bwin', tau, T0 + 0.5, 0.2);
  E.stroke('#bd1', tau, T0 + 0.2, 0.4); E.stroke('#bl1', tau, T0 + 0.5, 0.2);
  E.pop('#adl', tau, T.cus + 0.1, { base: 'translate(-50%,-50%)', dy: 0 });
  S.css('#cus', { opacity: S.ent(tau, T.cus, 0.12) });
  E.stroke('#ar', tau, T.cus + 0.2, 0.9);
  // 별 다섯 개가 좋은 가게 → 파랑으로 채워짐, 초록 체크
  for (let i = 0; i < 5; i++) { const e = document.getElementById('s' + i); E.stroke('#s' + i, tau, T0 + 0.3, 0.2); e.style.fill = tau > T.ok + i * 0.07 ? '#1F5FD1' : 'none'; e.style.stroke = tau > T.ok + i * 0.07 ? '#1F5FD1' : '#20262D'; }
  E.stroke('#chk', tau, T.chk, 0.3);
  // 알리는 → 화살표가 표지판을 지나 문 안으로
  E.stroke('#ar2', tau, T.door, 0.55); E.stroke('#ah', tau, T.door + 0.5, 0.15);
  // 안 좋은 가게 → 예전 U턴(점선, 옅게) + ✕
  E.stroke('#ut', tau, T.bad + 0.45, 0.5); E.stroke('#uh', tau, T.bad + 0.9, 0.15);
  document.getElementById('ut').style.opacity = tau >= T.bad + 0.45 ? 0.55 : 0; document.getElementById('uh').style.opacity = tau >= T.bad + 0.9 ? 0.55 : 0;
  E.stroke('#x1', tau, T.no, 0.2); E.stroke('#x2', tau, T.no + 0.1, 0.2);
  { const rk = S.ent(tau, T.rem, 0.3), bd = document.getElementById('bd1'); bd.style.stroke = rk > 0 ? '#1F5FD1' : ''; bd.style.strokeWidth = rk > 0 ? (4 + 4 * rk).toFixed(2) : ''; }
  E.pop('#ess', tau, T.ess, { base: 'translate(-50%,-50%)', dy: 0 });
});
</script>
</body></html>
