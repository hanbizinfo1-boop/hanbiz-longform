<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s26 시급 3천 원 버리기 — 한낮 빈 홀 계산대, 엎어 둔 휴대폰에 괄호 → 3,000원 판 → 빨강 줄 · 실물 층</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#wrap{left:0;top:0;width:1920px;height:1080px}
#vig{left:0;top:0;width:1920px;height:1080px;background:radial-gradient(ellipse 52% 56% at 61% 72%,rgba(0,0,0,0) 30%,rgba(10,6,2,.62) 100%);opacity:0}
#lit{left:880px;top:650px;width:560px;height:300px;background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(255,226,170,.42),rgba(255,226,170,0) 70%);opacity:0}
#fx{left:0;top:0;width:1920px;height:1080px}
#dp{left:1010px;top:520px;width:520px;height:150px;font-size:112px;text-align:center;padding:18px 0 0}
</style></head>
<body><div id="stage">
  <div id="wrap" class="abs">
    <div id="ph" class="photo"></div>
    <div id="vig" class="abs"></div>
    <div id="lit" class="abs"></div>
    <div id="dp" class="dpan" data-box="dp"><span id="dpn">0원</span></div>
    <svg id="fx" class="abs" viewBox="0 0 1920 1080">
      <path id="br" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M969 757 V712 H1014 M1299 712 H1344 V757 M1344 811 V856 H1299 M1014 856 H969 V811"/>
      <path id="stk" fill="none" stroke="#FF6B6B" stroke-width="10" stroke-linecap="round" d="M1030 632 L1510 560"/>
    </svg>
  </div>
</div>
<script src="../data/s26.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#1B1E22', '#FFFFFF', '#FF6B6B'];   // 어두운 판 · 흰 글 · 빨강 줄(버리는 생각)
const T = { sim: S.at('명심해야'), si: S.at('시급'), three: S.at('3천'), bu: S.at('버리셔야'), hand: S.at('한다는') };
S.ev(1.21, 'marker', 'bracket'); S.ev(2.3, 'shine', 'light'); S.ev(T.si, 'card_in', 'dp'); S.ev(T.three, 'gauge', 'count'); S.ev(4.4, 'marker', 'ring'); S.ev(T.bu, 'no', 'strike');
S.css('#ph', { backgroundImage: S.ph('p26_empty_hall_noon') });
S.scene(tau => {
  // 아주 느린 밀기(1.00→1.08) — 휴대폰 쪽으로
  S.css('#wrap', { transformOrigin: '1150px 780px', transform: `scale(${E.drift(tau, 1, 1.08).toFixed(4)})` });
  S.css('#vig', { opacity: S.EO(S.P(tau, 0.02, 1.4)) });
  E.stroke('#br', tau, T.sim, 0.5);
  S.css('#lit', { opacity: S.EO(S.P(tau, 2.3, 2.8)) * 0.9 });
  const k = S.ent(tau, T.si, 0.12);
  S.css('#dp', { opacity: k, transform: `translateY(${(16 * (1 - k)).toFixed(1)}px)` });
  const n = S.count(tau, T.three, T.three + 0.55, 0, 3000);
  document.getElementById('dpn').textContent = (tau < T.si ? '' : S.fmt(Math.floor(n / 10) * 10) + '원');
  E.ring('#dp', tau, 4.4, '127,168,245');
  E.stroke('#stk', tau, T.bu, 0.4);
  // 괄호가 «버림» 쪽 빨강으로
  const rd = S.EO(S.P(tau, T.hand, T.hand + 0.25));
  S.css('#br', { stroke: rd > 0.5 ? '#FF6B6B' : '#fff' });
});
</script>
</body></html>
