<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s53 진행표 카드 — 두 칸 켜진 채 셋째 칸 «단골»이 아래로 내려가 두 칸을 받치는 받침이 됨 (설명 층 · 진행표 카드)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#cam{left:0;top:0;width:1920px;height:1080px;transform-origin:960px 540px}
#art{left:0;top:0;width:1920px;height:1080px;pointer-events:none}
#brl{left:755px;top:740px;font-size:48px;transform:translate(-50%,-50%)}
</style></head>
<body><div id="stage">
  <div id="cam" class="abs">
    <div class="grid"></div>
    <svg id="art" class="abs" viewBox="0 0 1920 1080">
      <path id="br" class="ln bl w6" d="M362 664 V688 H1150 V664"/>
      <path id="sp0" class="ln bl w6" d="M753 716 V668 M737 686 L753 668 L769 686"/>
      <path id="sp1" class="ln bl w6" d="M1163 716 V668 M1147 686 L1163 668 L1179 686"/>
      <path id="gnd" class="ln w6" d="M300 894 H1620"/>
      <g id="pp">
        <g id="pq0"></g><g id="pq1"></g><g id="pq2"></g><g id="pq3"></g><g id="pq4"></g>
      </g>
    </svg>
    <div id="brl" class="abs t bl" data-box="brl">여기까지</div>
  </div>
</div>
<script src="../data/s53.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script src="../lib/prog.js"></script>
<script>
window.PALETTE = ['#F4F5F2', '#20262D', '#1F5FD1'];   // 모눈 · 선 · 파랑(켜진 칸)
const RX = 360, RY = 260, CW = (1200 - 56) / 3, GAP = 28;
const pc = PROG.mount('#cam', { x: RX, y: RY, w: 1200, h: 380 });
const cells = pc.root.querySelectorAll('.pcell');
cells.forEach((c, i) => { c.dataset.box = 'c' + i; });
const T = { c1: 0.12, c2: 0.5, br: S.at('여기까지'), dash: S.at('않을'), c3: S.at('세번째가'), drop: S.at('앞의'), slide: S.at('앞의') + 0.42, sup: S.at('버티게'), see: S.at('보시는'), few: S.at('많지'), gnd: S.at('해') };
S.ev(T.c1, 'card_in', 'c1'); S.ev(T.br, 'marker', 'bracket'); S.ev(T.c3, 'click', 'c3'); S.ev(T.drop, 'sweep', 'drop'); S.ev(T.sup, 'ok', 'support');
// 보시는 분: 위쪽에 작은 사람 선화 다섯이 나란히(보는 사람) — 많지 않을: 하나만 남고 옅어짐
[760, 860, 960, 1060, 1160].forEach((x, i) => { const g = document.getElementById('pq' + i), np = document.createElementNS('http://www.w3.org/2000/svg', 'path'); np.setAttribute('class', 'ln w4'); np.setAttribute('d', `M${x - 16} 124 a16 16 0 1 0 32 0 a16 16 0 1 0 -32 0 M${x} 140 V176 M${x - 18} 152 H${x + 18} M${x} 176 L${x - 12} 198 M${x} 176 L${x + 12} 198`); g.appendChild(np); });
const c3 = cells[2], word3 = c3.querySelector('.pword'), icon3 = c3.querySelector('.picon'), num3 = c3.querySelector('.pnum');
S.scene(tau => {
  // 근데 세 번째가: 셋째 칸 쪽으로 카메라가 밀고 들어감(0.6초) → 앞의: 다시 빠지며 받침이 내려옴
  const pz = S.cam(tau, 4.13, 4.73) * (1 - S.cam(tau, T.drop, T.drop + 0.7));
  S.css('#cam', { transformOrigin: `${S.lerp(960, 1360, pz).toFixed(1)}px ${S.lerp(540, 450, pz).toFixed(1)}px`, transform: `scale(${(E.drift(tau) * (1 + 0.06 * pz)).toFixed(4)})` });
  [0, 1, 2, 3, 4].forEach(i => { const g = document.getElementById('pq' + i), a = S.ent(tau, T.see + 0.1 * i, 0.15), lose = i === 4 ? 0 : S.ent(tau, T.few + 0.12 * i, 0.3), gone = S.ent(tau, 4.13, 0.3); g.style.opacity = (a * (1 - 0.8 * lose) * (1 - gone)).toFixed(3); });
  E.stroke('#gnd', tau, T.gnd, 0.5);
  const on3 = S.P(tau, T.c3, T.c3 + 0.2);
  const dropK = S.EZ(S.P(tau, T.drop, T.drop + 0.4)), slideK = S.EZ(S.P(tau, T.slide, T.slide + 0.5));
  const gone = S.P(tau, T.drop, T.drop + 0.2);
  PROG.draw(pc, [{ show: 1, on: S.P(tau, T.c1, T.c1 + 0.2) }, { show: 1, on: S.P(tau, T.c2, T.c2 + 0.2) }, { show: 1, on: on3 }], 1);
  // 셋째 칸이 켜지기 전: 파랑 점선 테두리로 «다음은 이것»
  if (tau >= T.dash && on3 < 0.5) { c3.style.borderColor = '#1F5FD1'; c3.style.borderStyle = 'dashed'; c3.style.borderWidth = '3px'; }
  else { c3.style.borderStyle = 'solid'; c3.style.borderWidth = '1px'; }
  // 첫 두 칸은 가운데로 비켜서고, 셋째 칸은 아래로 내려가 받침이 됨
  const shift = 203 * slideK;
  cells[0].style.transform += ` translateX(${shift.toFixed(1)}px)`; cells[1].style.transform += ` translateX(${shift.toFixed(1)}px)`;
  const h = S.lerp(380, 130, dropK), top = S.lerp(0, 480, dropK), left = S.lerp(2 * (CW + GAP), 203, slideK), w = S.lerp(CW, 794, slideK);
  c3.style.top = top.toFixed(1) + 'px'; c3.style.height = h.toFixed(1) + 'px'; c3.style.left = left.toFixed(1) + 'px'; c3.style.width = w.toFixed(1) + 'px';
  word3.style.top = S.lerp(243, (130 - 87) / 2, dropK).toFixed(1) + 'px'; icon3.style.opacity = 1 - gone;
  num3.style.opacity = 1 - gone;
  // 여기까지: 두 칸 아래 대괄호 — 받침이 내려오기 전에 걷힘
  const bo = tau >= T.br ? 1 - S.P(tau, T.drop - 0.05, T.drop + 0.15) : 0;
  E.stroke('#br', tau, T.br, 0.5); S.css('#br', { opacity: bo });
  E.pop('#brl', tau, T.br + 0.2, { base: 'translate(-50%,-50%)', dy: 0 }); S.css('#brl', { opacity: S.ent(tau, T.br + 0.2, 0.12) * bo });
  // 버티게 해 주는: 받침에서 두 칸으로 올라가는 화살표
  E.stroke('#sp0', tau, T.sup, 0.35); E.stroke('#sp1', tau, T.sup + 0.15, 0.35);
});
</script>
</body></html>
