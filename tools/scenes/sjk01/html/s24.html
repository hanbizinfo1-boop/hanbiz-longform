<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s24 근무표는 퍼즐 — 이름 쪽지가 칸에 들어가고 튕겨 나온다 (v2)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#rig{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:960px 540px}
#ph{position:absolute;left:0;top:-100px;width:1920px;height:1280px;background:url("../../../../소재/sjk01/codex/e24_table_daylight.png") center/100% 100% no-repeat}
#sheet{left:200px;top:250px;width:1520px;height:560px;background:#FCFCFA;border-radius:2px;box-shadow:0 18px 40px rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.2);font-family:"UI"}
.g{position:absolute;background:#EEF0F3;color:#6B7280;font-size:22px;display:flex;align-items:center;justify-content:center;border:1px solid #C8CCD2}
.hc{position:absolute;background:#F6F7F9;color:#15181C;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1px solid #C8CCD2}
.ce{position:absolute;border:1px solid #C8CCD2}
.lb{position:absolute;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:600;color:#3A3F47;border:1px solid #C8CCD2;background:#F6F7F9}
.sl{position:absolute;width:170px;height:78px;display:flex;align-items:center;justify-content:center;font-family:"Pen";font-size:64px;color:#15181C;background:#FFF9C9;box-shadow:0 8px 18px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.3)}
.sl svg{position:absolute;left:0;top:0;width:170px;height:78px;overflow:visible}
.dt{position:absolute;width:177px;height:192px;border:4px dashed #D8402F;border-radius:4px;opacity:0}
</style></head>
<body><div id="stage">
  <div id="rig">
    <div id="ph"></div>
    <div id="sheet" class="abs" data-box="sheet" data-box-group="sh" data-box-bleed></div>
    <div id="slips"></div>
  </div>
</div>
<script src="../data/s24.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#ECE8E0', '#15181C', '#D8402F'];
// 표(스프레드시트 모양): 열 머리 A~H · 행 번호 · 격자 · 머리줄 · 고정 틀 선
const DAYS = ['월', '화', '수', '목', '금', '토', '일'];
const CX = c => 206 + 185 * c, CY = r => 114 + 200 * r;
const cell = (c, r) => [200 + CX(c) + 92.5, 250 + CY(r) + 100];
let h = '';
h += `<div class="g" style="left:20px;top:20px;width:56px;height:38px"></div><div class="g" style="left:76px;top:20px;width:130px;height:38px">A</div>`;
DAYS.forEach((d, i) => { h += `<div class="g" style="left:${CX(i)}px;top:20px;width:185px;height:38px">${'BCDEFGH'[i]}</div><div class="hc" style="left:${CX(i)}px;top:58px;width:185px;height:56px">${d}</div>`; });
h += `<div class="g" style="left:20px;top:58px;width:56px;height:56px">1</div><div class="hc" style="left:76px;top:58px;width:130px;height:56px"></div>`;
[0, 1].forEach(r => { h += `<div class="g" style="left:20px;top:${CY(r)}px;width:56px;height:200px">${r + 2}</div><div class="lb" style="left:76px;top:${CY(r)}px;width:130px;height:200px">${r ? '저녁' : '점심'}</div>`; DAYS.forEach((d, i) => { h += `<div class="ce" style="left:${CX(i)}px;top:${CY(r)}px;width:185px;height:200px"></div>`; }); });
h += `<div style="position:absolute;left:20px;top:112px;width:1481px;height:3px;background:#6B7280"></div><div style="position:absolute;left:204px;top:20px;width:3px;height:494px;background:#6B7280"></div>`;
S.$('#sheet').innerHTML = h;
let dts = '';
[[2, 1, 'dA'], [4, 0, 'dB']].forEach(a => { const [x, y] = cell(a[0], a[1]); dts += `<div class="dt" id="${a[2]}" style="left:${x - 88}px;top:${y - 96}px"></div>`; });
S.$('#slips').innerHTML = dts;
const NAMES = ['서연', '준호', '민지', '현우', '지은'];
const HOME = [[540, 895], [780, 895], [1020, 895], [1260, 895], [1500, 895]];
const HROT = [-5, 3, -2, 4, -3];
NAMES.forEach((n, i) => S.$('#slips').insertAdjacentHTML('beforeend', `<div class="sl" id="sl${i}">${n}<svg viewBox="0 0 156 70" preserveAspectRatio="none"><path id="xa${i}" d="M18 10 L138 60" fill="none" stroke="#D8402F" stroke-width="10" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/><path id="xb${i}" d="M140 10 L16 60" fill="none" stroke="#D8402F" stroke-width="10" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg></div>`));
const PL = [cell(1, 0), cell(0, 1), cell(3, 0), cell(2, 1), cell(4, 0)];
const T = { j: S.at('화요일'), p: S.at('주말만'), m: S.at('시험'), a: S.at('하나'), b: S.at('그거'), z: S.at('이걸'), t: S.at('한시간이') };
const EJ = [T.j, T.p, T.m];
S.focus([{ t0: T.t - 0.1, t1: S.SC.dur + 0.3, big: '01:00:00', small: '근무표 하나에', color: '#F2C230', size: 230 }]);
S.ev(0.1, 'sweep', 'slips'); S.ev(0.9, 'card_in', 'sl4'); S.ev(T.j, 'no', 'xa0'); S.ev(T.p, 'no', 'xa1'); S.ev(T.m, 'no', 'xa2');
S.ev(T.a, 'sweep', 'sl3'); S.ev(T.a + 0.4, 'marker', 'dA'); S.ev(T.b, 'click', 'sl4'); S.ev(T.b + 0.45, 'marker', 'dB'); S.ev(T.z, 'in', 'rig');
const lerp = S.lerp;
const mixp = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
S.scene(tau => {
  // 카메라: 쪽지가 튕겨 나올 때마다 그 칸으로 컷 줌, 머릿속 장면에선 표 전체로
  const p = mixp([1 + 0.02 * S.P(tau, 0, S.SC.dur), 960, 540], [1.22, 960, 540], S.cam(tau, T.z, T.z + 0.35));
  S.css('#rig', { transformOrigin: `${p[1]}px ${p[2]}px`, transform: `scale(${p[0]})` });
  for (let i = 0; i < 5; i++) {
    const [hx, hy] = HOME[i], [px, py] = PL[i];
    const e1 = S.ent(tau, 0.05 + i * 0.2, 0.22);
    let x = lerp(hx, px, e1), y = lerp(hy, py, e1), rot = HROT[i] * (1 - e1);
    if (i < 3) {
      const xk = S.cam(tau, EJ[i], EJ[i] + 0.25);
      S.css('#xa' + i, { strokeDashoffset: 1 - S.clamp(xk * 2, 0, 1) }); S.css('#xb' + i, { strokeDashoffset: 1 - S.clamp(xk * 2 - 1, 0, 1) });
      const e2 = S.ent(tau, EJ[i] + 0.3, 0.35);
      x = lerp(x, hx, e2); y = lerp(y, hy, e2); rot = HROT[i] * (1 - e1 + e2);
    }
    if (i === 3) { const e3 = S.ent(tau, T.a, 0.35), c = cell(0, 1); x = lerp(x, c[0], e3); y = lerp(y, c[1], e3); }
    if (i === 4) { const e3 = S.ent(tau, T.b, 0.35), c = cell(2, 1); x = lerp(x, c[0], e3); y = lerp(y, c[1], e3); }
    S.css('#sl' + i, { left: (x - 85) + 'px', top: (y - 39) + 'px', transform: `rotate(${rot}deg)`, zIndex: 3 });
  }
  const dA = S.ent(tau, T.a + 0.35, 0.12) * (1 - S.ent(tau, T.b + 0.4, 0.12));
  S.css('#dA', { opacity: dA });
  S.css('#dB', { opacity: S.ent(tau, T.b + 0.4, 0.12) });
});
</script>
</body></html>
