<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s18 맛있는 국밥 vs 사골 열두 시간 — 반반</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#rp{position:absolute;left:960px;top:0;width:960px;height:1080px;overflow:hidden}
#ph{position:absolute;left:-90px;top:-150px;width:1140px;height:1280px;background:url("../../../../소재/sjk01/codex/c18_gukbap_bowl.png") 46% 50%/cover;transform-origin:50% 40%}
#vl{position:absolute;left:958px;top:0;width:4px;height:1080px;background:#15181C}
.mc{background:#FBFAF6;border-radius:20px;padding:34px 44px;font-family:"UI";box-shadow:0 24px 60px rgba(0,0,0,.28),0 2px 8px rgba(0,0,0,.2)}
.mc .nm{font-size:58px;font-weight:800;line-height:1.2}
.mc .pr{font-size:34px;font-weight:700;margin-top:4px;color:#15181C}
.mc .ds{margin-top:18px;font-size:38px;line-height:1.5;color:#3E434B;font-weight:500}
#lc{left:110px;top:360px;width:720px;height:300px}
#rc{left:1000px;top:560px;width:880px;height:360px}
</style></head>
<body><div id="stage">
  <div class="bg tex-paper"></div>
  <div id="rp"><div id="ph"></div></div>
  <div id="vl"></div>
  <div id="lc" class="abs mc" data-box="lc"><div class="nm">돼지국밥</div><div class="pr">10,000원</div><div class="ds">맛있는 국밥</div></div>
  <div id="rc" class="abs mc" data-box="rc"><div class="nm">돼지국밥</div><div class="pr">10,000원</div><div class="ds" id="rd"></div></div>
</div>
<script src="../data/s18.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#ECE8E0', '#15181C', '#F2C230'];
const SEG = [['사골을 열두 시간 고아서 국물이 뽀얗고,', 1], ['고기는 한 숟갈마다 올라옵니다.', 2]].map(a => [a[0], S.line(a[1]).t0, S.line(a[1]).t1 - 0.05]);
const T = { l: 0.1, r: S.at('사골을') - 0.25, w: S.at('당연히') };
S.ev(T.l, 'in', 'lc'); S.ev(T.r, 'card_in', 'rc'); S.ev(SEG[0][1], 'type', 'rd'); S.ev(T.w, 'shine', 'rc');
S.scene(tau => {
  S.css('#ph', { transform: `scale(${1 + 0.05 * S.P(tau, 0, S.SC.dur)})` });
  const a = S.ent(tau, T.l, 0.16), b = S.ent(tau, T.r, 0.16), w = S.cam(tau, T.w, T.w + 0.35);
  S.css('#lc', { opacity: a * (1 - 0.68 * w), filter: `blur(${2.4 * w}px)`, transform: `translateX(${(1 - a) * -40}px)` });
  S.css('#rc', { opacity: b, transform: `translateY(${(1 - b) * 36}px) scale(${1 + 0.03 * w})`, boxShadow: `0 24px 60px rgba(0,0,0,.28),0 0 0 ${9 * w}px rgba(242,194,48,${w})` });
  let txt = '';
  SEG.forEach(s => { const n = Math.floor(S.clamp((tau - s[1]) / Math.max(0.2, s[2] - s[1]), 0, 1) * [...s[0]].length); if (n > 0) txt += (txt ? ' ' : '') + [...s[0]].slice(0, n).join(''); });
  const typing = tau >= SEG[0][1] && tau < SEG[1][2] + 0.05;
  S.$('#rd').innerHTML = S.esc(txt) + (typing ? '<span class="caret"></span>' : '');
});
</script>
</body></html>
