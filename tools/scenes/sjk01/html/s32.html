<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s32 우리 가게에만 있는 것 — 게시판 클로즈업 (v2)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#ph{position:absolute;left:0;top:-100px;width:1920px;height:1280px;background:url("../../../../소재/sjk01/codex/c31_empty_board.png") 0 0/100% 100% no-repeat}
#svg{position:absolute;left:0;top:0;width:1920px;height:1080px}
.pst{position:absolute;width:250px;height:380px;padding:58px 22px 0;color:#15181C;filter:grayscale(.6) brightness(.93)}
.pst:before{content:"";position:absolute;left:112px;top:6px;width:26px;height:16px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.34),rgba(0,0,0,0) 70%)}
.pst .bd{position:absolute;left:0;top:0;right:0;height:40px;background:#15181C;color:#F2C230;font-size:22px;line-height:40px;text-align:center;letter-spacing:.2em}
.pst .h{font-family:"Serif";font-weight:900;font-size:31px;line-height:1.28;margin-bottom:16px}
.pst .b{font-size:24px;line-height:1.5;font-weight:500}
.pst .b div{margin-bottom:5px}
.u{background:linear-gradient(#7C776E,#7C776E) no-repeat 0 100%/100% 3px;padding-bottom:1px}
#memo{left:848px;top:150px;width:250px;height:330px;padding:34px 22px;transform:rotate(1.2deg)}
#memo .ln{font-family:"Pen";font-size:50px;line-height:1.35;color:#15181C;white-space:nowrap;margin-bottom:12px}
#memo .ln span{background:linear-gradient(#F2C230,#F2C230) no-repeat 0 85%/0% 45%}
#yel{left:788px;top:118px;width:360px;height:604px;padding:30px 24px;background-color:#F9E39A;background-blend-mode:multiply;color:#15181C}
#yel .t{font-size:27px;font-weight:700;line-height:1.35;margin-bottom:14px}
#yel .l{font-size:22px;line-height:1.42;font-weight:500;margin-bottom:9px}
#yel .hl{background:linear-gradient(#F2C230,#F2C230) no-repeat 0 100%/0% 100%;font-weight:700}
/* AI 대화창 — 사이드바 + 모델 표시 + 말풍선 + 입력창 */
.aiw{display:flex;background:#fff;border-radius:14px;overflow:hidden;font-family:"UI";color:#1A1A1A;box-shadow:0 40px 80px rgba(0,0,0,.5)}
.aiw .sb{width:236px;background:#F4F5F7;border-right:1px solid #E3E5E8;padding:18px 12px;display:flex;flex-direction:column;gap:6px;font-size:22px}
.aiw .sb .nw{display:flex;align-items:center;gap:8px;border:1.5px solid #D7DBE2;border-radius:10px;padding:10px 12px;background:#fff;font-weight:600;margin-bottom:10px}
.aiw .sb .it{padding:9px 12px;border-radius:8px;color:#4A4F57;white-space:nowrap;overflow:hidden}
.aiw .sb .it.on{background:#E3E7EE;color:#111;font-weight:600}
.aiw .mn{flex:1;display:flex;flex-direction:column;min-width:0}
.aiw .tp{height:58px;border-bottom:1px solid #E8EAED;display:flex;align-items:center;padding:0 22px;font-size:23px;font-weight:600;gap:8px}
.aiw .bd2{flex:1;padding:26px 28px;display:flex;flex-direction:column;gap:18px;font-size:27px}
.aiw .me{align-self:flex-end;background:#EEF1F6;border-radius:18px 18px 4px 18px;padding:16px 22px;line-height:1.6;max-width:100%}
.aiw .in{margin:0 22px 22px;border:1.5px solid #D7DBE2;border-radius:16px;min-height:62px;padding:0 16px;display:flex;align-items:center;gap:12px;font-size:23px;color:#9AA1AC}
.aiw .in span{flex:1}
#chat{left:960px;top:130px;width:920px;height:700px}
#note{font-size:23px;color:#6B7280;padding:10px 16px;border:1.5px dashed #C9CDD4;border-radius:12px;align-self:flex-end}
.chip{position:absolute;left:110px;top:110px;padding:12px 32px 16px;font-size:46px;white-space:nowrap;background:rgba(21,24,28,.92);color:#ECE8E0;border-radius:6px;box-shadow:0 14px 34px rgba(0,0,0,.45);border-left:8px solid #F2C230}
</style></head>
<body><div id="stage">
  <div id="cam">
    <div id="ph"></div>
    <div id="posters"></div>
    <div id="memo" class="abs print"><div class="ln"><span id="m1">밥 주는 거</span></div><div class="ln"><span id="m2">화 안 내는 거</span></div><div class="ln"><span id="m3">마감이 일찍</span></div></div>
    <div id="yel" class="abs print"><div class="t">저녁 알바 구해요 (평일 주 3일)</div><div class="l">시간: 17:30 ~ 21:00 · 시급 10,500원</div><div class="l"><span class="hl" id="hl">밥 줘요.</span> 출근하면 국밥 한 그릇 먹고 시작해요.</div><div class="l">사장님이 화 안 내요. 처음엔 다들 실수해요. 천천히 알려 드려요.</div><div class="l">마감은 21시 칼같이. 막차 걱정 없어요.</div><div class="l">경력 없어도 돼요. 일 순서는 종이로 정리돼 있어요.</div><div class="l">문의: 010-0000-0000 (문자 주세요)</div></div>
    <svg id="svg" viewBox="0 0 1920 1080"><rect id="slot" x="843" y="124" width="262" height="392" rx="8" fill="none" stroke="#F2C230" stroke-width="6" stroke-dasharray="14 10" opacity="0"/></svg>
  </div>
  <div id="chat" class="abs aiw" data-box="chat">
    <div class="sb"><div class="nw"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>새 채팅</div><div class="it">리뷰 답글 10개</div><div class="it">한 달 치 소식 글</div><div class="it">메뉴 설명 다섯 줄</div><div class="it on">알바 공고</div></div>
    <div class="mn"><div class="tp">AI<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></div>
      <div class="bd2"><div class="me" id="p1"></div><div id="note"></div></div>
      <div class="in"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#9AA1AC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12l-9 9a6 6 0 0 1-8.5-8.5l9-9a4 4 0 0 1 5.7 5.7l-9 9a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg><span>메시지 보내기</span><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#9AA1AC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></div></div>
  </div>
  <div id="k1" class="chip mono" data-box="k1">20대 눈높이</div>
  <div id="k2" class="chip mono" data-box="k2">과장 금지</div>
</div>
<script src="../data/s32.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#ECE8E0', '#15181C', '#F2C230'];
const ANG = [-2.2, 1.4, -1.0, 2.6, -1.7, 1.1, -2.7, 1.9, -0.8, 2.3];
const JIT = [[0, 4], [3, -6], [-4, 2], [2, 7], [-3, -3], [4, 5], [-2, -5], [0, 3], [5, -2], [-4, 6]];
let h = '';
for (let i = 0; i < 10; i++) {
  if (i === 2) continue;
  const c = i % 5, r = Math.floor(i / 5);
  h += `<div class="pst print" style="left:${267 + c * 288 + JIT[i][0]}px;top:${125 + r * 416 + JIT[i][1]}px;transform:rotate(${ANG[i]}deg)"><div class="bd mono">알바 모집</div><div class="h">홀 서빙<br>알바 구합니다</div><div class="b"><div><span class="u">성실한 분 구합니다.</span></div><div><span class="u">경력자 우대.</span></div><div>시급 협의.</div><div>연락 주세요.</div></div></div>`;
}
S.$('#posters').innerHTML = h;
const T = { slot: S.at('있잖아요'), m1: S.at('밥주는거'), m2: S.at('화안내는'), m3: S.at('마감이'), diff: S.at('차별점을'), chat: S.at('알바공고') - 0.45, note: S.at('시급이랑'), pay: S.at('시급이랑') + 0.9,
  h1: S.at('밥주는거랑'), h2: S.at('사장님이화안내는거야'), t20: S.at('20대가'), ex: S.at('과장하지'), ins: S.at('이렇게') };
const SEG = [['우리 가게 알바 공고 써 줘.', S.at('우리가게알바공고'), S.at('시급이랑') - 0.1], ['시급이랑 시간은 이거고,', S.at('시급이랑'), S.at('우리가게좋은') - 0.1],
  ['우리 가게 좋은 점은 밥 주는 거랑', S.at('우리가게좋은'), S.at('사장님이화안내는거야') - 0.1], ['사장님이 화 안 내는 거야.', S.at('사장님이화안내는거야'), S.at('20대가') - 0.1],
  ['20대가 읽고 지원하고 싶게,', S.at('20대가'), S.at('과장하지') - 0.1], ['과장하지 말고.', S.at('과장하지'), S.at('이렇게') - 0.25]];
const NOTE = '(시급 10,500원 · 평일 저녁 17:30~21:00 · 주 3일)';
S.focus([{ t0: T.diff, t1: T.diff + 1.5, big: '차별점', small: '공고에 넣을 것', color: '#F2C230' }, { t0: T.pay, t1: T.pay + 1.1, big: '10,500원', small: '시급', color: '#F2C230', size: 190 }]);
S.ev(T.slot, 'marker', 'slot'); S.ev(T.m1 - 0.5, 'page', 'memo'); S.ev(T.m1, 'type', 'm1'); S.ev(T.m2, 'marker', 'm2'); S.ev(T.m3, 'type', 'm3');
S.ev(T.chat, 'msg_in', 'chat'); S.ev(SEG[0][1], 'type', 'p1'); S.ev(T.note, 'card_in', 'note'); S.ev(T.h1 + 0.3, 'marker', 'm1');
S.ev(T.h2 + 0.3, 'ok', 'm2'); S.ev(T.t20 + 1.4, 'card_in', 'k1'); S.ev(T.ex, 'no', 'k2');
S.ev(T.ins, 'page', 'yel'); S.ev(T.ins + 0.4, 'marker', 'hl');
const camSet = (sel, s, cx, cy) => {
  const tx = S.clamp(960 - cx * s, 1920 - 1920 * s, 0), ty = S.clamp(540 - cy * s, 1080 - 1180 * s, 100 * s);
  S.css(sel, { transform: `translate(${tx}px,${ty}px) scale(${s})` });
};
const KF = (tau, keys) => { let [, s, cx, cy] = keys[0]; for (let i = 1; i < keys.length; i++) { const [t, s2, x2, y2, d = 0.3] = keys[i]; const k = S.cam(tau, t - d, t); s = S.lerp(s, s2, k); cx = S.lerp(cx, x2, k); cy = S.lerp(cy, y2, k); } return [s, cx, cy]; };
S.scene(tau => {
  const [s, cx, cy] = KF(tau, [[0, 1.2, 1100, 430], [T.slot + 0.2, 1.5, 1235, 395, 1.2], [T.ins + 0.5, 1.55, 968, 432, 0.7]]);
  camSet('#cam', s, cx, cy);
  S.$('#slot').style.opacity = S.ent(tau, T.slot, 0.12) * (1 - S.P(tau, T.m1 - 0.6, T.m1 - 0.4));
  const mk = S.ent(tau, T.m1 - 0.5, 0.14) * (1 - S.ent(tau, T.ins - 0.05, 0.14));
  S.css('#memo', { opacity: mk, transform: `rotate(1.2deg) translateY(${(1 - S.ent(tau, T.m1 - 0.5, 0.14)) * -24}px)` });
  [['#m1', T.m1], ['#m2', T.m2], ['#m3', T.m3]].forEach(([id, t]) => { S.css(id, { clipPath: `inset(-4px ${(1 - S.cam(tau, t, t + 0.5)) * 100}% -4px 0)` }); });
  S.$('#m1').style.backgroundSize = (S.cam(tau, T.h1 + 0.3, T.h1 + 0.7) * 100) + '% 45%'; S.$('#m2').style.backgroundSize = (S.cam(tau, T.h2 + 0.3, T.h2 + 0.7) * 100) + '% 45%';
  const ci = S.ent(tau, T.chat, 0.12), co = S.ent(tau, T.ins - 0.35, 0.18);
  S.css('#chat', { opacity: ci * (1 - co), transform: `translateX(${(1 - ci) * 60 + co * 40}px)` });
  let txt = '';
  SEG.forEach(sg => { const n = Math.floor(S.clamp((tau - sg[1]) / Math.max(0.2, sg[2] - sg[1]), 0, 1) * [...sg[0]].length); if (n > 0) txt += (txt ? ' ' : '') + [...sg[0]].slice(0, n).join(''); });
  S.$('#p1').innerHTML = S.esc(txt) + (tau >= SEG[0][1] && tau < SEG[5][2] + 0.1 ? '<span class="caret"></span>' : '');
  S.css('#p1', { opacity: tau >= SEG[0][1] - 0.05 ? 1 : 0 });
  const n2 = Math.floor(S.clamp((tau - T.note) / 0.9, 0, 1) * [...NOTE].length);
  S.$('#note').textContent = [...NOTE].slice(0, n2).join(''); S.css('#note', { opacity: n2 > 0 ? 1 : 0 });
  const k1 = S.ent(tau, T.t20 + 1.4, 0.12) * (1 - S.P(tau, T.ex - 0.05, T.ex)), k2 = S.ent(tau, T.ex, 0.12) * (1 - S.P(tau, T.ins - 0.4, T.ins - 0.25));
  S.css('#k1', { opacity: k1, transform: `translateX(${(1 - k1) * -24}px)` }); S.css('#k2', { opacity: k2, transform: `translateX(${(1 - k2) * -24}px)` });
  const y = S.ent(tau, T.ins, 0.14);
  S.css('#yel', { opacity: y, transform: `translateY(${(1 - y) * -70}px) rotate(-0.8deg)` });
  S.css('#hl', { backgroundSize: (S.cam(tau, T.ins + 0.4, T.ins + 0.8) * 100) + '% 100%' });
});
</script>
</body></html>
