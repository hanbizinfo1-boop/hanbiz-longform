<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s43 도장 전 사람 확인</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#ph{position:absolute;left:0;top:-100px;width:1920px;height:1280px;background:url("../../../../소재/sjk01/codex/c43_stamp_hand.png") 0 0/100% 100% no-repeat}
.chip{left:120px;padding:12px 30px 14px;font-size:42px;line-height:1.3;white-space:nowrap;border-radius:4px;box-shadow:0 14px 34px rgba(0,0,0,.4)}
#c1{top:250px;background:rgba(21,24,28,.9);color:#ECE8E0;border:2px solid rgba(236,232,224,.5)}
#c2{top:350px;background:#F2C230;color:#15181C;font-weight:700}
</style></head>
<body><div id="stage">
  <div id="cam"><div id="ph"></div></div>
  <div id="c1" class="abs chip mono" data-box="c1">AI 답 ≠ 법률 판단</div>
  <div id="c2" class="abs chip mono" data-box="c2">도장 전 — 사람 확인</div>
</div>
<script src="../data/s43.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#ECE8E0', '#15181C', '#F2C230'];
const T = { c1: S.at('법률'), c2: S.at('사람한테'), up: S.at('마지막판단은') };
S.ev(T.c1 - 0.05, 'msg_in', 'c1'); S.ev(T.c2 - 0.05, 'card_in', 'c2'); S.ev(T.up, 'shine', 'ph');
const camSet = (sel, s, cx, cy) => {
  const tx = S.clamp(960 - cx * s, 1920 - 1920 * s, 0), ty = S.clamp(540 - cy * s, 1080 - 1180 * s, 100 * s);
  S.css(sel, { transform: `translate(${tx}px,${ty}px) scale(${s})` });
};
S.scene(tau => {
  const k = S.P(tau, -0.3, S.SC.dur);
  camSet('#cam', 1 + 0.07 * k, S.lerp(960, 1080, k), S.lerp(540, 500, k));
  S.css('#ph', { filter: `brightness(${1 + 0.13 * S.ent(tau, T.up, 0.9)})` });
  [['#c1', T.c1], ['#c2', T.c2]].forEach(([id, t]) => { const c = S.ent(tau, t - 0.05, 0.14); S.css(id, { opacity: c, transform: `translateX(${(1 - c) * -26}px)` }); });
});
</script>
</body></html>
