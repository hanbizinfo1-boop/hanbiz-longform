<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s02 유리문 통과 → 계산대 (원테이크 2)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
.seq{position:absolute;left:0;top:0;width:1920px;height:1080px}
#dim{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
#clock{left:0;top:0;width:520px;text-align:center;color:#ECE8E0;transform-origin:50% 50%;text-shadow:0 6px 30px rgba(0,0,0,.6)}
#clock .lab{font-size:30px;letter-spacing:.14em;color:#d9d3c7;margin-bottom:10px}
#clock .t{font-size:150px;line-height:1;letter-spacing:.03em}
#clock .u{height:8px;margin:18px auto 0;width:78%;background:#F2C230;transform-origin:50% 50%}
#mini{left:1560px;top:60px;color:#ECE8E0;font-size:56px;letter-spacing:.04em;text-shadow:0 4px 18px rgba(0,0,0,.7)}
#todo{left:110px;top:150px;width:520px;display:flex;flex-direction:column;gap:18px}
.td{display:flex;align-items:center;gap:18px;background:#FFFFFF;border-radius:14px;padding:16px 24px;font-size:40px;font-weight:700;color:#15181C;box-shadow:0 18px 40px rgba(0,0,0,.45);font-family:"UI"}
.td svg{flex:none;width:40px;height:40px;stroke:#2E55D9;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.td.done{opacity:.55}
</style></head>
<body><div id="stage">
  <img id="a" class="seq" alt="">
  <img id="b" class="seq" alt="">
  <div id="mini" class="abs mono" data-box="mini">23:47</div>
  <div id="todo" class="abs" data-box="todo">
    <div class="td" id="d1"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>리뷰 답글</div>
    <div class="td" id="d2"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v16"/></svg>근무표</div>
    <div class="td" id="d3"><svg viewBox="0 0 24 24"><path d="M4 6h2l2 10h10l2-7H7"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>재료 주문</div>
    <div class="td" id="d4"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/></svg>인스타</div>
  </div>
  <div id="dim"></div>
  <div id="clock" class="abs mono" data-box="clock"><div class="lab" id="lab">가게 문 닫고 나서</div><div class="t" id="ct">23:47</div><div class="u" id="cu"></div></div>
</div>
<script src="../data/s02.js"></script>
<script src="../lib/sjk.js"></script>
<script src="op_seq.js"></script>
<script>
// 10-15 2차: 시계를 가운데↔구석으로 왔다 갔다 하지 않는다(키프레임 2번 규칙). 구석 작은 시계는 그대로 흐르고,
// 할 일은 말할 때마다 칩이 하나씩 쌓이고(새 요소), «그거 하다 보면»에서 큰 시계가 가운데에 새로 뜬다(+ 배경 흐림·어둡게) → «12시» 00:00.
window.PALETTE = ['#ECE8E0', '#F2C230', '#2E55D9'];
const T = { d1: S.at('리뷰') - 0.05, d2: S.at('근무표') - 0.05, d3: S.at('재료') - 0.05, d4: S.at('인스타') - 0.05,
  big: S.at('그거') - 0.12, z: S.at('12시'), end: S.SC.dur };
S.ev(T.d1, 'card_in', 'd1'); S.ev(T.d2, 'pop', 'd2'); S.ev(T.d3, 'card_in', 'd3'); S.ev(T.d4, 'pop', 'd4');
S.ev(T.big, 'big_in', 'clock_big'); S.ev(T.z, 'marker', 'midnight');
const mm = m => { m = Math.floor(m); const h = m >= 0 ? 0 : 23; const mi = m >= 0 ? m : 60 + m; return String(h).padStart(2, '0') + ':' + String(mi).padStart(2, '0'); };
const minute = tau => tau < T.z ? S.lerp(-13, 0, S.P(tau, -0.3, T.z)) : S.lerp(0, 12, S.P(tau, T.z, T.end));
S.scene(async tau => {
  await OP.draw(tau + S.SC.t0);
  const B = S.ent(tau, T.big, 0.14);
  // 구석 시계: 처음부터 — 큰 시계가 뜨면 사라짐
  S.css('#mini', { opacity: 1 - B });
  S.$('#mini').textContent = mm(minute(tau));
  ['d1', 'd2', 'd3', 'd4'].forEach(id => {
    const k = S.ent(tau, T[id], 0.11);
    S.css('#' + id, { opacity: k * (1 - B), transform: `translateX(${(1 - k) * -40}px)` });
  });
  // 큰 시계: 가운데에 새로 뜸(크기 1.3→1 튀어 오름 한 번)
  S.css('#clock', { opacity: B, transform: `translate(700px,330px) scale(${(1.3 - 0.3 * B).toFixed(4)})` });
  S.css('#dim', { background: `rgba(8,10,14,${(0.5 * B).toFixed(3)})`, backdropFilter: `blur(${(8 * B).toFixed(2)}px)` });
  S.$('#ct').textContent = mm(minute(tau));
  S.$('#ct').style.color = tau >= T.z ? '#F2C230' : '#ECE8E0';
  S.css('#cu', { transform: `scaleX(${S.ent(tau, T.z, 0.3)})` });
  S.$('#lab').textContent = tau >= T.z ? '자정 넘김' : '가게 문 닫고 나서';
});
</script>
</body></html>
