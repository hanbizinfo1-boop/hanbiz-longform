<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s29 마감 녹음 → 글 → 체크리스트 (휴대폰 화면)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#ph{position:absolute;left:0;top:-100px;width:1920px;height:1280px;background:url("../../../../소재/sjk01/codex/d29_phone_hand_kitchen_clean.png") 0 0/100% 100% no-repeat}
#scr{position:absolute;left:0;top:0;width:368px;height:825px;border-radius:30px;overflow:hidden;font-family:"UI";background:#fff}
.lay{position:absolute;left:0;top:0;right:0;bottom:0}
#A{background:#14171C;color:#F2F3F5}
#A .hd{text-align:center;font-size:24px;font-weight:600;padding-top:26px}
#A .tm{text-align:center;font-size:76px;margin-top:70px;font-family:"Mono";letter-spacing:.02em}
#A .st{text-align:center;font-size:23px;color:#B6BAC2;margin-top:6px;height:30px}
#wave{position:absolute;left:28px;right:28px;top:330px;height:170px;display:flex;align-items:center;justify-content:space-between}
#wave i{display:block;width:8px;border-radius:4px;background:#E5594F}
#btn{position:absolute;left:142px;top:650px;width:84px;height:84px;border-radius:50%;border:5px solid #F2F3F5;display:flex;align-items:center;justify-content:center}
#btn b{display:block;width:60px;height:60px;border-radius:50%;background:#E5594F}
#B{background:#F7F7F8;color:#1E2024}
#B .hd{height:76px;display:flex;align-items:center;padding:0 22px;font-size:24px;font-weight:700;border-bottom:1px solid #E4E6EA;background:#fff}
#B .tx{position:absolute;left:22px;right:22px;top:92px;font-size:24px;line-height:1.5;color:#2A2D33}
#C{background:#fff;color:#1E2024}
#C .hd{height:70px;display:flex;align-items:center;padding:0 22px;font-size:24px;font-weight:700;border-bottom:1px solid #E4E6EA;background:#F3F4F6}
#C .bd{position:absolute;left:16px;right:16px;top:86px;display:flex;flex-direction:column;gap:12px}
#C .me{align-self:flex-end;background:#EEF1F6;border-radius:18px;padding:12px 16px;font-size:25px;line-height:1.45;max-width:100%}
#C .att{align-self:flex-end;border:2px dashed #C9CDD4;border-radius:14px;padding:8px 14px;font-size:22px;color:#6B7280}
#C .inp{position:absolute;left:16px;right:16px;bottom:22px;height:62px;border:2px solid #D7DBE2;border-radius:31px;padding:0 22px;display:flex;align-items:center;font-size:22px;color:#9AA1AC}
#D{background:#fff;color:#1E2024}
#D .hd{height:64px;display:flex;align-items:center;padding:0 20px;font-size:24px;font-weight:700;border-bottom:1px solid #E4E6EA;background:#F3F4F6}
#D .bd{position:absolute;left:16px;right:16px;top:74px}
#D .sec{display:inline-block;font-size:24px;font-weight:700;padding:3px 12px;border-radius:6px;margin:6px 0 8px}
#D .sec.w{background:#F2C230;color:#15181C}
#D .sec.n{background:#EDEFF3;color:#3A3F47}
#D .it{display:flex;gap:10px;font-size:24px;line-height:1.32;padding:6px 6px;margin:0 -6px 6px;border-radius:6px}
#D .it i{flex:none;font-style:normal;font-weight:700;width:26px;height:26px;line-height:26px;border-radius:50%;background:#15181C;color:#fff;text-align:center;font-size:17px;margin-top:2px}
#D .it .hi{background:linear-gradient(#F2C230,#F2C230) no-repeat 0 100%/0% 62%}
</style></head>
<body><div id="stage">
  <div id="cam">
    <div id="ph"></div>
    <div id="scr">
      <div class="lay" id="A"><div class="hd">음성 녹음</div><div class="tm" id="tm">00:00</div><div class="st" id="st">탭하면 녹음 시작</div><div id="wave"></div><div id="btn"><b id="bdot"></b></div></div>
      <div class="lay" id="B"><div class="hd">받아쓰기</div><div class="tx" id="btx"></div></div>
      <div class="lay" id="C"><div class="hd">새 대화</div><div class="bd"><div class="att">(받아쓰기 붙여 넣음)</div><div class="me" id="pm"></div></div><div class="inp">무엇이든 물어보세요</div></div>
      <div class="lay" id="D"><div class="hd">마감 체크리스트</div><div class="bd">
        <div class="sec w">⚠ 먼저 — 위험한 것</div>
        <div class="it"><i>1</i><span><span class="hi" id="hi1">가스 잠그기</span> — 주방 뒤쪽 노란 밸브를 옆으로(가로로) 돌린다</span></div>
        <div class="it"><i>2</i><span>바닥은 물 뿌리지 않기 — 전기 설비가 많다. 밀대로만 닦는다</span></div>
        <div class="sec n">마감 순서</div>
        <div class="it"><i>3</i><span>손님이 다 나가면 간판 불 끄기</span></div>
        <div class="it"><i>4</i><span>육수 덜기 — 큰 통 → 작은 통 2개로 나눠 냉장고 맨 아래 칸</span></div>
        <div class="it"><i>5</i><span>포스기 «마감» 버튼 → 영수증은 금고 위에</span></div>
        <div class="it"><i>6</i><span>바닥 밀대 청소</span></div>
        <div class="it"><i>7</i><span>뒷문 잠금 한 번 더 확인</span></div>
      </div></div>
    </div>
  </div>
</div>
<script src="../data/s29.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#ECE8E0', '#15181C', '#F2C230'];
const shrink = (q, f) => { const cx = q.reduce((a, p) => a + p[0], 0) / 4, cy = q.reduce((a, p) => a + p[1], 0) / 4; return q.map(p => [cx + (p[0] - cx) * f, cy + (p[1] - cy) * f]); };
S.fitQuad(S.$('#scr'), 368, 825, shrink([[780.1, 102.3], [1147.8, 103.1], [1146.1, 927.7], [778.4, 926.9]], 0.985));
const NB = 26; let wh = ''; for (let i = 0; i < NB; i++) wh += '<i></i>'; S.$('#wave').innerHTML = wh; const bars = [...S.$('#wave').children];
const REC = '어 마감할 때는 일단 손님 다 나가면 간판 불 끄고 어 그다음에 가스 가스 꼭 잠가 주방 뒤쪽에 노란 밸브 있거든 그거 옆으로 돌려 놓고 육수는 큰 통에서 작은 통 두 개에 나눠서 덜어 갖고 냉장고 맨 아래 칸 넣고 아 그리고 포스기 마감 버튼 누르고 영수증 나오면 그거 금고 위에 올려 두고 바닥은 물 뿌리지 말고 밀대로만 해 전기 많아서 그리고 마지막에 뒷문 잠갔는지 한 번 더 보고';
const WORDS = []; S.SC.lines.forEach(l => (l.words || []).forEach(w => WORDS.push([w.t0, w.t1])));
const sp = t => WORDS.some(w => t >= w[0] - 0.04 && t <= w[1] + 0.04) ? 1 : 0;
const T = { rec: S.at('녹음기') + 0.35, txt: S.at('글로바꿔서'), chat: S.at('이건우리가게마감') - 0.15, list: S.at('이러면') - 0.1, hl: S.at('가스잠그는') };
const SEG = [['이건 우리 가게 마감 순서를', S.at('이건우리가게마감'), S.at('내가말로') - 0.05],
  ['내가 말로 한 거야.', S.at('내가말로'), S.at('처음온') - 0.05],
  ['처음 온 알바가 보고 따라 할 수 있게', S.at('처음온'), S.at('번호붙은') - 0.05],
  ['번호 붙은 체크리스트로 정리해 줘.', S.at('번호붙은'), S.at('위험한건') - 0.05],
  ['위험한 건 맨 위에 넣어주고', S.at('위험한건'), S.at('위험한건', 1) - 0.05]];
S.ev(T.rec, 'click', 'btn'); S.ev(T.txt, 'type', 'btx'); S.ev(T.chat, 'msg_in', 'pm'); S.ev(SEG[0][1], 'ok', 'pm');
S.ev(T.list, 'card_in', 'D'); S.ev(T.hl, 'marker', 'hi1');
const camSet = (sel, s, cx, cy) => {
  const tx = S.clamp(960 - cx * s, 1920 - 1920 * s, 0), ty = S.clamp(540 - cy * s, 1080 - 1180 * s, 100 * s);
  S.css(sel, { transform: `translate(${tx}px,${ty}px) scale(${s})` });
};
const lay = (id, o) => S.css(id, { opacity: o, visibility: o > 0.001 ? 'visible' : 'hidden' });
S.scene(tau => {
  // 카메라: ④(체크리스트)에서 휴대폰 화면 쪽으로
  const c = S.cam(tau, T.list - 0.1, T.list + 1.3);
  camSet('#cam', S.lerp(1, 1.28, c), S.lerp(960, 963, c), S.lerp(540, 515, c));
  // ① 녹음 앱
  const rec = tau >= T.rec, el = Math.max(0, tau - T.rec);
  const stop = S.ent(tau, T.txt - 0.1, 0.1);
  const run = rec && stop < 0.5;
  const secs = Math.floor(Math.min(el, T.txt - 0.1 - T.rec));
  S.$('#tm').textContent = '00:' + String(secs).padStart(2, '0');
  S.$('#st').textContent = !rec ? '탭하면 녹음 시작' : (run ? '녹음 중' : '저장됨');
  S.$('#bdot').style.borderRadius = run ? '14px' : '50%'; S.$('#bdot').style.width = S.$('#bdot').style.height = run ? '34px' : '60px';
  bars.forEach((b, k) => {
    const tt = tau - (NB - 1 - k) * 0.055;
    const a = run ? sp(tt) * (0.3 + 0.7 * Math.abs(Math.sin(tt * 21 + k * 1.9 + (k % 3)))) : 0;
    b.style.height = (10 + 150 * a) + 'px';
  });
  // ② 받아쓰기 글(작은 글씨 빽빽, 화면 안에서 스크롤)
  const kB = S.ent(tau, T.txt, 0.2), kBo = S.ent(tau, T.chat - 0.1, 0.16);
  const bx = S.$('#btx'); bx.textContent = REC;
  const rv = S.P(tau, T.txt + 0.1, T.txt + 1.7);
  S.css('#btx', { clipPath: `inset(0 0 ${(1 - rv) * 100}% 0)` });
  const over = Math.max(0, bx.offsetHeight - (825 - 92 - 20));
  S.css('#btx', { transform: `translateY(${-over * S.cam(tau, T.txt + 1.8, T.chat - 0.4)}px)` });
  lay('#A', 1); lay('#B', kB * (1 - kBo));
  // ③ 입력창(프롬프트 말풍선)
  const kC = S.ent(tau, T.chat, 0.16), kCo = S.ent(tau, T.list, 0.16);
  lay('#C', kC * (1 - kCo));
  let txt = '';
  SEG.forEach(sg => { const n = Math.floor(S.clamp((tau - sg[1]) / Math.max(0.2, sg[2] - sg[1]), 0, 1) * [...sg[0]].length); if (n > 0) txt += (txt ? ' ' : '') + [...sg[0]].slice(0, n).join(''); });
  S.$('#pm').innerHTML = S.esc(txt) + (tau >= SEG[0][1] && tau < SEG[4][2] + 0.1 ? '<span class="caret"></span>' : '');
  S.css('#pm', { opacity: tau >= SEG[0][1] - 0.05 ? 1 : 0 });
  // ④ 체크리스트 · ⑤ «가스 잠그기» 형광펜
  lay('#D', S.ent(tau, T.list, 0.2));
  S.css('#hi1', { backgroundSize: (S.cam(tau, T.hl, T.hl + 0.5) * 100) + '% 62%' });
});
</script>
</body></html>
