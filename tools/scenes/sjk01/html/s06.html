<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s06 6번째 활용법 — 내용 가린 카드(스포일러 없음) · v2</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#bgA{position:absolute;left:0;top:-100px;width:1920px;height:1280px;background:url("../../../../소재/sjk01/codex/d14_phone_on_table_morning_clean.png") center/100% 100% no-repeat}
#dimA{position:absolute;left:0;top:0;width:1920px;height:1080px;background:#10100c;opacity:.5}
#bgB{position:absolute;left:0;top:0;width:1920px;height:1080px;background:url("../../../../소재/sjk01/codex/e24_table_daylight.png") center/cover}
#shotA,#shotB{position:absolute;left:0;top:0;width:1920px;height:1080px}
#num{left:150px;top:170px;font-size:76px;color:#F2C230}
#ttl{left:150px;top:260px;font-size:150px;line-height:1.12;color:#ECE8E0;text-shadow:0 6px 30px rgba(0,0,0,.6)}
#chipd{left:150px;top:660px;font-size:82px;padding:6px 36px;background:#F2C230;color:#15181C;border-radius:10px;box-shadow:0 10px 26px rgba(0,0,0,.4)}
#mk{position:absolute;left:1005px;top:197px;width:570px;height:646px;transform-origin:50% 50%}
#mk .inner{position:absolute;inset:0;transform:scale(1.9);transform-origin:0 0;width:300px;height:340px}
#mk .inner .v2c{filter:blur(6px)}
#mk .sk{margin:14px 16px 0;height:22px;border-radius:11px;background:#DDE0E6}
#lock{position:absolute;left:0;right:0;top:230px;display:flex;justify-content:center}
#edge{position:absolute;left:-12px;top:-12px;width:594px;height:670px;overflow:visible}
#qb{position:absolute;left:660px;top:130px;width:600px;height:680px;border-radius:30px;display:flex;align-items:center;justify-content:center;font-size:300px;color:#15181C;opacity:0}
#qb:after{content:"";position:absolute;inset:26px;border:3px solid rgba(21,24,28,.35);border-radius:16px}
#glow{position:absolute;left:652px;top:122px;width:616px;height:696px;border-radius:34px;border:8px solid #F2C230;opacity:0}
.chp{position:absolute;font-size:62px;padding:6px 34px;border-radius:10px;opacity:0;white-space:nowrap}
#cAI{left:260px;top:420px;background:#2E55D9;color:#fff}
#cBad{left:1340px;top:420px;background:#D8402F;color:#fff;font-family:"Serif";font-weight:900}
#cEnd{left:690px;top:850px;background:#F2C230;color:#15181C;font-family:"Serif";font-weight:900;font-size:68px}
</style></head>
<body><div id="stage">
  <div id="shotA">
    <div id="bgA"></div><div id="dimA"></div>
    <div id="num" class="abs mono">00</div>
    <div id="ttl" class="abs serif">6번째<br>활용법</div>
    <div id="chipd" class="abs serif">내일 당장</div>
    <div id="mk">
      <div class="inner"><div class="v2c"><div class="hd" style="background:#F1F2F4"><div style="width:120px;height:20px;border-radius:10px;background:#C9CED6"></div></div><div class="sk" style="margin-top:20px"></div><div class="sk" style="width:70%"></div><div class="sk"></div><div class="sk" style="width:55%"></div><div class="sk" style="margin-top:26px"></div><div class="sk" style="width:80%"></div></div></div>
      <div id="lock"><svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="#15181C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 2px 6px rgba(255,255,255,.9))"><rect x="5" y="11" width="14" height="9" rx="2" fill="#F2C230"/><path d="M8 11V8a4 4 0 018 0v3"/><path d="M12 14.5v2.5"/></svg></div>
      <svg id="edge" viewBox="0 0 594 670"><rect id="er" x="6" y="6" width="582" height="658" rx="26" fill="none" stroke="#F2C230" stroke-width="12" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>
    </div>
  </div>
  <div id="shotB">
    <div id="bgB"></div>
    <div id="qb" class="print mono">?</div><div id="glow"></div>
    <div id="cAI" class="chp mono">AI</div><div id="cBad" class="chp">큰일</div><div id="cEnd" class="chp">끝까지</div>
  </div>
</div>
<script src="../data/s06.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/cards_v2_a.js"></script>
<script>
window.PALETTE = ['#ECE8E0', '#15181C', '#F2C230', '#D8402F'];
const T = { six: S.at('여섯'), day: S.at('내일'), cut: S.at('그리고') - 0.05, last: S.at('마지막에는') + 0.3, ai: S.at('AI한테'), big: S.at('큰일'), gl: S.at('그거'), end: S.at('꼭') };
S.ev(0.3, 'big_in', 'ttl'); S.ev(0.7, 'card_in', 'mk'); S.ev(T.six + 0.15, 'marker', 'edge'); S.ev(T.day, 'card_in', 'chipd'); S.ev(T.cut, 'in', 'cut');
S.ev(T.last, 'card_in', 'qb'); S.ev(T.ai, 'msg_in', 'cAI'); S.ev(T.big, 'card_in', 'cBad'); S.ev(T.gl, 'shine', 'glow'); S.ev(T.end, 'big_in', 'cEnd');
const pop = (id, t0, tau, dy) => { const k = S.ent(tau, t0, 0.12); S.css(id, { opacity: k, transform: `translateY(${(1 - k) * dy}px)` }); return k; };
S.scene(tau => {
  const A = tau < T.cut ? 1 : 0;
  S.css('#shotA', { opacity: A }); S.css('#shotB', { opacity: 1 - A });
  // 06 카운트
  const n = Math.round(6 * S.EO(S.P(tau, T.six, T.six + 0.5)));
  S.$('#num').textContent = '0' + n;
  pop('#num', 0.25, tau, 14); pop('#ttl', 0.3, tau, 24);
  const km = S.ent(tau, 0.7, 0.14);
  S.css('#mk', { opacity: km, transform: `translateX(${(1 - km) * 50}px)` });
  S.$('#er').setAttribute('stroke-dashoffset', 1 - S.cam(tau, T.six + 0.15, T.six + 0.85));
  pop('#chipd', T.day, tau, 18);
  // 장면 B: 다른 구도로 탁 끊어 — 뒤집힌 카드
  const kq = S.ent(tau, T.last, 0.12);
  S.css('#qb', { opacity: kq, transform: `translateY(${(1 - kq) * -70}px)` });
  pop('#cAI', T.ai, tau, 16); pop('#cBad', T.big, tau, 16); pop('#cEnd', T.end, tau, 16);
  const g = Math.sin(Math.PI * S.P(tau, T.gl, T.gl + 1.0));
  S.css('#glow', { opacity: Math.max(0, g), boxShadow: `0 0 ${30 * g}px ${6 * g}px rgba(242,194,48,${0.55 * g})` });
});
</script>
</body></html>
