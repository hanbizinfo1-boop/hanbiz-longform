<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s10 그래서 이렇게 시키는 거예요 — 리뷰 열 개 답글</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#rig{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:981px 487px}
#ph{position:absolute;left:0;top:-100px;width:1920px;height:1280px;background:url("../../../../소재/sjk01/codex/d10_laptop_counter_clean.png") center/100% 100% no-repeat}
#app{position:absolute;left:0;top:0;width:895px;height:543px;background:#fff;overflow:hidden;font-family:"UI";color:#1A1A1A}
#app .bar{position:absolute;left:0;top:0;right:0;height:40px;background:#F1F2F4;border-bottom:1px solid #E3E5E8;display:flex;align-items:center;gap:8px;padding:0 16px;font-size:16px;color:#6B7280;z-index:3}
#app .dot{width:11px;height:11px;border-radius:50%}
#vp{position:absolute;left:0;top:40px;right:0;height:437px;overflow:hidden}
#sc{position:absolute;left:0;top:0;width:895px}
#pb{position:absolute;left:28px;right:28px;top:14px;height:180px;background:#EEF1F6;border-radius:16px;padding:14px 20px;font-size:24px;line-height:1.55}
#pb .chip{display:block;margin-top:4px;font-size:22px;color:#6B7280}
.rp{position:absolute;left:28px;right:28px;height:110px;display:flex;gap:14px;align-items:flex-start;font-size:22px;line-height:1.5;color:#222;overflow:hidden}
.rp .no{flex:none;width:34px;height:34px;border-radius:50%;background:#2E55D9;color:#fff;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.rp b{display:block;font-size:22px;color:#1A1A1A}
#inp{position:absolute;left:28px;right:28px;bottom:10px;height:44px;border:2px solid #D7DBE2;border-radius:22px;display:flex;align-items:center;padding:0 20px;font-size:21px;color:#9AA1AC;background:#fff;z-index:3}
#bd{right:70px;top:56px;font-size:46px;padding:10px 26px;background:#15181C;color:#F2C230;border-radius:6px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.35)}
</style></head>
<body><div id="stage">
  <div id="rig">
    <div id="ph"></div>
    <div id="app">
      <div class="bar"><div class="dot" style="background:#E5594F"></div><div class="dot" style="background:#E9B43F"></div><div class="dot" style="background:#58B84F"></div><span style="margin-left:12px">새 대화</span></div>
      <div id="vp"><div id="sc"><div id="pb"><span id="ptx"></span><span class="chip" id="pchip"></span></div></div></div>
      <div id="inp">무엇이든 물어보세요</div>
    </div>
  </div>
  <div id="bd" class="abs mono" data-box="bd">10개 · 1분</div>
</div>
<script src="../data/s10.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#ECE8E0', '#15181C', '#F2C230'];
// 사진 속 노트북 화면 네 모서리(quads.json d10 stage) — 안쪽으로 1.5% 줄임
const Q0 = [[527.3, 210.6], [1436.2, 212.5], [1435.0, 764.4], [526.2, 762.4]];
const cx = Q0.reduce((a, p) => a + p[0], 0) / 4, cy = Q0.reduce((a, p) => a + p[1], 0) / 4;
const Q = Q0.map(p => [cx + (p[0] - cx) * 0.985, cy + (p[1] - cy) * 0.985]);
const W = Math.round(Math.hypot(Q[1][0] - Q[0][0], Q[1][1] - Q[0][1])), H = Math.round(Math.hypot(Q[3][0] - Q[0][0], Q[3][1] - Q[0][1]));
const APP = S.$('#app'); APP.style.width = W + 'px'; APP.style.height = H + 'px';
S.$('#sc').style.width = W + 'px';
const VH = H - 40 - 62; S.$('#vp').style.height = VH + 'px';
S.fitQuad(APP, W, H, Q);
const REPLY = [
  ['★1 국물이 너무 짜요', '짜게 느끼셨다니 죄송합니다. 다음에 오시면 말씀해 주세요. 싱겁게 따로 말아 드릴게요.'],
  ['★5 혼밥 양 많아서', '혼자 오셔도 편하게 드실 수 있게 늘 넉넉히 담고 있어요. 다음 점심도 든든하게 챙겨 드릴게요!'],
  ['★3 기다리는 시간', '기다리시게 해서 죄송해요. 손님 몰리는 시간엔 주방에 한 명 더 붙여서 더 빨리 내 드릴게요.'],
  ['★4 깍두기 맛있어요', '깍두기는 매주 직접 담가요. 다음엔 국밥도 깍두기만큼 기억에 남게 끓여 볼게요!'],
  ['★5 부모님 수육', '부모님 모시고 와 주셔서 감사해요. 수육은 매일 아침 삶아서 부드럽게 내고 있어요. 또 모시고 오세요!'],
  ['★2 테이블 끈적', '불편하셨겠어요, 죄송합니다. 손님 나가실 때마다 테이블을 두 번 닦도록 바로 바꿨어요.'],
  ['★5 퇴근길에 생각나는 집', '퇴근길에 생각나는 집이라니 그 말이 제일 힘이 돼요. 오늘도 따뜻하게 끓여 두겠습니다.'],
  ['★4 순대국 특 가격', '양 넉넉하게 느끼셨다니 다행이에요. 가격 말씀도 잘 새겨들을게요. 다음에도 든든하게 담아 드릴게요.'],
  ['★3 포장 국물 샘', '봉투까지 젖게 해 드려 죄송합니다. 포장 국물은 이제 뚜껑 위에 랩을 한 번 더 씌워 드려요.'],
  ['★5 늦게까지', '늦은 시간에도 찾아 주셔서 감사해요. 섞어국밥 추천까지! 다음에도 따뜻하게 기다릴게요.'],
];
const PITCH = 122, TOP0 = 206;
const sc = S.$('#sc'); sc.style.height = (TOP0 + REPLY.length * PITCH + 20) + 'px';
REPLY.forEach((r, i) => {
  sc.insertAdjacentHTML('beforeend', `<div class="rp" id="rp${i}" style="top:${TOP0 + i * PITCH}px"><div class="no">${i + 1}</div><div><b>${r[0]}</b><span id="rt${i}">${r[1]}</span></div></div>`);
});
const SEG = [['아래 리뷰 열 개에 답글 써 줘.', 1], ['우리 가게는 동네 국밥집이고,', 2], ['말투는 친근하게,', 3], ['이름은 부르지 말고,', 4], ['별점 낮은 건 변명하지 말고', 5], ['고칠 거 하나만 말해 줘.', 6]].map(a => [a[0], S.line(a[1]).t0, S.line(a[1]).t1 - 0.05]);
const T = { chip: S.at('이렇게넣으면') - 0.05, pour: S.at('열개가') - 0.05, back: S.at('아까') + 0.05, hl: S.at('짜다는'), after: S.at('예쁘게'), bd: S.at('1분이면') };
S.ev(0.1, 'card_in', 'app'); S.ev(SEG[0][1], 'type', 'ptx'); S.ev(T.chip, 'msg_in', 'pchip'); S.ev(T.pour, 'sweep', 'rp0');
S.ev(T.hl, 'marker', 'rt0'); S.ev(T.bd - 0.05, 'big_in', 'bd');
const ZS = 2.2;
S.scene(tau => {
  // 프롬프트: 말 따라 타자
  let txt = '';
  SEG.forEach(s => { const n = Math.floor(S.clamp((tau - s[1]) / Math.max(0.2, s[2] - s[1]), 0, 1) * [...s[0]].length); if (n > 0) txt += (txt ? ' ' : '') + [...s[0]].slice(0, n).join(''); });
  const typing = tau >= SEG[0][1] && tau < SEG[5][2] + 0.1;
  S.$('#ptx').innerHTML = S.esc(txt) + (typing ? '<span class="caret"></span>' : '');
  const ck = S.ent(tau, T.chip, 0.14);
  S.$('#pchip').textContent = ck > 0 ? '(리뷰 10개 붙여 넣음)' : '';
  S.css('#pchip', { opacity: ck });
  // 답글 열 개 — 한 번에 쏟아짐(0.14초 간격)
  let vis = 0;
  for (let i = 0; i < REPLY.length; i++) {
    const k = S.ent(tau, T.pour + i * 0.14, 0.16); vis += k;
    S.css('#rp' + i, { opacity: k * (i ? 1 : 1), transform: `translateY(${(1 - k) * 22}px)` });
  }
  const sPour = Math.max(0, TOP0 + vis * PITCH - VH);
  const kb = S.cam(tau, T.back, T.back + 0.9);
  const sRead = 100 + 60 * S.cam(tau, T.after, T.bd - 0.2);
  S.css('#sc', { transform: `translateY(${-(S.lerp(sPour, 100, kb) + (kb >= 1 ? sRead - 100 : 0))}px)` });
  // 카메라: 화면 안으로 밀고 들어가 화면이 판 전체가 됨
  const z = S.cam(tau, T.back - 0.1, T.back + 1.1);
  S.css('#rig', { transform: `translate(${-21 * z}px,${53 * z}px) scale(${1 + (ZS - 1) * z + 0.1 * S.cam(tau, T.hl + 1.2, T.bd + 0.6)})` });
  // 1번 답글만 노랑 형광펜, 나머지 흐림
  S.css('#inp', { opacity: 1 - S.P(z, 0, 0.4) });
  const h = S.ent(tau, T.hl, 0.18);
  for (let i = 0; i < REPLY.length; i++) S.css('#rp' + i, { opacity: i ? Math.min(1, S.ent(tau, T.pour + i * 0.14, 0.16)) * (1 - 0.68 * h) : S.ent(tau, T.pour, 0.16) });
  S.css('#pb', { opacity: (tau >= SEG[0][1] - 0.05 ? 1 : 0) * (1 - 0.68 * h) });
  S.$('#rt0').style.background = h > 0 ? `linear-gradient(transparent 52%,rgba(242,194,48,${0.9 * h}) 52%)` : 'none';
  const b = S.ent(tau, T.bd, 0.14);
  S.css('#bd', { opacity: b, transform: `translateY(${(1 - b) * -16}px)` });
});
</script>
</body></html>
