<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s31 07 채용 공고 — 똑같은 공고 열 장 (v2)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#ph{position:absolute;left:0;top:-100px;width:1920px;height:1280px;background:url("../../../../소재/sjk01/codex/c31_empty_board.png") 0 0/100% 100% no-repeat}
.pst{position:absolute;width:250px;height:380px;padding:58px 22px 0;color:#15181C}
.pst:before{content:"";position:absolute;left:112px;top:6px;width:26px;height:16px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.34),rgba(0,0,0,0) 70%)}
.pst .bd{position:absolute;left:0;top:0;right:0;height:40px;background:#15181C;color:#F2C230;font-size:22px;line-height:40px;text-align:center;letter-spacing:.2em}
.pst .h{font-family:"Serif";font-weight:900;font-size:31px;line-height:1.28;margin-bottom:16px}
.pst .b{font-size:24px;line-height:1.5;font-weight:500}
.pst .b div{margin-bottom:5px}
.u{background:linear-gradient(#7C776E,#7C776E) no-repeat 0 100%/0% 3px;padding-bottom:1px}
#card{left:660px;top:380px;width:600px;height:300px;padding:34px 44px;transform:rotate(1.5deg);transform-origin:50% 50%}
#card .no{font-size:48px;color:#2E55D9;display:block;margin-bottom:4px}
#card .tt{font-size:120px;line-height:1.2;display:block;color:#15181C}
#ins{position:absolute;left:1290px;top:430px;width:480px;height:230px;border:6px solid #ECE8E0;border-radius:10px;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.5);opacity:0;background:#F4F1EA}
#ins .in{left:0;top:-258px;transform:scale(1.9);transform-origin:0 0;padding-top:153px}
#ins .in:before{display:none}
.chip{position:absolute;left:110px;top:30px;padding:12px 32px 16px;font-size:46px;white-space:nowrap;background:rgba(21,24,28,.92);color:#ECE8E0;border-radius:6px;box-shadow:0 14px 34px rgba(0,0,0,.45);border-left:8px solid #F2C230}
</style></head>
<body><div id="stage">
  <div id="cam">
    <div id="ph"></div>
    <div id="posters"></div>
    <div id="card" class="abs print"><span class="no mono">07</span><span class="tt serif">채용 공고</span></div>
  </div>
  <div id="k1" class="chip mono" data-box="k1">연락 없음</div>
  <div id="k2" class="chip mono" data-box="k2">지원자 입장</div>
  <div id="ins" data-box="ins"><div class="in pst"><div class="b"><div><span class="u u1">성실한 분 구합니다.</span></div><div><span class="u u2">경력자 우대.</span></div></div></div></div>
</div>
<script src="../data/s31.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#ECE8E0', '#15181C', '#2E55D9'];
const ANG = [-2.2, 1.4, -1.0, 2.6, -1.7, 1.1, -2.7, 1.9, -0.8, 2.3];
const JIT = [[0, 4], [3, -6], [-4, 2], [2, 7], [-3, -3], [4, 5], [-2, -5], [0, 3], [5, -2], [-4, 6]];
let h = '';
for (let i = 0; i < 10; i++) {
  const c = i % 5, r = Math.floor(i / 5);
  h += `<div class="pst print" id="p${i}" style="left:${267 + c * 288 + JIT[i][0]}px;top:${125 + r * 416 + JIT[i][1]}px;transform:rotate(${ANG[i]}deg)"><div class="bd mono">알바 모집</div><div class="h">홀 서빙<br>알바 구합니다</div><div class="b"><div><span class="u u1">성실한 분 구합니다.</span></div><div><span class="u u2">경력자 우대.</span></div><div>시급 협의.</div><div>연락 주세요.</div></div></div>`;
}
S.$('#posters').innerHTML = h;
const T = { card: 0.12, cardOut: S.at('알바') - 0.15, p0: S.at('구하는') - 0.1, pz: S.at('사람이'), same: S.at('똑같거든요'), u: S.at('성실한'), u2: S.at('경력자'), d: S.at('다들'), v: S.at('구하는', 1) };
T.v = S.at('입장'); T.g = S.at('같은가게예요');
S.focus([{ t0: T.same, t1: T.u - 0.2, big: '똑같다', small: '다른 가게 공고와', color: '#F2C230' }, { t0: T.g, t1: S.SC.dur, big: '같은 가게', small: '지원자 눈에는', color: '#F2C230', size: 190 }]);
// 10-15 4차: 카메라 순간 컷 4번 없앰 — 한 샷 유지(느린 드리프트), 밑줄 자리는 돋보기 인셋으로 얹음
S.ev(T.card, 'card_in', 'card'); S.ev(T.p0, 'page', 'posters'); S.ev(T.p0 + 0.65, 'card_in', 'posters'); S.ev(T.p0 + 1.3, 'page', 'posters');
S.ev(T.pz + 0.3, 'msg_in', 'k1'); S.ev(T.u - 0.1, 'card_in', 'ins'); S.ev(T.u, 'marker', 'u1'); S.ev(T.u2, 'marker', 'u2');
S.ev(T.v - 0.3, 'card_in', 'k2');
const camSet = (sel, s, cx, cy) => {
  const tx = S.clamp(960 - cx * s, 1920 - 1920 * s, 0), ty = S.clamp(540 - cy * s, 1080 - 1180 * s, 100 * s);
  S.css(sel, { transform: `translate(${tx}px,${ty}px) scale(${s})` });
};
S.scene(tau => {
  camSet('#cam', 1.03 + 0.03 * S.P(tau, 0, S.SC.dur), 960, 520);
  const k = S.ent(tau, T.card, 0.14), o = 1 - S.ent(tau, T.cardOut, 0.14);
  S.css('#card', { opacity: k * o, transform: `rotate(1.5deg) translateY(${(1 - k) * 22}px)` });
  for (let i = 0; i < 10; i++) {
    const e = S.ent(tau, T.p0 + i * 0.14, 0.12), g = S.ent(tau, T.g + i * 0.03, 0.5), el = S.$('#p' + i);
    el.style.opacity = e;
    el.style.filter = tau > T.g - 0.2 ? `grayscale(${0.85 * g}) brightness(${1 - 0.1 * g})` : 'none';
    el.style.transform = `rotate(${ANG[i]}deg) translateY(${(1 - e) * -30}px)`;
    el.querySelector('.u1').style.backgroundSize = (S.cam(tau, T.u + i * 0.05, T.u + i * 0.05 + 0.4) * 100) + '% 3px';
    el.querySelector('.u2').style.backgroundSize = (S.cam(tau, T.u2 + i * 0.05, T.u2 + i * 0.05 + 0.4) * 100) + '% 3px';
  }
  S.$('#ins .u1').style.backgroundSize = (S.cam(tau, T.u, T.u + 0.4) * 100) + '% 3px';
  S.$('#ins .u2').style.backgroundSize = (S.cam(tau, T.u2, T.u2 + 0.4) * 100) + '% 3px';
  const ie = S.ent(tau, T.u - 0.1, 0.14) * (1 - S.ent(tau, T.d - 0.05, 0.12));
  S.css('#ins', { opacity: ie, transform: `translateY(${(1 - ie) * 18}px)` });
  S.css('#ph', { filter: tau > T.g - 0.2 ? `saturate(${1 - 0.45 * S.ent(tau, T.g, 0.8)})` : 'none' });
  const a = S.ent(tau, T.pz + 0.3, 0.12) * (1 - S.P(tau, T.same - 0.1, T.same + 0.05)), b = S.ent(tau, T.v - 0.3, 0.12) * (1 - S.P(tau, T.g - 0.2, T.g));
  S.css('#k1', { opacity: a, transform: `translateX(${(1 - a) * -24}px)` }); S.css('#k2', { opacity: b, transform: `translateX(${(1 - b) * -24}px)` });
});
</script>
</body></html>
