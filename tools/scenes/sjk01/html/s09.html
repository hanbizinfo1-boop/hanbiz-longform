<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s09 왜 이렇게 오래 걸릴까요 — 답글 다는 것이 보이게 (v2-2)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#rig{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#ph{position:absolute;left:0;top:-100px;width:1920px;height:1280px;background:url("../../../../소재/sjk01/codex/d09_phone_hand_night_clean.png") center/100% 100% no-repeat}
#app{position:absolute;left:0;top:0;width:456px;height:950px;background:#F4F5F7;border-radius:32px;overflow:hidden;font-family:"UI";color:#1A1A1A}
.scr{position:absolute;left:0;top:0;width:456px;height:950px;background:#F4F5F7}
.sb{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:22px;font-weight:700}
.hd{padding:4px 18px 0;font-size:32px;font-weight:800}
.chips{display:flex;gap:8px;padding:8px 14px 10px}
.chip{font-size:22px;padding:4px 10px;border-radius:999px;background:#E4E7EC;color:#3A3F47;white-space:nowrap}
.chip.on{background:#1A1A1A;color:#fff}
#lst{position:absolute;left:0;top:140px;width:456px}
.rc{margin:0 14px 9px;background:#fff;border-radius:14px;padding:10px 14px 10px;border:3px solid transparent}
.rc.bad{border-color:#D8402F}
.rc .r1{display:flex;align-items:center;gap:8px;font-size:22px}
.rc .av{flex:none;width:30px;height:30px;border-radius:50%;color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center}
.rc .nk{font-weight:700;flex:none}
.rc .tm{margin-left:auto;color:#6B7280;flex:none}
.rc .tx{font-size:22px;line-height:1.38;margin-top:3px;color:#222}
.rc .rr{margin-top:6px;background:#F1F3F6;border-radius:8px;padding:3px 10px;font-size:22px;color:#8A9099;white-space:nowrap;overflow:hidden;border-bottom:3px solid transparent}
.rc .rr b{color:#3A3F47;margin-right:6px}
#sR{transform:translateX(456px)}
#rtop{height:70px;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:32px;font-weight:800;border-bottom:1px solid #E3E5E8;background:#fff}
#rorig{margin:14px;background:#fff;border-radius:14px;padding:12px 16px 14px;border:3px solid transparent}
#rorig.bad{border-color:#D8402F}
#rorig .r1{display:flex;align-items:center;gap:10px;font-size:26px}
#rorig .av{flex:none;width:40px;height:40px;border-radius:50%;color:#fff;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center}
#rorig .tx{font-size:30px;line-height:1.4;margin-top:6px;font-weight:500}
.mk{background-repeat:no-repeat;background-position:0 90%;background-size:0% 44%;background-image:linear-gradient(rgba(242,194,48,.95),rgba(242,194,48,.95))}
#rlab{padding:6px 18px 6px;font-size:28px;color:#6B7280;font-weight:700}
#rin{margin:0 14px;height:250px;background:#fff;border:3px solid #2E55D9;border-radius:14px;padding:16px 18px;font-size:42px;line-height:1.35;font-weight:500;word-break:break-all}
#rbtn{position:absolute;left:24px;right:24px;top:660px;height:92px;border-radius:16px;background:#2E55D9;color:#fff;font-size:38px;font-weight:800;display:flex;align-items:center;justify-content:center}
</style></head>
<body><div id="stage">
  <div id="rig">
    <div id="ph"></div>
    <div id="app">
      <div class="scr" id="sL"><div class="sb"><span>23:47</span><span>●●●</span></div><div class="hd">리뷰 관리</div>
        <div class="chips"><span class="chip">새 리뷰 10</span><span class="chip on">답글 안 단 리뷰 10</span></div><div id="lst"></div></div>
      <div class="scr" id="sR"><div class="sb" style="background:#fff"><span>23:47</span><span>●●●</span></div>
        <div id="rtop"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>답글 쓰기</div>
        <div id="rorig"></div><div id="rlab">사장님 답글</div><div id="rin"></div><div id="rbtn">등록</div></div>
    </div>
  </div>
</div>
<script src="../data/s09.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#ECE8E0', '#F2C230', '#D8402F'];
const Q0 = [[727.5, 49.9], [1188.9, 55.7], [1176.9, 1020.1], [715.4, 1014.3]];
const cx0 = Q0.reduce((a, p) => a + p[0], 0) / 4, cy0 = Q0.reduce((a, p) => a + p[1], 0) / 4;
const Q = Q0.map(p => [cx0 + (p[0] - cx0) * 0.985, cy0 + (p[1] - cy0) * 0.985]);
const star = (sz, on) => `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24"><path d="M12 2l3.1 6.6 7.2.9-5.3 5 1.4 7.1L12 18l-6.4 3.6L7 14.5 1.7 9.5l7.2-.9z" fill="${on ? '#F5A800' : '#D5D8DE'}"/></svg>`;
const stars = (n, sz) => [1, 2, 3, 4, 5].map(i => star(sz, i <= n)).join('');
const REV = [
  ['맛집탐**', 1, '오늘', '국물이 너무 짜요. 다시는 안 갑니다.', '#E5594F'],
  ['점심한그릇', 5, '어제', '혼밥했는데 양이 많아서 좋았어요', '#4A90D9'],
  ['ㅎㅇ**', 3, '어제', '맛은 괜찮은데 기다리는 시간이 길었어요', '#7C6BC4'],
  ['국밥러버', 4, '2일 전', '깍두기가 진짜 맛있어요. 국밥은 무난', '#3FA66B'],
  ['dlwl**', 5, '2일 전', '부모님 모시고 갔는데 수육 부드럽다고 좋아하셨어요', '#D98A2B'],
  ['배고픈**', 2, '3일 전', '테이블이 좀 끈적였어요', '#C46B8A'],
];
S.$('#lst').innerHTML = REV.map((r, i) => `<div class="rc${i ? '' : ' bad'}" id="rc${i}"><div class="r1"><div class="av" style="background:${r[4]}">${r[0][0]}</div><span class="nk">${r[0]}</span><span style="display:flex">${stars(r[1], 18)}</span><span class="tm">${r[2]}</span></div><div class="tx">${r[3]}</div><div class="rr" id="rr${i}"><b>사장님 답글</b><span id="rt${i}">달기</span></div></div>`).join('');
S.fitQuad(S.$('#app'), 456, 950, Q);
const setOrig = i => {
  const r = REV[i], o = S.$('#rorig'); if (o.dataset.i == i) return; o.dataset.i = i;
  o.className = i === 0 ? 'bad' : '';
  o.innerHTML = `<div class="r1"><div class="av" style="background:${r[4]}">${r[0][0]}</div><b>${r[0]}</b><span style="display:flex">${stars(r[1], 24)}</span></div><div class="tx"><span class="mk" id="om1">${i === 0 ? '국물이 너무 짜요.' : r[3]}</span>${i === 0 ? ' <span class="mk" id="om2">다시는 안 갑니다.</span>' : ''}</div>`;
};
const TXT = '감사합니다.', LONG = '안녕하세요, 방문해 주셔서 감사';
const T = { push: 1.2, o1: S.at('똑같이') + 0.15, ty1: S.at('감사합니다만'), tap1: S.at('쓰면') + 0.05, rep: S.at('성의') + 0.05, o2: S.at('길게') - 0.1, ty2: S.at('길게') + 0.2, del: S.at('말이') + 0.1, o3: S.at('하나짜리') - 0.05, clk: S.at('그날'), red: S.at('화가'), m1: S.at('국물이'), m2: S.at('다시는'), bt: S.at('이런'), ag: S.at('아니'), th: S.at('30년째'), out: S.at('30년째') + 0.95 };
const CL = T.tap1 + 0.2, C2 = S.at('말이') + 1.0;
S.focus([{ t0: T.clk, t1: T.clk + 1.25, big: '23:47', small: '그날 밤', color: '#F2C230' }, { t0: T.th, t1: T.th + 0.85, big: '30년째', small: '국물', color: '#ECE8E0' }]);
S.ev(0.0, 'card_in', 'app'); S.ev(T.push, 'in', 'rig'); S.ev(T.o1 - 0.1, 'click', 'rr1'); S.ev(T.ty1, 'type', 'rin'); S.ev(T.tap1, 'ok', 'rbtn'); S.ev(T.rep, 'msg_in', 'rr2'); S.ev(T.rep + 0.55, 'marker', 'rr3');
S.ev(T.o2 - 0.15, 'click', 'rr5'); S.ev(T.ty2, 'type', 'rin'); S.ev(T.del, 'no', 'rin'); S.ev(T.o3 - 0.2, 'sweep', 'rr0'); S.ev(T.o3 + 0.1, 'in', 'rorig');
S.ev(T.red, 'no', 'rorig'); S.ev(T.m1, 'marker', 'om1'); S.ev(T.m2, 'shine', 'om2'); S.ev(T.bt + 0.2, 'in', 'rbtn'); S.ev(T.out, 'sweep', 'rig');
const mixp = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
S.scene(tau => {
  // 목록(카드 위에서 차례로 올라옴)
  for (let i = 0; i < REV.length; i++) { const k = S.ent(tau, -0.15 + i * 0.1, 0.12); S.css('#rc' + i, { opacity: k, transform: `translateY(${(1 - k) * 20}px)` }); }
  // 같은 «감사합니다.» 가 줄줄이
  [1, 2, 3, 4].forEach((i, n) => {
    const t = i === 1 ? CL + 0.05 : T.rep + (n - 1) * 0.28;
    const on = tau >= t;
    S.$('#rt' + i).textContent = on ? TXT : '달기'; S.$('#rt' + i).style.color = on ? '#3A3F47' : '#8A9099';
    const y = on && i > 0 ? S.ent(tau, T.rep + 0.55 + (n) * 0.14, 0.14) : 0;
    S.css('#rr' + i, { borderBottomColor: `rgba(242,194,48,${y})`, background: y > 0 ? `rgba(255,241,184,${y})` : '#F1F3F6' });
  });
  // 탭 하이라이트(답글 칸을 누름)
  [[1, T.o1 - 0.1], [5, T.o2 - 0.15], [0, T.o3 - 0.2]].forEach(a => { const f = tau >= a[1] && tau < a[1] + 0.22; if (!(a[0] === 1 && tau >= T.rep)) S.css('#rr' + a[0], { background: f ? '#CFE0FF' : '#F1F3F6' }); });
  // 목록 스크롤: 6번째 카드까지 내렸다가 위로 (화면 안 내용 이동)
  const sc = 230 * S.cam(tau, T.o2 - 0.5, T.o2 - 0.15) * (1 - S.cam(tau, T.o3 - 0.45, T.o3 - 0.2));
  S.css('#lst', { transform: `translateY(${-sc}px)` });
  // «답글 쓰기» 화면 열림/닫힘
  const r = S.ent(tau, T.o1, 0.18) - S.ent(tau, CL + 0.15, 0.18) + S.ent(tau, T.o2, 0.18) - S.ent(tau, C2 + 0.55, 0.18) + S.ent(tau, T.o3, 0.18);
  S.css('#sR', { transform: `translateX(${(1 - r) * 456}px)` }); S.css('#sL', { transform: `translateX(${-r * 70}px)` });
  const which = tau < C2 + 0.3 ? (tau < T.o2 - 0.3 ? 1 : 5) : 0;
  setOrig(which);
  const bl = Math.floor(tau * 2.4) % 2 === 0 ? '|' : ' ';
  let txt = '';
  if (which === 1) txt = TXT.slice(0, Math.floor(S.clamp((tau - T.ty1) * 14, 0, TXT.length)));
  else if (which === 5) { const a = Math.floor(S.clamp((tau - T.ty2) * 13, 0, LONG.length)), d = Math.floor(S.clamp((tau - T.del) * 36, 0, LONG.length)); txt = LONG.slice(0, Math.max(0, a - d)); }
  S.$('#rin').textContent = txt + bl;
  S.css('#rbtn', { transform: `scale(${tau >= T.tap1 && tau < T.tap1 + 0.2 && which === 1 ? 0.94 : 1})`, background: tau >= T.tap1 && tau < T.tap1 + 0.2 && which === 1 ? '#1D3FA8' : '#2E55D9', opacity: which === 0 && tau >= T.bt ? 0.45 : 1 });
  const fl = which === 0 ? S.cam(tau, T.red, T.red + 0.2) * (1 - S.cam(tau, T.red + 0.5, T.red + 0.8)) : 0;
  S.css('#rorig', { boxShadow: `0 0 0 ${8 * fl}px rgba(216,64,47,${0.5 * fl})` });
  const m1 = S.$('#om1'), m2 = S.$('#om2');
  if (which === 0 && m1) { m1.style.backgroundSize = (S.cam(tau, T.m1, T.m1 + 0.4) * 100) + '% 44%'; if (m2) m2.style.backgroundSize = (S.cam(tau, T.m2, T.m2 + 0.45) * 100) + '% 44%'; }
  // 카메라: 휴대폰 화면으로 밀고 들어가기 1번 + 빠지기 1번
  const A = [1, 960, 540, 960, 540], B = [1.28, 950, 250, 950, 250];
  let p = mixp(A, [1.03, 960, 540, 960, 540], S.P(tau, 0, T.push));
  p = mixp(p, B, S.cam(tau, T.push, T.push + 0.45));
  p = mixp(p, A, S.cam(tau, T.out, T.out + 0.5));
  S.css('#rig', { transform: `translate(${p[3] - p[0] * p[1]}px,${p[4] - p[0] * p[2]}px) scale(${p[0]})` });
});
</script>
</body></html>
