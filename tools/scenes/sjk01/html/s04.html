<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s04 검색창처럼만 쓰는 AI</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#chat{left:150px;top:110px;width:1060px;height:760px;display:flex;flex-direction:column}
#chat .body{flex:1;padding:40px 48px;display:flex;flex-direction:column;gap:26px;font-size:27px}
.ai{display:flex;gap:16px;align-items:flex-start;line-height:1.6;color:#222}
.ai .av{flex:none;width:40px;height:40px;border-radius:50%;background:#2E55D9;margin-top:4px}
#input{margin:0 40px 34px;height:74px;border:2px solid #D7DBE2;border-radius:37px;display:flex;align-items:center;padding:0 30px;font-size:24px;color:#9AA1AC}
#gauge{left:1290px;top:250px;width:520px}
#gauge .lab{font-size:24px;color:#5A5650}
#num{font-size:190px;line-height:1;margin:18px 0 26px;color:#15181C}
#bar{position:relative;height:30px;border:3px solid #15181C;border-radius:4px;background:#F7F4EE}
#fill{position:absolute;left:0;top:0;bottom:0;background:#2E55D9}
#rest{margin-top:20px;font-size:26px;color:#5A5650}
</style></head>
<body><div id="stage">
  <div class="bg tex-paper"></div>
  <div id="chat" class="abs chat" data-box="chat">
    <div class="bar"><div class="dot" style="background:#E5594F"></div><div class="dot" style="background:#E9B43F"></div><div class="dot" style="background:#58B84F"></div><span style="margin-left:16px">새 대화</span></div>
    <div class="body">
      <div id="m1" class="bubble-me">돼지국밥 칼로리 알려 줘</div>
      <div id="a1" class="ai"><div class="av"></div><div>돼지국밥 한 그릇(밥 포함)은 보통 600~800kcal 정도예요. 고기 양과 밥 양에 따라 달라집니다.</div></div>
      <div id="m2" class="bubble-me">이 기사 요약해 줘 <span style="color:#6B7280;font-size:22px">(링크 붙여 넣음)</span></div>
      <div id="a2" class="ai"><div class="av"></div><div>기사 핵심은 세 줄입니다. ① 외식 물가가 올랐다 ② 손님 방문 횟수가 줄었다 ③ 점심 할인 경쟁이 늘었다.</div></div>
    </div>
    <div id="input">무엇이든 물어보세요</div>
  </div>
  <div id="gauge" class="abs" data-box="gauge">
    <div class="lab mono">AI 쓰는 만큼</div>
    <div id="num" class="serif">0%</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="rest" class="mono">나머지 90% — 비어 있음</div>
  </div>
</div>
<script src="../data/s04.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#ECE8E0', '#15181C', '#2E55D9'];
const T = {
  m1: S.at('알려') - 0.15, m2: S.at('요약') - 0.15,
  g: S.at('10'), gs: S.at('검색창'),
};
T.a1 = T.m1 + 0.75; T.a2 = T.m2 + 0.7;
S.ev(T.m1, 'msg_in', 'm1'); S.ev(T.a1, 'card_in', 'a1'); S.ev(T.m2, 'msg_in', 'm2'); S.ev(T.a2, 'card_in', 'a2');
S.ev(T.g - 0.1, 'in_in', 'gauge'); S.ev(T.g + 0.2, 'gauge', 'fill'); S.ev(T.gs, 'marker', 'input');
const pop = (id, t0) => { const k = S.ent(t, t0, 0.14); S.css(id, { opacity: k, transform: `translateY(${(1 - k) * 18}px)` }); };
let t = 0;
S.scene(tau => {
  t = tau;
  pop('#m1', T.m1); pop('#a1', T.a1); pop('#m2', T.m2); pop('#a2', T.a2);
  // 게이지가 들어오며 대화창은 왼쪽으로 물러남(카메라 대신 무대 이동)
  const k = S.cam(tau, T.g - 0.35, T.g + 0.35);
  S.css('#chat', { transform: `translateX(${-60 * k}px) scale(${1 - 0.06 * k})`, transformOrigin: '0 50%' });
  const g = S.ent(tau, T.g - 0.1, 0.16);
  S.css('#gauge', { opacity: g, transform: `translateX(${(1 - g) * 50}px)` });
  const v = S.count(tau, T.g, T.g + 0.9, 0, 10);
  S.$('#num').textContent = Math.round(v) + '%';
  S.css('#fill', { width: v + '%' });
  S.css('#rest', { opacity: S.ent(tau, T.g + 1.1, 0.2) });
  // «검색창» — 입력창이 노랑 테두리로(사람이 봐야 할 것 = 노랑)
  const s = S.ent(tau, T.gs, 0.15);
  S.css('#input', { borderColor: s > 0 ? `rgba(242,194,48,${s})` : '#D7DBE2', boxShadow: `0 0 0 ${6 * s}px rgba(242,194,48,${0.35 * s})`, color: s > 0.5 ? '#15181C' : '#9AA1AC' });
});
</script>
</body></html>
