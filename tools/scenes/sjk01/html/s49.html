<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s49 AI = 도구 / 결정 = 사장님</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#cam{position:absolute;left:0;top:0;width:1920px;height:1080px}
.ln{left:160px;width:1600px;text-align:center;font-size:210px;line-height:1.1;white-space:nowrap}
#l1{top:210px;color:#2E55D9}
#l2{top:510px;color:#15181C}
#l2 span{position:relative;display:inline-block}
#ul{position:absolute;left:0;right:0;bottom:-6px;height:22px;background:#F2C230;transform-origin:0 50%}
</style></head>
<body><div id="stage">
  <div class="bg tex-paper"></div>
  <div id="cam">
    <div id="l1" class="abs serif ln" data-box="l1">AI = 도구</div>
    <div id="l2" class="abs serif ln" data-box="l2"><span id="sp">결정 = 사장님<i id="ul"></i></span></div>
  </div>
</div>
<script src="../data/s49.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#ECE8E0', '#15181C', '#2E55D9', '#F2C230'];
const T = { a: S.at('AI는') - 0.05, b: S.at('결정자는') - 0.05, u: S.at('사장님이에요') };
S.ev(T.a, 'big_in', 'l1'); S.ev(T.b, 'card_in', 'l2'); S.ev(T.u, 'marker', 'ul');
S.scene(tau => {
  const a = S.ent(tau, T.a, 0.16), b = S.ent(tau, T.b, 0.16), u = S.ent(tau, T.u, 0.28);
  S.css('#l1', { opacity: a, transform: `translateY(${(1 - a) * 26}px)` });
  S.css('#l2', { opacity: b, transform: `translateY(${(1 - b) * 26}px)` });
  S.css('#ul', { transform: `scaleX(${u})`, opacity: u > 0 ? 1 : 0 });
  S.css('#cam', { transformOrigin: '960px 520px', transform: `scale(${1 + 0.03 * S.cam(tau, 0, S.SC.dur)})` });
});
</script>
</body></html>
