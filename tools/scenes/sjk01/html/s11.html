<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s11 7시간 30분이 한 달에 30분으로 (v2)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#ph{position:absolute;left:0;top:-100px;width:1920px;height:1280px;background:url("../../../../소재/sjk01/codex/c11_hourglass.png") center/100% 100% no-repeat;transform-origin:520px 660px}
</style></head>
<body><div id="stage">
  <div id="ph"></div>
</div>
<script src="../data/s11.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#ECE8E0', '#F2C230'];
const T = { a: S.at('일곱') - 0.05, b: S.at('30분') - 0.1 };
S.focus([{ t0: T.a, t1: T.a + 1.05, big: '7시간 30분', small: '한 달 리뷰 답글', color: '#ECE8E0', size: 190 }, { t0: T.b, t1: S.SC.dur + 0.3, big: '30분', small: '한 달', color: '#F2C230', size: 260 }]);
S.ev(T.a + 1.05, 'sweep', 'ph'); S.ev(2.35, 'shine', 'ph');
S.scene(tau => {
  // 와이드 → 모래시계로 컷 줌(0.3초) → 더 가까이
  const k = S.cam(tau, T.a + 1.05, T.a + 1.4);
  S.css('#ph', { transform: `scale(${1 + 0.06 * S.P(tau, 0, T.a + 1.05) + 0.3 * k + 0.08 * S.P(tau, T.a + 1.4, S.SC.dur)})` });
});
</script>
</body></html>
