<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s40 원가율 순서 막대 10개 — 수육만 남음</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#stage{color:#ECE8E0}
#cap{left:200px;top:90px;font-size:26px;color:#9FB0CC;white-space:nowrap}
#cap2{left:1470px;top:90px;font-size:26px;color:#9FB0CC;white-space:nowrap}
#rows{left:0;top:150px;width:1920px;height:760px}
.r{position:absolute;left:0;width:1920px;height:62px}
.r .nm{position:absolute;left:200px;width:260px;height:62px;line-height:62px;text-align:right;font-size:34px;font-weight:600}
.r .tr{position:absolute;left:490px;width:900px;top:11px;height:40px;border-radius:5px;background:rgba(236,232,224,.09)}
.r .fl{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:#2E55D9}
.r .pc{position:absolute;top:0;height:62px;line-height:62px;font-size:34px;color:#ECE8E0}
.r .co{position:absolute;left:1470px;height:62px;line-height:62px;font-size:26px;color:#9FB0CC;white-space:nowrap}
#q{font-size:60px;color:#F2C230;line-height:62px;height:62px}
</style></head>
<body><div id="stage">
  <div class="bg tex-navy"></div>
  <div id="cap" class="abs mono" data-box="cap">원가율 높은 순서</div>
  <div id="cap2" class="abs mono" data-box="cap2">원가 / 판매가</div>
  <div id="rows" class="abs"></div>
</div>
<script src="../data/s40.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#ECE8E0', '#2E55D9', '#F2C230'];
const M = [['수육(소)', 70.0, 14000, 20000], ['수육(대)', 65.0, 19500, 30000], ['모둠순대', 46.0, 6900, 15000], ['내장국밥', 43.0, 4300, 10000], ['순대국 특', 42.5, 5100, 12000],
  ['섞어국밥', 41.9, 4400, 10500], ['돼지국밥', 40.0, 4000, 10000], ['순대국', 38.0, 3800, 10000], ['김치찌개', 36.7, 3300, 9000], ['공깃밥 추가', 35.0, 350, 1000]];
const TRK = 900, SC100 = 1.0;   // 트랙 900px = 100%
let h = '';
M.forEach((m, i) => {
  h += `<div class="r" id="r${i}" style="top:${i * 78}px"><div class="nm">${m[0]}</div><div class="tr"><div class="fl" id="f${i}"></div></div>` +
    `<div class="pc mono" id="p${i}">0.0%</div><div class="co mono">${S.fmt(m[2])} / ${S.fmt(m[3])}</div></div>`;
});
S.$('#rows').innerHTML = h;
const T = { fill: S.at('줄') - 0.15, step: 0.27, hl: S.at('수육') - 0.05, q: S.at('이따가') - 0.1, calm: S.at('제일') + 0.5 };
T.fill = S.at('줄세워') - 0.15;
S.ev(T.fill, 'gauge', 'f0'); S.ev(T.hl, 'marker', 'f0'); S.ev(T.q, 'card_in', 'q');
const qEl = document.createElement('div'); qEl.id = 'q'; qEl.className = 'abs mono'; qEl.textContent = '?'; qEl.dataset.box = 'q'; qEl.style.cssText = 'left:0;top:0;opacity:0';
S.$('#rows').appendChild(qEl);
S.scene(tau => {
  M.forEach((m, i) => {
    const k = S.ent(tau, -0.2 + i * 0.07, 0.18);          // 이름·트랙이 위에서 차례로 들어옴
    const f = S.ent(tau, T.fill + i * T.step, 0.55);       // 막대 차오름
    const w = m[1] / 100 * TRK * f;
    const isHot = i === 0;
    const hl = S.ent(tau, T.hl, 0.25);
    const dim = isHot ? 1 : 1 - 0.72 * hl;
    S.css('#r' + i, { opacity: k * dim, transform: `translateY(${(1 - k) * -14}px)` });
    S.css('#f' + i, { width: w + 'px', background: isHot && hl > 0.01 ? `rgb(${Math.round(46 + 196 * hl)},${Math.round(85 + 109 * hl)},${Math.round(217 - 169 * hl)})` : '#2E55D9' });
    const pc = S.$('#p' + i);
    pc.textContent = (m[1] * f).toFixed(1) + '%';
    pc.style.opacity = f > 0.02 ? 1 : 0;
    pc.style.left = (490 + w + 22) + 'px';
    pc.style.color = isHot && hl > 0.5 ? '#F2C230' : '#ECE8E0';
  });
  // «이따가 말씀드릴게요» — 수육 막대 옆 물음표
  const q = S.ent(tau, T.q, 0.16);
  S.css('#q', { opacity: q, transform: `translateX(${(1 - q) * 12}px)`, left: (490 + 0.7 * TRK + 190) + 'px' });
  // 마지막 문장에서 수육 줄만 살짝 앞으로(카메라)
  const c = S.cam(tau, T.calm, T.calm + 1.6);
  S.css('#r0', { transformOrigin: '400px 31px', transform: `translateY(${(1 - S.ent(tau, -0.2, 0.18)) * -14}px) scale(${1 + 0.04 * c})` });
});
</script>
</body></html>
