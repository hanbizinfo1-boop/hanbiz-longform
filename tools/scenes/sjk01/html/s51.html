<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s51 소통하고 결정하는 일 (v2)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#ph{position:absolute;left:0;top:-100px;width:1920px;height:1280px;background:url("../../../../소재/sjk01/codex/c51_serving_bowl.png") 0 0/100% 100% no-repeat}
#svg{position:absolute;left:0;top:0;width:1920px;height:1080px}
.chip{position:absolute;left:120px;top:110px;padding:12px 32px 16px;font-size:48px;white-space:nowrap;border-radius:6px;box-shadow:0 14px 34px rgba(0,0,0,.4)}
#c1{background:rgba(21,24,28,.92);color:#ECE8E0;border-left:8px solid #F2C230}
#c2{background:#F2C230;color:#15181C;font-weight:700}
</style></head>
<body><div id="stage">
  <div id="cam"><div id="ph"></div>
    <svg id="svg" viewBox="0 0 1920 1080"><ellipse id="e1" cx="960" cy="590" rx="330" ry="170" fill="none" stroke="#F2C230" stroke-width="6" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>
  </div>
  <div id="c1" class="chip mono" data-box="c1">손님 응대</div>
  <div id="c2" class="chip mono" data-box="c2">가게 운영</div>
</div>
<script src="../data/s51.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#ECE8E0', '#15181C', '#F2C230'];
const T = { z: S.at('손님들이랑') + 0.1, c2: S.at('운영할지'), f: S.at('결정하는') };
S.focus([{ t0: T.f, t1: S.SC.dur, big: '결정', small: '사장님의 일', color: '#F2C230' }]);
S.ev(T.z - 0.3, 'in', 'cam'); S.ev(T.z + 0.1, 'marker', 'e1'); S.ev(T.z + 0.4, 'card_in', 'c1'); S.ev(T.c2 - 0.1, 'sweep', 'cam'); S.ev(T.c2 - 0.3, 'msg_in', 'c2');
const camSet = (sel, s, cx, cy) => {
  const tx = S.clamp(960 - cx * s, 1920 - 1920 * s, 0), ty = S.clamp(540 - cy * s, 1080 - 1180 * s, 100 * s);
  S.css(sel, { transform: `translate(${tx}px,${ty}px) scale(${s})` });
};
const KF = (tau, keys) => { let [, s, cx, cy] = keys[0]; for (let i = 1; i < keys.length; i++) { const [t, s2, x2, y2, d = 0.3] = keys[i]; const k = S.cam(tau, t - d, t); s = S.lerp(s, s2, k); cx = S.lerp(cx, x2, k); cy = S.lerp(cy, y2, k); } return [s, cx, cy]; };
S.scene(tau => {
  const [s, cx, cy] = KF(tau, [[0, 1.03, 960, 540], [T.z, 1.5, 1000, 560], [T.c2, 1.12, 700, 500, 0.4]]);
  camSet('#cam', s, cx, cy);
  S.$('#e1').style.strokeDashoffset = 1 - S.cam(tau, T.z + 0.1, T.z + 0.5); S.$('#e1').style.opacity = 1 - S.P(tau, T.c2 - 0.2, T.c2);
  const a = S.ent(tau, T.z + 0.4, 0.12) * (1 - S.P(tau, T.c2 - 0.5, T.c2 - 0.35)), b = S.ent(tau, T.c2 - 0.3, 0.12) * (1 - S.P(tau, T.f - 0.2, T.f));
  S.css('#c1', { opacity: a, transform: `translateX(${(1 - a) * -24}px)` }); S.css('#c2', { opacity: b, transform: `translateX(${(1 - b) * -24}px)` });
});
</script>
</body></html>
