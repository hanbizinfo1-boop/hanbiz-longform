<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s53 고정 댓글 화면 — 마지막 성제관</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#card{left:360px;top:60px;width:1200px;height:740px;background:#fff;border-radius:22px;box-shadow:0 30px 70px rgba(0,0,0,.28),0 2px 8px rgba(0,0,0,.18);font-family:"UI";color:#0F0F0F;overflow:hidden}
#pin{position:absolute;left:44px;top:30px;display:flex;align-items:center;gap:10px;font-size:24px;color:#606060;padding:6px 16px 6px 12px;border-radius:20px;background:rgba(242,194,48,0)}
#pin svg{width:24px;height:24px;fill:#606060}
#who{position:absolute;left:44px;top:90px;display:flex;align-items:center;gap:20px}
#av{width:68px;height:68px;border-radius:50%;background:#C9C5BD}
#nm{font-size:30px;font-weight:700}
#win{position:absolute;left:44px;top:182px;width:1112px;height:440px;overflow:hidden;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 18px,#000 calc(100% - 26px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 18px,#000 calc(100% - 26px),transparent 100%)}
#txt{position:absolute;left:0;top:0;width:1112px;font-size:28px;line-height:1.62;color:#1F1F1F}
#txt .hd{font-size:32px;font-weight:700;margin-bottom:26px;color:#0F0F0F}
#txt .it{margin-bottom:30px;padding:10px 16px;margin-left:-16px;margin-right:-16px;border-radius:10px}
#txt .it b{display:block;font-size:28px;color:#0F0F0F;margin-bottom:2px}
#foot{position:absolute;left:44px;top:652px;display:flex;align-items:center;gap:34px;font-size:26px;color:#606060}
#foot svg{width:40px;height:40px}
#like path,#dis path{stroke-width:1.8;stroke-linejoin:round}
#inp{left:360px;top:836px;width:1200px;height:84px;background:#fff;border:2px solid #CFCBC3;border-radius:42px;display:flex;align-items:center;padding:0 22px;gap:20px;font-family:"UI";font-size:28px;color:#8A8A8A;box-shadow:0 14px 34px rgba(0,0,0,.14)}
#inp .a{width:48px;height:48px;border-radius:50%;background:#C9C5BD;flex:none}
#cur{display:inline-block;width:3px;height:36px;background:#0F0F0F;vertical-align:-8px;margin-right:6px}
#cover{position:absolute;left:0;top:0;width:1920px;height:1080px}
#brand{left:260px;top:360px;width:1400px;text-align:center;font-size:250px;line-height:1.1;color:#15181C;white-space:nowrap}
</style></head>
<body><div id="stage">
  <div class="bg tex-paper"></div>
  <div id="card" class="abs" data-box="card">
    <div id="pin"><svg viewBox="0 0 24 24"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg><span>고정됨</span></div>
    <div id="who"><div id="av"></div><div id="nm">성제관</div></div>
    <div id="win"><div id="txt"></div></div>
    <div id="foot">
      <svg id="like" viewBox="0 0 24 24"><path id="lk" d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z" fill="none" stroke="#606060"/></svg>
      <svg id="dis" viewBox="0 0 24 24" style="transform:rotate(180deg)"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z" fill="none" stroke="#606060"/></svg>
      <span>답글</span>
    </div>
  </div>
  <div id="inp" class="abs" data-box="inp"><div class="a"></div><div><span id="cur"></span><span id="ph">댓글 추가...</span></div></div>
  <div id="cover" class="tex-paper" style="opacity:0"></div>
  <div id="brand" class="abs serif" data-box="brand" style="opacity:0">성제관</div>
</div>
<script src="../data/s53.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#ECE8E0', '#15181C', '#F2C230', '#2E55D9'];
const HEAD = '무료 프롬프트 10개 — 복사해서 ○○만 바꿔 넣으세요';
const IT = [
  ['1 리뷰 답글', '아래 리뷰 열 개에 답글 써 줘. 우리 가게는 ○○동 ○○집이고, 말투는 친근하게, 이름은 부르지 말고, 별점 낮은 건 변명하지 말고 고칠 거 하나만 말해 줘.'],
  ['2 네이버 플레이스 · 인스타 소식 글', '우리 가게는 ○○동 ○○집이야. 이번 달 신메뉴는 ○○이고, ○○에 손님이 많아. 이걸로 네이버 플레이스 소식 4개, 인스타 글 4개를 한 달 치로 짜 줘. 한 편은 200자 안으로.'],
  ['3 배달앱 메뉴 설명', '우리 메뉴 ○개야. 재료랑 양이랑 맛을 적어 줄게. 배달앱 메뉴 설명을 메뉴마다 두 줄로 먹어 본 사람이 쓴 것처럼 써 줘. 내가 안 적은 재료는 넣지 마.'],
  ['4 단골 재방문 문자', '한 달 넘게 안 온 단골한테 보낼 문자 세 가지 버전으로 써 줘. 광고 티 나지 않고 짧게, 다음 주 평일 점심에 쓸 수 있는 혜택 하나 넣어서.'],
  ['5 근무표', '우리 가게 알바 ○명이야. 각자 안 되는 요일이랑 시간을 적어 줄게. 필요한 인원은 ○○이야. 다음 주 근무표를 표로 짜 주고 한 사람이 주 몇 시간인지도 같이 보여 줘.'],
  ['6 알바 매뉴얼', '이건 우리 가게 ○○ 순서를 내가 말로 한 거야. 처음 온 알바가 보고 따라 할 수 있게 번호 붙은 체크리스트로 정리해 줘. 위험한 건 맨 위에 넣어 줘.'],
  ['7 채용 공고', '우리 가게 알바 공고 써 줘. 시급이랑 시간은 ○○이고, 우리 가게 좋은 점은 ○○야. 20대가 읽고 지원하고 싶게, 과장하지 말고.'],
  ['8 매출 분석', '이건 우리 가게 석 달 치 매출이야. 요일별로, 시간대별로, 메뉴별로 정리해 주고 제일 안 팔리는 시간이랑 제일 안 팔리는 메뉴 세 개만 뽑아 줘.'],
  ['9 메뉴 원가', '○○ 한 그릇에 들어가는 재료랑 지금 사는 가격을 적어 줄게. 한 그릇 원가가 얼마인지, 판매가 대비 몇 퍼센트인지 계산해 주고 원가 비율 높은 순서로 줄 세워 줘.'],
  ['10 계약서 읽기', '이건 우리 가게 ○○ 계약서야. 우리 쪽에 불리할 수 있는 조항이랑 계약하기 전에 상대방한테 물어봐야 할 질문 다섯 개만 뽑아 줘.<br>※ AI 답은 법률 판단이 아니에요. 도장 찍기 전에는 꼭 사람한테 확인받으세요.'],
];
S.$('#txt').innerHTML = `<div class="hd">${HEAD}</div>` + IT.map((x, i) => `<div class="it" id="it${i}"><b>${x[0]}</b>${x[1]}</div>`).join('');
const T = { pin: S.at('고정'), sc: S.at('내일'), h1: S.at('리뷰', 0) , inp: S.at('댓글로'), like: S.at('좋아요'), cov: S.at('다음') - 0.1 };
T.h1 = S.at('답글부터');
S.ev(0.0, 'in', 'card'); S.ev(T.pin, 'shine', 'pin'); S.ev(T.h1, 'marker', 'it0'); S.ev(T.inp, 'click', 'inp'); S.ev(T.like, 'ok', 'lk'); S.ev(T.cov + 0.4, 'big_in', 'brand');
S.scene(tau => {
  const k = S.ent(tau, -0.2, 0.3), cv = S.cam(tau, T.cov, T.cov + 0.4);
  S.css('#card', { opacity: cv > 0.5 ? 0 : k, transform: `translateY(${(1 - k) * 40}px)` });
  S.css('#inp', { opacity: cv > 0.5 ? 0 : S.ent(tau, 0.2, 0.3) });
  // «고정» — 고정됨 칩이 노랑으로
  const p = S.ent(tau, T.pin, 0.2);
  S.css('#pin', { background: `rgba(242,194,48,${0.8 * p})`, color: p > 0.5 ? '#15181C' : '#606060' });
  // 천천히 스크롤
  const y = 20 * Math.max(0, Math.min(tau, 7.0) - T.sc) + 52 * Math.max(0, tau - 7.0);
  S.css('#txt', { transform: `translateY(${-y}px)` });
  // 1번 형광
  S.css('#it0', { background: `rgba(242,194,48,${0.55 * S.ent(tau, T.h1, 0.2)})` });
  // 댓글 입력창 — 포커스 + 커서 깜빡
  const f = S.ent(tau, T.inp, 0.12);
  S.css('#inp', { borderColor: f > 0 ? '#15181C' : '#CFCBC3' });
  S.css('#cur', { opacity: tau > T.inp ? (Math.floor(tau * 2) % 2 === 0 ? 1 : 0) : 0 });
  // 좋아요 — 코발트로 채워짐
  const l = S.ent(tau, T.like, 0.16), lk = S.$('#lk');
  lk.setAttribute('fill', l > 0 ? '#2E55D9' : 'none'); lk.setAttribute('fill-opacity', l); lk.setAttribute('stroke', l > 0.5 ? '#2E55D9' : '#606060');
  // 끝 — 종이색으로 덮이고 성제관
  const c = S.cam(tau, T.cov, T.cov + 0.4);
  S.css('#cover', { opacity: c });
  const b = S.ent(tau, T.cov + 0.4, 0.2);
  S.css('#brand', { opacity: b, transform: `translateY(${(1 - b) * 20}px)` });
});
</script>
</body></html>
