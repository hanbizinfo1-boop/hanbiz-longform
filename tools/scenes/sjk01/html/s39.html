<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s39 숫자의 방 — 국밥 원가 블록 40% · 수육 70%</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
.seq{position:absolute;left:0;top:0;width:1920px;height:1080px}
#lines{position:absolute;left:0;top:0;width:1920px;height:1080px}
.lab{position:absolute;color:#ECE8E0;font-size:28px;line-height:1;white-space:nowrap;text-shadow:0 2px 12px rgba(0,0,0,.85),0 0 3px rgba(0,0,0,.9)}
.lab.r{text-align:right}
#aTop{font-size:40px}
#aPct{font-size:170px;line-height:1;color:#2E55D9;text-shadow:0 0 28px rgba(255,255,255,.18),0 4px 18px rgba(0,0,0,.7)}
#bPct{font-size:190px;line-height:1;color:#F2C230;text-shadow:0 4px 18px rgba(0,0,0,.7)}
</style></head>
<body><div id="stage">
  <img id="a" class="seq" alt="">
  <svg id="lines" viewBox="0 0 1920 1080"></svg>
  <div id="l0" class="lab mono r" data-box="l0"></div><div id="l1" class="lab mono r" data-box="l1"></div><div id="l2" class="lab mono r" data-box="l2"></div><div id="l3" class="lab mono r" data-box="l3"></div><div id="l4" class="lab mono r" data-box="l4"></div>
  <div id="aTop" class="lab mono" data-box="aTop">4,000 / 10,000</div>
  <div id="aPct" class="lab serif" data-box="aPct">40%</div>
  <div id="lineLab" class="lab mono" data-box="lineLab">보통 35~40%</div>
  <div id="bBase" class="lab mono" data-box="bBase">수육(소) 14,000 / 20,000</div>
  <div id="bBox" class="lab" data-box="bBox" style="text-align:center"><div id="bPct" class="serif">70%</div><div id="bRest" class="mono" style="font-size:30px;margin-top:6px;color:#ECE8E0">남는 것 30%</div></div>
</div>
<script src="../data/s39.js"></script>
<script src="../../../../_tmp/sjk01/blender/b39/proj.js"></script>
<script src="../lib/sjk.js"></script>
<script>
// 3D 막대 연번(블렌더) 위에 글만 얹는다 — 좌표는 proj.js(프레임마다 화면 좌표).
window.PALETTE = ['#ECE8E0', '#2E55D9', '#F2C230'];
const FPSV = 60000 / 1001, N = 1400, BASE = '../../../../_tmp/sjk01/blender/b39/';
const pad = n => String(n).padStart(4, '0');
const NAMES = ['사골 육수 1,200', '돼지 앞다리살 1,700', '밥 400', '부추·파·다대기 300', '김치·깍두기 400'];
const DROP = [0.55, 1.05, 1.55, 2.05, 2.55];
const T = {
  a: S.at('판매가'), p40: S.at('40%'), ln: S.at('40%') + 0.65, b: S.at('수육이'), p70: S.at('70%'), rest: S.at('남는'),
};
S.ev(DROP[0] + 0.4, 'card_in', 'labels'); S.ev(T.a, 'marker', 'aTop'); S.ev(T.p40, 'big_in', 'aPct'); S.ev(T.ln, 'card_in', 'lineLab');
S.ev(T.b, 'msg_in', 'bBase'); S.ev(T.p70, 'big_in', 'bPct'); S.ev(T.rest, 'shine', 'bRest');
const img = document.getElementById('a');
async function seq(tau) {
  const k = Math.min(N, Math.max(1, Math.round(tau * FPSV) + 1));
  const src = BASE + 'f_' + pad(k) + '.png';
  if (img.dataset.src !== src) { img.dataset.src = src; img.src = src; try { await img.decode(); } catch (e) { } }
  return Math.min(N - 1, Math.max(0, k - 1));
}
const place = (id, x, y, o) => S.css(id, Object.assign({ left: x.toFixed(1) + 'px', top: y.toFixed(1) + 'px' }, o));
// sjk.js 의 S.scene 은 async 장면 함수를 기다리지 않는다(연번 decode 전에 캡처될 수 있음) — 여기서는 seek 가 끝까지 기다린다.
const scene = fn => { window.seek = async t => { await fn(t - S.SC.pre); }; };
scene(async tau => {
  const k = await seq(tau), P = window.PROJ[k];
  // ① 블록 라벨 — 왼쪽에 모아 놓고 가는 선으로 블록에 잇는다(블록이 얇아 옆에 붙이면 겹침)
  const ys = []; const raw = P.segs.map(s => s[1]);
  ys[4] = raw[4] - 12;
  for (let i = 3; i >= 0; i--) ys[i] = Math.max(raw[i], ys[i + 1] + 42);
  let svg = '';
  const fade = 1 - S.ent(tau, T.p40 - 0.6, 0.5);          // «40%» 가 서기 전에 정리
  for (let i = 0; i < 5; i++) {
    const kk = S.ent(tau, DROP[i] + 0.35, 0.14) * fade;
    const el = S.$('#l' + i); el.textContent = NAMES[i];
    const ax = 2 * P.A_base[0] - P.segs[i][0];            // 블록 앞쪽 왼 모서리 근처
    place('#l' + i, ax - 46 - 460, ys[i] - 14, { width: '460px', opacity: kk, transform: `translateX(${((1 - kk) * -18).toFixed(2)}px)` });
    if (kk > 0.01) svg += `<line x1="${(ax - 40).toFixed(1)}" y1="${ys[i].toFixed(1)}" x2="${ax.toFixed(1)}" y2="${P.segs[i][1].toFixed(1)}" stroke="#ECE8E0" stroke-opacity="${(0.7 * kk).toFixed(2)}" stroke-width="2"/><circle cx="${ax.toFixed(1)}" cy="${P.segs[i][1].toFixed(1)}" r="4" fill="#ECE8E0" fill-opacity="${kk.toFixed(2)}"/>`;
  }
  S.$('#lines').innerHTML = svg;
  // ② 4,000 / 10,000 → 40%
  const a = S.ent(tau, T.a, 0.14) * (1 - S.ent(tau, T.p40 - 0.02, 0.1));
  place('#aTop', P.A_top[0] - 190, P.A_top[1] - 78, { width: '380px', textAlign: 'center', opacity: a });
  const p = S.ent(tau, T.p40, 0.16);
  place('#aPct', P.A_top[0] - 190, P.A_top[1] - 196, { width: '380px', textAlign: 'center', opacity: p, transform: `translateY(${((1 - p) * 20).toFixed(2)}px)` });
  // ③ 기준선 끝 라벨
  const l = S.ent(tau, T.ln, 0.14);
  place('#lineLab', P.line_r[0] + 18, P.line_r[1] - 14, { opacity: l, transform: `translateX(${((1 - l) * 16).toFixed(2)}px)` });
  // ④ 수육
  const b = S.ent(tau, T.b, 0.14);
  place('#bBase', P.B_base[0] - 200, P.B_base[1] + 34, { width: '400px', textAlign: 'center', opacity: b });
  const q = S.ent(tau, T.p70, 0.16), r = S.ent(tau, T.rest, 0.14);
  place('#bBox', P.B_top[0] - 190, P.B_top[1] - 276, { width: '380px', opacity: q, transform: `translateY(${((1 - q) * 20).toFixed(2)}px)` });
  S.css('#bRest', { opacity: r });
});
</script>
</body></html>
