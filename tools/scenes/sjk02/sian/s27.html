<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>시안 s27 — AI 가 쓴 글을 그대로 메뉴에 올림</title>
<link rel="stylesheet" href="../lib/sjk.css">
<link rel="stylesheet" href="sian.css">
<style>
#dk{left:150px;top:150px;width:1060px;height:760px;transform:rotate(-2deg)}
.bars{display:flex;flex-direction:column;gap:12px;flex:1}
.bars i{display:block;height:20px;border-radius:5px;background:#323B43}
.copy{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:6px 14px;border-radius:9px;background:#1FA39A;font-size:20px;color:#fff}
.copy svg{width:20px;height:20px}
#app{left:1290px;top:500px;width:580px;transform:rotate(1.5deg)}
#app .row{border-bottom:none}
#app .th{width:112px;height:112px;background-image:url("../../../../소재/sjk02/codex/p29_two_pots.png")}
#app .ds{font-size:24px;color:#3A444C}
body.b #dk,body.b #app{filter:none}
.lit{position:relative;z-index:3}
</style></head>
<body><div id="stage">
  <div class="bg tex-dark"></div>
  <div id="dk" class="dk">
    <div class="tb"><span class="md"><i></i>AI</span><span class="tab">새 대화</span></div>
    <div class="cv"><div class="col">
      <div class="me" style="width:40%"><div class="bars"><i style="width:160px"></i></div></div>
      <div class="ai"><div class="av">AI</div><div class="bars"><i style="width:94%"></i><i style="width:70%"></i></div></div>
      <div class="me">메뉴 설명 써 줘</div>
      <div class="ai"><div class="av">AI</div><div class="tx"><span id="ans" class="ansT">진한 사골 육수에 푸짐한 고기를 담은 정성 가득한 한 그릇</span><br><span class="copy"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>복사</span></div></div>
    </div></div>
    <div class="in"><span style="color:#6B747B">메시지 보내기</span><span class="send"><svg viewBox="0 0 24 24" fill="none" stroke="#171C21" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span></div>
  </div>
  <div id="app" class="app"><div class="hd">메뉴</div>
    <div class="row"><div class="th"></div><div><div class="nm">돼지국밥</div><div class="ds"><span class="dsT">진한 사골 육수에 푸짐한 고기를 담은 정성 가득한 한 그릇</span></div></div></div></div>

  <!-- A 콜아웃: 두 글에 같은 청록 밑줄 + 키캡 화살표 + 결론 카드 -->
  <svg class="full va"><path class="lead" d="M380 600 C 560 800, 1060 820, 1282 700" stroke-dasharray="14 12"/><path class="lead" d="M1282 686 L1304 700 L1280 716" /></svg>
  <div class="keys va" style="left:470px;top:690px"><span class="key">Ctrl</span>+<span class="key">C</span></div>
  <div class="keys va" style="left:960px;top:690px"><span class="key">Ctrl</span>+<span class="key">V</span></div>
  <div class="co va" style="left:1290px;top:250px"><div class="ic" style="background:#3A4651"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></div><div><div class="tt">그대로 올림</div><div class="sb">고친 곳 없이 메뉴판으로</div></div></div>

  <!-- B 스포트라이트: 두 글만 밝히고 굵은 주홍 붓 화살표 + 큰 글 -->
  <svg class="full vb"><defs><filter id="bl"><feGaussianBlur stdDeviation="22"/></filter>
    <mask id="m"><rect width="1920" height="1080" fill="#fff"/><g filter="url(#bl)" fill="#000"><rect x="250" y="440" width="930" height="150" rx="30" transform="rotate(-2 700 495)"/><rect x="1290" y="500" width="590" height="250" rx="30"/></g></mask></defs>
    <rect width="1920" height="1080" fill="rgba(6,9,12,.78)" mask="url(#m)"/>
    <path class="brush" d="M720 600 C 860 760, 1080 790, 1250 690" stroke-width="18"/><path class="brush" d="M1196 664 L1262 684 L1232 744" stroke-width="18"/>
    <path class="brush" d="M1300 290 C 1460 274, 1640 276, 1790 288" stroke-width="22" opacity=".95"/></svg>
  <div class="kick vb" style="left:1300px;top:150px">AI 글 → <b>메뉴판</b></div>
  <div class="big vb" style="left:1292px;top:196px;font-size:104px">그대로 올림</div>

  <!-- C 스티커: 큰 기울인 스티커 + 손그림 화살표 -->
  <svg class="full vc"><path class="scrib" d="M640 560 C 760 720, 1000 760, 1240 660"/><path class="scrib" d="M1188 636 L1250 656 L1214 712"/>
    <path class="scrib" d="M262 462 C 520 440, 1000 432, 1150 452 C 1175 478, 1160 516, 1110 524 C 820 540, 480 548, 272 536 C 244 516, 244 484, 272 466" stroke-width="7"/></svg>
  <div class="stk vc" style="left:1300px;top:250px;transform:rotate(-7deg);font-size:58px"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>그대로 올림</div>
</div>
<script>document.body.className = (new URLSearchParams(location.search).get('v') || 'a');
if (document.body.className === 'a') document.querySelectorAll('.ansT,.dsT').forEach(e => e.classList.add('same'));</script>
</body></html>
