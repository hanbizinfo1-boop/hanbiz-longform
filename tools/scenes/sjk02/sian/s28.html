<style>

#glow{background:rgba(255,255,255,.10);box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 60px 16px rgba(255,200,170,.45)}

<body><div id="stage">
  <div id="world" class="abs">
    <div id="ph" class="photo"></div>
    <div id="glow" class="memo va"></div>

    <svg class="full vc"><path class="scrib" d="M1010 228 C 1120 196, 1300 200, 1340 300 C 1370 420, 1340 620, 1270 690 C 1180 740, 1010 700, 975 620 C 950 500, 960 330, 1030 240 C 1080 200, 1180 205, 1230 220" stroke-width="6"/></svg>

  <svg class="full va"><path class="lead" d="M960 330 L760 330 L760 300"/></svg>

  <div class="co va" style="left:250px;top:780px;padding:10px 22px 10px 10px"><div class="ic" style="background:var(--te);width:52px;height:52px;font-size:24px">AI</div><div><div class="tt" style="font-size:28px">아직 대기</div></div></div>

  <!-- B 스포트라이트: 메모지 빼고 어둡게 → 왼쪽 큰 글 -->
  <svg class="full vb"><defs><filter id="bl"><feGaussianBlur stdDeviation="50"/></filter>
    <mask id="m"><rect width="1920" height="1080" fill="#fff"/><ellipse cx="1150" cy="460" rx="250" ry="330" fill="#000" filter="url(#bl)"/></mask></defs>
    <rect width="1920" height="1080" fill="rgba(6,9,12,.80)" mask="url(#m)"/>
    <path class="brush" d="M150 560 C 330 540, 520 542, 690 552" stroke-width="24" opacity=".95"/></svg>
  <div class="kick vb" style="left:150px;top:380px">AI 한테 시키기 <b>전에</b></div>
  <div class="big vb" style="left:142px;top:428px;font-size:130px">한 줄 먼저</div>

  <!-- C 스티커: 손그림 동그라미(세계 안) + 화살표 + 손글씨 + AI 스티커 -->
  <svg class="full vc"><path class="scrib" d="M520 640 C 640 600, 760 560, 880 520"/><path class="scrib" d="M826 510 L886 518 L858 572"/></svg>
  <div class="hnd vc" style="left:300px;top:640px;font-size:84px;transform:rotate(-6deg)">이 한 줄</div>
  <div class="stk te vc" style="left:250px;top:150px;transform:rotate(-8deg);font-size:44px;padding:10px 24px">AI</div>
</div>

document.body.className = (new URLSearchParams(location.search).get('v') || 'a');
