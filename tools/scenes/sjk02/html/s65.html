<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s65 줄인 시간은 손님한테 — 바쁜 점심 홀(얼굴 흐림) → 근무 기록지에 접힌 칸 셋이 «손님» 열로 모여 주홍</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
.cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.ph{position:absolute;left:0;top:-100px;width:1920px;height:1280px;background-size:100% 100%;background-repeat:no-repeat}
.fb{position:absolute;border-radius:50%;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#tb{position:absolute;left:0;top:0;width:1200px;height:1000px;background:#EDEEF3;font-family:"Pre";color:#1F2A33}
#tb .ln{position:absolute;left:0;height:3px;width:1200px;background:#C9CCD3}
#tb .vl{position:absolute;top:0;width:3px;height:1000px;background:#C9CCD3}
#tb .hd{position:absolute;top:70px;font-size:40px;font-weight:800;color:#59636B;letter-spacing:.1em}
#tb .lb{position:absolute;left:40px;font-size:44px;font-weight:800;white-space:nowrap}
#tb .ce{position:absolute;left:340px;width:230px;height:66px;border-radius:6px;background:#1F2A33;color:#fff;font-size:38px;font-weight:800;display:flex;align-items:center;justify-content:center}
#tb .cl{position:absolute;left:790px;top:20px;width:340px;height:760px;border:5px dashed rgba(240,90,40,.0);border-radius:10px}
</style></head>
<body><div id="stage">
  <div id="shotA" class="cam">
    <div id="ph1" class="ph"></div>
    <div class="fb" style="left:640px;top:-100px;width:1290px;height:740px"></div>
    <div class="fb" style="left:420px;top:-100px;width:260px;height:400px"></div>
  </div>
  <div id="shotB" class="cam">
    <div id="ph2" class="ph"></div>
    <div id="tb" data-diegetic>
      <div class="ln" style="top:150px"></div><div class="ln" style="top:300px"></div><div class="ln" style="top:450px"></div><div class="ln" style="top:600px"></div>
      <div class="vl" style="left:780px"></div>
      <div class="hd" id="hd" style="left:800px;color:#F05A28">손님</div>
      <div class="lb" id="l0" style="top:182px">리뷰 답글</div><div class="ce" id="c0" style="top:182px">30분</div>
      <div class="lb" id="l1" style="top:332px">근무표</div><div class="ce" id="c1" style="top:332px">5분</div>
      <div class="lb" id="l2" style="top:482px">매주 숫자</div><div class="ce" id="c2" style="top:482px">5분</div>
    </div>
  </div>
</div>
<script src="../data/s65.js"></script>
<script src="../lib/sjk.js"></script>
<script>S.camCssC = c => S.camCss({ s: c.s, x: Math.min(1920 - 960 / c.s, Math.max(960 / c.s, c.x)), y: Math.min(1180 - 540 / c.s, Math.max(540 / c.s - 100, c.y)) });</script>
<script>
window.PALETTE = ['#2B3036', '#1F2A33', '#F05A28'];
window.DEVICES = ['R10 되부름'];
S.$('#ph1').style.backgroundImage = S.ph('n65_busy_lunch_hall');
S.$('#ph2').style.backgroundImage = S.ph('n58_timesheet');
const sc = q => q.map(p => [p[0] * 1.25, p[1] * 1.25 - 100]);
S.fitQuad(S.$('#tb'), 1200, 1000, sc([[203, 266], [1060, 170], [1360, 848], [319, 1038]]));
const T = { cut: S.at('리뷰', 0), tbl: S.at('테이블을'), ai: S.at('AI를'), r1: S.at('근무표'), r2: S.at('매주'), fr: S.at('이렇게'), mv: S.at('시간을'), cus: S.at('손님한테') };
S.ev(T.cut, 'in', 'tb'); S.ev(T.r1, 'card_in', 'l1'); S.ev(T.r2, 'card_in', 'l2'); S.ev(T.fr, 'card_in', 'hd'); S.ev(T.mv, 'sweep', 'c0'); S.ev(T.cus, 'shine', 'c0');
const KA = [{ t: 0, s: 1.14, x: 640, y: 380 }];
// 10-20 효과음 채움 — «테이블을» 에 카메라가 손님 쪽으로 옮김 · «AI를» 에 한 번 더 다가감
S.ev(T.tbl - 0.05, 'in', 'f_tbl'); S.ev(T.ai - 0.3, 'sweep', 'f_push');
S.scene(tau => {
  const A = tau < T.cut;
  S.$('#shotA').style.display = A ? 'block' : 'none'; S.$('#shotB').style.display = A ? 'none' : 'block';
  // 샷 A: 앞 반은 쟁반 든 대표님 쪽, «언제 테이블을 돌아» 부터 손님 쪽 — 둘 다 느린 밀기, «AI를» 에 한 번 더 다가감
  const b = tau >= T.tbl - 0.1;
  const push = S.cam(tau, T.ai - 0.3, T.ai + 0.3);
  const s = b ? S.lerp(1.1, 1.18, S.P(tau, T.tbl, T.cut)) + 0.08 * push : S.lerp(1.12, 1.2, S.P(tau, 0, T.tbl));
  const x = b ? S.lerp(1230, 1300, S.P(tau, T.tbl, T.cut)) : S.lerp(620, 700, S.P(tau, 0, T.tbl)), y = b ? 360 : 400;
  S.$('#shotA').style.transform = S.camCssC({ s, x, y });
  // 샷 B: 근무 기록지 — 줄 셋의 접힌 칸이 차례로, «시간을» 에 «손님» 열로 미끄러져 모임, «손님한테» 에 주홍
  S.$('#shotB').style.transform = S.camCssC({ s: S.lerp(1.0, 1.07, S.P(tau, T.cut, S.SC.dur)), x: 960, y: 540 });
  S.css('#tb', { opacity: S.ent(tau, T.cut, 0.25) });
  const R = [T.cut, T.r1, T.r2];
  const m = S.EZ(S.P(tau, T.mv, T.mv + 0.6)), o = S.ent(tau, T.cus, 0.2);
  R.forEach((t, i) => {
    const l = S.ent(tau, t, 0.14), c = S.ent(tau, t + 0.2, 0.14);
    S.css('#l' + i, { opacity: l, transform: `translateX(${((1 - l) * -20).toFixed(1)}px)` });
    const ce = S.$('#c' + i);
    ce.style.opacity = c; ce.style.left = S.lerp(340, 830, m) + 'px';
    ce.style.background = `rgb(${Math.round(31 + 209 * o)},${Math.round(42 + 48 * o)},${Math.round(51 - 11 * o)})`;
    ce.style.boxShadow = `0 0 0 ${(o * 8).toFixed(1)}px rgba(240,90,40,${(0.5 * o).toFixed(2)})`;
  });
  S.css('#hd', { opacity: S.ent(tau, T.fr, 0.14) });
});
</script>
</body></html>
