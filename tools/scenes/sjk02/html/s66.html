<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s66 딱 세 개 — 테이블 번호표 사진 → 첫 번째 단골 노트 / 두 번째 메뉴판 / 세 번째 홀 어깨 너머, 컷마다 왼쪽 아래 큰 번호와 두 낱말 이름표</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
.cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.ph{position:absolute;left:0;top:-100px;width:1920px;height:1280px;background-size:100% 100%;background-repeat:no-repeat}
#shade{position:absolute;left:0;top:0;width:1920px;height:1080px;background:radial-gradient(ellipse 900px 620px at 0px 1000px,rgba(8,10,14,.72),rgba(8,10,14,0))}
#num{position:absolute;left:96px;top:470px;font-size:230px;line-height:1;color:rgba(255,255,255,.72);text-shadow:0 6px 28px rgba(0,0,0,.55);opacity:0}
#tag{position:absolute;left:104px;top:742px;font-family:"Pre";font-weight:800;font-size:60px;letter-spacing:.04em;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.75);white-space:nowrap}
#tag span{display:inline-block}
#ul{position:absolute;left:100px;top:822px;width:360px;height:30px;overflow:visible}
</style></head>
<body><div id="stage">
  <div id="c0" class="cam"><div id="ph0" class="ph"></div></div>
  <div id="c1" class="cam"><div id="ph1" class="ph"></div></div>
  <div id="c2" class="cam"><div id="ph2" class="ph"></div></div>
  <div id="c3" class="cam"><div id="ph3" class="ph"></div></div>
  <div id="shade"></div>
  <div id="num" class="blk" data-box="num">1</div>
  <div id="tag" data-box="tag"><span id="w1"></span> <span id="w2"></span></div>
  <svg id="ul" viewBox="0 0 560 30" preserveAspectRatio="none"><path id="ulp" d="M4 18 C 120 6, 300 8, 556 14" fill="none" stroke="#F05A28" stroke-width="12" stroke-linecap="round"/></svg>
</div>
<script src="../data/s66.js"></script>
<script src="../lib/sjk.js"></script>
<script>S.camCssC = c => S.camCss({ s: c.s, x: Math.min(1920 - 960 / c.s, Math.max(960 / c.s, c.x)), y: Math.min(1180 - 540 / c.s, Math.max(540 / c.s - 100, c.y)) });</script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#14191E', '#FFFFFF', '#F05A28'];
window.DEVICES = ['R12 번호 컷'];
['p57_table_number', 'p63_regular_notebook', 'p62_menu_lowangle', 'p61_hall_shoulder'].forEach((n, i) => { S.$('#ph' + i).style.backgroundImage = S.ph(n); });
const T = { c1: S.at('첫'), c2: S.at('두'), c3: S.at('세', 2), push: S.at('딱'), a: S.at('자주'), b: S.at('처음'), c: S.at('새벽'), d: S.at('답글만'), e: S.at('다음에') };
const SH = [
  { cut: T.c1, num: '1', w1: ['단골', S.at('단골')], w2: ['기억', S.at('기억하기')] },
  { cut: T.c2, num: '2', w1: ['한 줄', S.at('한줄')], w2: ['말하기', S.at('말해')] },
  { cut: T.c3, num: '3', w1: ['직접', S.at('불만')], w2: ['얘기', S.at('얘기하기')] }];
const ulp = S.$('#ulp'), UL = ulp.getTotalLength(); ulp.style.strokeDasharray = UL;
SH.forEach((s, i) => { S.ev(s.cut, 'card_in', 'num'); S.ev(s.w2[1], 'marker', 'ul'); });
S.ev(T.push, 'in', 'c0'); S.ev(T.a, 'in', 'c1'); S.ev(T.b, 'in', 'c2'); S.ev(T.d, 'in', 'c3');
// 컷마다 카메라: [시작 s, 끝 s, x, y] + 중간 한 걸음
const CAM = {
  0: tau => ({ s: S.lerp(1.0, 1.05, S.P(tau, 0, T.c1)) + 0.07 * S.cam(tau, T.push, T.push + 0.5), x: 960, y: 540 }),
  1: tau => ({ s: S.lerp(1.0, 1.1, S.P(tau, T.c1, T.c2)) + 0.06 * S.cam(tau, T.a, T.a + 0.5), x: 960 + 40 * S.P(tau, T.c1, T.c2), y: 560 }),
  2: tau => ({ s: 1.38 + 0.04 * S.P(tau, T.c2, T.c3), x: S.lerp(470, 640, S.cam(tau, T.b, T.b + 0.5)) + 90 * S.cam(tau, T.c, T.c + 0.5), y: 640 }),
  3: tau => ({ s: S.lerp(1.0, 1.1, S.P(tau, T.c3, S.SC.dur)) + 0.05 * S.cam(tau, T.d, T.d + 0.5) + 0.05 * S.cam(tau, T.e, T.e + 0.5), x: 960 + 30 * S.cam(tau, T.d, T.d + 0.5), y: 560 })
};
S.scene(tau => {
  const idx = tau < T.c1 ? 0 : tau < T.c2 ? 1 : tau < T.c3 ? 2 : 3;
  for (let i = 0; i < 4; i++) { S.$('#c' + i).style.display = i === idx ? 'block' : 'none'; }
  S.$('#c' + idx).style.transform = S.camCssC(CAM[idx](tau));
  S.css('#shade', { opacity: idx === 0 ? 0 : 1 });
  const cur = SH[Math.max(0, idx - 1)], t0 = cur.cut;
  const on = idx > 0;
  S.$('#num').textContent = cur.num;
  const k = S.ent(tau, t0, 0.14);
  S.css('#num', { opacity: on ? k : 0, transform: `translateY(${((1 - k) * 24).toFixed(1)}px)` });
  const a = S.ent(tau, cur.w1[1], 0.12), b = S.ent(tau, cur.w2[1], 0.12);
  S.$('#w1').textContent = cur.w1[0]; S.$('#w2').textContent = cur.w2[0];
  S.css('#w1', { opacity: on ? a : 0, transform: `translateY(${((1 - a) * 14).toFixed(1)}px)` });
  S.css('#w2', { opacity: on ? b : 0, transform: `translateY(${((1 - b) * 14).toFixed(1)}px)` });
  const u = S.EO(S.P(tau, cur.w2[1] + 0.05, cur.w2[1] + 0.45));
  ulp.style.strokeDashoffset = UL * (1 - u); ulp.style.opacity = on && u > 0 ? 1 : 0;
});
</script>
</body></html>
