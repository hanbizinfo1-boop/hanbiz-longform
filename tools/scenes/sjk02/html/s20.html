<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s20 무조건 AI 쓰시라고 했어요 — 상담 탁자 어깨 너머 + 기울인 태블릿 설정 판 스위치가 하나씩 켜짐(실제 화면 동작)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#ph{position:absolute;left:0;top:-100px;width:1920px;height:1280px;background-size:100% 100%;filter:saturate(.8) contrast(1.03)}
#tilt{left:880px;top:270px;width:900px;height:660px;transform:perspective(2200px) rotateX(8deg) rotateZ(-3deg);transform-origin:50% 50%}
#pn{left:0;top:0;width:900px;height:510px}
#pn .hd{height:70px;font-size:36px;padding:0 34px}
#nm{height:84px;display:flex;align-items:center;padding:0 34px;font-size:38px;font-weight:800;border-bottom:1px solid #EEF0F1;color:#59636B}
.sr{position:relative;height:116px;display:flex;align-items:center;padding:0 34px;border-bottom:1px solid #EEF0F1;font-size:40px;font-weight:800}
.sr .sw{position:absolute;right:40px;top:30px;width:112px;height:56px;border-radius:28px;background:#C8CDD1}
.sr .sw i{position:absolute;left:5px;top:5px;width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#bar{left:0;top:590px;width:900px;height:72px}
#bar .lab{position:absolute;left:34px;top:20px;font-size:30px;color:#1F2A33;letter-spacing:.08em}
#bar .tr{position:absolute;left:250px;top:24px;width:600px;height:26px;border-radius:13px;background:#E3E6E8}
#bar .fl{position:absolute;left:250px;top:24px;height:26px;border-radius:13px;background:var(--te)}
</style></head>
<body><div id="stage">
  <div id="world"><div id="ph"></div></div>
  <div id="tilt" class="abs">
    <div id="pn" class="app" data-diegetic data-box="pn">
      <div class="hd">자동화 설정</div>
      <div id="nm">○○국밥</div>
      <div class="sr" id="r1">리뷰 답글 · AI 자동<div class="sw" id="s1"><i></i></div></div>
      <div class="sr" id="r2">소식 글 · AI 자동<div class="sw" id="s2"><i></i></div></div>
      <div class="sr" id="r3" style="border-bottom:0">메뉴 설명 · AI 자동<div class="sw" id="s3"><i></i></div></div>
    </div>
    <div id="bar" class="app" data-diegetic data-box="bar"><div class="lab lab">작업 시간</div><div class="tr"></div><div id="fl" class="fl" style="width:600px"></div></div>
  </div>
</div>
<script src="../data/s20.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#D9DBD6', '#1F2A33', '#1FA39A'];   // 흐린 낮 사진 + 흰 앱 판 + 청록 스위치 = AI 가 하는 것
window.DEVICES = ['실제 화면 동작'];
const T = { nm: S.at('상담하는'), rows: S.at('무조건'), rv: S.at('리뷰도'), sk: S.at('소식'), mn: S.at('메뉴'), down: S.at('일은 진짜') };
document.getElementById('ph').style.backgroundImage = S.ph('p20_consult_table');
S.ev(0.0, 'in', 'pn'); S.ev(T.nm, 'card_in', 'nm');
S.ev(T.rv, 'click', 's1'); S.ev(T.sk, 'ok', 's2'); S.ev(T.mn, 'click', 's3'); S.ev(T.down, 'gauge', 'fl');
const sw = (id, tau, t0) => {
  const el = document.getElementById(id), k = S.EO(S.P(tau, t0, t0 + 0.18));
  el.style.background = `rgb(${Math.round(200 + (31 - 200) * k)},${Math.round(205 + (163 - 205) * k)},${Math.round(209 + (154 - 209) * k)})`;
  el.firstElementChild.style.left = (5 + 56 * k) + 'px';
};
S.scene(tau => {
  const s = 1.0 + 0.07 * S.P(tau, 0, S.SC.dur);
  S.css('#world', { transform: S.camCss({ s, x: 960 + 40 * S.P(tau, 0, S.SC.dur), y: 540 }) });
  // 판 들어옴(0.25초, 줄 셋은 꺼진 채) → 가게 이름 줄(상담하는) → 스위치 셋
  const k = S.ent(tau, 0, 0.25);
  S.css('#tilt', { opacity: k, transform: `perspective(2200px) rotateX(8deg) rotateZ(-3deg) translateY(${((1 - k) * 60).toFixed(1)}px)` });
  S.css('#nm', { opacity: S.ent(tau, T.nm, 0.12) });
  sw('s1', tau, T.rv); sw('s2', tau, T.sk); sw('s3', tau, T.mn);
  S.css('#fl', { width: S.lerp(600, 200, S.EO(S.P(tau, T.down, T.down + 0.7))) + 'px' });
});
</script>
</body></html>
