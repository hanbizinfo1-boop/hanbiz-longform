<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s38 소식 글 — «AI로 쓰기» 소식 화면에 뻔한 글 → 세 가게에 같은 글(회색) → 배추 사진 2.5D 위에서 한 줄 넣어 시킴 → 배추 사진이 들어간 새 소식 글</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
/* 10-19 다시 만들기: 콘크리트·회색 사진 자리·손글씨(말 복사) 삭제 → 배추 사진 2.5D(R5 Business Casual, blender/parallax.py) + 읽히는 소식 화면 */
#bgA{left:-40px;top:-30px;width:2000px;height:1140px;background-size:cover;background-position:center;filter:blur(18px) brightness(.55) saturate(.7)}
#bl{position:absolute;left:0;top:0;width:1920px;height:1080px;transform:scale(1.12);transform-origin:40% 50%}   /* 2.5D 이동 끝에 사진 가장자리가 보여 12% 키워 덮음 */
.row3{position:absolute;left:0;top:0;width:1920px;height:1080px;perspective:2200px}
.rin{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:50% 55%;transform:rotateX(7deg) rotateZ(-2deg)}
.pn{width:520px;top:170px}
.pn .pf{display:flex;align-items:center;gap:14px;padding:16px 26px}
.pn .pf .nm{font-size:26px}
.pn .pf .dt{font-size:22px;color:#7B848B;margin-left:auto}
.pn .pic{position:relative;margin:0 26px;height:200px;border-radius:10px;overflow:hidden;background-size:cover;background-position:center 60%}
.pn .bd{padding:20px 26px 10px;font-size:28px;line-height:1.5;color:#1F2A33;font-weight:600;min-height:150px}
.pn .ai{display:inline-flex;align-items:center;gap:8px;margin:0 26px 18px;padding:8px 16px;border-radius:10px;background:#E3F4F2;color:#0B6E66;font-size:22px;font-weight:800}
.pn .ft{height:62px;border-top:1px solid #EEF0F1;display:flex;align-items:center;gap:26px;padding:0 26px;font-size:22px;color:#59636B;font-weight:600}
.pn .ft b{color:#F05A28}
.oh{background:linear-gradient(transparent 56%,rgba(240,90,40,.40) 56%) no-repeat;background-size:calc(var(--hl,0)*100%) 100%}
#dkin{position:absolute;left:310px;top:830px;width:1300px;height:96px}
#dkin .in{position:absolute;left:0;top:0;right:0;bottom:0;font-size:30px}
#pz{left:1300px;top:70px;width:560px}
</style></head>
<body><div id="stage">
  <div id="bgA" class="photo abs"></div>
  <img id="bl" alt="">
  <!-- 샷 A : 뻔한 소식 글 -->
  <div id="shotA" class="abs" style="left:0;top:0;width:1920px;height:1080px">
    <div class="row3"><div class="rin">
      <div id="pm" class="app pn" style="left:700px;transform-origin:50% 0"></div>
      <div id="pc1" class="app pn" style="left:120px"></div>
      <div id="pc2" class="app pn" style="left:1280px"></div>
    </div></div>
  </div>
  <!-- 샷 B : 배추 2.5D 위 입력창 -->
  <div id="dkin" class="dk"><div class="in"><span id="dkt"></span><span class="send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" stroke="#171C21" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg></span></div></div>
  <!-- 샷 C : 새 소식 글 -->
  <div id="pz" class="app pn"></div>
</div>
<script src="../data/s38.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#4A5A4C', '#1F2A33', '#F05A28'];   // 배추 사진 · 먹 글 · 주홍(가게 한 줄) — 회색은 «똑같은 것»
window.DEVICES = ['R5 사진 2.5D(블렌더)', '실제 화면 동작(소식 글)'];
const T = { tp: S.at('시키면'), out: S.at('나와요'), nxt: S.at('이런'), any: S.at('어느'), sik: S.at('시킬'), bae: S.at('배추가'), kim: S.at('김치를'),
            gae: S.at('얘기가'), son: S.at('손님이'), tt: S.at('떠오를'), diff: S.at('차이예요') };
const TB = T.sik - 0.08, TC = T.gae - 0.1;      // 샷 B·C 시작
const OLD = '이번 주도 맛있는 국밥으로 찾아뵙겠습니다.';
const PROMPT = '이번 주는 배추가 너무 좋아서 김치를 평소보다 두 통 더 담갔어요.';
const NEW = '이번 주는 {oh|배추가 너무 좋아서} 김치를 평소보다 두 통 더 담갔어요.';
function panel(id, name, pic) {
  S.$('#' + id).innerHTML = '<div class="hd">소식</div><div class="pf"><div class="av">○</div><div class="nm">' + name + '</div><div class="dt">방금</div></div>' +
    '<div class="pic"></div><div class="bd"></div>' + (id === 'pm' ? '<div class="ai">AI로 쓰기</div>' : '') + '<div class="ft">좋아요 <b>0</b> · 댓글 0</div>';
  S.$('#' + id + ' .pic').style.backgroundImage = S.ph(pic);
}
panel('pm', '○○국밥', 'p67_pot_lid_steam'); panel('pc1', '○○해장국', 'p30_burner_flame'); panel('pc2', '○○설렁탕', 'p29_two_pots'); panel('pz', '○○국밥', 'p38_cabbage_macro');
S.$('#pc1 .bd').textContent = OLD; S.$('#pc2 .bd').textContent = OLD;
S.$('#bgA').style.backgroundImage = S.ph('p38_cabbage_macro');
S.ev(0.02, 'in', 'pm'); S.ev(T.tp, 'click', 'aibtn'); S.ev(T.tp + 0.35, 'type', 'pm');
S.ev(T.any, 'card_in', 'pc'); S.ev(T.any + 0.75, 'no', 'grey');
S.ev(TB, 'in', 'shotB'); S.ev(T.sik + 0.5, 'type', 'dkt');
S.ev(TC, 'card_in', 'pz'); S.ev(T.gae + 0.6, 'marker', 'hl'); S.ev(T.son + 0.3, 'gauge', 'likes'); S.ev(T.diff, 'shine', 'pz');
// 10-20 효과음 채움 — 뻔한 글이 써지는 중 · «이런» 에 화면이 물러남 · 프롬프트가 써지는 중
S.ev(T.nxt, 'sweep', 'f_pullback'); S.ev(T.bae + 0.1, 'type', 'f_dkt'); S.ev(T.kim + 1.5, 'type', 'f_dkt');
S.scene(async tau => {
  if (tau >= TB - 0.2) await S.bl('#bl', 's38', tau, { t0: 7.55, pfx: 'f_' });
  S.$('#bl').style.visibility = tau >= TB ? 'visible' : 'hidden';
  S.$('#shotA').style.visibility = tau < TB ? 'visible' : 'hidden';
  // ── 샷 A: 흐린 배추 바탕 위 소식 화면
  S.css('#bgA', { transform: `scale(${(1.0 + 0.04 * S.P(tau, 0, TB)).toFixed(4)})` });
  const k0 = S.ent(tau, 0.0, 0.14), m = S.cam(tau, T.nxt, T.nxt + 0.5);
  S.css('#pm', { opacity: k0, transform: `translateY(${((1 - k0) * 24).toFixed(1)}px) scale(${(1.3 - 0.3 * m).toFixed(4)})` });
  const btn = S.$('#pm .ai'); btn.style.background = tau >= T.tp && tau < T.tp + 0.25 ? '#BFE6E1' : '#E3F4F2';
  btn.style.opacity = (1 - S.P(tau, T.out, T.out + 0.3)).toFixed(3);
  E.line('#pm .bd', OLD, tau, T.tp + 0.35, T.out - 0.15, true);
  E.pop('#pc1', tau, T.any, { dx: -50, dy: 0, sc: 0.04 }); E.pop('#pc2', tau, T.any + 0.12, { dx: 50, dy: 0, sc: 0.04 });
  const g = S.P(tau, T.any + 0.75, T.any + 1.2);
  ['#pm', '#pc1', '#pc2'].forEach(s => E.gray(s, g));
  // ── 샷 B: 배추 2.5D + 입력창
  const kb = S.ent(tau, T.sik + 0.15, 0.14), kbo = 1 - S.P(tau, TC, TC + 0.3);
  S.css('#dkin', { opacity: (kb * kbo).toFixed(3), transform: `translateY(${((1 - kb) * 30).toFixed(1)}px)` });
  E.line('#dkt', PROMPT, tau, T.sik + 0.5, T.kim + 1.9, true);
  // ── 샷 C: 새 소식 글(배추 사진)
  const kc = S.ent(tau, TC, 0.14);
  S.css('#bl', { filter: `brightness(${(1 - 0.25 * S.P(tau, TC, TC + 0.4)).toFixed(3)})` });
  S.css('#pz', { opacity: tau >= TC ? kc : 0, transform: `perspective(2200px) rotateY(-8deg) rotateZ(1.5deg) translateX(${((1 - kc) * 60).toFixed(1)}px) scale(1.4)`, transformOrigin: '100% 0' });
  const bd = S.$('#pz .bd');
  E.line(bd, NEW, tau, TC + 0.15, TC + 1.6, true);
  bd.querySelectorAll('.oh').forEach(e => e.style.setProperty('--hl', S.EO(S.P(tau, T.gae + 0.6, T.gae + 1.1)).toFixed(3)));
  S.$('#pz .ft b').textContent = Math.round(S.count(tau, T.son + 0.3, T.son + 1.6, 0, 48));
  E.ring('#pz', tau, T.diff);
});
</script>
</body></html>
