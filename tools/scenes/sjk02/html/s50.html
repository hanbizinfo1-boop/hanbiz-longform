<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s50 이번 주 정산 — 영수증 롤 사진 위로 감열지 띠에 줄이 인쇄되듯 위에서 아래로</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#bgp{position:absolute;left:0;top:0;width:1920px;height:1080px;background-size:cover;background-position:center;filter:brightness(.62) saturate(.8)}
#rc{left:660px;top:-60px;width:600px;height:1200px;transform:rotateX(0deg)}
#rc .r{position:absolute;left:0;width:600px;height:76px}
#rc .lb{position:absolute;left:34px;top:14px;font-size:36px;font-weight:700;color:#232A30;letter-spacing:-.01em}
#rc .am{position:absolute;right:34px;top:14px;font-size:38px;font-weight:800;color:#232A30;font-variant-numeric:tabular-nums}
#rc .r.big .lb,#rc .r.big .am{color:#E04A18;font-weight:900;font-size:42px;top:12px}
#rc .r.fee{height:112px}
#rc .r.fee .lb{font-size:30px;top:8px}
#rc .r.fee .am{font-size:44px;top:44px;left:34px;right:auto;color:#E04A18;font-weight:900}
#rc .ul{position:absolute;left:30px;width:300px;height:7px;background:#F05A28;border-radius:4px;bottom:6px}
#rc .rule{position:absolute;left:30px;right:30px;height:8px;background:#232A30;top:30px}
#rc .hd{position:absolute;left:34px;top:112px;font-size:26px;font-weight:600;letter-spacing:.2em;color:#6A737A}
</style></head>
<body><div id="stage">
  <div id="cam">
    <div id="bgp"></div>
    <div id="rcw" class="abs" style="left:0;top:0;width:1920px;height:1080px"><div class="abs thermal" style="left:660px;top:-700px;width:600px;height:660px"></div><div id="rc" class="abs thermal"><div class="hd">이번 주</div></div></div>
  </div>
</div>
<script src="../data/s50.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#14191E', '#F4F4F2', '#F05A28'];
window.DEVICES = ['R10 감열지 숫자'];
S.$('#bgp').style.backgroundImage = S.ph('p43_receipt_roll');
// 행: [종류, 라벨, 금액, 시각, 이벤트]
const L = n => S.line(n).t0;
const ROWS = [
  { k: '', lb: '이번 주 매출', am: '7,200,000', t: L(1) - 0.05, ev: 'page' },
  { k: '', lb: '재료비', am: '-2,600,000', t: L(2) - 0.05, ev: 'card_in' },
  { k: '', lb: '인건비', am: '-1,800,000', t: L(3) - 0.05, ev: 'page' },
  { k: '', lb: '수수료', am: '-700,000', t: L(4) - 0.05, ev: 'card_in' },
  { k: '', lb: '고정비', am: '-1,100,000', t: L(5) - 0.05, ev: 'page' },
  { k: 'rule', t: L(6) - 0.5 },
  { k: 'big', lb: '이번 주 수익', am: '1,000,000', t: L(6) - 0.05, ev: 'card_in' },
  { k: 'fee', lb: '지난주보다 배달앱 수수료', am: '+150,000', t: L(7) - 0.05, ev: 'page' }];
const T = { h: S.at('100만'), w15: S.at('15만'), one: S.at('한눈에'), look: S.at('이렇게') };
const rc = S.$('#rc'), Y0 = 130, YS = 80;
ROWS.forEach((r, i) => {
  const d = document.createElement('div'); d.className = 'r ' + (r.k === 'rule' ? '' : r.k); d.id = 'r' + i;  if (r.k !== "rule") d.setAttribute("data-box", "r" + i);
  r.y = Y0 + i * YS + (i > 6 ? 16 : 0); d.style.top = r.y + 'px';
  if (r.k === 'rule') d.innerHTML = '<div class="rule"></div>';
  else d.innerHTML = `<div class="lb">${r.lb}</div><div class="am">${r.am}</div>` + (r.k === 'fee' ? '<div class="ul" id="ul" style="width:0px"></div>' : '');
  rc.appendChild(d);
});
S.focus([{ t0: T.h, t1: T.h + 1.4, big: '100만', small: '이번 주', color: 'or' }]);
S.ev(0.1, 'in', 'rc');
ROWS.forEach((r, i) => { if (r.ev) S.ev(r.t + 0.1, r.ev, 'r' + i); });
S.ev(T.w15, 'marker', 'ul');
const FEE = ROWS[7];
S.scene(tau => {
  // 띠: 위에서 내려오며 시작(0.1~0.6)
  const k = S.ent(tau, 0.05, 0.5);
  S.css('#rcw', { opacity: k, transform: `translateY(${((1 - k) * -90).toFixed(1)}px)` });
  ROWS.forEach((r, i) => {
    const p = S.P(tau, r.t, r.t + 0.3), e = S.EO(p);
    S.css('#r' + i, { opacity: p > 0 ? 1 : 0, clipPath: `inset(0 0 ${((1 - e) * 100).toFixed(1)}% 0)` });
  });
  S.css('#ul', { width: (300 * S.EO(S.P(tau, T.w15, T.w15 + 0.45))) + 'px' });
  // 카메라: 줄이 인쇄되는 동안 띠 가운데를 가까이 보다가 «한눈에» 에서 물러나 띠 전체
  const back = S.cam(tau, T.look - 0.2, T.one + 0.5);
  const s = S.lerp(1.15 + 0.03 * S.P(tau, 0, T.look), 1.0, back), cy = S.lerp(410, 450, back);
  S.css('#cam', { transform: S.camCss({ s, x: 960, y: cy }) });
});
</script>
</body></html>
