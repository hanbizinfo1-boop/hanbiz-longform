<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s17 수수료랑 광고비 — 블렌더 유리 동전 통(R3): 관 둘로 동전이 빠져나가 통이 빔</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#bl{position:absolute;left:0;top:0;width:1920px;height:1080px}
.tg{position:absolute;left:0;top:0;padding:8px 18px 10px;border-radius:10px;background:#1F2A33;color:#fff;font-family:"Pre";font-weight:800;font-size:50px;white-space:nowrap;
  box-shadow:0 0 0 3px rgba(255,255,255,.9),0 12px 26px rgba(10,14,18,.45)}
</style></head>
<body><div id="stage">
  <img id="bl" alt="">
  <div id="tf" class="tg">수수료</div><div id="ta" class="tg">광고비</div>
</div>
<script src="../data/s17.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../../../../_tmp/sjk02/blender/s17/proj.js"></script>
<script>
window.PALETTE = ['#B9BEC2', '#1F2A33', '#C9A15A'];
window.DEVICES = ['R3 은유 기계(블렌더)'];
const T = { fee: S.at('수수료랑'), ad: S.at('광고비') };
S.ev(T.fee + 0.1, 'no', 'drainL');
S.ev(T.ad, 'card_in', 'drainR');
function tag(el, cx, by, k) {
  el.style.opacity = k;
  el.style.transform = `translate(${(cx - el.offsetWidth / 2).toFixed(1)}px,${(by - el.offsetHeight + (1 - k) * 16).toFixed(1)}px) scale(${(0.9 + 0.1 * k).toFixed(3)})`;
}
function place(el, p, dx, dy, k) {
  if (!p) { el.style.opacity = 0; return; }
  el.style.opacity = k;
  // 관 끝 앵커가 화면 밖으로 나가 이름표가 잘림 → 화면 안 80px 여백에 가둠(10-19)
  const x = S.clamp(p[0] - el.offsetWidth / 2 + dx, 80, 1920 - 80 - el.offsetWidth), y = S.clamp(p[1] - el.offsetHeight + dy, 80, 1080 - 200 - el.offsetHeight);
  el.style.transform = `translate(${x.toFixed(1)}px,${(y + (1 - k) * 12).toFixed(1)}px)`;
}
// 10-20 효과음 채움 — 동전이 관을 따라 흘러 내려가는 중
S.ev(T.ad + 0.4, 'coin', 'f_flow');
S.scene(async tau => {
  await S.bl('#bl', 's17', tau);
  // 10-20 사장님 «가생이에있어서 눈에띄지도 않아» — 관 끝(화면 밖) 대신 동전이 지나가는 관 굽이 바로 위(화면 안쪽 1/4)에 크게
  tag(S.$('#tf'), 420, 470, S.ent(tau, T.fee + 0.1, 0.12));
  tag(S.$('#ta'), 1480, 480, S.ent(tau, T.ad + 0.05, 0.12));
});
</script>
</body></html>
