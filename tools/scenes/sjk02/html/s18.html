<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s18 AI가 그 자리에 와 있다 → 조금만 지나면 다 쓴다 — 옛날 TV 화면이 메뉴 목록에서 AI 대화창으로, 물러나면 가게 8곳에 AI(R4 옛날 TV)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#cam{left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#w{left:0;top:0;width:1920px;height:1080px;transform-origin:960px 540px;transform:scale(1.12)}
/* 사진(1536x1024)을 1.25배로 깔고 위 100px 잘라 냄 → #ph 안은 사진 좌표 그대로 */
#ph{left:0;top:-100px;width:1536px;height:1024px;transform-origin:0 0;transform:scale(1.25);background-size:1536px 1024px;filter:saturate(.9) contrast(1.03)}
#scr{left:0;top:0;width:1536px;height:1024px;-webkit-mask-image:url("../../../../_tmp/sjk02/tex/n18_mask.png");mask-image:url("../../../../_tmp/sjk02/tex/n18_mask.png");-webkit-mask-size:1536px 1024px;mask-size:1536px 1024px;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
#ui{left:0;top:0;width:640px;height:520px;overflow:hidden;background:#12151a}
#ui .pg{position:absolute;left:0;top:0;width:640px;height:520px}
#menu{background:#fff;font-family:"Pre";color:#1F2A33}
#menu .hd{height:78px;display:flex;align-items:center;padding:0 30px;font-size:42px;font-weight:800;border-bottom:2px solid #E7E9EB}
#menu .mr{height:140px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:2px solid #EEF0F1}
#menu .mr b{font-size:38px;font-weight:800}
#menu .mr span{font-size:34px;font-weight:700;color:#59636B}
#chat{background:#171C21}
#chat .dk{left:0;top:0;width:640px;height:520px;border-radius:0;border:0;box-shadow:none}
#chat .dk .tb{height:70px;padding:0 28px;font-size:30px}
#chat .dk .tb .md{font-size:32px}
#chat .dk .tb .md i{width:16px;height:16px}
#chat .dk .cv{top:70px;bottom:0;padding:22px 0}
#chat .dk .col{width:92%;gap:22px}
#chat .dk .me{font-size:34px;padding:14px 24px;line-height:1.4}
#chat .dk .ai{font-size:34px;line-height:1.45;gap:16px}
#chat .dk .ai .av{width:50px;height:50px;font-size:24px;border-radius:12px}
#scan{left:0;top:0;width:640px;height:520px;background:repeating-linear-gradient(180deg,rgba(0,0,0,.07) 0 2px,transparent 2px 5px);pointer-events:none}
#glow{left:0;top:0;width:640px;height:520px;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(0,0,0,.32) 100%);pointer-events:none}
.sc{position:absolute;top:790px;width:180px;height:150px;border-radius:16px;background-color:#fff;background-repeat:no-repeat;background-size:338px 225px;background-position:-77px -33px;box-shadow:0 18px 36px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3)}
.sc .ai{position:absolute;right:-14px;top:-14px;width:48px;height:48px;border-radius:50%;background:var(--te);color:#fff;font-family:"Pre";font-weight:900;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff,0 6px 14px rgba(0,0,0,.4)}
</style></head>
<body><div id="stage">
  <div id="cam" class="abs">
    <div id="w" class="abs">
      <div id="ph" class="abs">
        <div id="scr" class="abs">
          <div id="ui" class="abs" data-diegetic>
            <div id="menu" class="pg"><div class="hd">메뉴</div>
              <div class="mr"><b>돼지국밥</b><span>9,000원</span></div>
              <div class="mr"><b>순대국밥</b><span>9,500원</span></div>
              <div class="mr"><b>수육국밥</b><span>11,000원</span></div></div>
            <div id="chat" class="pg"><div class="dk"><div class="tb"><span class="md"><i></i>AI</span><span class="tab">새 대화</span></div>
              <div class="cv"><div class="col"><div class="me">메뉴 설명 써 줘</div><div class="ai"><div class="av">AI</div><div class="tx" id="ans"></div></div></div></div></div></div>
            <div id="scan" class="abs"></div><div id="glow" class="abs"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="row"></div>
  </div>
</div>
<script src="../data/s18.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#171C21', '#E7EAEC', '#1FA39A'];   // 어두운 가게 사진 + TV 화면 + 청록 = AI
window.DEVICES = ['R4 옛날 TV'];
const T = { ai: S.at('AI가'), lead: S.at('앞서가는'), pass: S.at('지나면'), all: S.at('다 써요') };
const ANS = '정성을 다해 끓인 따뜻한 국밥 한 그릇으로 여러분을 기다립니다.';
document.getElementById('ph').style.backgroundImage = 'url("../../../../_tmp/sjk02/tex/n18_clean.png")';
// 초록 화면 네 점(사진 좌표, 곡선 가장자리는 마스크가 다듬음) — 640x520 판을 맞춤
S.fitQuad(document.getElementById('ui'), 640, 520, [[644, 238], [962, 160], [964, 444], [640, 496]]);
const row = document.getElementById('row'), sc = [];
for (let i = 0; i < 8; i++) {
  const d = document.createElement('div'); d.className = 'sc'; d.style.left = (156 + i * 204) + 'px'; d.style.backgroundImage = S.ph('n10_shop_icon');
  d.innerHTML = '<div class="ai">AI</div>'; row.appendChild(d); sc.push(d);
}
S.ev(T.ai, 'click', 'ui');
S.ev(T.pass, 'card_in', 'row');
S.ev(T.all, 'click', 'ai');
const CAM = [{ t: 0, s: 1, x: 960, y: 540 }, { t: T.lead, s: 1.15, x: 1005, y: 330, d: 0.5 }, { t: T.pass, s: 0.9, x: 960, y: 540, d: 0.5 }];
// 10-20 효과음 채움 — TV 대화창에 답이 한 글자씩 써지는 중 · «앞서가는» 에 카메라가 확대
S.ev(T.ai + 0.4, 'type', 'f_ans'); S.ev(T.ai + 1.05, 'type', 'f_ans'); S.ev(T.lead, 'sweep', 'f_zoom');
S.scene(tau => {
  S.css('#cam', { transform: S.camCss(S.camState(tau, CAM, 0.5)) });
  // 채널 바뀌듯 가로로 닦아 넘김(0.15초, 번쩍임 없음)
  const k = S.EO(S.P(tau, T.ai, T.ai + 0.15));
  S.css('#menu', { transform: `translateX(${(-640 * k).toFixed(1)}px)` });
  S.css('#chat', { transform: `translateX(${(640 * (1 - k)).toFixed(1)}px)` });
  S.type('#ans', ANS, tau, T.ai + 0.35, 20, false);
  // 8곳 가로 줄 + AI 동그라미
  sc.forEach((d, i) => {
    const q = S.ent(tau, T.pass + 0.06 * i, 0.12);
    d.style.opacity = q; d.style.transform = `translateY(${((1 - q) * 40).toFixed(1)}px)`;
    const a = S.ent(tau, T.all + 0.03 * i, 0.1);
    d.querySelector('.ai').style.opacity = a; d.querySelector('.ai').style.transform = `scale(${(0.6 + 0.4 * a).toFixed(3)})`;
  });
});
</script>
</body></html>
