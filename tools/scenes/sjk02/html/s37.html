<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s37 답글은 다른 손님도 다 읽거든요 — 스포트라이트 B안: 지하철 둘레 어둡게 · 폰 한 대만 빛 + 화면(리뷰·답글) · 큰 숫자 조회 1,284 · 붓 밑줄</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#world{left:0;top:0;width:1920px;height:1080px;transform-origin:1031px 340px}
#ph{left:0;top:0;width:1920px;height:1080px;background-position:center top;filter:saturate(.5)}
#shade{position:absolute;left:0;top:0;width:1920px;height:1080px}
#pw{position:absolute;left:1190px;top:50px;width:420px;height:720px;perspective:1800px}
#scr{position:absolute;left:0;top:0;width:420px;height:720px;background:#fff;border-radius:34px;border:8px solid #1B2026;overflow:hidden;font-family:"Pre";color:#1F2A33;box-shadow:0 0 0 3px rgba(255,255,255,.35),0 30px 70px rgba(0,0,0,.6);transform-origin:50% 50%}
#scr .hd{height:76px;display:flex;align-items:center;padding:0 28px;font-size:34px;font-weight:800;border-bottom:2px solid #E7E9EB}
#scr .who{display:flex;align-items:center;gap:14px;padding:18px 28px 6px}
#scr .av{width:58px;height:58px;border-radius:50%;background:#D7DCDF;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#59636B}
#scr .nm{font-size:30px;font-weight:800}
#scr .stars{display:flex;gap:3px;margin-top:2px}
#scr .body{padding:6px 28px 0;font-size:31px;line-height:1.4;font-weight:600}
#scr .rbox{position:absolute;left:18px;right:18px;top:334px;border-radius:14px;background:#F2F4F5;padding:14px 18px;font-size:30px;line-height:1.42;font-weight:600;color:#3A444C;opacity:0}
#scr .rbox b{display:block;font-size:24px;color:#6B747B;margin-bottom:4px}
#scr .or{color:var(--or);font-weight:800}
#glow{position:absolute;left:931px;top:240px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,138,91,.8),rgba(255,138,91,0) 70%);mix-blend-mode:screen;opacity:0}
#dots{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
#dots path{fill:none;stroke:#FF7A4D;stroke-width:4;stroke-dasharray:2 12;stroke-linecap:round}
#big{position:absolute;left:300px;top:610px;font-size:160px;line-height:1;color:#fff;text-shadow:0 8px 34px rgba(0,0,0,.7);white-space:nowrap;opacity:0}
#brush{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
#brush path{fill:none;stroke:#F05A28;stroke-linecap:round;stroke-linejoin:round;stroke-width:26;opacity:.95}
</style></head>
<body><div id="stage">
  <div id="world" class="abs">
    <div id="ph" class="photo"></div>
    <div id="glow"></div>
  </div>
  <svg id="shade"><defs><filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <mask id="m"><rect width="1920" height="1080" fill="#fff"/><circle id="hole" cx="1031" cy="340" r="190" fill="#000" filter="url(#bl)"/></mask></defs>
    <rect id="dark" width="1920" height="1080" fill="rgba(6,9,12,.76)" mask="url(#m)"/></svg>
  <svg id="dots"><path id="dp" d="M1075 300 C 1110 220, 1150 190, 1195 180"/></svg>
  <div id="pw"><div id="scr" data-diegetic data-box="scr"><div class="hd">리뷰</div>
    <div class="who"><div class="av">김</div><div><div class="nm">김**</div><div class="stars" id="stars"></div></div></div>
    <div class="body">수육이 정말 부드러워요. 다음에 또 올게요.</div>
    <div class="rbox" id="rbox"><b>답글</b>오늘 드신 수육은 <span class="or">아침 8시에 삶은 거라</span> 제일 부드러울 때 드신 거예요.</div></div></div>
  <div id="big" class="blk" data-box="big">조회 <span id="num">0</span></div>
  <svg id="brush"><path id="bp" d="M330 790 C 560 772, 820 778, 1020 786"/></svg>
</div>
<script src="../data/s37.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#14191E', '#F05A28', '#FFFFFF'];
window.DEVICES = ['R7 스포트라이트 ②'];
const T = { scr: S.at('그리고'), rep: S.at('리뷰 쓴'), cnt: S.at('다른 손님도'), ul: S.at('다 읽거든요') };
S.$('#stars').innerHTML = [1, 2, 3, 4, 5].map(() => '<svg width="28" height="28" viewBox="0 0 24 24"><path d="M12 2l3.1 6.6 7.2.9-5.3 5 1.4 7.1L12 18l-6.4 3.6L7 14.5 1.7 9.5l7.2-.9z" fill="#F5A800"/></svg>').join('');
S.css('#ph', { backgroundImage: S.ph('p37_subway_hands') });
S.ev(-0.05, 'in', 'dark'); S.ev(T.scr + 0.05, 'card_in', 'scr'); S.ev(T.rep, 'msg_in', 'rbox'); S.ev(T.cnt, 'gauge', 'num'); S.ev(T.ul, 'marker', 'bp');
S.scene(tau => {
  const dr = S.P(tau, 0, S.SC.dur);
  S.css('#world', { transform: `scale(${(1 + 0.04 * dr).toFixed(4)})` });
  const dk = S.ent(tau, -0.15, 0.5);
  S.$('#dark').setAttribute('fill', `rgba(6,9,12,${(0.76 * dk).toFixed(3)})`);
  S.css('#glow', { opacity: dk });
  const a = S.ent(tau, T.scr + 0.05, 0.16);
  S.css('#pw', { opacity: a, transform: `translateY(${((1 - a) * 40).toFixed(1)}px)` });
  S.css('#scr', { transform: `rotateY(${(-14 + 3 * dr).toFixed(2)}deg) rotateZ(${(3 - 1 * dr).toFixed(2)}deg)` });
  S.css('#rbox', { opacity: S.ent(tau, T.rep, 0.14), transform: `translateY(${((1 - S.ent(tau, T.rep, 0.14)) * 14).toFixed(1)}px)` });
  E.stroke('#dp', tau, T.scr + 0.15, 0.5);
  // 큰 숫자: 0 → 1,284
  const b = S.ent(tau, T.cnt - 0.05, 0.14);
  S.css('#big', { opacity: b, transform: `translateY(${((1 - b) * 20).toFixed(1)}px)` });
  S.$('#num').textContent = S.fmt(S.count(tau, T.cnt, T.cnt + 1.3, 0, 1284));
  E.stroke('#bp', tau, T.ul, 0.5);
});
</script>
</body></html>
