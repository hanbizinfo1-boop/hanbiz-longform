<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s43 두 번째는 숫자 — 영수증 프린터에서 감열지가 나오며 «2» «숫자» 인쇄, 매출은 회색·수익은 주홍</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#ph{left:0;top:-100px;width:1920px;height:1280px;background-size:100% 100%}
#win{left:620px;top:56px;width:600px;height:858px;overflow:hidden;transform-origin:50% 100%;transform:rotate(-2.2deg)}
#roll{position:absolute;left:30px;width:540px;height:1060px}
#roll .ln{position:absolute;left:0;width:540px;text-align:center;color:#262C31;white-space:nowrap}
.dash{position:absolute;left:34px;width:472px;height:0;border-top:5px dashed #A9AFB4}
#mk{position:absolute;left:60px;width:420px;height:70px;background:rgba(240,90,40,.38);transform-origin:0 50%}
#c1{left:110px;top:250px} #c2{left:110px;top:352px}
</style></head>
<body><div id="stage">
  <div id="ph" class="photo abs"></div>
  <div id="win" class="abs" data-box="win">
    <div id="roll" class="thermal" style="background-repeat:repeat">
      <div id="l1" class="ln blk" style="top:36px;font-size:250px;line-height:270px">2</div>
      <div id="l2" class="ln blk" style="top:330px;font-size:112px;line-height:130px">숫자</div>
      <div class="dash" id="d1" style="top:496px"></div>
      <div id="l3" class="ln blk" style="top:528px;font-size:92px;line-height:120px;color:#8A9199">매출</div>
      <div class="dash" id="d2" style="top:676px"></div>
      <div id="mk" style="top:704px"></div>
      <div id="l4" class="ln blk" style="top:700px;font-size:128px;line-height:140px;color:#F05A28">수익</div>
    </div>
  </div>
  <div id="c1" class="chip gr" data-box="c1">사라지는 가게</div>
  <div id="c2" class="chip or" data-box="c2">살아남는 가게</div>
</div>
<script src="../data/s43.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#D9DBD6', '#1F2A33', '#F05A28'];
S.$('#ph').style.backgroundImage = S.ph('p43_receipt_roll');
const T = { two: S.at('두 번째'), num: S.at('숫자'), gone: S.at('사라지는'), sales: S.at('매출만'), live: S.at('살아남는'), prof: S.at('수익을'), imp: S.at('중요한데요') };
S.ev(0.35, 'page', 'l1'); S.ev(T.num + 0.1, 'card_in', 'l2'); S.ev(T.gone, 'msg_in', 'c1'); S.ev(T.sales, 'card_in', 'l3'); S.ev(T.live, 'msg_in', 'c2');
S.ev(T.prof, 'marker', 'l4'); S.ev(T.imp, 'shine', 'mk');
// 용지가 나온 길이(feed) — 구간마다 EO 로 쭉
const FEED = [[0.3, 1.0, 0, 330], [T.num + 0.05, T.num + 0.5, 330, 480], [T.gone, T.gone + 0.3, 480, 540], [T.sales, T.sales + 0.45, 540, 690],
  [T.live, T.live + 0.3, 690, 740], [T.prof, T.prof + 0.55, 740, 868]];
function feed(tau) { let f = 0; FEED.forEach(([a, b, f0, f1]) => { if (tau >= a) f = S.lerp(f0, f1, S.EO(S.P(tau, a, b))); }); return f; }
S.scene(tau => {
  const d = S.P(tau, 0, S.SC.dur);
  S.css('#ph', { transform: `scale(${(1.0 + 0.045 * d).toFixed(4)}) translateX(${(-26 * d).toFixed(1)}px)` });
  const f = feed(tau);
  S.css('#roll', { top: (858 - f).toFixed(1) + 'px' });
  S.css('#win', { opacity: S.ent(tau, 0.2, 0.1) });
  E.wipeY('#l1', tau, 0.4, 0.45); E.wipeY('#l2', tau, T.num + 0.1, 0.35);
  S.css('#d1', { opacity: tau >= T.gone + 0.1 ? 1 : 0 }); E.wipe('#d1', tau, T.gone + 0.1, 0.3);
  E.wipeY('#l3', tau, T.sales + 0.05, 0.4);
  S.css('#d2', {}); E.wipe('#d2', tau, T.live + 0.1, 0.3);
  E.wipeY('#l4', tau, T.prof + 0.05, 0.4);
  S.css('#mk', { opacity: tau >= T.imp ? 1 : 0, transform: `scaleX(${S.EO(S.P(tau, T.imp, T.imp + 0.4)).toFixed(3)})` });
  E.pop('#c1', tau, T.gone, { dx: -20, dy: 0 }); E.pop('#c2', tau, T.live, { dx: -20, dy: 0 });
});
</script>
</body></html>
