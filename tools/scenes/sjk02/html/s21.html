<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s21 몇 달 뒤 숫자 — 탁자 위 기울인 스프레드시트 판 (일 시간 막대 줄고 매출 막대 평평)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#bg{position:absolute;left:-60px;top:-40px;width:2040px;height:1160px;background-size:cover;background-position:center;filter:blur(11px) saturate(.7) brightness(.82)}
#wrap{position:absolute;left:0;top:0;width:1920px;height:1080px;perspective:2200px}
#sh{position:absolute;left:310px;top:150px;width:1300px;height:580px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 36px 70px rgba(20,25,30,.45),0 4px 10px rgba(20,25,30,.3);transform-origin:50% 60%}
.cl{position:absolute;top:0;height:46px;background:#F1F3F4;border-bottom:1px solid #DADDDF;color:#6B747B;font-weight:600;font-size:24px;display:flex;align-items:center;justify-content:center;border-right:1px solid #DADDDF}
.hd{position:absolute;top:46px;height:74px;background:#F7F8F8;border-bottom:2px solid #C9CED2;font-weight:800;font-size:32px;display:flex;align-items:center;padding:0 24px;border-right:1px solid #DADDDF;opacity:0}
.rn{position:absolute;left:0;width:60px;background:#F1F3F4;color:#6B747B;font-size:24px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #DADDDF;border-right:1px solid #DADDDF}
.mo{position:absolute;left:60px;width:200px;font-size:34px;font-weight:700;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid #DADDDF;border-right:1px solid #DADDDF;opacity:0}
.cell{position:absolute;border-bottom:1px solid #DADDDF;border-right:1px solid #DADDDF}
.bar{position:absolute;left:24px;height:40px;border-radius:8px;top:50%;margin-top:-20px;width:0}
#tips{position:absolute;left:0;top:0;width:1300px;height:580px;pointer-events:none}
.tag{position:absolute;opacity:0}
</style></head>
<body><div id="stage">
  <div class="bg" style="background:#2b3035"></div>
  <div id="bg"></div>
  <div id="wrap">
    <div id="sh" data-box="sh" data-box-group="sh" data-diegetic>
      <div class="cl" style="left:0;width:60px"></div><div class="cl" style="left:60px;width:200px">A</div><div class="cl" style="left:260px;width:520px">B</div><div class="cl" style="left:780px;width:520px">C</div>
      <div class="hd" id="h0" style="left:0;width:260px"></div>
      <div class="hd" id="h1" style="left:260px;width:520px">일한 시간</div>
      <div class="hd" id="h2" style="left:780px;width:520px">매출</div>
      <div class="rn" style="top:46px;height:74px">1</div>
      <div class="rn" style="top:120px;height:104px">2</div><div class="rn" style="top:224px;height:104px">3</div><div class="rn" style="top:328px;height:104px">4</div>
      <div class="rn" style="top:432px;height:74px">5</div><div class="rn" style="top:506px;height:74px">6</div>
      <div class="mo" id="m1" style="top:120px;height:104px">1월</div>
      <div class="mo" id="m2" style="top:224px;height:104px">2월</div>
      <div class="mo" id="m3" style="top:328px;height:104px">3월</div>
      <div class="cell" style="left:260px;width:520px;top:120px;height:104px"><div class="bar" id="bh1" style="background:#1FA39A"></div></div>
      <div class="cell" style="left:260px;width:520px;top:224px;height:104px"><div class="bar" id="bh2" style="background:#1FA39A"></div></div>
      <div class="cell" style="left:260px;width:520px;top:328px;height:104px"><div class="bar" id="bh3" style="background:#1FA39A"></div></div>
      <div class="cell" style="left:780px;width:520px;top:120px;height:104px"><div class="bar" id="br1" style="background:#9AA0A6"></div></div>
      <div class="cell" style="left:780px;width:520px;top:224px;height:104px"><div class="bar" id="br2" style="background:#9AA0A6"></div></div>
      <div class="cell" style="left:780px;width:520px;top:328px;height:104px"><div class="bar" id="br3" style="background:#9AA0A6"></div></div>
      <svg id="tips" viewBox="0 0 1300 580"><line id="flat" x1="1252" y1="120" x2="1252" y2="432" stroke="#6E767D" stroke-width="3" stroke-dasharray="10 9" opacity="0"/></svg>
    </div>
  </div>
</div>
<script src="../data/s21.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#D9DBD6', '#1F2A33', '#1FA39A', '#9AA0A6'];   // 시트 흰 판 + 청록(일 시간) + 회색(매출 그대로)
const T = { m1: S.at('몇'), m2: S.at('지나고'), m3: S.at('대표님들이랑'), num: S.at('숫자를'), odd: S.at('이상한'), half: S.at('반으로'),
  rev: S.at('매출은'), flat: S.at('그대로인'), many: S.at('생각보다'), man: S.at('많았어요') };
document.getElementById('bg').style.backgroundImage = S.ph('p22_two_reports');
S.ev(-0.05, 'in', 'sh'); S.ev(T.num, 'card_in', 'hd'); S.ev(T.odd + 0.1, 'gauge', 'bh'); S.ev(T.rev, 'no', 'br');
S.focus([{ t0: T.half, t1: T.half + 1.25, big: '일 ½', small: '몇 달 뒤', color: 'te' }]);
const BAR = 440;
// 10-20 효과음 채움 — 월 라벨(1월·2월·3월) 줄이 차례로 뜸
S.ev(T.m1 + 0.1, 'card', 'f_m1'); S.ev(T.m3, 'card', 'f_m3');
S.scene(tau => {
  // 바탕 사진 흐림 + 아주 느린 옆 흐름
  S.css('#bg', { transform: `translateX(${(-40 * S.P(tau, 0, S.SC.dur)).toFixed(1)}px)` });
  // 판: 기울인 채 들어옴 → 아주 천천히 기울기 변화
  const k = S.ent(tau, -0.1, 0.14), d = S.P(tau, 0, S.SC.dur);
  S.css('#sh', { opacity: k, transform: `rotateX(${8 - 2 * d}deg) rotateZ(${-3 + 1.2 * d}deg) translateY(${(1 - k) * 36}px)` });
  [['m1', T.m1], ['m2', T.m2], ['m3', T.m3]].forEach(([id, t0]) => {
    const p = S.ent(tau, t0, 0.12); S.css('#' + id, { opacity: p, transform: `translateX(${(1 - p) * -18}px)` });
  });
  const hp = S.ent(tau, T.num, 0.12);
  ['h0', 'h1', 'h2'].forEach(id => S.css('#' + id, { opacity: hp }));
  // 일한 시간 막대: 이상한 에 자람(100·76·50 — 비율만, 숫자 없음) → 반으로 에 마지막 줄 더 줄어듦
  const g = S.EO(S.P(tau, T.odd + 0.1, T.odd + 0.7));
  const shr = S.EO(S.P(tau, T.half + 0.1, T.half + 0.7));
  const len = [1.0, 1.0 - 0.24 * shr, 1.0 - 0.5 * shr];
  // 자라는 동안 1·2·3줄 모두 처음엔 같은 길이로 시작해 shr 로 갈라짐
  ['bh1', 'bh2', 'bh3'].forEach((id, i) => { document.getElementById(id).style.width = (BAR * g * len[i]).toFixed(1) + 'px'; });
  // 매출 막대: 3줄 모두 같은 길이 — 매출은 에 평평하게 + 점선
  const rg = S.EO(S.P(tau, T.rev, T.rev + 0.5));
  ['br1', 'br2', 'br3'].forEach(id => { document.getElementById(id).style.width = (BAR * rg).toFixed(1) + 'px'; });
  document.getElementById('flat').setAttribute('opacity', S.EO(S.P(tau, T.flat, T.flat + 0.3)).toFixed(3));
});
</script>
</body></html>
