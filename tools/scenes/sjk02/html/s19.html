<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s19 갈리는 건 AI 말고 다른 것 — 골목 갈림길 사진, 왼쪽 길이 탈색·어두워지고 오른쪽 주홍 불빛 길로 카메라가 감(글 없음)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#cam{left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#w{left:0;top:0;width:1920px;height:1080px;transform-origin:960px 540px;transform:scale(1.06)}
/* 사진(1536x1024)을 1.25배로 깔고 위 100px 잘라 냄 */
#ph{left:0;top:-100px;width:1536px;height:1024px;transform-origin:0 0;transform:scale(1.25)}
.lay{left:0;top:0;width:1536px;height:1024px;background-size:1536px 1024px;background-repeat:no-repeat}
#gray{filter:grayscale(1) brightness(.62) contrast(.95)}
</style></head>
<body><div id="stage">
  <div id="cam" class="abs">
    <div id="w" class="abs">
      <div id="ph" class="abs">
        <div id="col" class="abs lay"></div>
        <div id="gray" class="abs lay"></div>
      </div>
    </div>
  </div>
</div>
<script src="../data/s19.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#171C21', '#E7EAEC', '#F05A28'];   // 어두운 골목 + 오른쪽 주홍 불빛(우리 가게만 있는 것)
window.DEVICES = ['갈림길 사진'];
const T = { gal: S.at('갈리는'), other: S.at('다른') };
for (const id of ['col', 'gray']) document.getElementById(id).style.backgroundImage = S.ph('n19_alley_fork');
S.ev(T.gal, 'no', 'left'); S.ev(T.other - 0.05, 'in', 'cam');
// 왼쪽 길(사진 x 0~760)만 회색: 가장자리 140px 부드럽게
const m = 'linear-gradient(90deg,#000 0,#000 640px,transparent 800px)';
S.css('#gray', { webkitMaskImage: m, maskImage: m });
const CAM = [{ t: 0, s: 1, x: 960, y: 540 }, { t: T.other, s: 1.12, x: 1080, y: 540, d: 0.5 }];
S.scene(tau => {
  const c = S.camState(tau, CAM, 0.5);
  S.css('#cam', { transform: S.camCss({ s: c.s + 0.02 * S.P(tau, 0, T.other), x: c.x, y: c.y }) });
  S.css('#gray', { opacity: S.EO(S.P(tau, T.gal, T.gal + 0.55)) });
});
</script>
</body></html>
