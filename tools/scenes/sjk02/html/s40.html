<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s40 고깃집 대표님 — 고기 손질 사진 2.5D: «평범한 고깃집»에는 흐리고 색 빠진 채 멀리, «얘기를 하다 보니까» 색이 돌아오며 손으로 다가감, «기름을 걷어 낸다고»에 손그림 화살표 + 이름표</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
/* 10-19 다시 만들기: 오른쪽 칩 5개(말 요약) 삭제 → 사진 2.5D(R5 Business Casual, blender/parallax.py) + 손그림 화살표(R11) 하나 */
#bl{position:absolute;left:0;top:0;width:1920px;height:1080px}
#arw{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
#arw path{fill:none;stroke:#F05A28;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
#lb{position:absolute;left:0;top:0;font-family:"Hand";font-weight:700;font-size:64px;color:#fff;white-space:nowrap;text-shadow:0 3px 14px rgba(0,0,0,.7)}
</style></head>
<body><div id="stage">
  <img id="bl" alt="">
  <svg id="arw" viewBox="0 0 1920 1080"><path id="ap" d=""/><path id="ah" d=""/></svg>
  <div id="lb" data-box="lb">기름</div>
</div>
<script src="../data/s40.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script src="../../../../_tmp/sjk02/blender/s40/track.js"></script>
<script>
window.PALETTE = ['#6B5A50', '#FFFFFF', '#F05A28'];   // 고기 손질 사진 · 흰 손글씨 · 주홍 화살표
window.DEVICES = ['R5 사진 2.5D(블렌더)', 'R11 손그림 화살표'];
const T = { plain: S.at('평범한'), talk: S.at('얘기를'), morn: S.at('매일'), self: S.at('직접'), fat: S.at('기름을'), others: S.at('남들은'), obv: S.at('당연해서') };
S.ev(0.0, 'in', 'photo');
S.ev(T.talk, 'shine', 'color');
S.ev(T.fat + 0.15, 'marker', 'arrow');
S.ev(T.fat + 0.75, 'card_in', 'label');
// 프레임 → track 행(parallax.py: 프레임 1 = τ 0)
const tr = tau => { const L = window.TRACK || []; if (!L.length) return null; return L[Math.min(L.length - 1, Math.max(0, Math.round(tau * 60000 / 1001)))]; };
S.scene(async tau => {
  await S.bl('#bl', 's40', tau, { t0: 0, pfx: 'f_' });
  // «평범한 고깃집»까지 색 빠지고 어둡게 → «얘기를 하다 보니까» 색이 돌아옴
  const c = S.EO(S.P(tau, T.talk, T.talk + 0.9));
  S.css('#bl', { filter: `${S.desat(1 - c)} brightness(${(0.82 + 0.18 * c).toFixed(3)})` });
  const p = tr(tau);
  if (!p) return;
  const [fx, fy] = p[0];                       // 들어 올린 기름 조각
  // 화살표: 오른쪽 아래(고기 판 위 빈자리)에서 곡선으로 올라와 들어 올린 기름 조각을 가리킴
  const sx = fx + 360, sy = fy + 260, ex = fx + 50, ey = fy + 40;
  S.$('#ap').setAttribute('d', `M${sx} ${sy} C ${sx - 30} ${sy - 150}, ${ex + 170} ${ey + 20}, ${ex} ${ey}`);
  S.$('#ah').setAttribute('d', `M${ex + 50} ${ey + 8} L${ex} ${ey} L${ex + 22} ${ey + 46}`);
  S.$('#ap')._len = 0; S.$('#ah')._len = 0;              // 화살표가 사진을 따라 움직여 길이가 바뀜 → 매 프레임 다시 잼
  E.stroke('#ap', tau, T.fat + 0.15, 0.45);
  E.stroke('#ah', tau, T.fat + 0.55, 0.15);
  const k = S.ent(tau, T.fat + 0.75, 0.12);
  S.css('#lb', { opacity: k, transform: `translate(${(sx - 50).toFixed(1)}px,${(sy + 10 + (1 - k) * 10).toFixed(1)}px)` });
});
</script>
</body></html>
