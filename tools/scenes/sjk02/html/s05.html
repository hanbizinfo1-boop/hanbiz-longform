<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s05 할 일은 줄었는데 손님은 그대로 — 장부 사진 위 볼펜 획(R2 장부 볼펜)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
/* 사진(1536x1024)을 1.25배로 깔고 위 100px 잘라 냄 → #ph 안은 사진 좌표 그대로 */
#cam{left:0;top:0;width:1920px;height:1080px;transform-origin:960px 540px}
#ph{left:0;top:-100px;width:1536px;height:1024px;transform-origin:0 0;transform:scale(1.25);background-size:1536px 1024px;filter:saturate(.85) contrast(1.03)}
#ink{left:0;top:0;width:1536px;height:1024px}
.nm{position:absolute;font-family:"Hand";font-weight:700;font-size:46px;line-height:1;white-space:nowrap}
#nWork{left:925px;top:318px;color:#1F2A33}
#nCust{left:925px;top:652px;color:#F05A28}
#qm{left:1282px;top:668px;font-size:84px;color:#F05A28}
</style></head>
<body><div id="stage">
  <div id="cam" class="abs">
    <div id="ph" class="abs">
      <svg id="ink" class="abs" viewBox="0 0 1536 1024">
        <path id="lWork" d="M935 392 L1040 402 L1130 520 L1190 600 L1262 640" fill="none" stroke="#1F2A33" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>
        <path id="lCust" d="M935 726 L1275 748" fill="none" stroke="#F05A28" stroke-width="8" stroke-linecap="round" opacity=".95"/>
      </svg>
      <div id="nWork" class="nm" data-box="nWork">일</div>
      <div id="nCust" class="nm" data-box="nCust">손님</div>
      <div id="qm" class="nm" data-box="qm">?</div>
    </div>
  </div>
</div>
<script src="../data/s05.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#D9DBD6', '#1F2A33', '#F05A28'];   // 장부 종이·먹색 선 + 주홍(손님 선·물음표)
window.DEVICES = ['R2 장부 볼펜'];
document.getElementById('ph').style.backgroundImage = S.ph('n05_ledger_notebook');
const T = { work: S.at('일은'), cust: S.at('손님은'), q: S.at('안 늘까요') };
S.ev(T.work, 'marker', 'lWork'); S.ev(T.cust, 'marker', 'lCust'); S.ev(T.q, 'card_in', 'qm');
S.scene(tau => {
  S.css('#cam', { transform: `scale(${(1 + 0.05 * S.P(tau, 0, S.SC.dur)).toFixed(4)})` });
  E.stroke('#lWork', tau, T.work, 0.6);
  E.stroke('#lCust', tau, T.cust, 0.5);
  E.wipe('#nWork', tau, T.work + 0.1, 0.3);
  E.wipe('#nCust', tau, T.cust + 0.1, 0.3);
  const q = S.ent(tau, T.q, 0.12);
  S.css('#qm', { opacity: q, transform: `scale(${(0.8 + 0.2 * q).toFixed(3)}) rotate(-6deg)` });
});
</script>
</body></html>
