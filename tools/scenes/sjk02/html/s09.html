<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s09 리뷰 답글도 똑같아요 — 나무 계산대 위 리뷰 카드 6장 콜라주, 답글만 전부 같아 회색으로 빠짐(리뷰 콜라주)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#cam{left:0;top:0;width:1920px;height:1080px;transform-origin:960px 500px}
#bgw{left:-40px;top:-30px;width:2000px;height:1140px;background-size:cover;background-position:center;filter:brightness(.82) saturate(.9)}
.rv{position:absolute;width:390px;height:330px;border-radius:14px;background:#fff;overflow:hidden;box-shadow:0 24px 50px rgba(10,14,18,.42),0 3px 8px rgba(10,14,18,.3);padding:20px 24px;font-family:"Pre"}
.rv .tp{display:flex;align-items:center;gap:14px}
.rv .av{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;color:#fff}
.rv .st{color:#F2A33A;font-size:26px;letter-spacing:3px}
.rv .tx{margin-top:12px;font-size:25px;line-height:1.4;font-weight:600;height:72px;overflow:hidden}
.rv .rp{margin-top:12px;background:#F2F4F5;border:2px solid #9AA0A6;border-radius:10px;padding:10px 14px;font-size:22px;line-height:1.4;color:#3A444C;height:148px;overflow:hidden}
.rv .rp b{font-size:22px;color:#1F2A33;margin-right:6px}
</style></head>
<body><div id="stage">
  <div id="cam" class="abs">
    <div id="bgw" class="abs"></div>
    <div id="grid"></div>
  </div>
</div>
<script src="../data/s09.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#D9DBD6', '#1F2A33', '#9AA0A6'];   // 나무 바탕 + 흰 카드 → 같은 답글이 회색으로 빠짐
window.DEVICES = ['리뷰 콜라주'];
const T = { rv: S.at('리뷰'), thx: S.at('소중한'), end: S.at('되겠습니다') };
const R = '소중한 리뷰 감사합니다. 앞으로도 더 노력하는 가게가 되겠습니다.';
const INI = ['김', '이', '박', '최', '정', '한'], COL = ['#6E8FA8', '#8C9A7A', '#A58A74', '#7C8C99', '#9A8296', '#7A9A98'];
const STAR = ['★★★★★', '★★★★★', '★★★★☆', '★★★★★', '★★★★★', '★★★★☆'];
const TXT = ['국물이 진하고 양이 많아요', '포장해 와도 따뜻했어요', '김치가 맛있어요', '점심에 줄 서서 먹었어요', '수육이 부드러워요', '재방문 의사 있어요'];
// 흩어 놓음: 위치(왼위 x,y)·기울기
const POS = [[150, 100, -5], [690, 75, 4], [1230, 105, -3], [200, 525, 5], [720, 545, -6], [1240, 515, 3]];
const grid = document.getElementById('grid'), cards = [];
for (let i = 0; i < 6; i++) {
  const c = document.createElement('div'); c.className = 'rv'; c.id = 'r' + i; c.dataset.box = 'r' + i;
  c.style.left = POS[i][0] + 'px'; c.style.top = POS[i][1] + 'px';
  c.innerHTML = `<div class="tp"><div class="av" style="background:${COL[i]}">${INI[i]}</div><div class="st">${STAR[i]}</div></div>` +
    `<div class="tx">${TXT[i]}</div><div class="rp"><b>답글</b>${R}</div>`;
  grid.appendChild(c); cards.push(c);
}
document.getElementById('bgw').style.backgroundImage = S.ph('n09_wood_counter');
S.ev(T.rv, 'card_in', 'cards');
S.ev(T.thx, 'no', 'cards');
S.scene(tau => {
  S.css('#cam', { transform: `scale(${(1 + 0.04 * S.P(tau, 0, S.SC.dur)).toFixed(4)})` });
  const g = S.EO(S.P(tau, T.thx, T.thx + 0.5));
  cards.forEach((c, i) => {
    const k = S.ent(tau, T.rv + 0.12 * i, 0.12);
    c.style.opacity = k;
    c.style.transform = `rotate(${POS[i][2]}deg) translateY(${((1 - k) * 30).toFixed(1)}px) scale(${(0.96 + 0.04 * k).toFixed(3)})`;
    c.style.filter = S.desat(g);
  });
});
</script>
</body></html>
