<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s61 사람한테 쓴다 — 점심 홀 어깨 너머, 식탁 위 주문서에 «맵게» 볼펜 동그라미와 «단골» 도장</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#ph{position:absolute;left:0;top:-100px;width:1920px;height:1280px;background-size:100% 100%;background-repeat:no-repeat}
#slip{position:absolute;left:0;top:0;width:300px;height:124px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0 0.02  0 0 0 0.5 -.08'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>"),linear-gradient(120deg,rgba(255,245,190,.3),transparent 45%,rgba(120,80,0,.22)),#F0D24A;font-family:"Hand";font-weight:700;color:#1F3FA8;box-shadow:inset 0 0 18px rgba(120,80,0,.3),0 3px 8px rgba(0,0,0,.35)}
#slip .ph{position:absolute;left:0;right:0;top:0;height:28px;border-bottom:3px solid #C8321F;font-family:"Pre";font-weight:800;font-size:19px;letter-spacing:.5em;color:#C8321F;padding:3px 0 0 14px;line-height:22px}
#slip .ph2{position:absolute;right:14px;top:3px;font-family:"Pre";font-weight:700;font-size:15px;letter-spacing:.1em;color:#C8321F;line-height:22px}
#slip .l{position:absolute;left:18px;font-size:29px;font-weight:700;line-height:1;white-space:nowrap}
#slip svg{position:absolute;left:0;top:0;width:300px;height:124px;overflow:visible}
#stamp{position:absolute;right:10px;top:36px;border:4px solid #2B3FA0;color:#2B3FA0;font-family:"Pre";font-weight:900;font-size:30px;line-height:1;padding:3px 9px;border-radius:6px;transform:rotate(-10deg)}
</style></head>
<body><div id="stage">
  <div id="cam">
    <div id="ph"></div>
    <div id="slip" data-diegetic data-box="slip">
      <div class="ph">주문서</div><div class="ph2">NO.0371</div>
      <div class="l" style="top:34px">3번 테이블</div>
      <div class="l" style="top:64px">순대국밥 2</div>
      <div class="l" id="mg" style="top:88px;left:176px">맵게</div>
      <svg viewBox="0 0 300 124"><path id="ring" d="M0 0" fill="none" stroke="#D2301A" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div id="stamp">단골</div>
    </div>
  </div>
</div>
<script src="../data/s61.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#1F3FA8', '#C8321F', '#F0D24A'];
window.DEVICES = ['R12 주문서'];
S.$('#ph').style.backgroundImage = S.ph('p61_hall_shoulder');
// 식탁 위 주문서 네 점(눈으로 잰 값, 1536×1024 → 화면 x*1.25, y*1.25-100)
const sc = q => q.map(p => [p[0] * 1.25, p[1] * 1.25 - 100]);
S.fitQuad(S.$('#slip'), 300, 124, sc([[905, 800], [1195, 790], [1245, 905], [925, 905]]));
const T = { slip: S.at('사람한테'), st: S.at('단골'), mk: S.at('맵게'), end: S.at('한마디') };
// «맵게» 글 상자(슬립 좌표 — 변환 전 레이아웃)에서 동그라미를 계산: 사방 여백, 시작·끝이 겹쳐 손으로 두른 느낌
function buildRing() {
  const m = S.$('#mg'), cx = m.offsetLeft + m.offsetWidth / 2, cy = m.offsetTop + m.offsetHeight * 0.52;
  const rx = m.offsetWidth / 2 + 13, ry = m.offsetHeight * 0.5 + 6; let d = '';
  for (let i = 0; i <= 44; i++) { const a = -2.3 + i / 44 * (Math.PI * 2 + 0.9), g = 1 + 0.07 * i / 44, x = cx + rx * g * Math.cos(a), y = cy + ry * g * Math.sin(a); d += (i ? ' L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); }
  S.$('#ring').setAttribute('d', d);
}
S.ev(T.slip, 'paper', 'slip'); S.ev(T.st, 'card_in', 'stamp'); S.ev(T.mk, 'marker', 'ring'); S.ev(T.end, 'shine', 'slip');
S.scene(tau => {
  if (!window._rg) { buildRing(); window._rg = 1; }
  const d = S.P(tau, -0.2, S.SC.dur);
  S.css('#cam', { transform: S.camCss({ s: S.lerp(1.2, 1.3, d), x: S.lerp(1000, 1080, d), y: S.lerp(690, 730, d) }) });
  const k = S.ent(tau, T.slip, 0.14);
  S.css('#slip', { opacity: k });
  const sk = S.ent(tau, T.st, 0.1);
  S.css('#stamp', { opacity: sk, transform: `rotate(-10deg) scale(${(1.4 - 0.4 * sk).toFixed(3)})` });
  E.stroke('#ring', tau, T.mk, 0.5);
  const sh = S.ent(tau, T.end, 0.15) * (1 - S.P(tau, T.end + 0.3, T.end + 0.6));
  S.$('#slip').style.boxShadow = `inset 0 0 18px rgba(120,80,0,.3),0 3px 8px rgba(0,0,0,.35),0 0 0 ${(6 * sh).toFixed(1)}px rgba(240,90,40,${(0.9 * sh).toFixed(2)})`;
});
</script>
</body></html>
