<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s61 사람한테 쓴다 — 점심 홀 어깨 너머, 주홍 쪽지 한 장</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#w{left:0;top:0;width:1997px;height:1331px}
#ph{left:0;top:0;width:1997px;height:1331px}
#glow{left:1130px;top:-260px;width:620px;height:620px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,150,70,.7),rgba(255,130,50,0));mix-blend-mode:screen;opacity:0}
#note{left:1440px;top:340px;width:440px;height:236px;background:#FFF8EE;border-radius:6px;box-shadow:0 18px 36px rgba(20,25,30,.35);transform-origin:50% 0}
#tape{left:170px;top:-16px;width:110px;height:34px;background:rgba(210,200,175,.8)}
#nt{left:28px;top:36px;width:400px;font-size:72px;line-height:1.15;color:#F05A28}
#nt .l2{display:block}
#mk{left:28px;top:150px;width:130px;height:26px;background:rgba(240,90,40,.28);border-radius:4px;opacity:0}
</style></head>
<body><div id="stage">
  <div id="w" class="abs">
    <div id="ph" class="photo abs"></div>
    <div id="glow" class="abs"></div>
    <div id="note" class="abs" data-box="note"><div id="tape" class="abs"></div><div id="mk" class="abs"></div><div id="nt" class="hand abs"><span>지난번에</span><span class="l2">맵게 드셨죠?</span></div></div>
  </div>
</div>
<script src="../data/s61.js"></script>
<script src="../lib/sjk.js"></script>
<script src="_e6.js"></script>
<script>
window.PALETTE = ['#D9DBD6', '#F05A28', '#1F2A33'];
S.$('#ph').style.backgroundImage = S.ph('p61_hall_shoulder');
E.svg('#w', 1997, 1331, '<ellipse id="ring" cx="1430" cy="38" rx="170" ry="72" fill="none" stroke="#F05A28" stroke-width="8"/>');
const T = { ring: S.at('가게는'), pop: S.at('사람한테'), note: S.at('단골'), wr: S.at('얼굴') + 0.3, mk: S.at('맵게'), end: S.at('한마디') };
S.focus([{ t0: T.pop, t1: T.pop + 1.2, big: '사람', color: 'or' }]);
S.ev(T.ring, 'marker', 'ring'); S.ev(T.note, 'card_in', 'note'); S.ev(T.wr, 'type', 'nt'); S.ev(T.mk, 'marker', 'mk'); S.ev(T.end, 'shine', 'note');
S.scene(tau => {
  S.css('#w', { left: E.lin(tau, -0.2, S.SC.dur, 0, -77) + 'px' });
  E.stroke(S.$('#ring'), tau, T.ring, 0.45);
  S.$('#ring').style.opacity = S.EO(S.P(tau, T.ring, T.ring + 0.4)) * (1 - S.P(tau, T.pop + 0.9, T.pop + 1.4));
  S.css('#glow', { opacity: S.EO(S.P(tau, T.pop - 0.1, T.pop + 0.6)) });
  const k = E.in('#note', tau, T.note, { dy: -20, base: 'rotate(-3deg)' });
  const w = S.EO(S.P(tau, T.wr, T.wr + 1.6));
  S.css('#nt', { clipPath: `inset(-10px ${((1 - w) * 100).toFixed(1)}% -10px -10px)` });
  S.css('#mk', { opacity: S.EO(S.P(tau, T.mk, T.mk + 0.3)), clipPath: `inset(0 ${((1 - S.EO(S.P(tau, T.mk, T.mk + 0.35))) * 100).toFixed(1)}% 0 0)` });
  const sh = S.ent(tau, T.end, 0.15) * (1 - S.P(tau, T.end + 0.3, T.end + 0.6));
  S.$('#note').style.boxShadow = `0 18px 36px rgba(20,25,30,.35),0 0 0 ${(8 * sh).toFixed(1)}px rgba(240,90,40,${(0.9 * sh).toFixed(2)})`;
});
</script>
</body></html>
