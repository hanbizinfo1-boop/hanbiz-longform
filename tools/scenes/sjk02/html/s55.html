<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s55 매출은 줄고 수익은 늘었다 — 낮은 각도 감열지 띠 위 두 줄 선 그래프, 메뉴 칩이 회색으로 빠짐</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#wrap{left:0;top:0;width:1920px;height:1080px;perspective:1800px;perspective-origin:50% 38%}
#st{left:560px;top:60px;width:900px;height:780px;overflow:hidden;background-size:900px auto;transform-origin:50% 100%}
#ch{position:absolute;left:0;top:0;width:900px;height:780px}
.ln{fill:none;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}
.tg{position:absolute;font-size:28px;font-weight:800;padding:6px 16px;border-radius:10px;white-space:nowrap}
#tS{left:40px;top:110px;background:#E4E6E3;color:#5D646B}
#tP{left:40px;top:560px;background:#FDE6DC;color:#F05A28}
#cD{position:absolute;left:640px;top:70px;font-size:30px;padding:8px 18px}
.mc{left:110px;width:360px;font-size:34px;justify-content:center}
#m0{top:250px}#m1{top:350px}#m2{top:450px}#hg{top:600px;left:110px;width:360px;font-size:34px;justify-content:center}
#ax{position:absolute;left:30px;right:30px;top:720px;border-top:3px dotted #C5C9CC}
</style></head>
<body><div id="stage">
  <div class="bg tex-conc"></div>
  <div id="wrap" class="abs">
    <div id="st" class="abs thermal" data-box="st" data-box-group="stg">
      <svg id="ch" viewBox="0 0 900 780">
        <g stroke="#E3E6E8" stroke-width="2"><line x1="40" y1="230" x2="860" y2="230"/><line x1="40" y1="400" x2="860" y2="400"/><line x1="40" y1="570" x2="860" y2="570"/><line x1="40" y1="740" x2="860" y2="740"/></g>
        <path id="lS" class="ln" stroke="#9AA0A6" d="M80 250 L330 244 L560 330 L820 360"/>
        <path id="lP" class="ln" stroke="#F05A28" d="M80 700 L330 696 L560 620 L820 330"/>
        <circle id="dP" cx="820" cy="330" r="16" fill="#F05A28"/>
      </svg>
      <div id="tS" class="tg">매출</div><div id="tP" class="tg">수익</div>
      <div id="ax"></div>
    </div>
  </div>
  <div id="m0" class="chip ink mc" data-box="m0">배달 메뉴 A</div><div id="m1" class="chip ink mc" data-box="m1">배달 메뉴 B</div><div id="m2" class="chip ink mc" data-box="m2">배달 메뉴 C</div>
  <div id="hg" class="chip or" data-box="hg">포장 할인</div>
  <div id="cDc" class="chip te" data-box="cDc" data-box-group="stg" style="left:1400px;top:330px">결정</div>
</div>
<script src="../data/s55.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#D9DBD6', '#F05A28', '#1F2A33', '#9AA0A6'];
const T = { menu: S.at('배달메뉴'), cut: S.at('줄이고'), disc: S.at('할인을'), sd: S.at('매출은'), pf: S.at('남는돈은'), up: S.at('늘었어요'), only: S.at('매출만'), dec: S.at('결정'), cnt: S.at('따져'), can: S.at('할수') };
const lS = S.$('#lS'), lP = S.$('#lP'), nS = lS.getTotalLength(), nP = lP.getTotalLength();
lS.style.strokeDasharray = nS; lP.style.strokeDasharray = nP;
// 선 길이 비율: 앞 두 마디(평평) = 0.0~0.48, 내려감/올라감 구간 = 마지막 두 마디
S.focus([{ t0: T.up, t1: T.up + 1.4, big: '수익 ↑', color: 'or' }]);
S.ev(T.menu, 'card_in', 'm0'); S.ev(T.cut + 0.1, 'no', 'm1'); S.ev(T.disc, 'card_in', 'hg'); S.ev(T.sd, 'gauge', 'lS'); S.ev(T.up - 0.1, 'ok', 'lP');
S.ev(T.dec, 'card_in', 'cDc'); S.ev(T.cnt + 0.6, 'shine', 'dP');
S.scene(tau => {
  // 감열지 띠: 낮은 각도(rotateX 24°) 로 서서 천천히 앞으로 눕는다
  const e = S.ent(tau, -0.2, 0.3);
  S.css('#st', { opacity: e, transform: `rotateX(${24 - 6 * S.P(tau, 0, S.SC.dur)}deg) rotateZ(-2deg) translateY(${(1 - e) * 20}px)` });
  // 선: 앞 절반은 «메뉴» 부터 평평하게, 뒤는 말에 맞춰
  const aS = S.EO(S.P(tau, T.menu, T.menu + 0.7)) * 0.48 + S.EO(S.P(tau, T.sd, T.sd + 0.6)) * 0.52;
  const aP = S.EO(S.P(tau, T.menu + 0.1, T.menu + 0.8)) * 0.48 + S.EO(S.P(tau, T.up - 0.1, T.up + 0.7)) * 0.52;
  lS.style.strokeDashoffset = nS * (1 - aS); lP.style.strokeDashoffset = nP * (1 - aP);
  S.css('#tS', { opacity: S.ent(tau, T.menu + 0.5, 0.12) }); S.css('#tP', { opacity: S.ent(tau, T.menu + 0.6, 0.12) });
  // 매출만 볼 때: 회색 선이 한 번 더 탈색(흐려짐)
  const g = S.ent(tau, T.only, 0.3);
  lS.style.opacity = 1 - 0.65 * g; S.css('#tS', { filter: `grayscale(${g})`, opacity: S.ent(tau, T.menu + 0.5, 0.12) * (1 - 0.5 * g) });
  S.$('#dP').style.opacity = S.ent(tau, T.up + 0.6, 0.12);
  S.$('#dP').setAttribute('r', 16 + 8 * Math.max(0, Math.sin(S.P(tau, T.cnt + 0.6, T.cnt + 1.2) * Math.PI)));
  // 메뉴 칩 셋(0.12초 간격) → «줄이고» 에 둘이 회색으로 빠짐 → 포장 할인(주홍)
  ['m0', 'm1', 'm2'].forEach((id, i) => {
    const k = S.ent(tau, T.menu - 0.1 + i * 0.12 - 0.3, 0.12);
    const out = i > 0 ? S.ent(tau, T.cut + 0.1 + (i - 1) * 0.12, 0.2) : 0;
    S.css('#' + id, { opacity: k * (1 - 0.55 * out), transform: `translateX(${(1 - k) * -40}px)`, filter: `grayscale(${out})` });
  });
  const h = S.ent(tau, T.disc, 0.12); S.css('#hg', { opacity: h, transform: `translateY(${(1 - h) * 14}px)` });
  const d = S.ent(tau, T.dec, 0.12); S.css('#cDc', { opacity: d, transform: `translateX(${(1 - d) * -30}px)` });
});
</script>
</body></html>
