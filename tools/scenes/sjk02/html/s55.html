<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s55 배달 메뉴 줄이고 포장 할인 → 매출 조금 ↓ 수익 ↑ — 메뉴 관리 화면에서 배달 스위치가 꺼지고 포장 할인이 켜진 뒤, 블렌더 유리 통 둘(매출·수익)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#bl{position:absolute;left:0;top:0;width:1920px;height:1080px}
#pw{left:0;top:0;width:1920px;height:1080px;perspective:2200px;perspective-origin:50% 40%}
#app{left:560px;top:110px;width:800px;transform-origin:50% 40%}
#app .row{align-items:center;padding:16px 26px}
#app .nm{flex:1;font-size:28px}
#app .pr{font-size:26px;margin:0 22px 0 0;color:#3A444C}
.sw{flex:none;width:72px;height:40px;border-radius:20px;background:#C9CED2;position:relative}
.sw i{position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.sec{padding:14px 26px 8px;font-size:22px;font-weight:700;letter-spacing:.12em;color:#8A9096;background:#F6F7F8}
.cap{flex:none;font-size:20px;font-weight:700;color:#8A9096;margin-right:12px}
#disc .bdg{font-size:22px}
.tg{position:absolute;left:0;top:0;padding:8px 18px 10px;border-radius:10px;background:#1F2A33;color:#fff;font-family:"Pre";font-weight:800;font-size:34px;white-space:nowrap;
  box-shadow:0 0 0 3px rgba(255,255,255,.9),0 12px 26px rgba(10,14,18,.45)}
#tp{background:#F05A28}
</style></head>
<body><div id="stage">
  <img id="bl" alt="">
  <div id="pw" class="abs">
    <div id="app" class="app" data-box="app">
      <div class="hd">메뉴 관리</div>
      <div class="sec">배달</div>
      <div id="rows"></div>
      <div class="sec">포장</div>
      <div id="disc" class="row"><span class="nm">포장 주문 할인<span id="bd" class="bdg">-1,000원</span></span><span class="cap">포장</span><div id="swd" class="sw"><i></i></div></div>
    </div>
  </div>
  <div id="ts" class="tg">매출</div><div id="tp" class="tg">수익</div>
</div>
<script src="../data/s55.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../../../../_tmp/sjk02/blender/s55/proj.js"></script>
<script>
window.PALETTE = ['#B08A63', '#1F2A33', '#F05A28'];   // 나무 계산대 · 먹 글 · 주홍(수익) — 매출 물은 회청
window.DEVICES = ['실제 화면 동작(메뉴 관리)', 'R3 은유 기계(블렌더)'];
const T = { few: S.at('몇'), cut: S.at('줄이고'), disc: S.at('할인을'), put: S.at('걸었어요'), then: S.at('그랬더니'), sales: S.at('매출은'), bank: S.at('통장에') };
const MENU = [['돼지국밥', '9,000'], ['순대국밥', '9,500'], ['수육국밥', '10,500'], ['모둠 순대', '15,000'], ['수육 (소)', '18,000'], ['섞어국밥', '9,500']];
const OFF = { 3: T.few, 4: T.few + 0.2, 5: T.cut + 0.05 };      // 끄는 줄(번호 → 시각)
S.$('#rows').innerHTML = MENU.map((m, i) => `<div id="r${i}" class="row"><span class="nm">${m[0]}</span><span class="pr">${m[1]}원</span><span class="cap">배달</span><div id="sw${i}" class="sw"><i></i></div></div>`).join('');
S.ev(0.0, 'in', 'app');
S.ev(T.few, 'click', 'off');
S.ev(T.disc, 'click', 'disc');
S.ev(T.put, 'card_in', 'badge');
S.ev(T.then, 'sweep', 'tanks');
S.ev(T.sales + 0.1, 'no', 'salesDown');
S.ev(S.at('오히려') + 0.2, 'gauge', 'profitUp');
function sw(el, on) {
  el.style.background = on > 0.5 ? '#1F2A33' : '#C9CED2';
  el.querySelector('i').style.transform = `translateX(${(32 * on).toFixed(1)}px)`;
}
function place(el, p, dy, k) {
  if (!p) { el.style.opacity = 0; return; }
  el.style.opacity = k;
  el.style.transform = `translate(${(p[0] - el.offsetWidth / 2).toFixed(1)}px,${(p[1] - el.offsetHeight - dy + (1 - k) * 12).toFixed(1)}px)`;
}
// 10-20 효과음 채움 — 수익 통의 물이 차오르는 중 · «매출만» 에 매출 물이 회색으로 · «따져» 에 수익 통이 빛남 · 카메라가 수익 통으로 옮김
S.ev(S.at('오히려') + 0.6, 'water', 'f_rise'); S.ev(S.at('매출만') + 0.1, 'no', 'f_salesGrey'); S.ev(S.at('따져'), 'shine', 'f_profGlow'); S.ev(S.at('따져') + 0.65, 'sweep', 'f_pan');
S.scene(async tau => {
  await S.bl('#bl', 's55', tau);
  // 앞 4초: 통 무대는 흐리게 깔리고 메뉴 관리 화면이 위에
  const out = S.cam(tau, T.then - 0.05, T.then + 0.4);
  S.css('#bl', { filter: `blur(${(16 * (1 - out)).toFixed(2)}px) brightness(${(0.72 + 0.28 * out).toFixed(3)})`, transform: `scale(${(1.06 - 0.06 * out).toFixed(4)})` });
  const k = S.ent(tau, 0.0, 0.14);
  S.css('#app', { opacity: (k * (1 - out)).toFixed(3), transform: `rotateX(8deg) rotateZ(-2deg) translateY(${((1 - k) * 30 - 700 * out).toFixed(1)}px)` });
  MENU.forEach((m, i) => {
    const t = OFF[i];
    const off = t === undefined ? 0 : S.EO(S.P(tau, t, t + 0.18));
    sw(S.$('#sw' + i), 1 - off);
    S.$('#r' + i).style.opacity = (1 - 0.55 * off).toFixed(3);
  });
  sw(S.$('#swd'), S.EO(S.P(tau, T.disc, T.disc + 0.18)));
  const bk = S.ent(tau, T.put, 0.12);
  S.css('#bd', { opacity: bk, display: 'inline-block', transform: `scale(${(0.8 + 0.2 * bk).toFixed(3)})` });
  place(S.$('#ts'), S.proj('sales_top', tau), 4, S.ent(tau, T.then + 0.35, 0.12));
  place(S.$('#tp'), S.proj('prof_top', tau), 4, S.ent(tau, T.then + 0.6, 0.12));
});
</script>
</body></html>
