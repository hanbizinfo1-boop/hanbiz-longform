<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s13 공고만이 아니라 가게 전체로 번지고 — 미니어처 상가 하이앵글, 왼쪽에서 오른쪽으로 색이 빠짐</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#ph{left:-30px;top:-160px;width:2100px;height:1400px}
.lay{left:0;top:0;width:2100px;height:1400px;background-size:2100px 1400px;background-repeat:no-repeat}
#gray{filter:grayscale(1) brightness(1.06) contrast(.88)}
</style></head>
<body><div id="stage">
  <div id="ph" class="abs">
    <div id="col" class="abs photo lay"></div>
    <div id="gray" class="abs photo lay"></div>
  </div>
</div>
<script src="../data/s13.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#D9DBD6', '#1F2A33', '#9AA0A6'];   // 사진(낮은 채도) → 회색으로 번짐 = 다 똑같아지는 것
window.DEVICES = ['R9 회색 번짐'];
const T = { all: S.at('가게 전체로') };
for (const id of ['col', 'gray']) document.getElementById(id).style.backgroundImage = S.ph('p13_miniature_street');
S.ev(T.all, 'no', 'sweep');
S.scene(tau => {
  const d = S.P(tau, -S.SC.pre, S.SC.dur);
  S.css('#ph', { left: (-20 - 120 * S.EIO(d)) + 'px' });
  // 회색 번짐: 사진 가운데 한 가게(사진 좌표 1000,700)에서 원형으로 1.4초에 걸쳐 반경 0→1500 (경계 180px 부드럽게)
  const r = S.lerp(-200, 1500, S.EIO(S.P(tau, T.all, T.all + 1.4)));
  const m = `radial-gradient(circle at 1000px 700px,#000 ${r.toFixed(1)}px,transparent ${(r + 180).toFixed(1)}px)`;
  S.css('#gray', { webkitMaskImage: m, maskImage: m });
});
</script>
</body></html>
