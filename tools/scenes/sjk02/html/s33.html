window.PALETTE = ['#B08A63', '#1F2A33', '#9AA0A6'];   // 나무 계산대 · 여러 색 구슬(세상 글) → 회색(무난한 글)
window.DEVICES = ['R3 은유 기계(블렌더)'];
const T = { avg: S.at('평균적인'), world: S.at('세상에'), pick: S.at('제일'), mem: S.at('기억에') };
S.ev(0.0, 'sweep', 'pour');
