<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s73 끝 — 댓글 입력창 → 채널 카드 → 구독 → 좋아요(콘크리트 · 주홍)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#pan{left:360px;top:120px;width:1200px;height:700px}
#pan .hd{font-size:30px;gap:14px}
#pan .hd span{font-weight:600;font-size:22px;letter-spacing:.12em;color:#7A838A}
#inp{position:absolute;left:36px;top:84px;width:1128px;height:78px;border-bottom:3px solid #CDD2D6;display:flex;align-items:center;gap:20px;font-size:28px;color:#8A939A}
#inp .a{width:52px;height:52px;border-radius:50%;background:#D7DCDF;flex:none}
#cur{display:inline-block;width:3px;height:36px;background:#1F2A33;vertical-align:-8px;margin-right:6px}
.rw{position:absolute;left:36px;width:1128px;height:104px}
.rw .av2{position:absolute;left:0;top:10px;width:56px;height:56px;border-radius:50%;background:#D7DCDF;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#59636B}
.rw .nm{position:absolute;left:84px;top:6px;font-size:23px;font-weight:800;color:#59636B}
.rw .cm{position:absolute;left:84px;top:40px;font-size:30px;font-weight:600;color:#1F2A33;white-space:nowrap}
.rw .ok{position:absolute;right:20px;top:14px;width:46px;height:46px;border-radius:50%;background:#1FA39A;display:flex;align-items:center;justify-content:center;opacity:0}
.rw .ok svg{width:26px;height:26px}
#ty{position:absolute;left:190px;top:580px;display:flex;gap:9px;opacity:0}
#ty i{width:14px;height:14px;border-radius:50%;background:#9AA0A6}
#rep{position:absolute;left:120px;top:540px;width:1044px;height:100px;opacity:0}
#rep .dotc{position:absolute;left:0;top:10px;width:46px;height:46px;border-radius:50%;background:#F05A28}
#rep .nm2{position:absolute;left:70px;top:6px;font-size:23px;font-weight:800;color:#C8461A}
#rep .cm2{position:absolute;left:70px;top:40px;font-size:30px;font-weight:600;color:#1F2A33;white-space:nowrap}
#q{left:1600px;top:70px;opacity:0}
#cover{position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:0}
#cta{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:960px 470px}
#ch{left:520px;top:250px;width:880px;height:260px;background:#fff;border-radius:14px;box-shadow:0 18px 44px rgba(20,25,30,.28);opacity:0}
#chav{position:absolute;left:50px;top:40px;width:180px;height:180px;border-radius:50%;background:url("../../../../소재/채널/ceosystem1_profile.png") center/cover}
#chnm{position:absolute;left:276px;top:68px;font-family:"Gmarket";font-weight:700;font-size:76px;line-height:1;color:#1F2A33;white-space:nowrap}
#chid{position:absolute;left:280px;top:166px;font-family:"Pre";font-weight:500;font-size:32px;color:#59636B}
.btn{top:560px;width:320px;height:96px;border-radius:48px;display:flex;align-items:center;justify-content:center;gap:16px;font-family:"Pre";font-weight:700;font-size:38px;opacity:0;box-shadow:0 10px 26px rgba(20,25,30,.22)}
#sub{left:620px;background:#1F2A33;color:#fff}
#sub .bell{display:none;width:38px;height:38px}
#lk2{left:980px;background:#fff;color:#1F2A33}
#lk2 svg{width:44px;height:44px}
#ptr{left:0;top:0;width:52px;height:52px;opacity:0}
#ptr svg{position:absolute;left:0;top:0;width:52px;height:52px;overflow:visible}
</style></head>
<body><div id="stage">
  <div class="bg tex-conc"></div>
  <div id="cam" class="abs" style="left:0;top:0;width:1920px;height:1080px">
    <div id="pan" class="app">
      <div class="hd">댓글 <span>전체</span></div>
      <div id="inp"><div class="a"></div><div><span id="cur"></span><span id="ph">댓글 추가...</span></div></div>
      <div id="r0" class="rw" style="top:190px"><div class="av2">김</div><div class="nm">김**</div><div class="cm">리뷰 답글 시킬 때 어떤 말을 넣어야 할지 모르겠어요</div><div class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
      <div id="r1" class="rw" style="top:300px"><div class="av2">박</div><div class="nm">박**</div><div class="cm">주 1회 숫자 계산, 포스기 자료로도 되나요?</div><div class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
      <div id="r2" class="rw" style="top:410px"><div class="av2">이</div><div class="nm">이**</div><div class="cm">저희는 카페인데 한 줄 찾는 법 궁금합니다</div><div class="ok"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
      <div id="ty"><i></i><i></i><i></i></div>
      <div id="rep"><div class="dotc"></div><div class="nm2">사장의 시스템</div><div class="cm2">확인해서 꼭 도움 되실 수 있게 달아 드리겠습니다.</div></div>
    </div>
    <div id="q" class="chip gr" data-box="q">?</div>
  </div>
  <div id="cover" class="tex-conc"></div>
  <div id="cta">
    <div id="ch" class="abs" data-box="ch"><div id="chav"></div><div id="chnm">사장의 시스템</div><div id="chid">@ceosystem1</div></div>
    <div id="sub" class="abs btn" data-box="sub"><svg class="bell" viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4a1.5 1.5 0 0 0-3 0v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" fill="#1F2A33"/></svg><span id="subt">구독</span></div>
    <div id="lk2" class="abs btn" data-box="lk2"><svg viewBox="0 0 24 24"><path id="lk2p" d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z" fill="none" stroke="#1F2A33" stroke-width="1.8" stroke-linejoin="round"/></svg><span>좋아요</span><span id="lkn" style="font-weight:500;color:#59636B">127</span></div>
    <div id="ptr" class="abs"><svg viewBox="0 0 24 24"><path d="M0 0 L0 17.5 L4.6 13.4 L7.6 20.4 L10.6 19.1 L7.7 12.3 L13.6 12.3 Z" fill="#fff" stroke="#1F2A33" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
  </div>
</div>
<script src="../data/s73.js"></script>
<script src="../lib/sjk.js"></script>
<script src="_e6.js"></script>
<script>
window.PALETTE = ['#D9DBD6', '#1F2A33', '#F05A28'];
window.DEVICES = ['댓글 CTA'];
const T = { q: S.at('감이'), q2: S.at('도움'), cmt: S.at('댓글'), rows: S.at('하나하나'), chk: S.at('도움', 1), ty: S.at('생각해'), rep: S.at('달아'), cov: S.at('도움', 2) };
const C = { card: T.cov - 0.2, push: S.at('다음') - 0.05 };
C.btn = C.card + 0.5; C.sub = C.btn + 0.35; C.like = S.at('눌러');
const SUBP = { x: 800, y: 640 }, LKP = { x: 1170, y: 640 };
S.ev(-0.1, 'in', 'pan'); S.ev(T.q, 'card_in', 'q'); S.ev(T.q2, 'shine', 'q'); S.ev(T.cmt, 'click', 'inp');
S.ev(T.rows, 'card_in', 'r0'); S.ev(T.chk, 'ok', 'r0'); S.ev(T.ty, 'type', 'ty'); S.ev(T.rep, 'msg_in', 'rep');
S.ev(C.card, 'card_in', 'ch'); S.ev(C.sub, 'click', 'sub'); S.ev(C.like, 'click', 'lk2');
S.scene(tau => {
  const k = S.ent(tau, -0.15, 0.2);
  // 판: 정면 — 아래서 올라오며 들어옴
  S.css('#pan', { opacity: k, transform: `translateY(${(1 - k) * 36}px)` });
  const bk = S.cam(tau, C.card - 0.05, C.card + 0.35);
  S.css('#cam', { filter: bk > 0 ? `blur(${10 * bk}px)` : 'none', opacity: 1 - 0.3 * bk });
  S.css('#cover', { opacity: 0.55 * bk });
  // ? 칩(감이 안 잡혀서) — 도움에 한 번 진해짐
  const qa = S.ent(tau, T.q, 0.12), qs = S.ent(tau, T.q2, 0.16) * (1 - S.P(tau, T.q2 + 0.3, T.q2 + 0.6));
  S.css('#q', { opacity: qa, transform: `scale(${(0.8 + 0.2 * qa) * (1 + 0.1 * qs)})` });
  // 입력창: 포커스 + 커서
  const f = S.ent(tau, T.cmt, 0.12);
  S.$('#inp').style.borderBottomColor = f > 0 ? '#1F2A33' : '#CDD2D6';
  S.css('#cur', { opacity: tau > T.cmt ? (Math.floor(tau * 2) % 2 === 0 ? 1 : 0) : 0 });
  // 댓글 줄(글 없음): 하나하나에 차례로
  [0, 1, 2].forEach(i => E.in('#r' + i, tau, T.rows + i * 0.3, { dy: 18 }));
  // 도움 되실에 체크(청록)
  [0, 1, 2].forEach(i => { const e = S.$('#r' + i + ' .ok'); const a = S.ent(tau, T.chk + i * 0.22, 0.12); e.style.opacity = a; e.style.transform = `scale(${0.6 + 0.4 * a})`; });
  // 생각해 보고 — 점 셋(주기 파동, 결정적)
  const ta = S.ent(tau, T.ty, 0.12) * (1 - S.P(tau, T.rep, T.rep + 0.15));
  S.$('#ty').style.opacity = ta;
  S.$('#ty').querySelectorAll('i').forEach((d, i) => { d.style.transform = `translateY(${(-5 * Math.sin((tau - T.ty) * 9 - i * 0.9)).toFixed(2)}px)`; });
  // 달아 드리겠습니다 — 첫 줄 아래 들여쓰기 답글(주홍 점)
  E.in('#rep', tau, T.rep, { dy: 14 });
  // 끝 CTA
  const ci = S.ent(tau, C.card, 0.12);
  S.css('#ch', { opacity: ci, transform: `translateY(${(1 - ci) * 30}px)` });
  const bi = S.ent(tau, C.btn, 0.12);
  const sp = (t => { const d = tau - t; return d >= 0 && d < 0.14 ? 0.9 + 0.1 * (d / 0.14) : 1; });
  const sd = tau >= C.sub + 0.07, ld = tau >= C.like + 0.07, lf = S.ent(tau, C.like + 0.05, 0.12);
  S.css('#sub', { opacity: bi, background: sd ? '#E4E6E3' : '#1F2A33', color: sd ? '#1F2A33' : '#fff', transform: `translateY(${(1 - bi) * 24}px) scale(${sp(C.sub) < 1 ? 0.96 : 1})` });
  S.css('#lk2', { opacity: bi, transform: `translateY(${(1 - bi) * 24}px) scale(${sp(C.like) < 1 ? 0.96 : 1})` });
  S.$('#subt').textContent = sd ? '구독중' : '구독';
  S.$('#sub .bell').style.display = sd ? 'block' : 'none';
  const lkp = S.$('#lk2p');
  lkp.setAttribute('fill', ld ? '#F05A28' : 'none'); lkp.setAttribute('fill-opacity', lf); lkp.setAttribute('stroke', ld ? '#F05A28' : '#1F2A33');
  S.$('#lkn').textContent = ld ? '128' : '127';
  // 커서
  const p0 = { x: 1430, y: 860 }, m1 = S.cam(tau, C.btn + 0.05, C.sub - 0.06), m2 = S.cam(tau, C.sub + 0.22, C.like - 0.08);
  const px = S.lerp(S.lerp(p0.x, SUBP.x, m1), LKP.x, m2), py = S.lerp(S.lerp(p0.y, SUBP.y, m1), LKP.y, m2);
  S.css('#ptr', { opacity: S.ent(tau, C.btn + 0.05, 0.1), left: px + 'px', top: py + 'px', transform: `scale(${sp(C.sub) * sp(C.like)})`, transformOrigin: '0 0' });
  // 다음 영상에서 — 아주 느린 밀기
  S.css('#cta', { transform: `scale(${1 + 0.02 * S.P(tau, C.push, S.SC.dur)})` });
});
</script>
</body></html>
