<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s28 살아남는 가게는 AI한테 시키기 전에 한 줄 — 스포트라이트 B안(메모 한 장만 빛 · 큰 글 · 붓 밑줄)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#world{left:0;top:0;width:1920px;height:1080px;transform-origin:1145px 450px}
#ph{left:0;top:0;width:1920px;height:1080px;filter:saturate(.7)}
#glow{position:absolute;left:0;top:0;width:300px;height:440px;background:rgba(255,255,255,.10);box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 60px 16px rgba(255,200,170,.45)}
#memo{position:absolute;left:0;top:0;width:300px;height:440px}
.hl{position:absolute;left:28px;font-size:72px;line-height:1;color:#1F2A33;white-space:nowrap;font-family:"Hand";font-weight:700}
#brush{position:absolute;left:0;top:0;width:300px;height:440px;overflow:visible}
#brush path{fill:none;stroke:#F05A28;stroke-linecap:round;stroke-linejoin:round;opacity:.85;mix-blend-mode:multiply}
#shade{position:absolute;left:0;top:0;width:1920px;height:1080px}
#big{position:absolute;left:1400px;top:330px;font-size:230px;line-height:1;color:#fff;text-shadow:0 8px 34px rgba(0,0,0,.65);white-space:nowrap;opacity:0}
</style></head>
<body><div id="stage">
  <div id="world" class="abs">
    <div id="ph" class="photo"></div>
    <div id="glow"></div>
    <div id="memo" data-diegetic data-box="memo">
      <div id="l1" class="hl" style="top:34px">새벽 5시</div>
      <div id="l2" class="hl" style="top:118px">불 올림</div>
      <div id="l3" class="hl" style="top:232px">점심 전</div>
      <div id="l4" class="hl" style="top:316px">한 솥</div>
      <svg id="brush" viewBox="0 0 300 440"><path id="bp" d="M18 206 C 80 194, 170 200, 262 190" stroke-width="22"/></svg>
    </div>
  </div>
  <svg id="shade"><defs><filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
    <mask id="m"><rect width="1920" height="1080" fill="#fff"/><ellipse id="el" cx="1145" cy="462" rx="380" ry="470" fill="#000" filter="url(#bl)"/></mask></defs>
    <rect id="dark" width="1920" height="1080" fill="rgba(6,9,12,.82)" mask="url(#m)"/></svg>
  <div id="big" class="blk">한 줄</div>
</div>
<script src="../data/s28.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#14191E', '#F05A28', '#FFFFFF'];
window.DEVICES = ['R7 스포트라이트 ①'];
const T = { w1: S.at('살아남는'), w2: S.at('AI한테') + 0.3, narrow: S.at('우리 가게만'), line: S.at('한 줄'), zoom: S.at('차이가') };
S.css('#ph', { backgroundImage: S.ph('p28_memo_macro') });
const Q = [[1046, 254], [1306, 254], [1252, 668], [986, 628]];
['#memo', '#glow'].forEach(s => S.fitQuad(S.$(s), 300, 440, Q));
S.ev(T.w1, 'marker', 'l1'); S.ev(T.w2, 'paper', 'l3'); S.ev(T.narrow, 'shine', 'el'); S.ev(T.line, 'marker', 'bp'); S.ev(T.line + 0.1, 'card_in', 'big');
const KEYS = [{ t: 0, s: 1.3, x: 1145, y: 450 }, { t: T.zoom, s: 1.4, x: 1145, y: 450, d: 0.5 }];
// 10-20 효과음 채움 — 메모에 «차이가» 로 카메라가 한 번 더 다가감
S.ev(T.zoom - 0.1, 'sweep', 'f_zoom');
S.scene(tau => {
  const c = S.camState(tau, KEYS), drift = S.P(tau, 0, S.SC.dur);
  S.css('#world', { transform: `scale(${(c.s * (1 + 0.012 * drift)).toFixed(4)})` });
  // 메모 글: 왼→오 닦아 써짐(1~2줄 «살아남는», 3~4줄 «시키기 전에»)
  E.wipe('#l1', tau, T.w1, 0.6); E.wipe('#l2', tau, T.w1 + 0.45, 0.6);
  E.wipe('#l3', tau, T.w2, 0.6); E.wipe('#l4', tau, T.w2 + 0.45, 0.6);
  // 스포트라이트: 처음 넓게 어두워지고 «우리 가게만» 에 좁아짐
  const dk = S.ent(tau, -0.15, 0.5), nr = S.EO(S.P(tau, T.narrow, T.narrow + 0.5));
  const el = S.$('#el');
  el.setAttribute('rx', (S.lerp(380, 255, nr) * (c.s / 1.3)).toFixed(1)); el.setAttribute('ry', (S.lerp(470, 345, nr) * (c.s / 1.3)).toFixed(1));
  S.$('#dark').setAttribute('fill', `rgba(6,9,12,${(0.82 * dk).toFixed(3)})`);
  S.css('#glow', { opacity: dk * (0.6 + 0.4 * nr) });
  // 붓 밑줄 + 큰 글
  E.stroke('#bp', tau, T.line, 0.45);
  const b = S.ent(tau, T.line + 0.1, 0.14);
  S.css('#big', { opacity: b, transform: `translateX(${((1 - b) * 40).toFixed(1)}px)` });
});
</script>
</body></html>
