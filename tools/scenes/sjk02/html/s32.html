<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s32 A 는 어디 붙여도 말이 된다 — 같은 종이 책상으로 돌아옴: 회색 A 열 장 위에 B 한 장이 내려앉아 색이 남고 «딱 한 줄»에 주홍 형광</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#bl{position:absolute;left:0;top:0;width:1920px;height:1080px}
</style></head>
<body><div id="stage">
  <img id="bl" alt="">
</div>
<script src="../data/s32.js"></script>
<script src="../lib/sjk.js"></script>

<script>
window.PALETTE = ['#3A4046', '#F4F3EF', '#F05A28'];
window.DEVICES = ['R1 종이 책상(블렌더)'];
const T = { b: S.at('B는'), ai: S.at('AI한테'), one: S.at('줄') };
S.ev(T.b + 0.05, 'paper', 'sheetB');
S.ev(T.ai, 'click', 'lift');
S.ev(T.one - 0.15, 'marker', 'hl');
// 10-20 효과음 채움 — 카메라가 B 한 장 쪽으로 천천히 내려가 다가가기 시작
S.ev(T.b + 0.5, 'sweep', 'f_dolly');
S.scene(async tau => { await S.bl('#bl', 's32', tau); });
</script>
</body></html>
