<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s46 손에 남는 게 월급이랑 별 차이 없다 — 월급봉투 사진 위 짧은 주홍 막대 ≒ 봉투</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
/* 낡은 나무 탁자 위 월급봉투(새 숏) — 아래 왼쪽 어두운 탁자 모서리에 45 의 짧은 주홍 막대, 봉투 둘레 회색 점선, 가운데 «≒» */
#cw{left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#ph{left:0;top:-100px;width:1920px;height:1280px;background-size:100% 100%}
#sv{position:absolute;left:0;top:0}
#big{position:absolute;left:1290px;top:790px;font-size:140px;line-height:1;color:#fff;text-shadow:0 8px 28px rgba(0,0,0,.75);white-space:nowrap;opacity:0}
</style></head>
<body><div id="stage">
  <div id="cw" class="abs">
    <div id="ph" class="photo abs"></div>
    <svg id="sv" width="1920" height="1080" viewBox="0 0 1920 1080">
      <path id="dot" d="M47 633 L423 391 L1570 658 L1309 1078 Z" fill="none" stroke="#D5D9DC" stroke-width="10" stroke-dasharray="2 20" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div id="big" class="blk" data-box="big">12시간</div>
</div>
<script src="../data/s46.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#D9DBD6', '#1F2A33', '#F05A28'];
window.DEVICES = ['숫자 이름표(사진 위 12시간)'];
S.$('#ph').style.backgroundImage = S.ph('p46_pay_envelope');
const T = { rem: S.at('손에'), bar: S.at('남는'), job: S.at('직장'), pay: S.at('월급이랑'), diff: S.at('별 차이가'), but: S.at('근데 일은'), h12: S.at('12시간') };
S.ev(T.bar, 'marker', 'dot'); S.ev(T.diff, 'shine', 'dot'); S.ev(T.but, 'no', 'dot'); S.ev(T.h12, 'card_in', 'big');
S.scene(tau => {
  const d = S.P(tau, 0, S.SC.dur);
  S.css('#cw', { transform: `translate(${(-40 * d).toFixed(1)}px,${(-14 * d).toFixed(1)}px) scale(${(1.03 + 0.06 * d).toFixed(4)})` });
  E.stroke('#dot', tau, T.bar, 0.9);
  const b = S.ent(tau, T.h12, 0.14);
  S.css('#big', { opacity: b, transform: `translateY(${((1 - b) * 18).toFixed(1)}px)` });
  const g = S.P(tau, T.but, T.but + 0.4);
  const sh = S.EO(S.P(tau, T.diff, T.diff + 0.2)) * (1 - S.P(tau, T.diff + 0.4, T.diff + 0.9));
  S.css('#sv', { opacity: (0.7 + 0.3 * sh) * (1 - g), filter: `brightness(${(1 + 0.8 * sh).toFixed(2)})` });
});
</script>
</body></html>
