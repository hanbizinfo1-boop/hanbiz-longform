<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s31 대표님이 손님이면 당연히 B — 어두운 나무 탁자 낮은 각 위에 종이 메뉴 두 장 · A 는 회색으로 빠지고 B 에 볼펜 동그라미</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#world{left:0;top:0;width:1920px;height:1080px;transform-origin:50% 60%}
#ph{left:0;top:0;width:1920px;height:1080px;filter:saturate(.8)}
#wrap{left:0;top:0;width:1920px;height:1080px;perspective:1500px;perspective-origin:50% 38%}
.pp{position:absolute;top:300px;width:480px;height:600px;background:#F6F4EE;color:#1F2A33;font-family:"Pre";padding:36px 38px;box-shadow:0 30px 44px rgba(0,0,0,.55),0 3px 8px rgba(0,0,0,.4);transform-origin:50% 50%}
.pp .t{font-size:32px;font-weight:800;line-height:1.35;border-bottom:3px solid #1F2A33;padding-bottom:12px}
.pp .b{font-size:40px;font-weight:600;line-height:1.5;margin-top:22px}
#pA{left:330px}
#pB{left:1000px}
#circ{position:absolute;left:0;top:0;width:480px;height:600px;overflow:visible}
#circ path{fill:none;stroke:#F05A28;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
</style></head>
<body><div id="stage">
  <div id="world" class="abs">
    <div id="ph" class="photo"></div>
    <div id="wrap" class="abs">
      <div id="pA" class="pp" data-diegetic data-box="pA"><div class="t">○○국밥 · 돼지국밥 9,000원</div><div class="b">진한 사골 육수에 푸짐한 고기를 담은 정성 가득한 한 그릇</div></div>
      <div id="pB" class="pp" data-diegetic data-box="pB"><div class="t">○○국밥 · 돼지국밥 9,000원</div><div class="b">새벽 5시에 불 올려서 점심 전에 딱 한 솥만 끓입니다.</div>
        <svg id="circ" viewBox="0 0 480 600"><path id="cp" d="M60 130 C 180 70, 420 90, 450 230 C 470 400, 400 470, 250 480 C 90 490, 20 400, 24 270 C 28 160, 110 100, 260 98"/></svg></div>
    </div>
  </div>
</div>
<script src="../data/s31.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#2A2420', '#F6F4EE', '#F05A28'];
window.DEVICES = ['R2 볼펜 동그라미'];
const T = { p: S.at('손님이면'), no: S.at('어디'), ok: S.at('당연히') };
S.css('#ph', { backgroundImage: S.ph('n31_counter_angle') });
S.ev(T.p, 'paper', 'pA'); S.ev(T.no, 'no', 'pA'); S.ev(T.ok, 'marker', 'cp');
S.scene(tau => {
  const dr = S.P(tau, 0, S.SC.dur);
  S.css('#world', { transform: `scale(${(1 + 0.05 * dr).toFixed(4)})` });
  const a = S.ent(tau, T.p, 0.14), b = S.ent(tau, T.p + 0.2, 0.14), g = S.EO(S.P(tau, T.no, T.no + 0.35));
  S.css('#pA', { opacity: a, filter: S.desat(g) + ` opacity(${(1 - 0.35 * g).toFixed(3)})`, transform: `translateY(${((1 - a) * -40).toFixed(1)}px) rotateX(${(54 - 4 * dr).toFixed(2)}deg) rotateZ(-5deg)` });
  S.css('#pB', { opacity: b, transform: `translateY(${((1 - b) * -40).toFixed(1)}px) rotateX(${(54 - 4 * dr).toFixed(2)}deg) rotateZ(4deg)` });
  E.stroke('#cp', tau, T.ok, 0.55);
});
</script>
</body></html>
