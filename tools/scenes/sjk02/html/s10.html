<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s10 왜? 다들 같은 AI한테 비슷한 말로 시키거든요 — 가게 5곳 → AI → 같은 글 띠 5개 흐름도(R8)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#cam{left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#bgw{left:-40px;top:-20px;width:2000px;height:1120px;background-size:cover;background-position:center}
.shop{position:absolute;left:160px;width:150px;height:122px;border-radius:16px;background-color:#fff;background-repeat:no-repeat;background-size:282px 188px;background-position:-64px -28px;box-shadow:0 18px 36px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3)}
.band{position:absolute;left:1190px;width:600px;height:84px;border-radius:12px;background:#fff;display:flex;align-items:center;padding:0 24px;font-size:31px;font-weight:700;white-space:nowrap;color:#1F2A33;box-shadow:0 14px 30px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3)}
#ai{left:890px;top:430px;width:140px;height:140px;border-radius:50%;background:var(--te);color:#fff;display:flex;align-items:center;justify-content:center;font-size:64px;box-shadow:0 0 0 6px rgba(255,255,255,.9),0 18px 40px rgba(0,0,0,.5)}
#ln{left:0;top:0;width:1920px;height:1080px}
</style></head>
<body><div id="stage">
  <div id="cam" class="abs">
    <div id="bgw" class="abs tex-dark"></div>
    <svg id="ln" class="abs" viewBox="0 0 1920 1080"></svg>
    <div id="shops"></div>
    <div id="bands"></div>
    <div id="ai" class="abs blk" data-box="ai">AI</div>
  </div>
</div>
<script src="../data/s10.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#14191E', '#E7EAEC', '#1FA39A'];   // 어두운 책상 · 흰 카드 · 청록 = AI
window.DEVICES = ['R8 흐름도'];
const T = { why: S.at('왜'), same: S.at('같은'), alike: S.at('비슷한'), cust: S.at('손님'), all: S.at('다 같은') };
const TXT = '정성을 다해 끓인 따뜻한 국밥 한 그릇';
const CY = i => 220 + i * 140;   // 10-20 자가검수 — 밀기 끝(×1.06)에도 위아래 여백 ≥ 90px
const bg = document.getElementById('bgw'); bg.style.backgroundImage = S.ph('t_dark_desk');
const ln = document.getElementById('ln'), shops = [], bands = [], lL = [], lR = [];
const NS = 'http://www.w3.org/2000/svg';
for (let i = 0; i < 5; i++) {
  const s = document.createElement('div'); s.className = 'shop'; s.style.top = (CY(i) - 61) + 'px'; s.style.backgroundImage = S.ph('n10_shop_icon');
  s.dataset.box = 'sh' + i; document.getElementById('shops').appendChild(s); shops.push(s);
  const b = document.createElement('div'); b.className = 'band'; b.style.top = (CY(i) - 42) + 'px'; b.textContent = TXT;
  b.dataset.box = 'bd' + i; document.getElementById('bands').appendChild(b); bands.push(b);
  const l = document.createElementNS(NS, 'path'); l.setAttribute('d', `M312 ${CY(i)} C 600 ${CY(i)} 700 500 886 500`);
  l.setAttribute('fill', 'none'); l.setAttribute('stroke', '#C8CDD1'); l.setAttribute('stroke-width', 5); l.setAttribute('stroke-linecap', 'round'); l.id = 'l' + i;
  ln.appendChild(l); lL.push(l);
  const r = document.createElementNS(NS, 'path'); r.setAttribute('d', `M1034 500 C 1100 500 1110 ${CY(i)} 1186 ${CY(i)}`);
  r.setAttribute('fill', 'none'); r.setAttribute('stroke', '#1FA39A'); r.setAttribute('stroke-width', 5); r.setAttribute('stroke-linecap', 'round'); r.id = 'r' + i;
  ln.appendChild(r); lR.push(r);
}
S.ev(T.why, 'in', 'shops');
S.ev(T.same, 'sweep', 'lines');
S.ev(T.alike, 'card_in', 'bands');
S.ev(T.all, 'no', 'bands');
const CAM = [{ t: 0, s: 1, x: 960, y: 540 }, { t: T.cust, s: 1.06, x: 1010, y: 500, d: 0.4 }];
// 10-20 효과음 채움 — 같은 글 띠가 차례로 날아듦(둘째 띠)
S.ev(T.alike + 0.6, 'msg', 'f_band2');
S.scene(tau => {
  S.css('#cam', { transform: S.camCss(S.camState(tau, CAM, 0.4)) });
  S.css('#ai', { opacity: S.ent(tau, T.why + 0.1, 0.12), transform: `scale(${(0.85 + 0.15 * S.ent(tau, T.why + 0.1, 0.12)).toFixed(3)})` });
  const g = S.EO(S.P(tau, T.all, T.all + 0.4));
  for (let i = 0; i < 5; i++) {
    const k = S.ent(tau, T.why + 0.06 * i, 0.12);
    shops[i].style.opacity = k; shops[i].style.transform = `translateX(${((1 - k) * -30).toFixed(1)}px)`;
    E.stroke(lL[i], tau, T.same, 0.45);
    E.stroke(lR[i], tau, T.alike, 0.4);
    const bk = S.ent(tau, T.alike + 0.4 + 0.1 * i, 0.12);
    bands[i].style.opacity = bk; bands[i].style.transform = `translateX(${((1 - bk) * 40).toFixed(1)}px)`;
    bands[i].style.filter = S.desat(g) + ` brightness(${(1 - 0.12 * g).toFixed(3)})`;
    bands[i].style.color = `rgb(${Math.round(31 + 100 * g)},${Math.round(42 + 100 * g)},${Math.round(51 + 100 * g)})`;
  }
});
</script>
</body></html>
