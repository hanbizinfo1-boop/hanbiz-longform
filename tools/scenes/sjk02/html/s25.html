<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s25 세 가지는 글·숫자·시간 — 카운터 위 메뉴판·영수증·번호표, 물건마다 차례로 빛이 비침(빛 세 물건)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#cam{left:0;top:0;width:1920px;height:1080px;transform-origin:960px 540px}
/* 사진(1536x1024)을 1.25배로 깔고 위 100px 잘라 냄 → #ph 안은 사진 좌표 그대로 */
#ph{left:0;top:-100px;width:1536px;height:1024px;transform-origin:0 0;transform:scale(1.25);background-size:1536px 1024px;filter:saturate(.9) contrast(1.03)}
.ob{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#1F2A33;font-family:"Pre";line-height:1.15}
.dim{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;opacity:0;background:rgb(8,10,14);-webkit-mask-composite:source-in;mask-composite:intersect}
.nm{position:absolute;background:#fff;color:#1F2A33;padding:8px 24px;border-radius:10px;font-size:40px;font-weight:800;letter-spacing:.06em;box-shadow:0 10px 24px rgba(0,0,0,.45);text-shadow:0 2px 6px rgba(0,0,0,.9),0 0 16px rgba(0,0,0,.8);white-space:nowrap;opacity:0;transform-origin:50% 50%}
</style></head>
<body><div id="stage">
  <div id="cam" class="abs">
    <div id="ph" class="abs">
      <div id="oM" class="ob" data-diegetic><div style="font-size:58px;font-weight:900;letter-spacing:-.02em">돼지국밥</div><div style="font-size:54px;font-weight:800;margin-top:10px">9,000</div></div>
      <div id="oR" class="ob" data-diegetic><div style="font-size:38px;font-weight:800">매출</div><div style="font-size:36px;font-weight:800;margin-top:6px">1,240,000</div></div>
      <div id="oN" class="ob" data-diegetic><div style="font-size:230px;font-weight:900;color:#5A3A1E;opacity:.88">3</div></div>
    </div>
    <div id="dim" class="dim"></div>
    <div id="lg" class="nm lab">글</div><div id="lr" class="nm lab">숫자</div><div id="ln" class="nm lab">시간</div>
  </div>
</div>
<script src="../data/s25.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#171C21', '#E7EAEC', '#F05A28'];
window.DEVICES = ['빛 세 물건'];
const T = { geul: S.at('글,'), num: S.at('숫자'), time: S.at('시간'), same: S.at('똑같이'), split: S.at('갈려요') };
document.getElementById('ph').style.backgroundImage = S.ph('n25_counter_three_objects');
// 사진 속 세 물건 네 점(사진 1536x1024 좌표, 왼위·오위·오아래·왼아래)
const QM = [[233, 296], [506, 298], [477, 666], [196, 664]];       // 메뉴판 앞면
const QR = [[790, 580], [965, 600], [900, 742], [702, 724]];       // 영수증 납작한 면
const QN = [[1143, 395], [1452, 402], [1445, 672], [1148, 662]];   // 번호표 둥근 면
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const fit = (id, q) => {
  const el = document.getElementById(id);
  const w = Math.round((dist(q[0], q[1]) + dist(q[3], q[2])) / 2 * 1.25), h = Math.round((dist(q[0], q[3]) + dist(q[1], q[2])) / 2 * 1.25);
  el.style.width = w + 'px'; el.style.height = h + 'px'; S.fitQuad(el, w, h, q);
};
fit('oM', QM); fit('oR', QR); fit('oN', QN);
// 둥근 빛 구멍(화면 좌표 = 사진 ×1.25, 위 100 잘림) — 물건 하나에 구멍 하나(x, y, rx, ry, 투명 끝 %)
const SPOT = [[456, 512, 440, 470, 62], [1031, 703, 380, 240, 62], [1624, 628, 360, 400, 62]];
const T2 = { shop: S.at('가게가') };
[['lg', 456], ['lr', 1031], ['ln', 1624]].forEach(([id, x]) => { const e = document.getElementById(id); e.style.left = x + 'px'; e.style.top = '860px'; });
S.ev(T.geul, 'click', 'dim'); S.ev(T.num, 'shine', 'dim'); S.ev(T.time, 'click', 'dim'); S.ev(T.same, 'in', 'all'); S.ev(T.split, 'card_in', 'names'); S.ev(T2.shop, 'shine', 'dim');
S.scene(tau => {
  S.css('#cam', { transform: `scale(${(1 + 0.05 * S.P(tau, 0, S.SC.dur)).toFixed(4)})` });
  // 빛: 글 → 메뉴판 · 숫자 → 영수증 · 시간 → 번호표 · 똑같이 → 셋 다 밝아짐
  // 빛 하나만 구멍(글 → 메뉴판 · 숫자 → 영수증 · 시간 → 번호표), 똑같이에 전부 밝게, 가게가에 다시 어두워졌다가 0.15초 간격으로 차례로 켜짐
  const E1 = (t0, d) => S.EO(S.P(tau, t0, t0 + d));
  const lit = [E1(T.geul, 0.2) * (1 - E1(T.num, 0.2)), E1(T.num, 0.2) * (1 - E1(T.time, 0.2)), E1(T.time, 0.2) * (1 - E1(T.same, 0.3))];
  const rampA = E1(T.geul, 0.2) * (1 - E1(T.same, 0.3)), rampB = E1(T2.shop - 0.1, 0.1);
  const D = Math.max(rampA, rampB);
  const a = lit.map((v, i) => Math.max(v, E1(T2.shop + 0.15 * i, 0.15)));
  const m = SPOT.map(([x, y, rx, ry, pc], i) => `radial-gradient(ellipse ${rx}px ${ry}px at ${x}px ${y}px,rgba(0,0,0,${(1 - a[i]).toFixed(3)}) ${pc}%,#000 100%)`).join(',');
  S.css('#dim', { opacity: (0.86 * D).toFixed(3), webkitMaskImage: m, maskImage: m });
  // 이름표 셋(갈려요)
  ['lg', 'lr', 'ln'].forEach((id, i) => { const k = S.ent(tau, T.split + 0.08 * i, 0.12); S.css('#' + id, { opacity: k, transform: `translate(-50%,${((1 - k) * 14).toFixed(1)}px)` }); });
});
</script>
</body></html>
