<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s41 그 한 줄이 번졌다 — 어두운 책상 위 기울인 리뷰 목록이 위로 흘러 오르고, 같은 말이 든 리뷰마다 주홍 형광 · 세는 숫자 3 → 27</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#wrap{left:0;top:0;width:1920px;height:1080px;perspective:2400px}
#app{left:430px;top:36px;width:700px;height:880px;transform-origin:50% 50%}
#app .hd{position:relative;z-index:3;background:#fff}
#lst{position:absolute;left:0;top:64px;width:700px}
.rv{height:150px;padding:18px 30px 0;border-bottom:1px solid #EEF0F1;box-sizing:border-box}
.rv .a{display:flex;align-items:center;gap:12px}
.rv .a .av{width:40px;height:40px;font-size:20px}
.rv .a .n{font-size:28px;font-weight:800}
.rv .a .s{font-size:26px;color:#F2A33A;letter-spacing:2px;margin-left:auto}
.rv .t{margin-top:12px;font-size:36px;font-weight:600;line-height:1.3;white-space:nowrap}
.hk{background-repeat:no-repeat;background-position:0 100%;background-image:linear-gradient(transparent 42%,rgba(240,90,40,.55) 42%);background-size:0% 100%}
#lab{position:absolute;left:1240px;top:300px;font-size:46px;color:#E7EAEC;text-shadow:0 3px 14px rgba(0,0,0,.6);white-space:nowrap;opacity:0}
#num{position:absolute;left:1236px;top:370px;font-size:220px;line-height:1;color:#fff;text-shadow:0 8px 30px rgba(0,0,0,.65);opacity:0}
</style></head>
<body><div id="stage">
  <div class="bg tex-dark"></div>
  <div id="wrap" class="abs">
    <div id="app" class="app" data-box="app"><div class="hd">리뷰</div><div id="lst"></div></div>
  </div>
  <div id="lab" class="lab" data-box="lab">기름</div>
  <div id="num" class="blk" data-box="num">3</div>
</div>
<script src="../data/s41.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#171C21', '#F05A28', '#FFFFFF'];
window.DEVICES = ['R10 세는 숫자'];
const T = { rv: S.at('리뷰에'), oil: S.at('기름이'), up: S.at('늘었어요') };
const RV = [
  ['김', '김**', '양이 많아요'], ['박', '박**', '친절해요'], ['이', '이**', '{기름이 덜해서 좋아요}'], ['최', '최**', '주차가 편해요'],
  ['정', '정**', '{기름이 덜해서 깔끔해요}'], ['한', '한**', '국물이 진해요'], ['조', '조**', '{기름기가 덜해서 부담 없어요}'], ['윤', '윤**', '포장이 깔끔해요'],
  ['장', '장**', '{기름이 덜해서 좋아요}'], ['서', '서**', '점심에 가기 좋아요'], ['문', '문**', '{기름기가 덜해서 부담 없어요}'], ['강', '강**', '또 올게요']
];
S.$('#lst').innerHTML = RV.map((r, i) => `<div class="rv"><div class="a"><div class="av">${r[0]}</div><div class="n">${r[1]}</div><div class="s">★★★★★</div></div><div class="t">${r[2].replace(/\{(.*)\}/, '<span class="hk" id="hk' + i + '">$1</span>')}</div></div>`).join('');
// 흐름: 처음엔 느리게, «리뷰에» 부터 빠르게 (px)
const ROW = 150, TRIG = 760;
const scroll = tau => 30 * Math.min(Math.max(tau, 0), T.rv) + 125 * Math.max(0, Math.min(tau, S.SC.dur + 1) - T.rv);
function crossing(i) { const c0 = ROW * i + ROW / 2; for (let t = 0; t < 20; t += 0.01) if (c0 - scroll(t) < TRIG) return t; return 99; }
const OIL = RV.map((r, i) => (r[2][0] === '{' ? i : -1)).filter(i => i >= 0);
const HT = OIL.map((i, k) => Math.max(T.oil + 0.15 * k, crossing(i)));
S.ev(-0.05, 'in', 'app'); S.ev(T.oil, 'marker', 'hk2'); S.ev(T.up, 'gauge', 'num');
// 10-20 효과음 채움 — 기름 말이 든 리뷰마다 주홍 형광이 그어지는 순간(첫 줄은 기존 계기)
HT.forEach((t, k) => { if (Math.abs(t - T.oil) > 0.3 && t < S.SC.dur - 0.5) S.ev(t, 'marker', 'f_hk' + k); });
S.scene(tau => {
  const a = S.ent(tau, -0.15, 0.14), dr = S.P(tau, 0, S.SC.dur);
  S.css('#app', { opacity: a, transform: `rotateX(${(3 - 1 * dr).toFixed(2)}deg) rotateZ(${(-2.5 + 1 * dr).toFixed(2)}deg) translateY(${((1 - a) * 40).toFixed(1)}px)` });
  S.css('#lst', { transform: `translateY(${(-scroll(tau)).toFixed(1)}px)` });
  OIL.forEach((i, k) => { S.$('#hk' + i).style.backgroundSize = (100 * S.EO(S.P(tau, HT[k], HT[k] + 0.35))).toFixed(1) + '% 100%'; });
  const l = S.ent(tau, T.oil, 0.14);
  S.css('#lab', { opacity: l, transform: `translateY(${((1 - l) * 14).toFixed(1)}px)` });
  S.css('#num', { opacity: l, transform: `translateY(${((1 - l) * 14).toFixed(1)}px)` });
  S.$('#num').textContent = String(Math.round(S.count(tau, T.up, T.up + 1.4, 3, 27)));
});
</script>
</body></html>
