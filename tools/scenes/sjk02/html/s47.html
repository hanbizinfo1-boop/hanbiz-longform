<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s47 매출은 괜찮은데 왜 통장에 돈이 없지 — 어두운 책상 위 기울인 은행 앱: 입금(청록 형광) → 출금(주홍 숫자) · 잔액에 동그라미</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
.row3{position:absolute;left:0;top:0;width:1920px;height:1080px;perspective:2400px}
#bk{left:610px;top:95px;width:700px;height:810px;transform-origin:50% 55%}
#bal{position:absolute;left:30px;right:30px;top:84px;height:160px;background:#242B32;border:1px solid #2C343C;border-radius:14px}
#bal b{position:absolute;left:26px;top:14px;font-size:24px;color:#A3ACB4;font-weight:700}
#bv{position:absolute;left:26px;top:60px;font-size:84px;font-weight:900;color:#ECEEEF;line-height:1.1;white-space:nowrap}
#lst{position:absolute;left:0;right:0;top:258px;height:530px;overflow:hidden}
.it{height:75px;display:flex;align-items:center;gap:14px;padding:0 30px;border-bottom:1px solid #262D34;opacity:0}
.it .d{font-size:26px;width:76px;color:#8E979F;font-weight:600;width:76px}
.it .tt{font-size:28px;font-weight:700;flex:1;white-space:nowrap}
.it .am{font-size:30px;font-weight:800;white-space:nowrap;text-align:right}
.it .hl{position:absolute;left:12px;right:12px;height:64px;border-radius:8px;background:rgba(31,181,150,.24);opacity:0}
#cs{position:absolute;left:0;top:0;pointer-events:none}
</style></head>
<body><div id="stage">
  <div class="bg tex-dark"></div>
  <div class="row3"><div id="bk" class="app" data-box="bk"><div class="hd">내 통장</div>
    <div id="bal"><b>잔액</b><div id="bv">312,400원</div></div>
    <div id="lst"></div>
    <svg id="cs" width="700" height="810" viewBox="0 0 700 810"><path id="circ" d="M0 0" fill="none" stroke="#F0602A" stroke-width="9" stroke-linecap="round"/></svg>
  </div></div>
</div>
<script src="../data/s47.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#171C21', '#1FA39A', '#F05A28'];
window.DEVICES = ['실제 화면(통장)'];
const T = { most: S.at('제일 많이'), sale: S.at('매출은'), bank: S.at('통장에'), none: S.at('없지') };
const IT = [
  ['10.1', '카드 매출 정산', '+1,284,000', 1], ['10.2', '배달 정산', '+846,000', 1], ['10.3', '식자재', '-1,120,000', 0], ['10.5', '월세', '-2,300,000', 0],
  ['10.8', '인건비', '-1,850,000', 0], ['10.12', '배달 수수료', '-214,000', 0], ['10.15', '가스', '-186,000', 0]
];
S.$('#lst').innerHTML = IT.map((r, i) => `<div class="it" id="it${i}" style="position:relative"><div class="hl" id="hl${i}" style="top:6px"></div><div class="d">${r[0]}</div><div class="tt">${r[1]}</div><div class="am" id="am${i}">${r[2]}</div></div>`).join('');
const INC = IT.map((r, i) => (r[3] ? i : -1)).filter(i => i >= 0), OUT = IT.map((r, i) => (r[3] ? -1 : i)).filter(i => i >= 0);
S.ev(0.03, 'in', 'bk'); S.ev(0.2, 'card_in', 'lst'); S.ev(T.sale, 'marker', 'hl0'); S.ev(T.bank, 'no', 'am2'); S.ev(T.none - 0.1, 'marker', 'circ');
// 10-22 동그라미: 잔액 숫자(#bv)의 실제 상자에서 계산 — 글자 사방 여백 10~16px, 숫자 전체를 감쌈
let CIRC = false;
function fitCircle() {
  const bal = S.$('#bal'), bv = S.$('#bv');
  const gw = bv.offsetWidth, gh = 76;                                   // 글 폭 · 숫자 높이(84px 글의 자획 높이)
  const cx = bal.offsetLeft + 1 + bv.offsetLeft + gw / 2, cy = bal.offsetTop + 1 + bv.offsetTop + bv.offsetHeight / 2 + 6;
  const rx = (gw / 2 + 12) * 1.2, ry = (gh / 2 + 10) * 1.3;
  const pts = []; const th0 = -2.3, N = 72;
  for (let i = 0; i <= N; i++) { const u = i / N * 1.1, th = th0 + u * 2 * Math.PI, k = 1 + 0.05 * (u - 0.5); pts.push([cx + rx * k * Math.cos(th), cy + ry * k * Math.sin(th)]); }
  S.$('#circ').setAttribute('d', 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L'));
  S.$('#circ')._len = 0; CIRC = true;
}
S.scene(tau => {
  if (!CIRC) fitCircle();
  const k = S.ent(tau, 0.0, 0.16), dr = S.P(tau, 0, S.SC.dur);
  S.css('#bk', { opacity: k, transform: `rotateX(${(6 - 1.5 * dr).toFixed(2)}deg) rotateZ(${(-3 + 0.8 * dr).toFixed(2)}deg) translateY(${((1 - k) * 36).toFixed(1)}px)` });
  // 내역 줄: «제일 많이» 부터 한 줄씩
  IT.forEach((r, i) => { const e = S.ent(tau, i < 4 ? 0.2 + 0.1 * i : T.most - 0.1 + 0.15 * i, 0.12); S.css('#it' + i, { opacity: e, transform: `translateX(${((1 - e) * 24).toFixed(1)}px)` }); });
  // 입금 줄: 청록 옅은 형광이 차례로
  INC.forEach((i, n) => { S.$('#hl' + i).style.opacity = S.EO(S.P(tau, T.sale + 0.15 * n, T.sale + 0.15 * n + 0.2)); });
  // 출금 줄: 주홍 숫자로
  OUT.forEach((i, n) => { const c = S.EO(S.P(tau, T.bank + 0.1 * n, T.bank + 0.1 * n + 0.2)); S.$('#am' + i).style.color = c > 0.5 ? '#F0602A' : '#ECEEEF'; });
  E.stroke('#circ', tau, T.none - 0.1, 0.5);
});
</script>
</body></html>
