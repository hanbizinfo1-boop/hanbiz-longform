<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s51 5분이면 끝 — 계산대 영수증 위 휴대폰 카메라 화면 → 사진이 대화창 첨부 칸으로</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#rig{position:absolute;left:0;top:0;width:1920px;height:1080px}
#ph{position:absolute;left:0;top:-100px;width:1920px;height:1280px;background:url("../../../../소재/sjk02/codex/d51_phone_receipt_clean.png") center/100% 100% no-repeat}
#scr{position:absolute;left:0;top:0;width:360px;height:784px;background:#0C0F12;overflow:hidden;border-radius:18px}
#vf{position:absolute;left:0;top:0;width:360px;height:650px;overflow:hidden;background:#20262B}
#vfrc{position:absolute;left:30px;top:-60px;width:300px;height:900px;background:#F4F5F4;font-family:"Pre";color:#232A30}
#vfrc .it{position:absolute;left:18px;right:18px;height:30px;display:flex;justify-content:space-between;font-size:21px;font-weight:600;white-space:nowrap}
#vfrc .it.hd2{font-size:22px;font-weight:800;letter-spacing:.1em;color:#59636B}
#vfrc .it.sum{font-size:25px;font-weight:900}
#vfrc .rl{position:absolute;left:18px;right:18px;height:3px;background:#232A30}
.br{position:absolute;width:44px;height:44px;border:5px solid #fff;opacity:0}
#scan{position:absolute;left:30px;width:300px;height:5px;background:#43C9BF;border-radius:3px;opacity:0;box-shadow:0 0 18px #43C9BF}
#shut{position:absolute;left:130px;top:672px;width:100px;height:100px;border-radius:50%;border:7px solid #fff;display:flex;align-items:center;justify-content:center}
#shut i{width:68px;height:68px;border-radius:50%;background:#fff;display:block}
#thumb{position:absolute;left:0;top:0;width:150px;height:200px;background:#F4F5F4;border-radius:8px;box-shadow:0 14px 30px rgba(0,0,0,.4);opacity:0;overflow:hidden}
#thumb .it{position:absolute;left:12px;right:12px;height:18px;display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:#232A30;white-space:nowrap;font-family:"Pre"}
#dk{left:1200px;top:300px;width:600px;height:480px;transform-origin:50% 50%}
#dk .cv{bottom:110px}
#dk .ai{font-size:32px}
#dk .tb{font-size:26px}
#dk .tb .md{font-size:28px}
#dk .tb .tab{font-size:26px}
#dk .in{font-size:28px;height:70px;border-radius:35px}
#dk .att{position:absolute;left:5%;bottom:104px;width:180px;height:80px;border:3px dashed #43C9BF;border-radius:12px;opacity:0;display:flex;align-items:center;justify-content:center;color:#43C9BF;font-size:30px;font-weight:700}
</style></head>
<body><div id="stage">
  <div class="bg tex-dark"></div>
  <div id="rig">
    <div id="ph"></div>
    <div id="scr">
      <div id="vf"><div id="vfrc" data-diegetic></div>
        <div class="br" id="b0" style="left:44px;top:60px;border-right:0;border-bottom:0"></div><div class="br" id="b1" style="right:44px;top:60px;border-left:0;border-bottom:0"></div>
        <div class="br" id="b2" style="left:44px;bottom:60px;border-right:0;border-top:0"></div><div class="br" id="b3" style="right:44px;bottom:60px;border-left:0;border-top:0"></div>
        <div id="scan"></div></div>
      <div id="shut"><i id="shi"></i></div>
    </div>
  </div>
  <div id="thumb"></div>
  <div id="dk" class="dk" data-box="dk">
    <div class="tb"><span class="md"><i></i>AI</span><span class="tab">새 대화</span></div>
    <div class="cv"><div class="col"><div class="ai"><div class="av">AI</div><div class="tx">영수증을 올려 주세요.</div></div></div></div>
    <div class="att" id="att">영수증</div>
    <div class="in">메시지를 입력하세요<span class="send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="#171C21" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
  </div>
</div>
<script src="../data/s51.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#14191E', '#1FA39A', '#E7EAEC'];
window.DEVICES = ['실제 화면'];
// 사진 속 휴대폰 화면(quads.json d51 stage — 값 복사). 사진 d51 이 올라오면 값을 채운다.
const Q0 = [[648.3, -50.7], [1038.2, 38.4], [849.0, 866.2], [459.1, 777.1]];   // quads.json d51_phone_receipt stage
const qc = Q0.reduce((a, p) => [a[0] + p[0] / 4, a[1] + p[1] / 4], [0, 0]);
S.fitQuad(S.$('#scr'), 360, 784, Q0.map(p => [qc[0] + (p[0] - qc[0]) * 0.985, qc[1] + (p[1] - qc[1]) * 0.985]));
// 뷰파인더 속 영수증(HTML) — 줄 막대
const rc = S.$('#vfrc');
const RCT = [['배추 3망', '27,000'], ['대파 2단', '8,000'], ['돼지 사골 20kg', '96,000']];
let h = '<div class="it hd2" style="top:250px"><span>○○국밥</span></div>';
RCT.forEach((r, i) => { h += `<div class="it" style="top:${322 + i * 64}px"><span>${r[0]}</span><span>${r[1]}</span></div>`; });
h += '<div class="rl" style="top:524px"></div><div class="it sum" style="top:546px"><span>합계</span><span>131,000</span></div>';
rc.innerHTML = h;
const th = S.$('#thumb'); let h2 = '';
RCT.forEach((r, i) => { h2 += `<div class="it" style="top:${50 + i * 26}px"><span>${r[0]}</span><span>${r[1]}</span></div>`; });
h2 += '<div class="it" style="top:136px;font-size:12px"><span>합계</span><span>131,000</span></div>';
th.innerHTML = '';
const T = { five: S.at('5분'), xl: S.at('엑셀'), hard: S.at('귀찮으시면'), rc: S.at('영수증'), shot: S.at('찍어서'), put: S.at('넣어도') };
const cx = qc[0], cy = qc[1];
S.focus([{ t0: T.five, t1: T.five + 1.1, big: '5분', color: 'te' }]);
S.ev(T.xl, 'marker', 'brackets'); S.ev(T.hard - 0.05, 'in', 'dk'); S.ev(T.rc, 'marker', 'scan'); S.ev(T.shot, 'click', 'shut'); S.ev(T.put, 'sweep', 'thumb');
S.scene(tau => {
  const dr = S.P(tau, 0, S.SC.dur);
  S.css('#rig', { transform: `translate(${-30 * dr}px,0)` });
  // 영수증 천천히 흘러감 → «엑셀» 에 초점 괄호 4개가 모임
  const bk = S.ent(tau, T.xl, 0.18);
  S.css('#vfrc', { transform: `translateY(${-30 * S.EIO(S.P(tau, 0, T.rc))}px) scale(${1 + 0.1 * bk})` });
  ['b0', 'b1', 'b2', 'b3'].forEach((id, i) => S.css('#' + id, { opacity: bk, transform: `translate(${(i % 2 ? -1 : 1) * (1 - bk) * 40}px,${(i < 2 ? 1 : -1) * (1 - bk) * 40}px)` }));
  // 스캔 선(영수증 위를 위→아래)
  const sp = S.P(tau, T.rc, T.rc + 0.55);
  S.css('#scan', { opacity: sp > 0 && sp < 1 ? 1 : 0, top: (20 + 500 * S.EIO(sp)) + 'px' });
  // 셔터 눌림
  const pk = S.ent(tau, T.shot, 0.08) - S.ent(tau, T.shot + 0.16, 0.12);
  S.css('#shi', { transform: `scale(${1 - 0.22 * pk})` });
  // 대화창 들어옴(화면 오른쪽 가운데, 기울인 판)
  const dk = S.ent(tau, T.hard - 0.05, 0.25);
  S.css('#dk', { opacity: dk, transform: `perspective(2200px) rotateX(5deg) rotateZ(2deg) translateX(${(1 - dk) * 120}px)` });
  S.css('#att', { opacity: S.ent(tau, T.hard + 0.3, 0.12) });
  // 찍은 사진이 작아지며 첨부 칸으로 날아감(곡선)
  const fp = S.cam(tau, T.put, T.put + 0.55);
  const sx = cx - 75, sy = cy - 100, ex = 1200 + 600 * 0.05 + 6, ey = 300 + 480 - 104 - 80 + 2;
  const x = S.lerp(sx, ex, fp), y = S.lerp(sy, ey, fp) - Math.sin(fp * Math.PI) * 110, sc = S.lerp(1.1, 0.46, fp);
  const vis = tau >= T.shot + 0.05 ? 1 : 0;
  S.css('#thumb', { opacity: vis * (fp < 1 ? 1 : 0), transform: `translate(${x}px,${y}px) scale(${sc})`, transformOrigin: '0 0' });
  const landed = S.ent(tau, T.put + 0.55, 0.1);
  S.css('#att', { background: `rgba(31,163,154,${0.28 * landed})`, borderStyle: landed > 0.5 ? 'solid' : 'dashed' });
});
</script>
</body></html>
