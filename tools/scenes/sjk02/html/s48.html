<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s48 매출은 매일 보이고 수익은 한 달 뒤 — 영수증 띠를 따라 옆으로 가고, «한 달» 에 숫자 이름표 30일 하나 · 늦은 때 회색 동그라미</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#cw{left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#ph{left:0;top:-100px;width:1920px;height:1280px;background-size:100% 100%}
#sv{position:absolute;left:0;top:0}
#d30{position:absolute;left:150px;top:760px;font-size:140px;line-height:1;color:#fff;text-shadow:0 8px 28px rgba(0,0,0,.75);white-space:nowrap;opacity:0}
</style></head>
<body><div id="stage">
  <div id="cw" class="abs">
    <div id="ph" class="photo abs"></div>
    <svg id="sv" width="1920" height="1080" viewBox="0 0 1920 1080">
      <path id="ridge" d="M60 700 C 400 640, 700 560, 1000 480 S 1400 410, 1590 392" fill="none" stroke="#E4E6E3" stroke-width="7" stroke-dasharray="4 18" stroke-linecap="round"/>
      <path id="circ" d="M1520 330 C 1560 250, 1760 245, 1840 300 C 1900 350, 1850 420, 1740 428 C 1620 435, 1520 410, 1520 340 C 1525 300, 1560 270, 1600 258" fill="none" stroke="#B7BCC1" stroke-width="9" stroke-linecap="round"/>
    </svg>
  </div>
  <div id="d30" class="blk" data-box="d30">30일</div>
</div>
<script src="../data/s48.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#D9DBD6', '#1F2A33', '#9AA0A6'];
window.DEVICES = ['숫자 이름표(30일)'];
S.$('#ph').style.backgroundImage = S.ph('p48_receipts_row');
const T = { daily: S.at('매일'), easy: S.at('보기가'), month: S.at('한 달'), cam: S.at('낼 때쯤'), late: S.at('늦은') };
S.ev(T.daily, 'marker', 'ridge'); S.ev(T.easy, 'in', 'cw'); S.ev(T.month, 'card_in', 'd30'); S.ev(T.late - 0.05, 'marker', 'circ');
const KEYS = [{ t: 0, s: 1.0, x: 960, y: 540 }, { t: T.easy, s: 1.12, x: 1080, y: 500, d: 0.9 }, { t: T.cam, s: 1.3, x: 1200, y: 430, d: 1.2 }];
// 10-20 효과음 채움 — «낼 때쯤» 에 카메라가 오른쪽 위로 크게 다가감
S.ev(T.cam, 'sweep', 'f_push');
S.scene(tau => {
  const c = S.camState(tau, KEYS, 1.2);
  S.css('#cw', { transform: S.camCss({ s: c.s * (1 + 0.015 * S.P(tau, 0, T.easy)), x: c.x, y: c.y }) });
  E.stroke('#ridge', tau, T.daily, 1.1);
  S.css('#ridge', { opacity: tau >= T.daily ? 1 - 0.5 * S.P(tau, T.cam, T.cam + 1) : 0 });
  const b = S.ent(tau, T.month, 0.14);
  S.css('#d30', { opacity: b, transform: `translateY(${((1 - b) * 20).toFixed(1)}px)` });
  E.stroke('#circ', tau, T.late - 0.05, 0.5);
});
</script>
</body></html>
