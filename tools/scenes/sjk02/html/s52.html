<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s52 음, 그렇군 — 콘크리트 위 손가락 아이레벨, 답 한 줄과 두 갈래 칩, 가운데 물음표</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#pw{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:50% 50%}
#hm{left:80px;top:96px;width:520px;height:110px;font-size:84px;color:#D3D6D9;line-height:1;text-shadow:0 3px 14px rgba(0,0,0,.7)}
#hmw{position:absolute;left:0;top:0;white-space:nowrap}
#hmu{position:absolute;left:0;top:0;width:520px;height:110px}
#dk{left:1230px;top:80px;width:620px;height:330px;transform-origin:50% 50%}
#dk .cv{bottom:96px;padding:18px 0}
#dk .me{font-size:22px;padding:12px 18px}
#dk .ai{font-size:26px}
#dk .dots{display:flex;gap:10px;padding-top:12px}#dk .dots i{width:12px;height:12px;border-radius:50%;background:#8C959C}
.cp{position:absolute;padding:14px 30px;border-radius:14px;background:#F4F5F3;color:#1F2A33;font-weight:800;font-size:40px;white-space:nowrap;box-shadow:0 14px 30px rgba(20,25,30,.3)}
#cL{left:330px;top:470px}#cR{left:1240px;top:470px}
#q{left:905px;top:610px;width:130px;height:130px;border-radius:50%;background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;font-size:90px;font-weight:900;box-shadow:0 16px 36px rgba(240,90,40,.45)}
</style></head>
<body><div id="stage">
  <div class="bg tex-conc"></div>
  <div id="pw"><div id="ph" class="photo" style="left:0;top:0;width:1920px;height:1080px"></div></div>
  <div id="hm" class="abs hand" data-box="hm"><div id="hmw">음, 그렇군</div><svg id="hmu" viewBox="0 0 520 110"><path id="hmp" d="M0 62 L520 62" stroke="#D3D6D9" stroke-width="7" fill="none" stroke-linecap="round"/></svg></div>
  <div id="dk" class="dk" data-box="dk">
    <div class="tb"><span class="md"><i></i>AI</span><span class="tab">새 대화</span></div>
    <div class="cv"><div class="col">
      <div class="me" id="me">지난주보다 뭐가 늘었는지 한 줄로 알려 줘.</div>
      <div class="ai"><div class="av">AI</div><div class="tx"><div class="dots" id="dots"><i></i><i></i><i></i></div><div id="ans"></div></div></div>
    </div></div>
    <div class="in">메시지를 입력하세요<span class="send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="#171C21" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
  </div>
  <div id="cL" class="cp" data-box="cL">배달 줄이기</div><div id="cR" class="cp" data-box="cR">가격 올리기</div>
  <div id="q" class="abs" data-box="q">?</div>
</div>
<script src="../data/s52.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#D9DBD6', '#1F2A33', '#1FA39A', '#F05A28'];
S.$('#ph').style.backgroundImage = S.ph('p52_finger_hesitate');
const ANS = '배달앱 수수료가 지난주보다 늘었어요';
const T = { hm: S.at('그렇군'), no: S.at('절대'), boss: S.at('대표님이'), ai: S.at('AI가'), ans: S.at('배달앱'), lL: S.at('배달을'), lR: S.at('가격을'), q: S.at('누가') };
const pL = S.$('#hmp'), len = pL.getTotalLength();
S.ev(T.hm, 'marker', 'hm'); S.ev(T.no, 'no', 'hm'); S.ev(T.boss, 'msg_in', 'dk'); S.ev(T.ans + 0.1, 'type', 'ans');
S.ev(T.lL, 'card_in', 'cL'); S.ev(T.lR, 'card_in', 'cR'); S.ev(T.q, 'shine', 'q');
S.scene(tau => {
  // 사진: 아이레벨 정지 — 아주 느린 옆 흐름
  S.css('#pw', { transform: S.track(tau, -0.2, S.SC.dur, 10, -26, 1.1) });
  // 손글씨: 그렇군 → 절대 안 돼요 에 탈색·가로줄
  const w = S.P(tau, T.hm, T.hm + 0.5);
  S.css('#hmw', { clipPath: `inset(0 ${(1 - S.EO(w)) * 100}% 0 0)` });
  const u = S.EO(S.P(tau, T.no, T.no + 0.28));
  S.$('#hmp').style.strokeDasharray = len; S.$('#hmp').style.strokeDashoffset = len * (1 - u);
  S.css('#hm', { display: tau < T.hm - 0.05 ? 'none' : 'block', opacity: 1 - 0.55 * S.ent(tau, T.no + 0.25, 0.2), filter: `grayscale(${S.ent(tau, T.no, 0.2)})` });
  // 대화창: 대표님이 물어보고 나서 들어옴 → AI 점 → 답 타자
  const dk = S.ent(tau, T.boss, 0.14);
  S.css('#dk', { opacity: dk, transform: `perspective(2200px) rotateX(${6 - 2 * S.P(tau, T.boss, S.SC.dur)}deg) rotateZ(-2deg) translateY(${(1 - dk) * -36}px)` });
  const di = Math.floor(tau / 0.3) % 3;
  document.querySelectorAll('#dots i').forEach((e, k) => e.style.opacity = k <= di ? 1 : 0.3);
  S.css('#dots', { display: tau < T.ans ? 'flex' : 'none' });
  S.type('#ans', ANS, tau, T.ans + 0.1, 21, false);
  // 두 칩: 두 갈래 — 같은 높이 왼 오른쪽에 하나씩
  [['cL', T.lL, -40], ['cR', T.lR, 40]].forEach(c => { const k = S.ent(tau, c[1], 0.12); S.css('#' + c[0], { opacity: k, transform: `translateX(${(1 - k) * c[2]}px)` }); });
  const qk = S.ent(tau, T.q, 0.14);
  S.css('#q', { opacity: qk, transform: `scale(${0.7 + 0.3 * qk})` });
});
</script>
</body></html>
