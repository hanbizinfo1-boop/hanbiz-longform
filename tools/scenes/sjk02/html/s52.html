<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s52 음, 그렇군 — 손가락 아이레벨 사진 오른쪽에 대화창 답 한 줄과 두 선택 버튼, 커서가 멈춤</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#pw{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:50% 50%}
#dk{left:900px;top:60px;width:960px;height:520px;transform-origin:50% 50%}
#dk .cv{bottom:96px;padding:18px 0}
#dk .me{font-size:32px;padding:14px 22px}
#dk .ai{font-size:34px}#dk .tb,#dk .tb .tab{font-size:26px}#dk .in{height:76px;font-size:30px}#dk .cv{bottom:110px}
#dk .dots{display:flex;gap:10px;padding-top:12px}#dk .dots i{width:12px;height:12px;border-radius:50%;background:#8C959C}
.btn{position:absolute;top:640px;width:440px;height:104px;border-radius:22px;background:#fff;color:#1F2A33;font-weight:800;font-size:42px;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 30px rgba(10,14,18,.42),0 2px 6px rgba(10,14,18,.3)}
#bL{left:940px}#bR{left:1400px}
#cur{position:absolute;left:0;top:0;width:54px;height:66px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
</style></head>
<body><div id="stage">
  <div id="pw"><div id="ph" class="photo" style="left:0;top:0;width:1920px;height:1080px"></div></div>
  <div id="dk" class="dk" data-box="dk">
    <div class="tb"><span class="md"><i></i>AI</span><span class="tab">새 대화</span></div>
    <div class="cv"><div class="col">
      <div class="me" id="me">지난주보다 뭐가 늘었는지 한 줄로 알려 줘.</div>
      <div class="ai"><div class="av">AI</div><div class="tx"><div class="dots" id="dots"><i></i><i></i><i></i></div><div id="ans"></div></div></div>
    </div></div>
    <div class="in">메시지를 입력하세요<span class="send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="#171C21" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
  </div>
  <div id="bL" class="btn" data-box="bL">배달 줄이기</div><div id="bR" class="btn" data-box="bR">가격 올리기</div>
  <svg id="cur" viewBox="0 0 27 33"><path d="M2 2 L2 26 L8.5 20.5 L13 30.5 L17.5 28.5 L13 18.5 L22 18.5 Z" fill="#fff" stroke="#14191E" stroke-width="2.2" stroke-linejoin="round"/></svg>
</div>
<script src="../data/s52.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#2E343A', '#1FA39A', '#FFFFFF'];
window.DEVICES = ['손가락 사진 + 대화창'];
S.$('#ph').style.backgroundImage = S.ph('p52_finger_hesitate');
const ANS = '배달앱 수수료가 지난주보다 15만 원 늘었어요.';
const T = { push: S.at('그렇군'), boss: S.at('대표님이'), ans: S.at('배달앱'), lL: S.at('배달을'), lR: S.at('가격을'), q: S.at('누가') };
S.ev(T.boss, 'in', 'dk'); S.ev(T.ans, 'msg_in', 'ans'); S.ev(T.lL, 'card_in', 'bL'); S.ev(T.lR + 0.05, 'card_in', 'bR');
// 10-20 효과음 채움 — «그렇군» 에 손가락 쪽으로 사진이 다가감 · AI 답이 써지는 중
S.ev(T.push, 'sweep', 'f_push'); S.ev(T.ans + 0.4, 'type', 'f_ans');
S.scene(tau => {
  // 사진: 아이레벨 — «그렇군» 에 손가락 쪽으로 한 번 다가가고 이어서 아주 느린 흐름
  const p = S.cam(tau, T.push, T.push + 0.5), dr = S.P(tau, T.push + 0.5, S.SC.dur);
  S.css('#pw', { transform: `translateX(${S.lerp(8, -26, dr).toFixed(1)}px) scale(${(S.lerp(1.08, 1.2, p) + 0.04 * dr).toFixed(4)})` });
  // 대화창: 대표님이 물어보고 나서 들어옴 → AI 점 → 답이 한 줄로 나옴
  const dk = S.ent(tau, T.boss, 0.14);
  S.css('#dk', { opacity: dk, transform: `perspective(2200px) rotateX(${6 - 2 * S.P(tau, T.boss, S.SC.dur)}deg) rotateZ(-2deg) translateY(${(1 - dk) * -36}px)` });
  const di = Math.floor(tau / 0.3) % 3;
  document.querySelectorAll('#dots i').forEach((e, k) => e.style.opacity = k <= di ? 1 : 0.3);
  S.css('#dots', { display: tau < T.ans ? 'flex' : 'none' });
  S.type('#ans', ANS, tau, T.ans, 21, false);
  // 선택 버튼 둘: 대화창 아래
  [['bL', T.lL, -30], ['bR', T.lR + 0.05, 30]].forEach(c => { const k = S.ent(tau, c[1], 0.12); S.css('#' + c[0], { opacity: k, transform: `translateY(${((1 - k) * 22).toFixed(1)}px)` }); });
  // 커서: «누가 정해요» 에 두 버튼 사이로 와서 멈춤(누르지 않음)
  const ck = S.cam(tau, T.q, T.q + 0.5);
  S.css('#cur', { opacity: S.ent(tau, T.q, 0.1), transform: `translate(${S.lerp(1780, 1370, ck).toFixed(1)}px,${S.lerp(900, 700, ck).toFixed(1)}px)` });
});
</script>
</body></html>
