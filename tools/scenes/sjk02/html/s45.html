<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s45 3천만 원 탑에서 비용이 하나씩 빠진다 — 블렌더 나무 블록 탑(스테인리스 계산대), 빠진 블록은 회색 막대 줄, 남는 건 주홍 한 칸</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
/* 10-19 다시 만들기(R3 Economist 은유 기계 · 연출설계 «폭포 차트»를 3D 로): 그림은 블렌더(tower.py), 숫자·이름표만 html 이 proj.js 좌표에 얹는다 */
#bl{position:absolute;left:0;top:0;width:1920px;height:1080px}
#cnt{position:absolute;left:0;top:0;display:flex;align-items:baseline;gap:8px;padding:12px 24px 14px;border-radius:12px;background:#1F2A33;color:#fff;
  box-shadow:0 0 0 3px rgba(255,255,255,.9),0 16px 36px rgba(10,14,18,.45);white-space:nowrap;transform-origin:50% 100%}
#cnt b{font-family:"Pre";font-weight:900;font-size:64px;letter-spacing:-.02em;line-height:1}
#cnt i{font-style:normal;font-family:"Pre";font-weight:700;font-size:30px;opacity:.85}
#cnt.or{background:#F05A28}
.tg{position:absolute;left:0;top:0;padding:6px 14px 8px;border-radius:10px;background:#1A1F25;border:1px solid #2C343C;color:#C3CAD0;font-family:"Pre";font-weight:800;font-size:36px;white-space:nowrap;
  box-shadow:0 10px 22px rgba(10,14,18,.35);transform-origin:50% 100%}
</style></head>
<body><div id="stage">
  <img id="bl" alt="">
  <div id="cnt" data-t9-ok><b id="cv">3,000</b><i>만</i></div>
  <div id="tg0" class="tg">재료비</div><div id="tg1" class="tg">월세</div><div id="tg2" class="tg">인건비</div><div id="tg3" class="tg">수수료</div><div id="tg4" class="tg">광고·전기·가스</div>
</div>
<script src="../data/s45.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../../../../_tmp/sjk02/blender/s45/proj.js"></script>
<script>
window.PALETTE = ['#B9BEC2', '#1F2A33', '#F05A28'];   // 스테인리스·나무 블록 + 먹 글 + 주홍(남는 한 칸) — 빠지는 것은 회색
window.DEVICES = ['R3 은유 기계(블렌더)', 'R10 숫자 카운트'];
const T = { sum: S.at('3천만'), r1: S.at('재료비'), r2: S.at('월세'), r3: S.at('인건비'), r4: S.at('수수료에'), r5: S.at('광고비'), r6: S.at('전기세'), r7: S.at('가스비'), all: S.at('빠져요') };
// 빠질 때마다 탑 위 숫자(만 원): 3,000 → 재료비 1,050 · 월세 300 · 인건비 750 · 수수료 300 · 광고비 120 · 전기 90 · 가스 90 → 300
const STEP = [[T.r1, 1950], [T.r2, 1650], [T.r3, 900], [T.r4, 600], [T.r5, 480], [T.r6, 390], [T.r7, 300]];
const TAG = [['tg0', '재료비', T.r1], ['tg1', '월세', T.r2], ['tg2', '인건비', T.r3], ['tg3', '수수료', T.r4], ['tg4', '광고비', T.r5]];
S.ev(0.30, 'card_in', 'tower');
S.ev(T.sum, 'gauge', 'cnt');
[[T.r1, 'no'], [T.r2, 'card_in'], [T.r3, 'no'], [T.r4, 'card_in'], [T.r5, 'no'], [T.r7, 'card_in']].forEach(([t, r], i) => S.ev(t + 0.05, r, 'pull' + i));
S.ev(T.r7 + 0.95, 'shine', 'profit');
function place(el, p, dy, k) {
  if (!p) { el.style.opacity = 0; return; }
  const w = el.offsetWidth, h = el.offsetHeight;
  el.style.opacity = k;
  el.style.transform = `translate(${(p[0] - w / 2).toFixed(1)}px,${(p[1] - h - dy + (1 - k) * 12).toFixed(1)}px)`;
}
// 10-20 효과음 채움 — «숫자만» 에 카메라가 탑 아래로 내려감
S.ev(S.at('숫자만') - 0.1, 'sweep', 'f_dive');
S.scene(async tau => {
  await S.bl('#bl', 's45', tau);
  // 탑 위 숫자: «3천만»에 뜨고, 빠질 때마다 0.5초 동안 내려 셈
  let v = 3000;
  for (const [t, to] of STEP) { if (tau < t + 0.2) break; const k = S.EO(S.P(tau, t + 0.2, t + 0.65)); v = Math.round(S.lerp(v, to, k)); if (k < 1) break; }
  const cv = S.$('#cv'); const s = S.fmt(v); if (cv.textContent !== s) cv.textContent = s;
  const cnt = S.$('#cnt');
  cnt.classList.toggle('or', tau >= T.r7 + 0.9);
  place(cnt, S.proj('top', tau), 26, S.ent(tau, T.sum, 0.14));
  TAG.forEach(([id, , t], i) => {
    // 광고·전기·가스는 한 자리에 쌓임 → 이름표는 그때 맨 위 블록을 따라감
    const pile = tau < T.r6 + 0.55 ? 'b_광고비' : tau < T.r7 + 0.55 ? 'b_전기세' : 'b_가스비';
    const name = ['b_재료비', 'b_월세', 'b_인건비', 'b_수수료', pile][i];
    place(S.$('#' + id), S.proj(name, tau), 18, S.ent(tau, t + 0.55, 0.12));
  });
});
</script>
</body></html>
