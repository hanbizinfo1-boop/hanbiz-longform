<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s64 석 달 — 점심 지난 홀, 옆으로 흐르며 대표님 뒷모습에 30분</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#w{left:-40px;top:-170px;width:2150px;height:1433px}
#ph{left:0;top:0;width:2150px;height:1433px}
.ck{opacity:0}
/* 10-20 «가생이 칩» 걷어 냄 → 대표님 머리 옆 시계 고리: 30분 = 반 바퀴가 돌아감 */
#tm{left:520px;top:280px;width:190px;height:190px;opacity:0}
#tm .dk{position:absolute;inset:22px;border-radius:50%;background:#1F2A33;box-shadow:0 14px 30px rgba(10,14,18,.45)}
#tm svg{position:absolute;inset:0}
#tm .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Pre";font-weight:900;font-size:46px;color:#fff;letter-spacing:-.02em}
#pn{left:1220px;top:170px;width:540px;height:440px;opacity:0}
#pn .hd{height:84px;font-size:46px;padding:0 30px;font-weight:700;letter-spacing:.06em}
.vb{position:absolute;bottom:84px;width:80px;border-radius:10px 10px 0 0}
#gb{position:absolute;bottom:84px;left:370px;width:110px;border-radius:10px 10px 0 0;background:#5E6670}
.cl{position:absolute;bottom:14px;font-size:46px;font-weight:700;color:#A3ACB4;white-space:nowrap}
</style></head>
<body><div id="stage">
  <div id="w" class="abs"><div id="ph" class="photo abs"></div>
    <div id="tm" class="abs ck" data-box="tm"><div class="dk"></div>
      <svg viewBox="0 0 190 190"><circle cx="95" cy="95" r="84" fill="none" stroke="rgba(255,255,255,.92)" stroke-width="12"/>
        <circle id="tma" cx="95" cy="95" r="84" fill="none" stroke="#F05A28" stroke-width="12" stroke-linecap="round" transform="rotate(-90 95 95)" stroke-dasharray="0 528"/></svg>
      <div class="v">30분</div></div>
  </div>
  <div id="pn" class="app" data-box="pn">
    <div class="hd">다시 온 손님</div>
    <div id="b1" class="vb" style="left:40px;background:#F05A28;height:0"></div>
    <div id="b2" class="vb" style="left:140px;background:#F05A28;height:0"></div>
    <div id="b3" class="vb" style="left:240px;background:#F05A28;height:0"></div>
    <div id="gb"></div><div class="cl" style="left:352px">광고비</div>
  </div>
</div>
<script src="../data/s64.js"></script>
<script src="../lib/sjk.js"></script>
<script src="_e6.js"></script>
<script>
window.PALETTE = ['#D9DBD6', '#F05A28', '#1FA39A'];
window.DEVICES = ['(기존) 홀 사진 + 그래프'];
S.$('#ph').style.backgroundImage = S.ph('p64_hall_wide');
E.svg('#w', 2150, 1433, '<ellipse id="rg" cx="1254" cy="633" rx="210" ry="420" fill="none" stroke="#F0602A" stroke-width="9"/>');
const T = { r1: S.at('리뷰'), r2: S.at('소식'), r3: S.at('AI로'), r4: S.at('아낀'), c30: S.at('30분씩'), rg: S.at('인사만'), st: S.at('석'), pn: S.at('다시') + 0.35, ad: S.at('광고비는') };
S.focus([{ t0: T.st, t1: T.st + 1.1, big: '석 달', color: 'or' }]);
S.ev(T.c30, 'card_in', 'tm'); S.ev(T.c30 + 0.25, 'gauge', 'tma');
S.ev(T.rg, 'marker', 'rg'); S.ev(T.pn, 'gauge', 'pn'); S.ev(T.ad, 'no', 'gb');
const H = [110, 170, 240];
// 10-20 효과음 채움 — «리뷰» «아낀» 에 카메라가 한 걸음 더 나아감
S.ev(T.r1, 'sweep', 'f_step'); S.ev(T.r4, 'sweep', 'f_step');
S.scene(tau => {
  // 옆으로 흐르며 «리뷰» «AI로» «아낀 시간에» 에 한 걸음씩 더 가고, 뒤는 아주 느린 흐름
  const stp = -40 * S.cam(tau, T.r1, T.r1 + 0.5) - 45 * S.cam(tau, T.r3, T.r3 + 0.5) - 45 * S.cam(tau, T.r4, T.r4 + 0.5) - 60 * S.EIO(S.P(tau, T.c30, S.SC.dur));
  S.css('#w', { left: (-40 + stp) + 'px' });
  // 시계 고리: 뜨고 → 주홍 호가 반 바퀴(30분) 돌고 → «석 달» 부각 전에 빠짐
  const tk = S.ent(tau, T.c30, 0.14) * (1 - S.ent(tau, T.st - 0.25, 0.2));
  S.css('#tm', { opacity: tk.toFixed(3), transform: `scale(${(0.86 + 0.14 * S.ent(tau, T.c30, 0.14)).toFixed(3)})` });
  S.$('#tma').setAttribute('stroke-dasharray', `${(264 * S.EIO(S.P(tau, T.c30 + 0.25, T.c30 + 1.1))).toFixed(1)} 528`);
  const rg = S.$('#rg'); E.stroke(rg, tau, T.rg, 0.5);
  E.in('#pn', tau, T.pn, { dy: 16 });
  [0, 1, 2].forEach(i => { S.$('#b' + (i + 1)).style.height = (H[i] * S.EO(S.P(tau, T.pn + 0.1 + i * 0.18, T.pn + 0.5 + i * 0.18))) + 'px'; });
  S.$('#gb').style.height = (250 - 180 * S.EO(S.P(tau, T.ad, T.ad + 0.5))) + 'px';
});
</script>
</body></html>
