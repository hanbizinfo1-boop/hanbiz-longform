<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s64 석 달 — 점심 지난 홀, 옆으로 흐르며 대표님 뒷모습에 30분</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#w{left:-40px;top:-170px;width:2150px;height:1433px}
#ph{left:0;top:0;width:2150px;height:1433px}
.ck{opacity:0}
#pn{left:1390px;top:70px;width:470px;height:330px;opacity:0}
#pn .hd{height:60px;font-size:24px;padding:0 22px;font-weight:700;letter-spacing:.06em}
.vb{position:absolute;bottom:34px;width:60px;border-radius:10px 10px 0 0}
#gb{position:absolute;bottom:34px;left:330px;width:80px;border-radius:10px 10px 0 0;background:#9AA0A6}
.cl{position:absolute;bottom:4px;font-size:22px;font-weight:700;color:#59636B;white-space:nowrap}
</style></head>
<body><div id="stage">
  <div id="w" class="abs"><div id="ph" class="photo abs"></div>
    <div id="c30" class="chip or ck" data-box="c30" style="left:1110px;top:230px">30분 · 테이블 인사</div>
  </div>
  <div id="r1" class="chip gr ck" data-box="r1" style="left:70px;top:64px">리뷰</div>
  <div id="r2" class="chip gr ck" data-box="r2" style="left:190px;top:64px">소식</div>
  <div id="r3" class="chip te ck" data-box="r3" style="left:310px;top:64px">= AI</div>
  <div id="r4" class="chip te ck" data-box="r4" style="left:70px;top:146px">아낀 시간</div>
  <div id="pn" class="app" data-box="pn">
    <div class="hd">다시 온 손님</div>
    <div id="b1" class="vb" style="left:44px;background:#F05A28;height:0"></div>
    <div id="b2" class="vb" style="left:124px;background:#F05A28;height:0"></div>
    <div id="b3" class="vb" style="left:204px;background:#F05A28;height:0"></div>
    <div id="gb"></div><div class="cl" style="left:312px">광고비</div>
  </div>
</div>
<script src="../data/s64.js"></script>
<script src="../lib/sjk.js"></script>
<script src="_e6.js"></script>
<script>
window.PALETTE = ['#D9DBD6', '#F05A28', '#1FA39A'];
S.$('#ph').style.backgroundImage = S.ph('p64_hall_wide');
E.svg('#w', 2150, 1433, '<ellipse id="rg" cx="1302" cy="720" rx="150" ry="330" fill="none" stroke="#F05A28" stroke-width="9"/>');
const T = { r1: S.at('리뷰'), r2: S.at('소식'), r3: S.at('AI로'), r4: S.at('아낀'), c30: S.at('30분씩'), rg: S.at('인사만'), st: S.at('석'), pn: S.at('다시') + 0.35, ad: S.at('광고비는') };
S.focus([{ t0: T.st, t1: T.st + 1.1, big: '석 달', color: 'or' }]);
S.ev(T.r1, 'card_in', 'r1'); S.ev(T.r2, 'msg_in', 'r2'); S.ev(T.r3, 'card_in', 'r3'); S.ev(T.r4, 'msg_in', 'r4'); S.ev(T.c30, 'card_in', 'c30');
S.ev(T.rg, 'marker', 'rg'); S.ev(T.pn, 'gauge', 'pn'); S.ev(T.ad, 'no', 'gb');
const H = [90, 140, 200];
S.scene(tau => {
  S.css('#w', { left: E.pan(tau, -0.2, S.SC.dur, -40, -240) + 'px' });
  E.in('#r1', tau, T.r1, { dy: -12 }); E.in('#r2', tau, T.r2, { dy: -12 }); E.in('#r3', tau, T.r3, { dy: -12 }); E.in('#r4', tau, T.r4, { dy: -12 });
  E.in('#c30', tau, T.c30);
  const rg = S.$('#rg'); E.stroke(rg, tau, T.rg, 0.5);
  E.in('#pn', tau, T.pn, { dy: 16 });
  [0, 1, 2].forEach(i => { S.$('#b' + (i + 1)).style.height = (H[i] * S.EO(S.P(tau, T.pn + 0.1 + i * 0.18, T.pn + 0.5 + i * 0.18))) + 'px'; });
  S.$('#gb').style.height = (170 - 120 * S.EO(S.P(tau, T.ad, T.ad + 0.5))) + 'px';
});
</script>
</body></html>
