<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s70 정리 — 같은 국자 여러 개가 회색, 손이 잡은 국자만 빛(스포트라이트) + 큰 글 «사람» 붓 밑줄(R7)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#ph{position:absolute;left:0;top:-100px;width:1920px;height:1280px;background-size:100% 100%;background-repeat:no-repeat}
.big{position:absolute;font-family:"Pre";font-weight:900;color:#fff;letter-spacing:-.03em;line-height:1.05;text-shadow:0 6px 30px rgba(0,0,0,.65);white-space:nowrap}
.brush{fill:none;stroke:#F05A28;stroke-linecap:round;stroke-linejoin:round}
.full{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
</style></head>
<body><div id="stage">
  <div id="cam">
    <div id="ph"></div>
    <svg class="full"><defs><filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
      <mask id="m" maskUnits="userSpaceOnUse" x="-800" y="-800" width="3600" height="2700"><rect x="-800" y="-800" width="3600" height="2700" fill="#fff"/><ellipse id="hole" cx="1290" cy="520" rx="260" ry="340" fill="#000" filter="url(#bl)"/></mask>
      <radialGradient id="gl"><stop offset="0" stop-color="#FF8A5B" stop-opacity=".55"/><stop offset="1" stop-color="#FF8A5B" stop-opacity="0"/></radialGradient></defs>
      <rect id="dim" x="-800" y="-800" width="3600" height="2700" fill="rgba(6,9,12,0)" mask="url(#m)"/>
      <g style="mix-blend-mode:screen"><ellipse id="glow" cx="1280" cy="560" rx="260" ry="330" fill="url(#gl)" opacity="0"/></g></svg>
  </div>
  <div id="big" class="big" data-box="big" style="left:760px;top:230px;font-size:220px">사람</div>
  <svg class="full"><path id="brush" class="brush" d="M740 480 C 880 462, 1020 468, 1160 478" stroke-width="26" opacity=".95"/></svg>
</div>
<script src="../data/s70.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#2B3036', '#FFFFFF', '#F05A28'];
window.DEVICES = ['R7 스포트라이트 + 큰 글'];
S.$('#ph').style.backgroundImage = S.ph('n70_ladles_wall');
const T = { gr: S.at('누구나'), sp: S.at('차이는'), big: S.at('대표님한테서') };
const brush = S.$('#brush'), BL = brush.getTotalLength(); brush.style.strokeDasharray = BL;
S.ev(T.gr, 'no', 'ph'); S.ev(T.sp, 'shine', 'glow'); S.ev(T.big, 'in', 'big'); S.ev(T.big + 0.4, 'marker', 'brush');
S.scene(tau => {
  // 카메라: 국자 줄을 따라 옆으로 천천히 → «차이는» 에 손 쪽으로 다가감
  const a = S.EIO(S.P(tau, -0.2, T.sp)), z = S.cam(tau, T.sp, T.sp + 0.6);
  S.$('#cam').style.transform = S.camCss({ s: S.lerp(1.1, 1.22, z) + 0.03 * a, x: S.lerp(S.lerp(880, 1040, a), 1130, z), y: S.lerp(520, 560, z) });
  // «누구나 똑같이» — 국자 전부 회색으로 빠짐
  const g = S.EIO(S.P(tau, T.gr, T.gr + 0.6));
  S.$('#ph').style.filter = `saturate(${(1.5 * (1 - g)).toFixed(3)}) contrast(${(1.05 - 0.1 * g).toFixed(3)}) brightness(${(1 + 0.04 * g).toFixed(3)})`;
  // «차이는» — 둘레가 어두워지고 손이 잡은 국자만 빛
  const sp = S.EO(S.P(tau, T.sp, T.sp + 0.5));
  S.$('#dim').setAttribute('fill', `rgba(6,9,12,${(0.74 * sp).toFixed(3)})`);
  S.$('#glow').setAttribute('opacity', sp.toFixed(3));
  S.$('#hole').setAttribute('rx', S.lerp(520, 250, sp).toFixed(1)); S.$('#hole').setAttribute('ry', S.lerp(620, 330, sp).toFixed(1));
  // 큰 글 «사람» + 주홍 붓 밑줄
  const b = S.ent(tau, T.big, 0.16);
  S.css('#big', { opacity: b, transform: `translateY(${((1 - b) * 26).toFixed(1)}px)` });
  const u = S.EO(S.P(tau, T.big + 0.4, T.big + 0.8));
  brush.style.strokeDashoffset = BL * (1 - u); brush.style.opacity = tau >= T.big + 0.4 ? 0.95 : 0;
});
</script>
</body></html>
