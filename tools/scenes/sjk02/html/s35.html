<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s35 그냥 이렇게 시키시면 돼요 — 어두운 탁자 위 기울인 큰 다크 대화창, 대표님 말투 프롬프트</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#wrap{left:0;top:0;width:1920px;height:1080px;perspective:2400px}
#dk{left:240px;top:44px;width:1440px;height:880px;transform-origin:50% 55%}
#dk .tb{height:64px;font-size:25px}
#dk .tb .md{font-size:27px}
#dk .cv{top:64px;display:flex;flex-direction:column;justify-content:flex-end}
#dk .col{width:88%}
#dk .me{font-size:38px;line-height:1.5;max-width:78%}
#dk .ai{font-size:38px}
#dk .ai .av{width:46px;height:46px;font-size:22px}
#dk .in{font-size:33px;left:4%;right:4%}
#dk .in.tall{height:338px;align-items:flex-start;border-radius:34px;padding:22px 34px}
#dk .in .ph{font-size:30px}
#dk .in .send{width:50px;height:50px;align-self:flex-end}
.ln{min-height:51px}
.sk.big{height:22px;border-radius:11px;margin:15px 0}
#mkx{background:linear-gradient(transparent 52%,rgba(255,122,77,.42) 52%);background-repeat:no-repeat;background-size:0% 100%}
.hk{background-repeat:no-repeat;background-position:0 100%;background-image:linear-gradient(transparent 40%,rgba(255,122,77,.45) 40%)}
</style></head>
<body><div id="stage">
  <div class="bg tex-dark"></div>
  <div id="wrap" class="abs">
    <div id="dk" class="dk" data-box="dk">
      <div class="tb"><span class="md"><i></i>AI</span><span class="tab">새 대화</span></div>
      <div class="cv"><div class="col" id="col"></div></div>
      <div class="in tall" id="inb"><span class="tx" id="inx"></span><span class="send" id="snd"></span></div>
    </div>
  </div>
</div>
<script src="../data/s35.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e3.js"></script>
<script>
window.PALETTE = ['#1D2328', '#FF7A4D', '#43C9BF'];   // 어두운 탁자 · 대화창 글 · 대표님 말(주홍) · AI 가 붙인 말(청록)
const T = { in: -0.05, send: S.at('이러면'), bars: Math.max(S.at('글은 AI가'), S.at('이러면') + 0.6), bar3: S.at('쓰는데'), or: Math.max(S.at('글은 AI가'), S.at('이러면') + 0.6) + 0.3, mk: S.at('목소리는') };
window.DEVICES = ['실제 대화창(대표님 말투)'];
const P = [
  { t: '내가 손님한테 자주 하는 말\n', c: '', t0: 1.595, t1: 2.879 },
  { t: '세 개 적어 줄게.\n', c: '', t0: 3.079, t1: 3.774 },
  { t: '이 말투를 그대로 살려서\n', c: '', t0: 3.941, t1: 5.224 },
  { t: '메뉴 설명 써 줘.\n', c: '', t0: 5.344, t1: 6.174 },
  { t: '내 말은 고치지 말고\n', c: '', t0: 6.366, t1: 7.388 },
  { t: '앞뒤만 붙여 줘.', c: '', t0: 7.548, t1: 8.514 }
];
const ANS = '오늘도 새벽부터 끓였습니다. {or|이거 오늘 아침에 들어온 거예요.} 배추와 무는 {or|이건 우리 어머니가 하던 방식이에요.} 그대로 손질해요. {or|새벽 5시에 불 올려서 점심 전에 딱 한 솥만 끓여.}';
const AP = []; { let last = 0, m; const re = /\{or\|([^}]*)\}/g; const parts = [];
  while ((m = re.exec(ANS))) { if (m.index > last) parts.push(['te', ANS.slice(last, m.index)]); parts.push(['or', m[1]]); last = re.lastIndex; }
  if (last < ANS.length) parts.push(['te', ANS.slice(last)]);
  const tot = parts.reduce((a, p) => a + [...p[1]].length, 0); let acc = 0;
  parts.forEach(p => { const n = [...p[1]].length; AP.push({ t: p[1], c: p[0], f0: acc / tot, f1: (acc + n) / tot }); acc += n; }); }
S.$('#snd').innerHTML = E3.SEND;
S.ev(0, 'in', 'dk'); S.ev(P[0].t0, 'type', 'inx'); S.ev(T.send, 'msg_in', 'col'); S.ev(T.bars, 'card_in', 'rep');
S.ev(T.bars + 0.1, 'type', 'rep'); S.ev(T.mk, 'marker', 'mkx');
const PREV = '<div class="me">가게 소개 한 줄 써 줘</div><div class="ai"><div class="av">AI</div><div class="tx">정성을 다해 끓인 따뜻한 국밥 한 그릇으로 여러분을 기다립니다.</div></div>';
S.scene(tau => {
  const k = S.ent(tau, T.in, 0.12), dr = S.P(tau, 0, S.SC.dur);
  S.css('#dk', { opacity: k, transform: `rotateX(${6 - 1.5 * dr}deg) rotateZ(${-2 + 0.6 * dr}deg) translateY(${((1 - k) * 26).toFixed(1)}px)` });
  const sent = tau >= T.send;
  S.$('#inb').style.height = sent ? '74px' : '338px';
  S.$('#inb').style.alignItems = sent ? 'center' : 'flex-start';
  S.$('#dk').querySelector('.cv').style.bottom = sent ? '118px' : '362px';
  const ty = E3.typed(tau, P);
  S.$('#inx').innerHTML = sent ? '<span class="ph">메시지 보내기</span>' : (ty.started ? ty.html : '<span class="ph">메시지 보내기</span>');
  let h = sent ? '' : PREV;
  if (sent) h += '<div class="me">' + E3.typed(99, P, false).html + '</div>';
  if (tau >= T.bars - 0.02) {
    const TT = T.mk - 0.25 - T.bars;
    const o = E3.typed(tau, AP.map(p => ({ t: p.t, c: p.c, t0: T.bars + TT * p.f0, t1: T.bars + TT * p.f1 })), false);
    const mk = S.EO(S.P(tau, T.mk, T.mk + 0.6));
    const html = o.html.split('<span class="or">').join('<span class="or hk" style="background-size:' + (100 * mk).toFixed(1) + '% 100%">');
    h += '<div class="ai" id="rep"><div class="av">AI</div><div class="tx">' + html + '</div></div>';
  }
  S.$('#col').innerHTML = h;
});
</script>
</body></html>
