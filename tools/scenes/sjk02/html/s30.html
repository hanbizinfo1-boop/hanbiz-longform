<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s30 B 가게는 딱 한 줄을 같이 넣었어요 — 같은 사진·층에서 초점이 뒤 솥(B)으로 옮겨 감 · 대화창에 한 줄 넣어 시킴</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#world{left:0;top:0;width:1920px;height:1080px;transform-origin:50% 50%}
.pl{left:0;top:0;width:1920px;height:1080px;background-image:url("../../../../소재/sjk02/codex/p29_two_pots.png");transform:scale(1.04)}
#pBase{filter:blur(8px) saturate(.75) brightness(.92)}
#pBack{clip-path:polygon(562px 331px,650px 312px,875px 306px,1125px 319px,1181px 337px,1181px 650px,1125px 700px,600px 700px,569px 600px)}
#pFront{clip-path:polygon(819px 513px,950px 477px,1375px 465px,1750px 488px,1869px 550px,1875px 700px,1838px 850px,1825px 1180px,700px 1180px,700px 975px,863px 975px,900px 600px)}
.lt{position:absolute;font-family:"Pre";font-weight:900;line-height:1;letter-spacing:-.04em;color:#fff;text-shadow:0 12px 40px rgba(0,0,0,.45)}
#lA{left:1360px;top:200px;font-size:320px}
#lB{left:770px;top:112px;font-size:230px}
#dkw{left:60px;top:330px;width:760px;height:550px}
#dkw .ai,#dkw .me{font-size:28px}
#dkw .cv{display:flex;flex-direction:column;justify-content:flex-end}
#dkw .in{font-size:26px}
.hk{background-repeat:no-repeat;background-position:0 100%;background-image:linear-gradient(transparent 38%,rgba(240,90,40,.6) 38%)}
</style></head>
<body><div id="stage">
  <div id="world" class="abs">
    <div id="pBase" class="photo pl"></div>
    <div id="lB" class="lt">B</div>
    <div id="pBack" class="photo pl"></div>
    <div id="lA" class="lt">A</div>
    <div id="pFront" class="photo pl"></div>
  </div>
  <div id="dkw" class="dk abs" data-box="dkw"><div class="tb"><span class="md"><i></i>AI</span><span class="tab">새 대화</span></div>
    <div class="cv" id="cv"><div class="col" id="col"></div></div>
    <div class="in tall" id="inb"><span class="tx" id="inx"></span><span class="send" id="snd"></span></div>
  </div>
</div>
<script src="../data/s30.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e3.js"></script>
<script>
window.PALETTE = ['#3A4E66', '#F05A28', '#E7EAEC'];
window.DEVICES = ['R6 초점 옮기기 ②'];
window.CONTINUES = 's29';   // s29 와 같은 층·같은 사진에서 초점만 뒤 솥으로(3차 시안 ③) — 검사기 T5·T8 이어 찍기
const T = {
  focus: S.at('B 가게는'), foc: S.at('딱 한 줄을') + 0.3, send: S.at('그랬더니'), mk: S.at('새벽', 1),
  p1: S.at('우리는'), p2: S.at('점심 전에'), p3: S.at('이 말 꼭'), p4: S.at('메뉴 설명 써 줘')
};
const P = [
  { t: '우리는 새벽 5시에 불 올려서\n', c: 'or', t0: T.p1, t1: T.p2 - 0.12 },
  { t: '점심 전에 딱 한 솥만 끓여.\n', c: 'or', t0: T.p2, t1: T.p3 - 0.2 },
  { t: '이 말 꼭 넣어서\n', c: '', t0: T.p3, t1: T.p4 - 0.04 },
  { t: '메뉴 설명 써 줘.', c: '', t0: T.p4, t1: T.send - 0.2 }
];
const SENDT = T.send + 0.1, REP0 = T.send + 0.5;
const REPLY = '새벽 5시에 불 올려서 점심 전에 딱 한 솥만 끓입니다.', HL = '새벽 5시에 불 올려서'.length;
S.$('#snd').innerHTML = E3.SEND;
S.ev(T.focus, 'in', 'pBack'); S.ev(T.focus + 0.3, 'click', 'lB'); S.ev(T.foc, 'card_in', 'inb'); S.ev(T.p1, 'type', 'inx');
S.ev(SENDT, 'msg_in', 'col'); S.ev(T.mk, 'marker', 'col');
const HAI = '<div class="ai"><div class="av">AI</div><div class="tx">정성을 다해 끓인 따뜻한 국밥 한 그릇으로 여러분을 기다립니다.</div></div>';
const HIST = '<div class="me">가게 소개 한 줄 써 줘</div>' + HAI;
const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
// 10-20 효과음 채움 — 프롬프트 둘째·셋째 줄이 써지기 시작
S.ev(T.p2, 'type', 'f_inx'); S.ev(T.p3, 'type', 'f_inx');
S.scene(tau => {
  const dr = S.P(tau, 0, S.SC.dur);
  S.css('#world', { transform: `scale(${(1.03 + 0.03 * dr).toFixed(4)}) translateX(${(-10 * dr).toFixed(2)}px)` });
  // 초점이 뒤 솥으로: 앞 솥·A 는 흐려지며 회색, 뒤 솥·B 는 또렷 + B 주홍
  const f = S.EO(S.P(tau, T.focus, T.focus + 0.5));
  S.css('#pBack', { filter: `blur(${(9 * (1 - f)).toFixed(2)}px) saturate(${(0.8 + 0.05 * f).toFixed(3)})` });
  S.css('#pFront', { filter: `blur(${(10 * f).toFixed(2)}px) saturate(${(0.85 - 0.5 * f).toFixed(3)})` });
  const cB = mix([255, 255, 255], [240, 90, 40], S.EO(S.P(tau, T.focus + 0.3, T.focus + 0.55)));
  S.css('#lB', { opacity: S.lerp(0.5, 1, f), filter: `blur(${(7 * (1 - f)).toFixed(2)}px)`, color: `rgb(${cB})` });
  const cA = mix([255, 255, 255], [201, 205, 209], f);
  S.css('#lA', { opacity: S.lerp(1, 0.45, f), filter: `blur(${(8 * f).toFixed(2)}px)`, color: `rgb(${cA})` });
  // 대화창(처음부터 읽히는 기록) → 입력 포커스 → 한 줄 타자 → 보내기 → 답
  const sent = tau >= SENDT;
  const ty = E3.typed(tau, P, tau >= T.foc);
  const inb = S.$('#inb');
  inb.style.borderColor = tau >= T.foc && !sent ? 'rgba(67,201,191,.8)' : '#333B42';
  S.$('#inx').innerHTML = sent ? '<span class="ph">메시지 보내기</span>' : (ty.started ? ty.html : (tau >= T.foc ? '<span class="caret"></span>' : '<span class="ph">메시지 보내기</span>'));
  S.$('#cv').style.bottom = (18 + inb.offsetHeight + 16) + 'px';
  let h = sent ? HAI : HIST;
  if (sent) h += '<div class="me">' + E3.typed(99, P, false).html.replace(/<br>/g, ' ') + '</div>';
  if (tau >= REP0) {
    const n = Math.floor(S.clamp((tau - REP0) * 11, 0, REPLY.length)), arr = [...REPLY].slice(0, n);
    const hp = S.EO(S.P(tau, T.mk, T.mk + 0.5));
    const a = arr.slice(0, HL).join(''), b = arr.slice(HL).join('');
    const hl = `<span class="hk" style="background-size:${(hp * 100).toFixed(1)}% 100%">${S.esc(a)}</span>`;
    h += '<div class="ai"><div class="av">AI</div><div class="tx">' + hl + S.esc(b) + (n < REPLY.length ? '<span class="caret"></span>' : '') + '</div></div>';
  }
  S.$('#col').innerHTML = h;
});
</script>
</body></html>
