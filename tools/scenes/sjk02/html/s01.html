<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s01 요즘 상가 거리 한번 걸어 보세요 — 첫 5초: 셔터 슬랫 매크로 → 간판에 거리 숏 컷(간판 선·셔터 탈색·옆 흐름)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
.shot{left:0;top:0;width:1920px;height:1080px;overflow:hidden}
#in{background-size:3430px auto;background-repeat:no-repeat;background-position:-736px -690px;filter:brightness(.7) saturate(.8)}
#cur{left:0;top:-100px;width:1920px;height:1138px;background-size:1920px 1280px;background-repeat:no-repeat;background-position:0 0;box-shadow:0 34px 60px rgba(0,0,0,.65);filter:saturate(.85) contrast(1.03)}
#flr{left:0;top:1037px;width:1920px;height:143px;background-size:1920px 1280px;background-repeat:no-repeat;background-position:0 -1137px;filter:saturate(.8)}
#w3{left:-60px;top:-200px;width:2300px;height:1533px}
#sg{left:0;top:0;width:2300px;height:1533px;filter:drop-shadow(0 3px 6px rgba(10,14,18,.55))}
.st{position:absolute;top:0;height:1533px;overflow:hidden}
.st .im{position:absolute;top:0;width:2300px;height:1533px;background-size:2300px 1533px;background-repeat:no-repeat}
.st .gy{filter:grayscale(1) brightness(1.04) contrast(.9)}
</style></head>
<body><div id="stage">
  <div id="s1" class="abs shot">
    <div id="in" class="abs shot"></div>
    <div id="flr" class="abs"></div>
    <div id="cur" class="abs"></div>
  </div>
  <div id="s3" class="abs shot">
    <div id="w3" class="abs"><svg id="sg" class="abs" viewBox="0 0 2300 1533"><polygon id="pg" points="" fill="none" stroke="#fff" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" pathLength="1"/></svg></div>
  </div>
</div>
<script src="../data/s01.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#D9DBD6', '#1F2A33', '#9AA0A6'];
window.DEVICES = ['셔터 탈색'];   // 흐린 낮 사진(낮은 채도) + 회색 = 문 닫은 가게
const T = { walk: S.at('걸어'), sign: S.at('간판은'), same: S.at('그대로'), door: S.at('문', 0), many: S.at('많잖아요') };
// p03 큰 바랜 간판 네 점(사진 1536x1024 → 2300x1533 래퍼, 배율 1.4974)
const K2 = 2300 / 1536, Q = [[885, 258], [1292, 166], [1314, 380], [888, 418]].map(([x, y]) => (x * K2).toFixed(0) + ',' + (y * K2).toFixed(0)).join(' ');
const pg = document.getElementById('pg'); pg.setAttribute('points', Q); pg.style.strokeDasharray = '1 1';
document.getElementById('in').style.backgroundImage = S.ph('p06_shop_front');
document.getElementById('cur').style.backgroundImage = S.ph('p01_shutter_macro');
document.getElementById('flr').style.backgroundImage = S.ph('p01_shutter_macro');
// 둘째 숏(간판~끝): 같은 사진 5개 띠(460px) — 띠마다 색 / 회색 두 겹
const w3 = document.getElementById('w3'), strips = [];
for (let i = 0; i < 5; i++) {
  const st = document.createElement('div'); st.className = 'st'; st.style.left = (i * 460) + 'px'; st.style.width = '460px';
  st.innerHTML = '<div class="im"></div><div class="im gy"></div>';
  st.querySelectorAll('.im').forEach(im => { im.style.left = (-i * 460) + 'px'; im.style.backgroundImage = S.ph('p03_shutter_row'); });
  w3.appendChild(st); strips.push(st.querySelector('.gy'));
}
w3.appendChild(document.getElementById('sg'));   // 간판 선은 띠 위에
S.ev(0.25, 'shutter', 'cur');
S.ev(T.sign + 0.1, 'marker', 'pg');
S.ev(T.door + 0.1, 'no', 'strips');
S.scene(tau => {
  const a = tau < T.sign, c = !a;
  S.css('#s1', { display: a ? 'block' : 'none' }); S.css('#s3', { display: c ? 'block' : 'none' });
  // ① 셔터가 «걸어» 에 탁 내려와 닫힘(0.28초)
  const d = S.EIO(S.P(tau, 0.25, T.walk));
  S.css('#cur', { transform: `translateY(${(-520 * (1 - d)).toFixed(1)}px)` });
  S.css('#in', { filter: `brightness(${(0.7 - 0.45 * d).toFixed(3)}) saturate(.8)` });
  S.css('#s1', { transform: `scale(${(1 + 0.04 * S.P(tau, T.walk, T.sign)).toFixed(4)})` });
  // ② 간판 둘레 선이 그려짐
  pg.style.strokeDashoffset = (1 - S.EO(S.P(tau, T.sign + 0.1, T.sign + 0.65))).toFixed(4);
  // ③ 옆 트래킹(오른→왼) + 띠 5개 차례로 탈색
  S.css('#w3', { left: (-60 - 240 * S.P(tau, T.sign, S.SC.dur + S.SC.post)).toFixed(1) + 'px' });
  strips.forEach((g, i) => { g.style.opacity = S.EO(S.P(tau, T.door + 0.1 + 0.15 * i, T.door + 0.1 + 0.15 * i + 0.3)); });
});
</script>
</body></html>
