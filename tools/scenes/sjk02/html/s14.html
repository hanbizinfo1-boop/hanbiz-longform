<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s14 어디서 많이 본 장면 — 바랜 필름 사진 + 전단 더미에 주홍 동그라미</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#ph{left:-20px;top:-160px;width:2100px;height:1400px}
#pic{left:0;top:0;width:2100px;height:1400px;background-size:2100px 1400px;background-repeat:no-repeat;filter:sepia(.28) saturate(.7) contrast(.96) brightness(1.03)}
#rg{left:0;top:0;width:2100px;height:1400px}
#vg{left:0;top:0;width:1920px;height:1080px;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 52%,rgba(238,228,206,.34) 100%);box-shadow:inset 0 0 160px 40px rgba(236,226,204,.5)}
</style></head>
<body><div id="stage">
  <div id="ph" class="abs">
    <div id="pic" class="abs"></div>
    <svg id="rg" class="abs" viewBox="0 0 2100 1400"><ellipse id="el" cx="813" cy="836" rx="232" ry="150" pathLength="1" fill="none" stroke="#F05A28" stroke-width="9" stroke-linecap="round" transform="rotate(-6 813 836)"/></svg>
  </div>
  <div id="vg" class="abs"></div>
</div>
<script src="../data/s14.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#D9DBD6', '#1F2A33', '#F05A28'];   // 바랜 사진 + 주홍 동그라미 하나(전단 = 손님 주문 창구)
const T = { scene: S.at('본'), app: S.at('배달앱') };
document.getElementById('pic').style.backgroundImage = S.ph('p14_old_counter_film');
const el = document.getElementById('el'); el.style.strokeDasharray = '1 1';
S.ev(T.app, 'marker', 'el');
S.scene(tau => {
  const d = S.P(tau, -S.SC.pre, S.SC.dur);
  S.css('#ph', { left: (-20 - 110 * S.EIO(d)) + 'px' });
  el.style.strokeDashoffset = (1 - S.EO(S.P(tau, T.app, T.app + 0.5))).toFixed(4);
});
</script>
</body></html>
