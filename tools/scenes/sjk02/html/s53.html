<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s53 결정은 대표님 — 52 마지막 화면 그대로 탈색 + 왼쪽 아래 «결정» 밑판</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#base{position:absolute;left:0;top:0;width:1920px;height:1080px}
#pw{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:50% 50%}
#dk{left:1230px;top:80px;width:620px;height:330px}
#dk .cv{bottom:96px;padding:18px 0}
#dk .me{font-size:22px;padding:12px 18px}
#dk .ai{font-size:26px}
.cp{position:absolute;padding:14px 30px;border-radius:14px;background:#F4F5F3;color:#1F2A33;font-weight:800;font-size:40px;white-space:nowrap;box-shadow:0 14px 30px rgba(20,25,30,.3)}
#cL{left:330px;top:470px}#cR{left:1240px;top:470px}
#q{left:905px;top:610px;width:130px;height:130px;border-radius:50%;background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;font-size:90px;font-weight:900}
#lb{left:130px;top:96px}
#plate{left:120px;top:640px;background:var(--or);color:#fff;padding:14px 46px 22px;border-radius:12px;font-size:200px;line-height:1;white-space:nowrap}
#who{left:126px;top:900px;font-size:44px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);letter-spacing:.2em}
</style></head>
<body><div id="stage">
  <div id="base">
    <div class="bg tex-conc"></div>
    <div id="pw"><div id="ph" class="photo" style="left:0;top:0;width:1920px;height:1080px"></div></div>
    <div id="dk" class="dk">
      <div class="tb"><span class="md"><i></i>AI</span><span class="tab">새 대화</span></div>
      <div class="cv"><div class="col"><div class="me">지난주보다 뭐가 늘었는지 한 줄로 알려 줘.</div><div class="ai"><div class="av">AI</div><div class="tx">배달앱 수수료가 지난주보다 늘었어요</div></div></div></div>
      <div class="in">메시지를 입력하세요<span class="send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="#171C21" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
    </div>
    <div id="cL" class="cp">배달 줄이기</div><div id="cR" class="cp">가격 올리기</div>
    <div id="q" class="abs">?</div>
  </div>
  <div id="lb" class="abs chip te" data-box="lb">AI = 숫자</div>
  <div id="plate" class="abs blk" data-box="plate">결정</div>
  <div id="who" class="abs lab" data-box="who">대표님</div>
</div>
<script src="../data/s53.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#D9DBD6', '#1FA39A', '#F05A28'];
S.$('#ph').style.backgroundImage = S.ph('p52_finger_hesitate');
const T = { ai: S.at('AI는'), dec: S.at('결정은') };
S.ev(T.ai + 0.05, 'card_in', 'lb'); S.ev(T.dec, 'shine', 'plate');
S.scene(tau => {
  // 52 의 끝 상태를 그대로 — 전체 흑백(들어오는 전환이 탈색 넘김이라 처음부터 회색)
  S.css('#base', { filter: S.desat(1) });
  S.css('#pw', { transform: S.track(tau, -1, S.SC.dur, -26, -34, 1.1) });
  const k = S.ent(tau, T.ai + 0.05, 0.12);
  S.css('#lb', { opacity: k, transform: `translateY(${(1 - k) * -14}px)` });
  const p = S.ent(tau, T.dec, 0.14);
  S.css('#plate', { opacity: p, transform: `translateX(${(1 - p) * -90}px)` });
  S.css('#who', { opacity: S.ent(tau, T.dec + 0.2, 0.12) });
});
</script>
</body></html>
