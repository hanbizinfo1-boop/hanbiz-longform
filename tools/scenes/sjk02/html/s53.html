<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s53 결정은 대표님 — 어두운 책상, 펜 든 손과 종이 둘 · 오른쪽 종이에만 빛 + 큰 글 «결정» 붓 밑줄(R7)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#ph{position:absolute;left:0;top:-100px;width:1920px;height:1280px;background-size:100% 100%;background-repeat:no-repeat}
.pp{position:absolute;left:0;top:0;width:300px;height:400px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:"Pre";font-weight:900;font-size:68px;line-height:1.25;color:#120E0A;letter-spacing:-.02em}
.full{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible}
.big{position:absolute;font-family:"Pre";font-weight:900;color:#fff;letter-spacing:-.03em;line-height:1.05;text-shadow:0 6px 30px rgba(0,0,0,.6);white-space:nowrap}
.brush{fill:none;stroke:#F05A28;stroke-linecap:round;stroke-linejoin:round}
#ai{position:absolute;left:330px;top:150px;display:flex;align-items:center;gap:22px}   /* 10-20: 구석(90,96) → 왼쪽 종이 위 — 숫자는 AI 가, 결정은 대표님이 */
#ai i{width:76px;height:76px;border-radius:50%;background:#1FA39A;border:5px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-family:"Pre";font-weight:900;font-size:34px;box-shadow:0 8px 20px rgba(0,0,0,.5)}
#ai b{font-family:"Pre";font-weight:900;font-size:64px;color:#fff;text-shadow:0 4px 16px rgba(0,0,0,.7)}
</style></head>
<body><div id="stage">
  <div id="cam">
    <div id="ph"></div>
    <div id="pL" class="pp" data-box="pL">배달<br>줄이기</div>
    <div id="pR" class="pp" data-box="pR">가격<br>올리기</div>
  </div>
  <svg class="full"><defs><filter id="bl"><feGaussianBlur stdDeviation="46"/></filter>
    <mask id="m"><rect width="1920" height="1080" fill="#fff"/><ellipse id="hole" cx="1370" cy="600" rx="330" ry="400" fill="#000" filter="url(#bl)"/></mask>
    <radialGradient id="gl"><stop offset="0" stop-color="#FFC9A0" stop-opacity=".28"/><stop offset="1" stop-color="#FFC9A0" stop-opacity="0"/></radialGradient></defs>
    <rect id="dim" width="1920" height="1080" fill="rgba(6,9,12,.62)" mask="url(#m)"/>
    <g style="mix-blend-mode:screen"><ellipse id="glow" cx="1370" cy="590" rx="320" ry="380" fill="url(#gl)" opacity="0"/></g></svg>
  <div id="ai" data-box="ai"><i>AI</i><b>+15만</b></div>
  <div id="big" class="big" data-box="big" style="left:1020px;top:48px;font-size:210px">결정</div>
  <svg class="full"><path id="brush" class="brush" d="M1010 290 C 1180 272, 1330 278, 1470 288" stroke-width="26" opacity=".95"/></svg>
</div>
<script src="../data/s53.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#2A1D12', '#FFFFFF', '#F05A28'];
window.DEVICES = ['R7 스포트라이트 + 큰 글'];
S.$('#ph').style.backgroundImage = S.ph('n53_hand_pen_two_papers');
// 사진 눈으로 잰 종이 네 점(1536×1024 → 화면: x*1.25, y*1.25-100) — 왼위·오위·오아래·왼아래
const sc = q => q.map(p => [p[0] * 1.25, p[1] * 1.25 - 100]);
S.fitQuad(S.$('#pL'), 300, 400, sc([[381, 314], [723, 335], [620, 727], [203, 684]]));
S.fitQuad(S.$('#pR'), 300, 400, sc([[886, 344], [1266, 368], [1306, 788], [912, 752]]));
S.$("#pR").style.color = "#120E0A";
const T = { dec0: S.at('대표님이'), ai: S.at('AI는'), num: S.at('숫자를'), dec: S.at('결정은') };
const brush = S.$('#brush'), BL = brush.getTotalLength(); brush.style.strokeDasharray = BL;
S.ev(T.dec0, 'shine', 'glow'); S.ev(T.ai + 0.35, 'card_in', 'ai'); S.ev(T.dec, 'shine', 'big'); S.ev(T.dec + 0.45, 'marker', 'brush');
S.scene(tau => {
  // 사진 느린 밀기
  const s = S.lerp(1.0, 1.05, S.P(tau, -0.2, S.SC.dur));
  S.css('#cam', { transform: S.camCss({ s, x: 960, y: 540 }) });
  // 스포트라이트: 처음엔 둘레만 살짝 어둡고, «대표님이 정하시는» 에 오른쪽 종이에 빛이 모임
  const sh = S.EO(S.P(tau, T.dec0, T.dec0 + 0.5));
  S.$('#dim').setAttribute('fill', `rgba(6,9,12,${(0.32 + 0.34 * sh).toFixed(3)})`);
  S.$('#glow').setAttribute('opacity', sh.toFixed(3));
  const hole = S.$('#hole'); hole.setAttribute('rx', (S.lerp(520, 330, sh)).toFixed(1)); hole.setAttribute('ry', (S.lerp(560, 400, sh)).toFixed(1));
  // 왼쪽 종이 위 «AI» + «+15만»
  const k = S.ent(tau, T.ai + 0.3, 0.14);
  S.css('#ai', { opacity: k, transform: `translateX(${((1 - k) * -40).toFixed(1)}px)` });
  // 큰 글 «결정» + 붓 밑줄
  const b = S.ent(tau, T.dec, 0.16);
  S.css('#big', { opacity: b, transform: `translateY(${((1 - b) * 26).toFixed(1)}px)` });
  const u = S.EO(S.P(tau, T.dec + 0.45, T.dec + 0.8));
  brush.style.strokeDashoffset = BL * (1 - u); brush.style.opacity = tau >= T.dec + 0.45 ? 0.95 : 0;
});
</script>
</body></html>
