<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s22 같은 AI, 갈린 두 가게 — 탁자 위 보고서 두 장 · 초점 옮기기(앞 → 뒤) · 큰 그래프 카드 + 손그림 화살표(R11)</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#cam{left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#w{left:0;top:0;width:1920px;height:1080px;transform-origin:960px 540px;transform:scale(1.08)}
.ly{position:absolute;left:0;top:-100px;width:1920px;height:1280px;background-size:100% 100%}
/* 사진 1536×1024 → 1.25배. 보고서 앞 장·뒤 장 다각형(위 100 잘림 보정은 .ly 안이라 사진 ×1.25) */
#lbase{filter:blur(9px) saturate(.72) brightness(.94)}
#lfront{clip-path:polygon(0px 862px,615px 675px,1206px 1027px,875px 1280px,450px 1280px);filter:saturate(.78) contrast(1.04)}
#lback{clip-path:polygon(565px 556px,1062px 432px,1365px 577px,1262px 800px,1098px 852px);filter:saturate(.78) contrast(1.04)}
#lfg{clip-path:polygon(0px 862px,615px 675px,1206px 1027px,875px 1280px,450px 1280px);filter:blur(9px) grayscale(1) brightness(1.04)}
.tag{position:absolute;opacity:0}
.gc{position:absolute;height:480px;background:#fff;border-radius:14px;padding:28px;font-family:"Pre";box-shadow:0 22px 48px rgba(10,14,18,.45),0 3px 8px rgba(10,14,18,.3)}
.gc svg.gr{position:absolute;left:28px;top:80px}
.gc .hd2{position:absolute;left:28px;top:18px;font-size:30px;font-weight:800;color:#1F2A33}
.gc .xl{position:absolute;left:28px;top:420px;width:464px;display:flex;font-size:22px;font-weight:600;color:#6B747B}
.gc .xl span{flex:none;width:77px;text-align:center;margin-left:0}
.gc .bars{position:absolute;left:28px;right:28px;top:150px;height:280px;display:flex;align-items:flex-end;gap:26px;padding:0 14px;border-bottom:4px solid #C9CED2}
.gc .bars i{flex:1;background:#F8C5B0;border-radius:6px 6px 0 0;transform-origin:bottom}
#gF{left:220px;top:430px;width:520px}
#gB{left:1040px;top:410px;width:560px}
#arw{position:absolute;left:28px;top:20px;overflow:visible}
#nmB{position:absolute;left:70px;top:100px;font-family:"Hand";font-weight:700;font-size:48px;line-height:1;color:#F05A28;white-space:nowrap}
.aic{position:absolute;width:48px;height:48px;border-radius:50%;background:var(--te);color:#fff;font-family:"Pre";font-weight:900;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px #fff,0 8px 18px rgba(0,0,0,.4);opacity:0}
</style></head>
<body><div id="stage">
  <div id="cam" class="abs"><div id="w" class="abs">
    <div class="ly" id="lbase"></div>
    <div class="ly" id="lfront"></div>
    <div class="ly" id="lback"></div>
    <div class="ly" id="lfg"></div>
    <div id="gF" class="gc tag" data-box="gF">
      <div class="hd2">손님 수</div>
      <svg class="gr" width="464" height="330" viewBox="0 0 464 330"><path d="M39 0V326M116 0V326M193 0V326M270 0V326M347 0V326M424 0V326" stroke="#E6E9EB" stroke-width="3"/><path d="M0 326H464" stroke="#C9CED2" stroke-width="4"/><path id="gl" d="M39 200 L116 182 L193 206 L270 188 L347 202 L424 194" fill="none" stroke="#9AA0A6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></svg>
      <div class="xl"><span>1월</span><span>2월</span><span>3월</span><span>4월</span><span>5월</span><span>6월</span></div>
      <div id="aiF" class="aic" style="left:-16px;top:-16px">AI</div>
    </div>
    <div id="gB" class="gc tag" data-box="gB">
      <div class="hd2">손님 수</div>
      <svg class="gr" width="464" height="330" viewBox="0 0 464 330"><path d="M39 0V326M116 0V326M193 0V326M270 0V326M347 0V326M424 0V326" stroke="#E6E9EB" stroke-width="3"/><path d="M0 326H464" stroke="#C9CED2" stroke-width="4"/><path id="ap" d="M39 270 C 150 255 250 200 410 70 M410 70 L360 74 M410 70 L408 122" fill="none" stroke="#F05A28" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="xl"><span>1월</span><span>2월</span><span>3월</span><span>4월</span><span>5월</span><span>6월</span></div>
      <div id="nmB">손님</div>
      <div id="aiB" class="aic" style="left:-16px;top:-16px">AI</div>
    </div>
  </div></div>
</div>
<script src="../data/s22.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#1F2A33', '#1FA39A', '#F05A28'];
window.DEVICES = ['R11 손그림 화살표'];
const T = { first: S.at('반대로'), shift: S.at('늘어난'), tool: S.at('도구를'), why: S.at('왜 이렇게') };
// 10-19: s21 과 같은 사진(p22)이 연속이라(T8) 다른 사진 흐림 바탕 하나로 — 초점 층(lfront·lback·lfg)은 p22 모양이라 끔
['lbase', 'lfront', 'lback', 'lfg'].forEach(id => { document.getElementById(id).style.backgroundImage = S.ph('n31_counter_angle'); });
['lfront', 'lback', 'lfg'].forEach(id => { document.getElementById(id).style.display = 'none'; });
S.ev(T.first + 0.1, 'card_in', 'gF'); S.ev(T.first + 0.5, 'marker', 'gl');
S.ev(T.shift, 'in', 'focus'); S.ev(T.shift + 0.05, 'card_in', 'gB'); S.ev(T.shift + 1.0, 'marker', 'ap');
S.ev(T.tool, 'click', 'aic');
const GL = document.getElementById('gl'); GL.style.strokeDasharray = 1;
const fade = (id, p) => S.css('#' + id, { opacity: S.clamp(p), transform: `translateY(${((1 - S.clamp(p)) * 14).toFixed(1)}px)` });
const CAM = [{ t: 0, s: 1.04, x: 980, y: 540 }, { t: T.why, s: 1.0, x: 960, y: 540, d: 0.4 }];
S.scene(tau => {
  // 느린 옆 흐름(아주 조금) 뒤 «왜 이렇게» 에 0.4초 물러남
  const c = S.camState(tau, CAM, 0.4);
  S.css('#cam', { transform: S.camCss({ s: c.s, x: c.x - 40 * S.P(tau, 0, T.why), y: c.y }) });
  // 초점 옮기기: 앞 장 선명 → 뒤 장 선명(0.4초)
  const m = S.EZ(S.P(tau, T.shift - 0.05, T.shift + 0.35));
  S.css('#lfront', { opacity: 1 - m }); S.css('#lback', { opacity: m });
  const pc = S.ent(tau, T.first + 0.1, 0.12), pu = S.ent(tau, T.shift + 0.05, 0.2);
  fade('gF', pc); GL.style.strokeDashoffset = 1 - S.EO(S.P(tau, T.first + 0.5, T.first + 1.3));
  fade('gB', pu); S.css('#gB', { filter: `blur(${(5 * (1 - pu)).toFixed(2)}px)` });
  // 주홍 손그림 화살표 + 이름표 «손님»
  E.stroke('#ap', tau, T.shift + 1.0, 0.55);
  E.wipe('#nmB', tau, T.shift + 1.45, 0.3);
  // 같은 도구를 → 두 카드 왼쪽 위에 청록 AI 원
  ['aiF', 'aiB'].forEach((id, i) => { const k = S.ent(tau, T.tool + 0.06 * i, 0.12); S.css('#' + id, { opacity: k, transform: `scale(${(0.6 + 0.4 * k).toFixed(3)})` }); });
});
</script>
</body></html>
