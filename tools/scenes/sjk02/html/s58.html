<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s58 AI 쓰면 시간이 남는다 — 클립보드 근무 기록지 사진, 표 칸에 30분 칸이 접혀 1칸만 남고 빈자리에 주홍 점선</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#ph{position:absolute;left:0;top:-100px;width:1920px;height:1280px;background-size:100% 100%;background-repeat:no-repeat}
#tb{position:absolute;left:0;top:0;width:1200px;height:1000px;background:#EDEEF3;font-family:"Pre";color:#1F2A33}
#tb .ln{position:absolute;left:0;height:3px;width:1200px;background:#C9CCD3}
#tb .hd{position:absolute;left:40px;top:56px;font-size:40px;font-weight:800;color:#59636B;letter-spacing:.1em}
#tb .lb{position:absolute;left:40px;font-size:46px;font-weight:800;white-space:nowrap}
#tb .ce{position:absolute;height:64px;width:38px;background:#1F2A33;border-radius:5px;transform-origin:0 50%}
#tb .vl{position:absolute;left:930px;font-size:48px;font-weight:900;white-space:nowrap}
#tb .em{position:absolute;height:64px;border:5px dashed #F05A28;border-radius:8px;opacity:0}
</style></head>
<body><div id="stage">
  <div id="cam">
    <div id="ph"></div>
    <div id="tb" data-diegetic>
      <div class="hd" id="hd">한 달</div>
      <div class="ln" style="top:150px"></div><div class="ln" style="top:300px"></div><div class="ln" style="top:450px"></div>
      <div class="lb" id="l1" style="top:196px">리뷰 답글</div><div id="c1"></div><div class="vl" id="v1" style="top:192px">7시간 30분</div><div class="em" id="e1" style="top:198px"></div>
      <div class="lb" id="l2" style="top:346px">근무표</div><div id="c2"></div><div class="vl" id="v2" style="top:342px">1시간</div><div class="em" id="e2" style="top:348px"></div>
    </div>
  </div>
</div>
<script src="../data/s58.js"></script>
<script src="../lib/sjk.js"></script>
<script src="../lib/e4.js"></script>
<script>
window.PALETTE = ['#2B3036', '#1F2A33', '#F05A28'];
window.DEVICES = ['R10 근무 기록지'];
S.$('#ph').style.backgroundImage = S.ph('n58_timesheet');
// 사진 속 표 네 점(눈으로 잰 값, 1536×1024 → 화면 x*1.25, y*1.25-100) — 왼위·오위·오아래·왼아래. 아래쪽은 화면 밖
const sc = q => q.map(p => [p[0] * 1.25, p[1] * 1.25 - 100]);
S.fitQuad(S.$('#tb'), 1200, 1000, sc([[203, 266], [1060, 170], [1360, 848], [319, 1038]]));
const T = { gap: S.at('시간이'), rev: S.at('리뷰 답글에'), h75: S.at('일곱'), m30: S.at('30분으로'), plan: S.at('근무표'), h1: S.at('한시간'), m5: S.at('5분이면'), rest: S.at('남은시간에'), q: S.at('뭐하세요') };
const X0 = 270, PITCH = 42;
let h1 = '', h2 = '';
for (let i = 0; i < 15; i++) h1 += `<div class="ce" id="a${i}" style="left:${X0 + i * PITCH}px;top:198px"></div>`;
for (let i = 0; i < 2; i++) h2 += `<div class="ce" id="b${i}" style="left:${X0 + i * PITCH}px;top:348px"></div>`;
S.$('#c1').innerHTML = h1; S.$('#c2').innerHTML = h2;
S.S1 = 1;
S.css('#e1', { left: (X0 + PITCH - 4) + 'px', width: (14 * PITCH - 4 + 8) + 'px' });
S.css('#e2', { left: (X0 + 14) + 'px', width: (PITCH * 2 - 14) + 'px' });
S.ev(0.1, 'in', 'tb'); S.ev(T.rev, 'card_in', 'l1'); S.ev(T.h75, 'gauge', 'c1'); S.ev(T.m30, 'no', 'c1'); S.ev(T.plan, 'card_in', 'l2'); S.ev(T.h1, 'gauge', 'c2'); S.ev(T.m5, 'card_in', 'b0'); S.ev(T.q, 'marker', 'e1');
S.scene(tau => {
  const d = S.P(tau, -0.2, S.SC.dur);
  S.css('#cam', { transform: S.camCss({ s: S.lerp(1.0, 1.06, d), x: 960, y: 540 }) });
  const k = S.ent(tau, 0.05, 0.3); S.css('#tb', { opacity: k });
  S.css('#hd', { opacity: S.ent(tau, T.gap, 0.14) });
  S.css('#l1', { opacity: S.ent(tau, T.rev, 0.14) }); S.css('#l2', { opacity: S.ent(tau, T.plan, 0.14) });
  // 행 1: 30분 칸 15개가 차례로 채워짐(먹색) → «30분으로» 오른쪽 칸부터 접혀 1칸만 남음(주홍)
  const fold = i => S.EO(S.P(tau, T.m30 + (14 - i) * 0.04, T.m30 + (14 - i) * 0.04 + 0.2));
  for (let i = 0; i < 15; i++) {
    const e = S.$('#a' + i), a = S.ent(tau, T.h75 + i * 0.04, 0.1), f = i > 0 ? fold(i) : 0;
    e.style.opacity = a * (1 - f); e.style.transform = `scaleX(${(1 - f).toFixed(3)})`;
    e.style.background = (i === 0 && tau >= T.m30 + 0.35) ? '#F05A28' : '#1F2A33';
  }
  const s1 = tau >= T.m30 + 0.1;
  S.$('#v1').textContent = s1 ? '30분' : '7시간 30분'; S.$('#v1').style.color = s1 ? '#F05A28' : '#1F2A33';
  S.css('#v1', { opacity: S.ent(tau, T.h75 + 0.6, 0.14) });
  // 행 2: 한 시간 = 칸 2개 → «5분이면» 아주 얇은 한 칸
  const s2 = S.EO(S.P(tau, T.m5, T.m5 + 0.3));
  for (let i = 0; i < 2; i++) {
    const e = S.$('#b' + i), a = S.ent(tau, T.h1 + i * 0.12, 0.1);
    if (i === 0) { e.style.opacity = a; e.style.width = (38 - 31 * s2) + 'px'; e.style.background = s2 > 0.4 ? '#F05A28' : '#1F2A33'; }
    else { e.style.opacity = a * (1 - s2); e.style.transform = `scaleX(${(1 - s2).toFixed(3)})`; }
  }
  const t2 = tau >= T.m5 + 0.1;
  S.$('#v2').textContent = t2 ? '5분' : '1시간'; S.$('#v2').style.color = t2 ? '#F05A28' : '#1F2A33';
  S.css('#v2', { opacity: S.ent(tau, T.h1 + 0.2, 0.14) });
  // «뭐 하세요?» 접혀서 생긴 오른쪽 빈자리에 주홍 점선
  const q = S.ent(tau, T.q, 0.14);
  S.css('#e1', { opacity: q }); S.css('#e2', { opacity: q });
});
</script>
</body></html>
