<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>s58 AI 쓰면 시간이 남는다 — 콘크리트 판 위 가로 시간 막대 둘(정면 대칭), 줄어든 자리에 빈 칸, 주홍 물음표</title>
<link rel="stylesheet" href="../lib/sjk.css">
<style>
#slab{left:180px;top:170px;width:1560px;height:640px;background:#F7F8F7}
#slab .hd{position:absolute;left:44px;top:28px;font-size:24px;color:#6E767D;letter-spacing:.18em;font-weight:600}
.row{position:absolute;left:0;width:1560px;height:150px}
.row .lb{position:absolute;left:44px;top:50px;width:250px;font-size:36px;font-weight:800}
.row .tr{position:absolute;left:310px;top:36px;width:1000px;height:78px;border:3px dashed #C5C9CC;border-radius:10px}
.row .bar{position:absolute;left:310px;top:36px;height:78px;border-radius:10px;background:#9AA0A6}
.row .free{position:absolute;top:36px;height:78px;border-radius:10px;border:3px dashed #C5C9CC;background:rgba(240,90,40,0)}
.row .val{position:absolute;top:44px;font-size:40px;font-weight:900;white-space:nowrap}
#q{left:760px;top:122px;width:120px;height:120px;border-radius:50%;background:#fff;border:7px solid var(--or);color:var(--or);display:flex;align-items:center;justify-content:center;font-size:84px;font-weight:900;box-shadow:0 14px 30px rgba(240,90,40,.4)}
</style></head>
<body><div id="stage">
  <div class="bg tex-conc"></div>
  <div id="slab" class="slab" data-box="slab">
    <div class="hd">한 달</div>
    <div id="r1" class="row" style="top:110px"><div class="lb">리뷰 답글</div><div class="tr"></div><div class="free" id="f1"></div><div class="bar" id="b1"></div><div class="val" id="v1">7시간 30분</div></div>
    <div id="r2" class="row" style="top:330px"><div class="lb">근무표</div><div class="tr"></div><div class="free" id="f2"></div><div class="bar" id="b2"></div><div class="val" id="v2">1시간</div></div>
    <div id="q" class="abs">?</div>
  </div>
</div>
<script src="../data/s58.js"></script>
<script src="../lib/sjk.js"></script>
<script>
window.PALETTE = ['#D9DBD6', '#1FA39A', '#F05A28', '#9AA0A6'];
const T = { gap: S.at('시간이'), rev: S.at('리뷰답글에'), h75: S.at('일곱'), m30: S.at('30분으로'), plan: S.at('근무표'), h1: S.at('한시간'), m5: S.at('5분이면'), rest: S.at('남은시간에'), q: S.at('뭐하세요') };
const SC = 1000 / 450;                  // 7시간 30분 = 450분 = 1000px
const W75 = 1000, W30 = 30 * SC, W60 = 60 * SC, W5 = 5 * SC;
S.focus([{ t0: T.m30 + 0.05, t1: T.m30 + 1.4, big: '30분', small: '7시간 30분 →', color: 'te' }]);
S.ev(T.gap, 'in', 'slab'); S.ev(T.h75, 'gauge', 'b1'); S.ev(T.h1, 'gauge', 'b2'); S.ev(T.m5, 'gauge', 'b2'); S.ev(T.rest, 'shine', 'f1'); S.ev(T.q, 'card_in', 'q');
S.scene(tau => {
  const k = S.ent(tau, -0.1, 0.14);
  S.css('#slab', { opacity: k, transform: `perspective(2200px) rotateX(${2 + 1 * S.P(tau, 0, S.SC.dur)}deg) translateY(${(1 - k) * 36}px)` });
  S.css('#r1', { opacity: S.ent(tau, T.gap, 0.12) }); S.css('#r2', { opacity: S.ent(tau, T.gap + 0.25, 0.12) });
  const o = S.EO(S.P(tau, T.rest, T.rest + 0.5));
  // 행 1: 꽉 찬 회색 막대(7시간 30분) → 30분(청록)으로 줄고 줄어든 자리는 빈 칸
  const g1 = S.EO(S.P(tau, T.h75, T.h75 + 0.55)), s1 = S.EO(S.P(tau, T.m30, T.m30 + 0.45));
  const w1 = W75 * g1 * (1 - s1) + W30 * s1 * (g1 > 0 ? 1 : 0);
  const b1 = S.$('#b1'); b1.style.width = w1 + 'px'; b1.style.background = s1 > 0.5 ? '#1FA39A' : '#9AA0A6';
  const v1 = S.$('#v1'); v1.textContent = s1 > 0.5 ? '30분' : '7시간 30분'; v1.style.color = o > 0.5 ? '#fff' : (s1 > 0.5 ? '#1FA39A' : '#1F2A33');
  v1.style.left = (330 + w1) + 'px'; v1.style.opacity = g1 > 0.6 ? 1 : 0;
  S.css('#f1', { left: (310 + w1) + 'px', width: (W75 - w1) + 'px', opacity: s1 > 0.3 ? 1 : 0 });
  // 행 2: 한 시간(회색) → 5분(청록)
  const g2 = S.EO(S.P(tau, T.h1, T.h1 + 0.45)), s2 = S.EO(S.P(tau, T.m5, T.m5 + 0.4));
  const w2 = W60 * g2 * (1 - s2) + W5 * s2 * (g2 > 0 ? 1 : 0);
  const b2 = S.$('#b2'); b2.style.width = w2 + 'px'; b2.style.background = s2 > 0.5 ? '#1FA39A' : '#9AA0A6';
  const v2 = S.$('#v2'); v2.textContent = s2 > 0.5 ? '5분' : '1시간'; v2.style.color = o > 0.5 ? '#fff' : (s2 > 0.5 ? '#1FA39A' : '#1F2A33');
  v2.style.left = (330 + w2) + 'px'; v2.style.opacity = g2 > 0.6 ? 1 : 0;
  S.css('#f2', { left: (310 + w2) + 'px', width: (W60 - w2) + 'px', opacity: s2 > 0.3 ? 1 : 0 });
  // «남은 시간에» 빈 칸 둘이 주홍으로 칠해짐
  ['f1', 'f2'].forEach(id => { const e = S.$('#' + id); e.style.background = `rgba(240,90,40,${0.85 * o})`; e.style.borderColor = o > 0.3 ? '#F05A28' : '#C5C9CC'; });
  const q = S.ent(tau, T.q, 0.14);
  S.css('#q', { opacity: q, transform: `scale(${0.7 + 0.3 * q})` });
});
</script>
</body></html>
